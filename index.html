    function renderOrderDetail() {
      const o = state.orders.find(x => x.id === ui.selectedOrderId);
      if (!o) { ui.view = ui.selectedCustomerId ? 'customer-detail' : 'customers'; return ui.selectedCustomerId ? renderCustomerDetail() : renderCustomers(); }
      const c = state.customers.find(x => x.id === o.customerId);
      ui.selectedCustomerId = o.customerId;
      const ost = getOrderStats(o);
      const paysAsc = [...ost.payments].sort((a, b) => ((a.date || '') + ' ' + (a.time || '')).localeCompare((b.date || '') + ' ' + (b.time || '')));
      let cumPaid = 0;
      const paysWithBalance = paysAsc.map(p => {
        cumPaid += Number(p.amount || 0);
        const bal = ost.total - cumPaid;
        return { ...p, runningBalance: Math.max(0, bal), extraPaidRow: Math.max(0, -bal) };
      }).reverse();

      return `
        <div class="space-y-4">
          <div class="flex items-center justify-between gap-3">
            <button type="button" data-open-customer="${esc(o.customerId)}" class="h-10 px-3 rounded-xl glass-card flex items-center gap-1.5 text-xs font-semibold cursor-pointer">${icon('back', 'w-4 h-4')} ${esc(c ? c.name : 'Customer')}</button>
            <button type="button" data-delete-order="${esc(o.id)}" class="h-10 px-3 rounded-xl bg-rose-600/20 text-rose-300 border border-rose-500/30 text-xs font-semibold cursor-pointer">Delete Order</button>
          </div>

          <div class="blue-hero-card rounded-3xl p-5 text-white space-y-3">
            <div class="flex items-start justify-between gap-2">
              <div>
                <div class="text-xs text-blue-100/80">${esc(c ? c.name : 'Customer')} · ${esc(formatDateTime(o.date, o.time, o.createdAt))}</div>
                <h1 class="text-xl font-extrabold mt-0.5">${esc(o.itemName)}</h1>
              </div>
              <select data-order-status="${esc(o.id)}" class="h-9 px-2.5 rounded-xl bg-white/15 border border-white/25 text-white text-xs font-bold">
                <option value="Pending" class="text-slate-900" ${(o.status || 'Pending') === 'Pending' ? 'selected' : ''}>Pending</option>
                <option value="In Progress" class="text-slate-900" ${o.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
                <option value="Completed" class="text-slate-900" ${o.status === 'Completed' ? 'selected' : ''}>Completed</option>
                <option value="Delivered" class="text-slate-900" ${o.status === 'Delivered' ? 'selected' : ''}>Delivered</option>
              </select>
            </div>

            <div class="blue-inner-card rounded-2xl p-3.5 text-xs space-y-1.5">
              <div class="flex justify-between"><span class="text-blue-100/80">Work Type:</span><span class="font-bold">${esc(o.itemName)}</span></div>
              ${o.description ? `<div class="flex justify-between gap-3"><span class="text-blue-100/80">Description:</span><span class="font-semibold text-right">${esc(o.description)}</span></div>` : ''}
              ${o.sqFt > 0 && o.rate > 0 ? `<div class="flex justify-between tabular-nums"><span class="text-blue-100/80">Measurement:</span><span class="font-bold">${esc(o.length)} × ${esc(o.width)} × ${esc(o.qty)} (${esc(Number(ost.sqFt.toFixed(2)))} sq.ft)</span></div>` : ''}
            </div>

            <div class="grid grid-cols-3 gap-3 pt-1">
              <div><div class="text-[11px] text-blue-100/80">Total Bill</div><div class="text-base font-bold tabular-nums">${esc(fmtRs(ost.total))}</div></div>
              <div><div class="text-[11px] text-blue-100/80">Advance / Paid</div><div class="text-base font-bold text-emerald-300 tabular-nums">${esc(fmtRs(ost.paid))}</div></div>
              <div>
                <div class="text-[11px] text-blue-100/80">Remaining</div>
                <div class="text-base font-bold text-amber-300 tabular-nums">${esc(fmtRs(ost.remaining))}</div>
                ${ost.extraPaid > 0 ? `<div class="text-[11px] font-bold text-rose-300 tabular-nums">Extra Paid: ${esc(fmtRs(ost.extraPaid))}</div>` : ''}
              </div>
            </div>

            <button type="button" data-add-order-payment="${esc(o.id)}" class="w-full h-11 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs cursor-pointer">+ Add Payment</button>
          </div>

          <div class="glass-card rounded-3xl p-5 space-y-3">
            <div class="flex items-center justify-between">
              <h2 class="text-sm font-bold">Payment History (${paysWithBalance.length})</h2>
              <span class="text-xs text-sec tabular-nums">Paid: ${esc(fmtRs(ost.paid))}</span>
            </div>
            ${paysWithBalance.length === 0 ? `<p class="text-xs text-sec py-3 text-center">No payments recorded for this order yet.</p>` : `
              <div class="space-y-2.5">
                ${paysWithBalance.map(p => `
                  <div class="rounded-2xl bg-white/5 border border-white/10 p-3.5 space-y-1.5 text-xs">
                    <div class="flex items-start justify-between gap-2">
                      <div>
                        <div class="font-bold text-sm text-emerald-400 tabular-nums">+ ${esc(fmtRs(p.amount))} <span class="text-xs font-semibold text-cyan-300">· ${esc(p.method || 'Cash')}</span></div>
                        <div class="text-sec mt-0.5">${esc(formatDateTime(p.date, p.time, p.createdAt))}${p.note ? ' · ' + esc(p.note) : ''}</div>
                      </div>
                      <div class="text-right tabular-nums">
                        <div class="text-[11px] text-mut">Running Balance</div>
                        <div class="font-bold ${p.runningBalance > 0 ? 'text-amber-300' : 'text-emerald-400'}">${esc(fmtRs(p.runningBalance))}</div>
                        ${p.extraPaidRow > 0 ? `<div class="text-[10px] font-bold text-rose-400">Extra ${esc(fmtRs(p.extraPaidRow))}</div>` : ''}
                      </div>
                    </div>
                    <div class="flex justify-end gap-3 pt-1 border-t border-white/10">
                      <button type="button" data-edit-order-pay="${esc(p.id)}" class="text-cyan-400 font-semibold cursor-pointer">Edit</button>
                      <button type="button" data-delete-order-pay="${esc(p.id)}" class="text-rose-400 font-semibold cursor-pointer">Delete</button>
                    </div>
                  </div>
                `).join('')}
              </div>
            `}
          </div>
        </div>
      `;
    }

    // ========================
    // STOCK MODULE (SEPARATE, FULL DETAIL)
    // ========================
    function renderStock() {
      const totalVal = state.stock.reduce((s, x) => s + (Number(x.qty || 0) * Number(x.cost || 0)), 0);
      const lowItems = getLowStockItems();
      const q = (ui.searchQuery || '').toLowerCase();

      return `
        <div class="space-y-4">
          <div class="flex items-center justify-between gap-3">
            <h1 class="text-xl font-extrabold">Stock Inventory</h1>
            <button type="button" data-modal="add-stock" class="px-4 h-11 rounded-xl btn-primary-grad text-xs font-bold whitespace-nowrap cursor-pointer">+ Add Stock</button>
          </div>

          <div class="grid grid-cols-3 gap-2.5 sm:gap-3">
            <div class="glass-card rounded-2xl p-3.5 sm:p-4">
              <div class="text-[11px] sm:text-xs text-sec">Total Stock Items</div>
              <div class="text-lg font-extrabold tabular-nums mt-1">${state.stock.length}</div>
            </div>
            <div class="glass-card rounded-2xl p-3.5 sm:p-4">

              <div class="text-[11px] sm:text-xs text-sec">Low Stock Items</div>
              <div class="text-lg font-extrabold ${lowItems.length ? 'text-rose-400' : 'text-emerald-400'} tabular-nums mt-1">${lowItems.length}</div>
            </div>
          </div>

          <div class="flex flex-col sm:flex-row gap-2">
            <input id="global-search" type="search" value="${esc(ui.searchQuery)}" placeholder="Search item, category, or party..." class="flex-1 h-11 px-4 rounded-xl glass-input text-sm" />
            <select data-stock-filter-sel class="h-11 px-3 rounded-xl glass-input text-xs font-semibold">
              <option value="all" ${ui.stockFilter === 'all' ? 'selected' : ''}>All Stock</option>
              <option value="low" ${ui.stockFilter === 'low' ? 'selected' : ''}>Low / Out of Stock</option>
              ${STOCK_CATEGORIES.map(cat => `<option value="${esc(cat)}" ${ui.stockFilter === cat ? 'selected' : ''}>${esc(cat)}</option>`).join('')}
            </select>
          </div>

          ${(() => {
            const items = state.stock.filter(item => {
              const matchQ = !q || (item.item || '').toLowerCase().includes(q) || (item.category || '').toLowerCase().includes(q) || (item.supplierName || '').toLowerCase().includes(q);
              const low = isLowStock(item);
              const matchF = ui.stockFilter === 'all' || (ui.stockFilter === 'low' ? low : item.category === ui.stockFilter);
              return matchQ && matchF;
            });
            if (!items.length) {
              return `<div class="glass-card rounded-3xl p-8 text-center"><p class="text-sm text-sec">No stock items found. Tap + Add Stock to add Sheet, Hardware, Paint, Glue, or Accessories.</p><button type="button" data-modal="add-stock" class="mt-4 px-5 h-11 rounded-xl btn-primary-grad text-xs font-bold cursor-pointer">+ Add Stock Item</button></div>`;
            }
            return `<div class="space-y-3">${items.map(s => {
              const val = Number(s.qty || 0) * Number(s.cost || 0);
              const low = isLowStock(s);
              const st = getStockStatus(s);
              const badgeCls = st.tone === 'red'
                ? 'bg-rose-500/20 text-rose-300 border-rose-400/50'
                : st.tone === 'yellow'
                  ? 'bg-amber-500/20 text-amber-300 border-amber-400/50'
                  : 'bg-emerald-500/20 text-emerald-300 border-emerald-400/50';
              return `
                <div data-open-stock="${esc(s.id)}" class="glass-card rounded-2xl p-4 space-y-2.5 cursor-pointer hover:border-cyan-400/50 transition-colors ${low ? 'border-rose-500/80 bg-rose-950/35' : ''}">
                  <div class="flex items-start justify-between gap-2">
                    <div class="min-w-0">
                      <div class="flex flex-wrap items-center gap-2">
                        <span class="text-sm font-bold ${low ? 'text-rose-200' : ''}">${esc(s.item)}</span>
                        <span class="text-[11px] font-bold px-2 py-0.5 rounded-md border ${badgeCls}">${esc(st.label)}</span>
                      </div>
                      <div class="text-xs ${low ? 'text-rose-300' : 'text-sec'} mt-1">
                        ${esc(s.category)} ${s.supplierName ? '· Party: ' + esc(s.supplierName) : ''} · ${esc(formatDateTime(s.purchaseDate, s.purchaseTime, s.updatedAt))}
                      </div>
                    </div>
                    <div class="text-right shrink-0 tabular-nums">
                      <div class="text-sm font-extrabold ${low ? 'text-rose-300' : 'text-cyan-300'}">${esc(fmtRs(val))}</div>
                      <div class="text-[11px] text-sec">Rate: ${esc(fmtRs(s.cost))}/${esc(s.unit || 'Pcs')}</div>
                    </div>
                  </div>
                  <div class="grid grid-cols-3 gap-2 text-xs bg-white/5 rounded-xl px-3 py-2 tabular-nums">
                    <div><span class="text-mut">Available:</span> <strong class="${low ? 'text-rose-300' : 'text-white'}">${esc(s.qty)} ${esc(s.unit || 'Pcs')}</strong></div>
                    <div><span class="text-mut">Used:</span> <strong>${esc(s.usedQty || 0)}</strong></div>
                    <div class="text-right"><span class="text-mut">Limit:</span> <strong>${esc(s.minQty ?? 5)}</strong></div>
                  </div>
                  <div class="flex flex-wrap items-center justify-between gap-2 pt-1">
                    <div class="flex items-center gap-2">
                      <button type="button" data-use-stock="${esc(s.id)}" data-stop-prop class="px-3 h-9 rounded-xl bg-amber-500/20 hover:bg-amber-500/30 border border-amber-400/40 text-amber-200 text-xs font-bold cursor-pointer">- Use Stock</button>
                      <button type="button" data-restock-item="${esc(s.id)}" data-stop-prop class="px-3 h-9 rounded-xl bg-emerald-500/20 hover:bg-emerald-500/30 border border-emerald-400/40 text-emerald-200 text-xs font-bold cursor-pointer">+ Add</button>
                    </div>
                    <div class="flex items-center gap-3">
                      <button type="button" data-edit-stock="${esc(s.id)}" data-stop-prop class="text-xs text-cyan-400 hover:text-cyan-300 font-semibold px-2 py-1 cursor-pointer">Edit</button>
                      <button type="button" data-delete-stock="${esc(s.id)}" data-stop-prop class="text-xs text-rose-400 hover:text-rose-300 px-2 py-1 cursor-pointer">Delete</button>
                    </div>
                  </div>
                </div>
              `;
            }).join('')}</div>`;
          })()}
        </div>
      `;
    }

    function renderStockDetail() {
      const s = state.stock.find(x => x.id === ui.selectedStockId);
      if (!s) { ui.view = 'stock'; return renderStock(); }
      const st = getStockStatus(s);
      const val = Number(s.qty || 0) * Number(s.cost || 0);
      const sup = s.supplierId ? state.suppliers.find(x => x.id === s.supplierId) : state.suppliers.find(x => (x.name || '').toLowerCase() === (s.supplierName || '').toLowerCase());
      const history = [...(s.history || [])].reverse();
      return `
        <div class="space-y-4">
          <div class="flex items-center justify-between gap-2">
            <button type="button" data-nav="stock" class="h-10 px-3 rounded-xl glass-card flex items-center gap-1.5 text-xs font-semibold cursor-pointer">${icon('back', 'w-4 h-4')} Stock</button>
            <div class="flex items-center gap-2">
              <button type="button" data-edit-stock="${esc(s.id)}" class="h-10 px-3 rounded-xl glass-card text-xs font-semibold cursor-pointer">Edit</button>
              <button type="button" data-delete-stock="${esc(s.id)}" class="h-10 px-3 rounded-xl bg-rose-600/20 text-rose-300 border border-rose-500/30 text-xs font-semibold cursor-pointer">Delete</button>
            </div>
          </div>

          <div class="blue-hero-card rounded-3xl p-5 text-white space-y-3">
            <div class="flex items-start justify-between gap-2">
              <div>

                <h1 class="text-xl font-extrabold mt-0.5">${esc(s.item)}</h1>
                ${s.supplierName ? `<div class="text-xs text-cyan-200 mt-1">Party: ${sup ? `<button type="button" data-open-supplier="${esc(sup.id)}" class="underline font-semibold cursor-pointer">${esc(s.supplierName)}</button>` : esc(s.supplierName)}</div>` : ''}
              </div>
              <span class="px-2.5 py-1 rounded-lg text-xs font-bold ${st.tone === 'red' ? 'bg-rose-500 text-white' : st.tone === 'yellow' ? 'bg-amber-400 text-slate-950' : 'bg-emerald-400 text-slate-950'}">${esc(st.label)}</span>
            </div>

            <div class="grid grid-cols-3 gap-3 pt-3 border-t border-white/15 tabular-nums">
              <div><div class="text-[11px] text-blue-100/80">Total Liya (Initial)</div><div class="text-base font-bold">${esc(s.initialQty ?? s.qty)} ${esc(s.unit || 'Pcs')}</div></div>
              <div><div class="text-[11px] text-blue-100/80">Kitna Use Hua</div><div class="text-base font-bold text-amber-300">${esc(s.usedQty || 0)} ${esc(s.unit || 'Pcs')}</div></div>
              <div><div class="text-[11px] text-blue-100/80">Kitna Bacha</div><div class="text-base font-bold text-emerald-300">${esc(s.qty)} ${esc(s.unit || 'Pcs')}</div></div>
            </div>

            <div class="blue-inner-card rounded-2xl p-3 text-xs grid grid-cols-2 gap-2 tabular-nums">
              <div>Purchase Rate: <strong>${esc(fmtRs(s.cost))}</strong>/${esc(s.unit || 'Pcs')}</div>
              <div class="text-right">Stock Value: <strong class="text-amber-300">${esc(fmtRs(val))}</strong></div>
              ${s.sellingRate ? `<div>Use / Sale Rate: <strong>${esc(fmtRs(s.sellingRate))}</strong></div>` : '<div></div>'}
              <div class="text-right">Low Limit: <strong>${esc(s.minQty ?? 5)}</strong></div>
            </div>

            <div class="grid grid-cols-2 gap-3 pt-1">
              <button type="button" data-use-stock="${esc(s.id)}" class="h-11 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold text-xs cursor-pointer">- Use / Minus Stock</button>
              <button type="button" data-restock-item="${esc(s.id)}" class="h-11 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs cursor-pointer">+ Add Purchase Stock</button>
            </div>

          <div class="glass-card rounded-3xl p-5 space-y-3">
            <h2 class="text-sm font-bold">Stock Movement History (${history.length})</h2>
            ${history.length === 0 ? `<p class="text-xs text-sec">No movement history yet.</p>` : history.map(h => `
              <div class="py-2.5 border-b border-white/10 last:border-0 flex items-center justify-between gap-2 text-xs">

                <div class="text-right tabular-nums">

        </div>

    // ========================
    // PARTY MODULE (SEPARATE FROM STOCK)
    // ========================
    function renderParty() {
      const q = (ui.searchQuery || '').toLowerCase();
      const filtered = state.suppliers.filter(sup =>
        !q || (sup.name || '').toLowerCase().includes(q) || (sup.shopName || '').toLowerCase().includes(q) || (sup.mobile || '').includes(q)
      );
      const totals = state.suppliers.reduce((acc, sup) => {
        const st = getSupplierStats(sup.id);
        acc.total += st.total; acc.paid += st.paid; acc.rem += st.remaining;
        return acc;
      }, { total: 0, paid: 0, rem: 0 });

      return `
        <div class="space-y-4">
          <div class="flex items-center justify-between gap-3">
            <h1 class="text-xl font-extrabold">Supplier Parties</h1>
            <button type="button" data-modal="add-supplier" class="px-4 h-11 rounded-xl btn-primary-grad text-xs font-bold whitespace-nowrap cursor-pointer">+ Add Party</button>
          </div>

          <div class="glass-card rounded-2xl p-4 grid grid-cols-3 gap-3">
            <div><div class="text-xs text-sec">Total Purchase</div><div class="text-base font-bold tabular-nums">${esc(fmtRs(totals.total))}</div></div>
            <div><div class="text-xs text-sec">Total Paid</div><div class="text-base font-bold text-emerald-400 tabular-nums">${esc(fmtRs(totals.paid))}</div></div>
            <div><div class="text-xs text-sec">Total Baqaya</div><div class="text-base font-bold text-rose-400 tabular-nums">${esc(fmtRs(totals.rem))}</div></div>
          </div>

          <input id="global-search" type="search" value="${esc(ui.searchQuery)}" placeholder="Search party name, shop, or phone..." class="w-full h-11 px-4 rounded-xl glass-input text-sm" />

            <div class="glass-card rounded-3xl p-8 text-center">
              <p class="text-sm text-sec">No parties added yet. Add suppliers to track stock purchases, payments, and remaining baqaya.</p>
              <button type="button" data-modal="add-supplier" class="mt-4 px-5 h-11 rounded-xl btn-primary-grad text-xs font-bold cursor-pointer">+ Add Party</button>
            </div>
          ` : `
            <div class="space-y-2.5">
              ${filtered.map(sup => {
                const st = getSupplierStats(sup.id);
                return `
                  <button type="button" data-open-supplier="${esc(sup.id)}" class="w-full glass-card rounded-2xl p-4 text-left hover:border-cyan-400/50 transition-colors cursor-pointer space-y-2">
                    <div class="flex items-start justify-between gap-3">
                      <div class="min-w-0">
                        <div class="text-base font-bold truncate">${esc(sup.name)}</div>
                        <div class="text-xs text-sec mt-0.5">${sup.shopName ? esc(sup.shopName) + ' · ' : ''}${esc(sup.mobile || 'No phone')} · ${st.stockCount} stock item${st.stockCount === 1 ? '' : 's'}</div>
                      </div>
                      <span class="text-xs text-cyan-400 font-semibold shrink-0">Details →</span>
                    </div>
                    <div class="grid grid-cols-3 gap-2 pt-2 border-t border-white/10 text-xs tabular-nums">
                      <div><span class="text-mut">Purchase:</span> <strong>${esc(fmtRs(st.total))}</strong></div>
                      <div><span class="text-mut">Paid:</span> <strong class="text-emerald-400">${esc(fmtRs(st.paid))}</strong></div>
                      <div class="text-right"><span class="text-mut">Baqaya:</span> <strong class="${st.remaining > 0 ? 'text-rose-400' : 'text-emerald-400'}">${esc(fmtRs(st.remaining))}</strong></div>
                    </div>
                  </button>
                `;
              }).join('')}
            </div>
          `}
        </div>
      `;
    }

      const st = getSupplierStats(sup.id);
      const stockItems = getPartyStockItems(sup).reverse();
      const entries = state.supplierEntries.filter(e => e.supplierId === sup.id).reverse();
      const pays = [...(state.partyPayments || []).filter(p => p.supplierId === sup.id)].reverse();

      return `

            <button type="button" data-delete-supplier="${esc(sup.id)}" class="h-10 px-3 rounded-xl bg-rose-600/20 text-rose-300 border border-rose-500/30 text-xs font-semibold cursor-pointer">Delete Party</button>

          <div class="blue-hero-card rounded-3xl p-5 text-white">

            <div class="grid grid-cols-3 gap-3 mt-4 pt-3 border-t border-white/15">

    // ========================
    // RENT MODULE (HOME + SHOP BOTH)
    // ========================
    function renderRent() {
      const mKey = currentMonthKey();
      const recs = state.rentRecords || [];
      const pays = state.rentPayments || [];

      const totalHomeRent = recs.filter(r => r.rentType === 'Home').reduce((s, r) => s + Number(r.monthlyAmount || 0), 0);
      const totalShopRent = recs.filter(r => r.rentType === 'Shop').reduce((s, r) => s + Number(r.monthlyAmount || 0), 0);
      const totalRentThisMonth = totalHomeRent + totalShopRent;
      const totalPaid = pays.filter(p => (p.date || '').startsWith(mKey)).reduce((s, p) => s + Number(p.amount || 0), 0);
      const totalBaqaya = recs.reduce((s, r) => {
        const paidRecMonth = pays.filter(p => p.rentId === r.id && (p.date || '').startsWith(mKey)).reduce((ps, p) => ps + Number(p.amount || 0), 0);
        return s + Math.max(0, Number(r.monthlyAmount || 0) - paidRecMonth);
      }, 0);

      const activeTab = ui.rentTab === 'Shop' ? 'Shop' : 'Home';
      const filteredRecs = recs.filter(r => r.rentType === activeTab);

      return `
        <div class="space-y-4">
          <div class="flex items-center justify-between gap-3">
            <h1 class="text-xl font-extrabold">Rent Management (گھر اور دکان)</h1>
            <button type="button" data-modal="add-rent" class="px-4 h-11 rounded-xl btn-primary-grad text-xs font-bold whitespace-nowrap cursor-pointer">+ Add Rent</button>
          </div>

          <div class="grid grid-cols-2 gap-2.5">
            <div class="glass-card rounded-2xl p-3.5">
              <div class="text-[11px] text-sec">Total Home Rent</div>
              <div class="text-sm font-extrabold text-cyan-300 tabular-nums mt-1">${esc(fmtRs(totalHomeRent))}</div>
            </div>
            <div class="glass-card rounded-2xl p-3.5">
              <div class="text-[11px] text-sec">Total Shop Rent</div>
              <div class="text-sm font-extrabold text-violet-300 tabular-nums mt-1">${esc(fmtRs(totalShopRent))}</div>
            </div>
            <div class="glass-card rounded-2xl p-3.5">
              <div class="text-[11px] text-sec">Rent This Month</div>
              <div class="text-sm font-extrabold tabular-nums mt-1">${esc(fmtRs(totalRentThisMonth))}</div>

              <div class="text-[11px] text-sec">Total Baqaya</div>
              <div class="text-sm font-extrabold ${totalBaqaya > 0 ? 'text-rose-400' : 'text-emerald-400'} tabular-nums mt-1">${esc(fmtRs(totalBaqaya))}</div>

          <div class="flex gap-1.5 glass-card p-1 rounded-xl w-fit">

            <button type="button" data-rent-tab="Shop" class="px-4 h-9 rounded-lg text-xs font-bold cursor-pointer ${activeTab === 'Shop' ? 'bg-blue-600 text-white' : 'text-sec'}">🏪 Shop Rent</button>
          </div>

          ${filteredRecs.length === 0 ? `
            <div class="glass-card rounded-3xl p-8 text-center">
              <p class="text-sm text-sec">No ${esc(activeTab)} Rent added yet. Tap + Add Rent to add a landlord &amp; monthly rent.</p>
              <button type="button" data-modal="add-rent" class="mt-4 px-5 h-11 rounded-xl btn-primary-grad text-xs font-bold cursor-pointer">+ Add ${esc(activeTab)} Rent</button>
            </div>
          ` : `
            <div class="space-y-3">
              ${filteredRecs.map(r => {
                const recPaysAsc = pays.filter(p => p.rentId === r.id).sort((a, b) => ((a.date || '') + ' ' + (a.time || '')).localeCompare((b.date || '') + ' ' + (b.time || '')));
                const monthPayMap = {};
                const recPaysWithBal = recPaysAsc.map(p => {
                  const pk = (p.date || todayISO()).slice(0, 7);
                  monthPayMap[pk] = (monthPayMap[pk] || 0) + Number(p.amount || 0);
                  const balAfter = Math.max(0, Number(r.monthlyAmount || 0) - monthPayMap[pk]);
                  return { ...p, balAfter };
                }).reverse();
                const paidThisMonth = monthPayMap[mKey] || 0;
                const remThisMonth = Math.max(0, Number(r.monthlyAmount || 0) - paidThisMonth);
                const isPaid = Number(r.monthlyAmount || 0) === 0 ? paidThisMonth > 0 : remThisMonth === 0;
                return `
                  <div class="glass-card rounded-3xl p-4 sm:p-5 space-y-3">
                    <div class="flex items-start justify-between gap-2">
                      <div>
                        <div class="flex flex-wrap items-center gap-2">
                          <span class="px-2 py-0.5 rounded-md text-[11px] font-bold ${r.rentType === 'Home' ? 'bg-cyan-500/20 text-cyan-300 border border-cyan-400/40' : 'bg-violet-500/20 text-violet-300 border border-violet-400/40'}">${esc(r.rentType)}</span>
                          <span class="text-base font-extrabold">${esc(r.title)}</span>
                          <span class="px-2 py-0.5 rounded-md text-[11px] font-bold ${isPaid ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-400/40' : 'bg-rose-500/20 text-rose-300 border border-rose-400/40'}">${isPaid ? 'Paid ✓' : 'Pending'}</span>
                        </div>
                        <div class="text-xs text-sec mt-1">Owner: ${esc(r.ownerName || 'Landlord')} ${r.dueDate ? '· Due: ' + esc(r.dueDate) : ''} · ${esc(formatDateTime(r.date, r.time, r.createdAt))}</div>
                        ${r.note ? `<div class="text-xs text-mut mt-0.5">${esc(r.note)}</div>` : ''}
                      </div>
                      <div class="text-right shrink-0 tabular-nums">
                        <div class="text-xs text-mut">Monthly Rent</div>
                        <div class="text-base font-extrabold">${esc(fmtRs(r.monthlyAmount))}</div>
                      </div>
                    </div>

                    <div class="grid grid-cols-3 gap-2 text-xs bg-white/5 rounded-2xl p-3 tabular-nums">
                      <div><span class="text-mut">Paid (Month):</span> <strong class="text-emerald-400">${esc(fmtRs(paidThisMonth))}</strong></div>
                      <div><span class="text-mut">Baqaya:</span> <strong class="${remThisMonth > 0 ? 'text-rose-400' : 'text-emerald-400'}">${esc(fmtRs(remThisMonth))}</strong></div>
                      <div class="text-right"><button type="button" data-pay-rent="${esc(r.id)}" class="px-3 h-8 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold cursor-pointer">+ Pay Rent</button></div>
                    </div>

                    <div class="flex justify-end gap-3 text-xs">
                      <button type="button" data-edit-rent="${esc(r.id)}" class="text-cyan-400 font-semibold cursor-pointer">Edit Rent</button>
                      <button type="button" data-delete-rent="${esc(r.id)}" class="text-rose-400 font-semibold cursor-pointer">Delete</button>
                    </div>

                    <div class="pt-2 border-t border-white/10 space-y-2">
                      <div class="text-xs font-bold text-sec">Payment History (${recPaysWithBal.length})</div>
                      ${recPaysWithBal.length === 0 ? `<p class="text-xs text-mut">No rent payments recorded yet.</p>` : recPaysWithBal.map(p => `
                        <div class="rounded-xl bg-white/5 border border-white/10 p-2.5 text-xs space-y-1">
                          <div class="flex items-start justify-between gap-2">
                            <div>
                              <div class="font-bold text-emerald-400 tabular-nums">${esc(fmtRs(p.amount))} <span class="text-cyan-300 font-semibold">· ${esc(p.method || 'Cash')}</span></div>
                              <div class="text-sec">${esc(formatDateTime(p.date, p.time, p.createdAt))}${p.note ? ' · ' + esc(p.note) : ''}</div>
                            </div>
                            <div class="text-right tabular-nums">
                              <div class="text-[10px] text-mut">Baqaya After</div>
                              <div class="font-bold ${p.balAfter > 0 ? 'text-amber-300' : 'text-emerald-400'}">${esc(fmtRs(p.balAfter))}</div>
                            </div>
                          </div>
                          <div class="flex justify-end gap-3 pt-1 border-t border-white/10">
                            <button type="button" data-edit-rent-pay="${esc(p.id)}" class="text-cyan-400 font-semibold cursor-pointer">Edit</button>
                            <button type="button" data-delete-rent-pay="${esc(p.id)}" class="text-rose-400 font-semibold cursor-pointer">Delete</button>
                          </div>
                        </div>
                      `).join('')}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `}
        </div>
      `;
    }

    // ========================
    // EXPENSES & DEDICATED MODULE VIEWS (Diesel, Committee, Expenses)
    // ========================
    function renderExpenses(forcedCat = null) {
      const catTitle = forcedCat || 'Workshop Expenses';
      const list = [...state.transactions]
        .filter(t => t.type === 'expense' && (!forcedCat || t.category === forcedCat))
        .reverse();
      const total = list.reduce((s, t) => s + Number(t.amount || 0), 0);

      let committeeSection = '';
      if (forcedCat === 'Committee') {
        committeeSection = `
          <div class="glass-card rounded-3xl p-5 space-y-3">
            <div class="flex items-center justify-between">
              <h2 class="text-sm font-bold">Active Committees</h2>
              <button type="button" data-modal="add-committee" class="px-3 h-9 rounded-xl btn-primary-grad text-xs font-bold cursor-pointer">+ New Committee</button>
            </div>
            ${state.committees.length === 0 ? `<p class="text-xs text-sec">No committee plans added yet.</p>` : state.committees.map(cm => `
              <div class="p-3 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-between gap-2 text-xs">
                <div>
                  <div class="font-bold text-sm">${esc(cm.name)}</div>
                  <div class="text-sec">Installment: ${esc(fmtRs(cm.monthlyAmount))}/mo · Paid ${esc(cm.paidMonths || 0)}/${esc(cm.totalMonths)} months</div>
                </div>
                <button type="button" data-pay-committee="${esc(cm.id)}" class="px-3 h-9 rounded-lg bg-emerald-600 text-white font-bold cursor-pointer">Pay Installment</button>
              </div>
            `).join('')}
          </div>
        `;
      }

      return `
        <div class="space-y-4">
          <div class="flex items-center justify-between gap-3">
            <h1 class="text-xl font-extrabold">${esc(catTitle)}</h1>
            <button type="button" data-add-expense-cat="${esc(forcedCat || 'Other')}" class="px-4 h-11 rounded-xl btn-primary-grad text-xs font-bold cursor-pointer">+ Add ${esc(forcedCat || 'Expense')}</button>
          </div>
          <div class="glass-card rounded-2xl p-4 flex items-center justify-between">
            <span class="text-xs text-sec">Total ${esc(catTitle)}</span>
            <span class="text-lg font-extrabold text-orange-400 tabular-nums">${esc(fmtRs(total))}</span>
          </div>
          ${committeeSection}
          ${list.length === 0 ? `
            <div class="glass-card rounded-3xl p-8 text-center">
              <p class="text-sm text-sec">No ${esc(catTitle.toLowerCase())} entries recorded yet.</p>
            </div>
          ` : `
            <div class="glass-card rounded-3xl divide-y divide-white/10 px-4">
              ${list.map(t => `
                <div class="py-3 flex items-center justify-between gap-3 text-xs">
                  <div class="min-w-0">
                    <div class="text-sm font-semibold truncate">${esc(t.title)}</div>
                    <div class="text-sec">${esc(t.category)} · ${esc(formatShortDate(t.date))}</div>
                  </div>
                  <div class="flex items-center gap-3 shrink-0">
                    <span class="text-sm font-bold text-orange-400 tabular-nums">${esc(fmtRs(t.amount))}</span>
                    <button type="button" data-delete-tx="${esc(t.id)}" class="text-rose-400 hover:text-rose-300 cursor-pointer">✕</button>
                  </div>
                </div>
              `).join('')}
            </div>
          `}
        </div>
      `;
    }

    // ========================

    function renderReport() {
      const m = getMetrics();

      });
      const stockVal = state.stock.reduce((s, x) => s + (Number(x.qty || 0) * Number(x.cost || 0)), 0);
      const curMKey = currentMonthKey();

      return `
        <div class="space-y-4">
          <div class="flex items-center justify-between gap-2">
            <div>
              <h1 class="text-xl font-extrabold">Monthly &amp; Profit Report</h1>

            <div class="glass-card rounded-2xl p-4"><div class="text-xs text-sec">This Month Income</div><div class="text-base font-bold text-emerald-400 tabular-nums mt-1">${esc(fmtRs(m.monthIncome))}</div></div>
            <div class="glass-card rounded-2xl p-4"><div class="text-xs text-sec">This Month Expense</div><div class="text-base font-bold text-orange-400 tabular-nums mt-1">${esc(fmtRs(m.monthExpense))}</div></div>
            <div class="glass-card rounded-2xl p-4"><div class="text-xs text-sec">All-Time Profit</div><div class="text-base font-bold text-amber-300 tabular-nums mt-1">${esc(fmtRs(m.totalProfit))}</div></div>
            <div class="glass-card rounded-2xl p-4"><div class="text-xs text-sec">Stock Valuation</div><div class="text-base font-bold text-cyan-300 tabular-nums mt-1">${esc(fmtRs(stockVal))}</div></div>
          </div>

          <!-- Carried-Forward Pending Balances (Active Until Cleared) -->
          <div class="glass-card rounded-3xl p-5 space-y-3 border border-amber-400/25">
            <div class="flex items-center justify-between">
              <h2 class="text-sm font-bold">Carried Forward Pending Payments (Baqaya)</h2>
              <span class="text-[11px] text-amber-300 font-bold">Active until paid ✓</span>
            </div>
            <div class="grid grid-cols-2 gap-3 text-xs">
              <button type="button" data-nav="customers" class="rounded-2xl bg-white/5 border border-white/10 p-3 text-left cursor-pointer">
                <div class="text-sec">Customers Baqaya</div>
                <div class="text-base font-extrabold text-amber-400 tabular-nums mt-1">${esc(fmtRs(m.custBaqaya))}</div>
                <div class="text-[11px] text-mut mt-0.5">${m.baqayaBills} pending accounts</div>
              </button>
              <button type="button" data-nav="party" class="rounded-2xl bg-white/5 border border-white/10 p-3 text-left cursor-pointer">
                <div class="text-sec">Party / Dealer Baqaya</div>
                <div class="text-base font-extrabold text-rose-400 tabular-nums mt-1">${esc(fmtRs(m.supBaqaya))}</div>
                <div class="text-[11px] text-mut mt-0.5">${state.suppliers.length} suppliers</div>
              </button>
            </div>
          </div>

          <div class="glass-card rounded-3xl p-5 space-y-3">
            <h2 class="text-sm font-bold">Expense Breakdown by Category</h2>
            ${Object.keys(catTotals).length === 0 ? `<p class="text-xs text-sec">No expenses logged yet.</p>` : Object.entries(catTotals).map(([cat, amt]) => `
              <div class="flex items-center justify-between text-xs py-1.5 border-b border-white/10 last:border-0">
                <span class="font-medium">${esc(cat)}</span>
                <span class="font-bold text-orange-400 tabular-nums">${esc(fmtRs(amt))}</span>
              </div>
            `).join('')}

          <div class="glass-card rounded-3xl p-5 space-y-3">
            <div class="flex items-center justify-between gap-2">
              <div>
                <h2 class="text-sm font-bold">Closed Months Archive 🔒</h2>
                <p class="text-xs text-sec">Maheena khatam hone par 23:59 par automatic lock &amp; archive hota hai (Read-Only).</p>
              </div>
              <button type="button" data-action="archive-now" class="px-3 h-9 rounded-xl glass-card text-xs font-semibold shrink-0 cursor-pointer">Snapshot Month</button>
            </div>
            ${state.archivedReports.length === 0 ? `<p class="text-xs text-sec">Abhi koi archived month nahi hai.</p>` : [...state.archivedReports].reverse().map(r => {
              const isExp = ui.expandedArchiveMonth === r.monthKey;

              const staffSnap = Array.isArray(r.staffSnapshot) ? r.staffSnapshot : [];

                <div class="rounded-2xl bg-white/5 border border-white/10 overflow-hidden">

                    <div>
                      <div class="flex items-center gap-2">
                        <span class="font-bold text-sm">${esc(r.label || formatMonthLabel(r.monthKey))}</span>
                        ${isLocked ? `<span class="px-2 py-0.5 rounded-full bg-amber-500/20 border border-amber-400/40 text-amber-300 text-[10px] font-bold">🔒 Closed</span>` : `<span class="px-2 py-0.5 rounded-full bg-cyan-500/15 border border-cyan-400/35 text-cyan-300 text-[10px] font-bold">Snapshot</span>`}
                      </div>
                      <div class="text-sec mt-0.5">${r.ordersCount || 0} orders · Inc ${esc(fmtRs(r.income))} · Exp ${esc(fmtRs(r.expense))}</div>

                    <div class="text-right">
                      <div class="font-extrabold tabular-nums text-sm ${r.profit >= 0 ? 'text-emerald-400' : 'text-rose-400'}">${esc(fmtRs(r.profit))}</div>

                    </div>
                  </button>
                  ${isExp ? `
                    <div class="px-3.5 pb-3.5 pt-2 border-t border-white/10 space-y-2.5 text-xs">
                      <div class="grid grid-cols-3 gap-2 tabular-nums">
                        <div class="rounded-xl bg-white/5 p-2"><div class="text-[10px] text-sec">Income</div><div class="font-bold text-emerald-400">${esc(fmtRs(r.income))}</div></div>
                        <div class="rounded-xl bg-white/5 p-2"><div class="text-[10px] text-sec">Expense</div><div class="font-bold text-orange-400">${esc(fmtRs(r.expense))}</div></div>
                        <div class="rounded-xl bg-white/5 p-2"><div class="text-[10px] text-sec">Net Profit</div><div class="font-bold ${r.profit >= 0 ? 'text-emerald-300' : 'text-rose-300'}">${esc(fmtRs(r.profit))}</div></div>
                      </div>
                      ${(cf.customerPending !== undefined || cf.partyPending !== undefined) ? `
                        <div class="rounded-xl bg-amber-500/10 border border-amber-400/25 p-2.5 flex justify-between tabular-nums">
                          <span>Carry-Forward Customers: <strong class="text-amber-300">${esc(fmtRs(cf.customerPending || 0))}</strong></span>
                          <span>Party: <strong class="text-rose-300">${esc(fmtRs(cf.partyPending || 0))}</strong></span>
                        </div>
                      ` : ''}
                      ${staffSnap.length > 0 ? `
                        <div class="space-y-1">
                          <div class="text-[11px] font-bold text-sec">Staff Snapshot (${esc(r.label)})</div>
                          ${staffSnap.map(st => `
                            <div class="flex justify-between py-1 border-b border-white/10 last:border-0 tabular-nums">
                              <span>${esc(st.name)} (${esc(st.role)})</span>
                              <span>Sal: ${esc(fmtRs(st.salaryPaid))} · Adv: ${esc(fmtRs(st.advances))}</span>
                            </div>
                          `).join('')}
                        </div>
                      ` : ''}
                    </div>
                  ` : ''}
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

          <div class="flex gap-1.5 glass-card p-1 rounded-xl w-fit">

                  <div class="min-w-0">

                  <div class="flex items-center gap-3 shrink-0">

      const q = (ui.recordSearch || '').toLowerCase();
      const allOrders = state.orders.filter(o => !q || (o.itemName || '').toLowerCase().includes(q));
      const allTx = state.transactions.filter(t => !q || (t.title || '').toLowerCase().includes(q) || (t.category || '').toLowerCase().includes(q));

        <div class="space-y-4">
          <h1 class="text-xl font-extrabold">All Workshop Records</h1>

          <div class="grid grid-cols-2 gap-3 text-xs">
            <button type="button" data-nav="customers" class="glass-card rounded-2xl p-4 text-left cursor-pointer"><div class="text-sec">Customers</div><div class="text-xl font-extrabold mt-1">${state.customers.length}</div></button>
            <button type="button" data-nav="customers" class="glass-card rounded-2xl p-4 text-left cursor-pointer"><div class="text-sec">Work Orders</div><div class="text-xl font-extrabold mt-1">${state.orders.length}</div></button>

                <span>${esc(t.title)} (${esc(t.category)}) · ${esc(t.date)}</span>

              </div>
            `).join('')}
          </div>
        </div>
      `;

    function formatLastBackupText() {
      const ts = Number(state.cloudMeta?.lastBackupAt || 0);
      if (!ts) return 'Abhi tak Cloud Backup nahi hua';
      const d = new Date(ts);
      const iso = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      const tm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
      return formatDateTime(iso, tm);
    }

    function renderAdminDashboard() {
      const users = (ui.adminUsers || []).filter(u => String(u.email || '').toLowerCase() !== ADMIN_EMAIL);
      const q = (ui.adminSearch || '').trim().toLowerCase();
      const flt = ui.adminFilter || 'all';
      const filtered = users.filter(u => {
        const matchQ = !q
          || String(u.name || '').toLowerCase().includes(q)
          || String(u.email || '').toLowerCase().includes(q)
          || String(u.mobile || '').toLowerCase().includes(q)
          || String(u.cnicLast4 || '').includes(q);
        if (!matchQ) return false;
        if (flt === 'duplicate') return u.kycStatus === 'duplicate';
        if (flt === 'verifying') return u.kycStatus === 'verifying' || u.kycStatus === 'none';
        if (flt === 'approved') return u.kycStatus === 'approved' && !u.blocked;
        if (flt === 'blocked') return Boolean(u.blocked);
        return true;
      });
      const dupCount = users.filter(u => u.kycStatus === 'duplicate').length;
      const verCount = users.filter(u => u.kycStatus === 'approved' && !u.blocked).length;
      const pendCount = users.filter(u => u.kycStatus === 'verifying' || u.kycStatus === 'none').length;
      const blkCount = users.filter(u => u.blocked).length;
      const totalPendingRs = users.reduce((s, u) => s + Number(u.totalPendingAmount || 0), 0);

      return `
        <div class="space-y-4">
          <div class="blue-hero-card rounded-3xl p-5 text-white space-y-3">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div class="flex items-center gap-3 min-w-0">
                ${renderLogoAvatar('w-12 h-12', 'ring-2 ring-amber-400')}
                <div class="min-w-0">
                  <div class="text-xs font-bold text-amber-300 uppercase tracking-wider">Admin Control Panel</div>
                  <h1 class="text-lg font-extrabold truncate">${esc(state.session?.name || 'Admin')}</h1>
                  <div class="text-[11px] text-blue-100/85 truncate">${esc(ADMIN_EMAIL)}</div>
                </div>
              </div>
              <div class="flex flex-wrap items-center gap-2">
                <button type="button" data-action="admin-refresh" class="px-3 h-9 rounded-xl bg-white/15 hover:bg-white/25 text-xs font-bold cursor-pointer">🔄 Refresh</button>
                <button type="button" data-set-theme="${state.settings.theme === 'light' ? 'dark-blue' : 'light'}" class="px-3 h-9 rounded-xl bg-white/15 hover:bg-white/25 text-xs font-bold cursor-pointer">${state.settings.theme === 'light' ? '🌙 Dark' : '☀️ Light'}</button>
                <button type="button" data-modal="change-password" class="px-3 h-9 rounded-xl bg-white/15 hover:bg-white/25 text-xs font-bold cursor-pointer">Password</button>
                <button type="button" data-action="signout" class="px-3 h-9 rounded-xl bg-rose-500 hover:bg-rose-400 text-white text-xs font-bold cursor-pointer">Logout</button>
              </div>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-5 gap-2.5 pt-2 border-t border-white/15 tabular-nums">
              <div class="rounded-xl bg-white/10 p-2.5"><div class="text-[10px] text-blue-100">Total Users</div><div class="text-lg font-extrabold">${users.length}</div></div>
              <div class="rounded-xl bg-white/10 p-2.5"><div class="text-[10px] text-blue-100">Verified ✓</div><div class="text-lg font-extrabold text-emerald-300">${verCount}</div></div>

              <div class="rounded-xl bg-white/10 p-2.5"><div class="text-[10px] text-blue-100">Blocked</div><div class="text-lg font-extrabold text-rose-300">${blkCount}</div></div>
              <div class="rounded-xl bg-white/10 p-2.5 col-span-2 sm:col-span-1"><div class="text-[10px] text-blue-100">All Pending</div><div class="text-sm font-extrabold text-cyan-200">${esc(fmtRs(totalPendingRs))}</div></div>
            </div>
          </div>

          <div class="space-y-2.5">
            <input id="admin-user-search" type="search" value="${esc(ui.adminSearch)}" placeholder="Search Name, Email, Mobile, CNIC last 4..." class="w-full h-11 px-4 rounded-xl glass-input text-sm" />
            <div class="flex flex-wrap gap-1.5">
              ${[
                { id: 'all', label: `All (${users.length})` },
                { id: 'duplicate', label: `Duplicate KYC (${dupCount})` },
                { id: 'verifying', label: `Pending (${pendCount})` },
                { id: 'approved', label: `Verified (${verCount})` },
                { id: 'blocked', label: `Blocked (${blkCount})` }
              ].map(tab => `
                <button type="button" data-admin-filter="${tab.id}" class="px-3.5 h-9 rounded-xl text-xs font-bold cursor-pointer ${flt === tab.id ? 'bg-blue-600 text-white' : 'glass-card text-sec'}">${esc(tab.label)}</button>
              `).join('')}
            </div>
          </div>

          ${ui.adminLoading ? `
            <div class="glass-card rounded-3xl p-8 text-center text-sm text-sec">Users aur Cloud Khata load ho raha hai...</div>
          ` : filtered.length === 0 ? `
            <div class="glass-card rounded-3xl p-8 text-center text-sm text-sec">Is filter me koi user nahi mila.</div>
          ` : `
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
              ${filtered.map(u => {
                const kSt = u.kycStatus || 'none';

                  ? `<span class="px-2 py-0.5 rounded-full bg-rose-500/20 border border-rose-400/40 text-rose-300 text-[10px] font-bold">⛔ Blocked</span>`

                    ? `<span class="px-2 py-0.5 rounded-full bg-amber-500/20 border border-amber-400/45 text-amber-300 text-[10px] font-bold">⚠ KYC Duplicate</span>`

                return `
                  <div class="glass-card rounded-3xl p-4 space-y-3">
                    <div class="flex items-start justify-between gap-2">
                      <div class="min-w-0">
                        <div class="flex flex-wrap items-center gap-2">
                          <span class="text-base font-extrabold truncate">${esc(u.name || 'User')}</span>
                          ${statusBadge}
                        </div>
                        <div class="text-xs text-sec truncate mt-0.5">${esc(u.email || u.identifier || '-')}</div>
                        <div class="text-[11px] text-mut mt-0.5 tabular-nums">Mobile: ${esc(u.mobile || '-')} · CNIC: ${u.cnicLast4 ? '****-*******-' + esc(u.cnicLast4[3] || u.cnicLast4) : '-'}</div>
                      </div>
                      <div class="text-right shrink-0 tabular-nums">
                        <div class="text-[11px] text-sec">${Number(u.customerCount || 0)} Customers</div>
                        <div class="text-sm font-extrabold text-amber-400">${esc(fmtRs(u.totalPendingAmount || 0))}</div>
                        <div class="text-[10px] text-mut">Pending</div>
                      </div>
                    </div>
                    <div class="grid grid-cols-3 gap-2 pt-2 border-t border-white/10">
                      <button type="button" data-admin-inspect="${esc(u.uid)}" class="h-9 rounded-xl btn-primary-grad text-xs font-bold cursor-pointer">View Data</button>
                      ${kSt !== 'approved' ? `

                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `}
        </div>
      `;

    // ========================
    // MAIN SHELL & MODERN PILL NAVBAR (EXACT 6 TABS: Home | Customer | Stock | Party / Dealer | Monthly Report | Profile)
    // ========================
    function positionPillSlider() {
      const nav = document.getElementById('pill-navbar');
      if (!nav) return;
      const activeBtn = nav.querySelector('.pill-nav-btn.active');
      if (activeBtn && nav.scrollWidth > nav.clientWidth + 4) {
        const targetScroll = activeBtn.offsetLeft - (nav.clientWidth / 2) + (activeBtn.offsetWidth / 2);
        nav.scrollTo({ left: Math.max(0, targetScroll), behavior: 'smooth' });
      }
    }

    function renderShell() {
      if (isAdminSession()) {
        const adminBody = ui.view === 'admin-inspect' ? renderAdminUserInspect() : renderAdminDashboard();
        return `
          <div class="min-h-screen pb-10">
            <main class="w-full px-3.5 sm:px-5 pt-4">
              ${adminBody}
            </main>
          </div>
        `;
      }

      const kycOk = isKycVerified();
      // Strictly gate Home and workshop pages until KYC is Verified & not blocked
      const v = kycOk ? ui.view : 'kyc';
      const animatePage = ui.lastRenderedView && ui.lastRenderedView !== v;
      ui.lastRenderedView = v;

      let bodyHtml = '';
      if (!kycOk) bodyHtml = renderKyc();
      else if (v === 'home') bodyHtml = renderHome();
      else if (v === 'work' || v === 'customers') bodyHtml = renderCustomers();
      else if (v === 'customer-detail') bodyHtml = renderCustomerDetail();
      else if (v === 'order-detail') bodyHtml = renderOrderDetail();
      else if (v === 'stock') bodyHtml = renderStock();
      else if (v === 'stock-detail') bodyHtml = renderStockDetail();
      else if (v === 'party') bodyHtml = renderParty();
      else if (v === 'supplier-detail') bodyHtml = renderSupplierDetail();
      else if (v === 'staff') bodyHtml = renderStaff();
      else if (v === 'staff-detail') bodyHtml = renderStaffDetail();
      else if (v === 'committee') bodyHtml = renderExpenses('Committee');
      else if (v === 'mess') bodyHtml = renderMess();
      else if (v === 'diesel') bodyHtml = renderExpenses('Diesel');
      else if (v === 'rent') bodyHtml = renderRent();
      else if (v === 'expenses') bodyHtml = renderExpenses(null);
      else if (v === 'report') bodyHtml = renderReport();
      else if (v === 'payments') bodyHtml = renderPayments();
      else if (v === 'records') bodyHtml = renderRecords();
      else if (v === 'profile') bodyHtml = renderProfile();
      else if (v === 'kyc') bodyHtml = renderKyc();
      else if (v === 'settings') bodyHtml = renderSettings();
      else bodyHtml = renderHome();

      const navItems = [
        { id: 'home', label: 'Home', icon: 'home', tone: 'blue' },
        { id: 'customers', label: 'Customer', icon: 'users', tone: 'green' },
        { id: 'stock', label: 'Stock', icon: 'stock', tone: 'teal' },
        { id: 'party', label: 'Party/Dealer', icon: 'party', tone: 'orange' },
        { id: 'report', label: 'Monthly', icon: 'report', tone: 'purple' },
        { id: 'profile', label: 'Profile', icon: 'user', tone: 'indigo' }
      ];

      const pillNavHtml = kycOk ? `
        <div class="pill-navbar-wrap">
          <nav id="pill-navbar" class="pill-navbar" aria-label="Main Navigation">
            ${navItems.map(n => {
              const active = v === n.id
                || (n.id === 'customers' && (v === 'work' || v === 'customer-detail' || v === 'order-detail'))
                || (n.id === 'stock' && v === 'stock-detail')
                || (n.id === 'party' && v === 'supplier-detail')
                || (n.id === 'profile' && (v === 'kyc' || v === 'settings'));
              return `
                <button type="button" data-nav="${n.id}" data-nav-tone="${n.tone}" class="pill-nav-btn ${active ? 'active' : ''}">
                  <span class="nav-icon-wrap">${icon(n.icon, 'w-5 h-5 shrink-0')}</span>
                  <span class="nav-label">${esc(n.label)}</span>
                  <span class="nav-dot" aria-hidden="true"></span>
                </button>
              `;
            }).join('')}
          </nav>
        </div>
      ` : '';

      return `
        <div class="min-h-screen flex flex-col ${kycOk ? 'pb-[112px]' : 'pb-8'}">
          <main class="w-full px-3.5 sm:px-5 pt-4 flex-1 ${animatePage ? 'page-slide-fade' : ''}">
            ${bodyHtml}
          </main>
          ${pillNavHtml}
        </div>
      `;
    }

    function render() {
      applyTheme();
      checkKycAutoApprove();
      const root = document.getElementById('app');
      if (!root) return;
      if (!state.session) {
        root.innerHTML = renderAuth();
      } else if (ui.pinLocked && !isAdminSession() && state.pinSecurity?.enabled && state.pinSecurity?.hash) {
        root.innerHTML = renderPinLock();
      } else {
        root.innerHTML = renderShell();
      }
      requestAnimationFrame(positionPillSlider);
    }

    function updateWorkCalculator() {
      const total = Math.max(0, Number(document.getElementById('wo-total')?.value || 0));
      const adv = Math.max(0, Number(document.getElementById('wo-adv')?.value || 0));
      const rem = Math.max(0, total - adv);
      const extraPaid = Math.max(0, adv - total);
      const totEl = document.getElementById('wo-calc-total');
      const advEl = document.getElementById('wo-calc-adv');
      const remEl = document.getElementById('wo-calc-rem');
      const extEl = document.getElementById('wo-calc-extra');
      if (totEl) totEl.textContent = fmtRs(total);

        if (idx >= 0) state.archivedReports[idx] = entry; else state.archivedReports.push(entry);

      else if (act === 'admin-refresh') { await loadAdminUsersList(); }

      else if (act === 'signout') {
        hydrateGeneration++;

        if (curUid) {
          saveUserCache(curUid, state, true);
          if (state.pinSecurity?.enabled && state.pinSecurity?.hash && state.session) {

              uid: curUid,
              name: state.session.name || '',
              email: state.session.email || '',
              mobile: state.session.mobile || '',
              identifier: state.session.identifier || state.session.email || state.session.mobile || '',
              authType: state.session.authType || 'email',
              pinHash: state.pinSecurity.hash
            });

        }
        const cloud = getCloud();
        if (state.session?.uid && cloud?.auth?.currentUser?.uid === state.session.uid && localStorage.getItem(PENDING_SYNC_KEY) === state.session.uid) {
          try { await flushCloudSync(); } catch (e) {}
        }
        if (cloud) { try { await cloud.signOutUser(); } catch (e) {} }
        ui.cloudHydrating = false;
        localStorage.removeItem(ACTIVE_UID_KEY);
        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem(PENDING_SYNC_KEY);
        sessionStorage.removeItem(PIN_UNLOCK_SESSION_KEY);
        const remKeep = loadRememberMe();
        state = defaultData();
        state.rememberMe = remKeep;
        ui.pinLocked = false;
        ui.pinEntry = '';
        ui.pinErrorCount = 0;
        ui.authMode = 'login';
        ui.view = 'login';

        ui.selectedOrderId = null;
        ui.selectedStockId = null;
        ui.selectedStaffId = null;
        ui.selectedSupplierId = null;
        ui.searchQuery = '';
        ui.recordSearch = '';
        ui.kycWelcomeBanner = false;
        ui.signupStep = 1;

        closeModal();

      else if (act === 'confirm-clear-all') {
        const keepSession = state.session;
        const keepCloud = state.cloudMeta;
        const keepPin = state.pinSecurity;
        const keepKyc = state.kyc;
        const keepRem = state.rememberMe;
        state = defaultData();
        state.session = keepSession;
        state.cloudMeta = keepCloud;
        state.pinSecurity = keepPin;
        state.kyc = keepKyc;
        state.rememberMe = keepRem;
        saveState(); closeModal(); ui.view = isKycVerified() ? 'home' : 'kyc'; render();
        toast('All workshop data cleared.', 'info');
      }
    });

    async function verifyPinEntryCode(enteredPin) {
      const enteredHash = await hashPassword(enteredPin);
      if (!state.session && ui.authMode === 'pin') {
        const pinMeta = loadLastPinMeta();
        if (pinMeta && enteredHash === pinMeta.pinHash) {
          ui.pinEntry = '';
          ui.pinErrorCount = 0;
          const cloud = getCloud();
          const fbUser = cloud?.auth?.currentUser || null;
          if (fbUser && fbUser.uid === pinMeta.uid) {
            sessionStorage.setItem(PIN_UNLOCK_SESSION_KEY, fbUser.uid);
            ui.authMode = 'login';
            ui.pinLocked = false;
            await hydrateFromFirebaseUser(fbUser);
            ui.view = isKycVerified() ? 'home' : 'kyc';
            render();
            toast('PIN Verified! Assalam o Alaikum ✓', 'success');
          } else {
            const remKeep = loadRememberMe();
            const userCache = loadUserCache(pinMeta.uid);
            state = userCache ? userCache : defaultData();
            state.rememberMe = remKeep;
            state.pinSecurity = { enabled: true, hash: pinMeta.pinHash };
            state.session = {
              id: pinMeta.uid,
              uid: '',
              cloudUid: pinMeta.uid,
              name: pinMeta.name || state.settings?.ownerName || 'Workshop Owner',
              email: pinMeta.email || '',
              mobile: pinMeta.mobile || '',
              identifier: pinMeta.identifier || pinMeta.email || '',
              authType: pinMeta.authType || 'email',
              photo: '',
              provider: 'pin-local',
              loginAt: Date.now()
            };
            sessionStorage.setItem(PIN_UNLOCK_SESSION_KEY, pinMeta.uid);
            ui.authMode = 'login';
            ui.pinLocked = false;
            ui.view = isKycVerified() ? 'home' : 'kyc';
            if (state.kyc?.status === 'verifying') startKycCountdownTimer();
            saveState(true);
            render();
            toast('PIN Verified! Login ho gaya ✓', 'success');
          }
          return;
        }
      } else if (state.session && enteredHash === state.pinSecurity?.hash) {
        ui.pinEntry = '';
        ui.pinErrorCount = 0;
        ui.pinLocked = false;
        sessionStorage.setItem(PIN_UNLOCK_SESSION_KEY, state.session?.uid || state.session?.id || '1');
        ui.view = isKycVerified() ? 'home' : 'kyc';
        render();
        toast('App unlocked ✓', 'success');
        return;
      }

      ui.pinEntry = '';
      ui.pinErrorCount = Number(ui.pinErrorCount || 0) + 1;
      if (ui.pinErrorCount >= 5) {
        const cloud = getCloud();
        if (cloud) { try { await cloud.signOutUser(); } catch (e) {} }
        localStorage.removeItem(ACTIVE_UID_KEY);
        sessionStorage.removeItem(PIN_UNLOCK_SESSION_KEY);
        const remKeep = loadRememberMe();
        state = defaultData();
        state.rememberMe = remKeep;
        ui.pinLocked = false;
        ui.authMode = 'login';
        ui.pinErrorCount = 0;
        render();
        toast('5 wrong PIN attempts. Security logout ho gaya — Password se login karein.', 'error');
      } else {
        render();
        const grp = !state.session && ui.authMode === 'pin' ? 'auth-pin' : 'lock-pin';
        document.querySelector(`[data-digit-group="${grp}"][data-digit-index="0"]`)?.focus();
        toast('Wrong PIN!', 'error');
      }
    }

    // Form Submissions
    document.addEventListener('submit', async (e) => {
      const f = e.target;
      e.preventDefault();

      if (f.id === 'login-form') {
        const rem = getLockoutRemainingSec();
        if (rem > 0) {
          toast(`Too many wrong attempts. Wait ${rem}s.`, 'error');
          render();
          return;
        }
        const identifier = document.getElementById('login-email').value.trim();
        const pass = document.getElementById('login-password').value;
        const remember = document.getElementById('login-remember').checked;
        const cloud = getCloud();
        if (!cloud) { toast('Cloud service loading, 1 second baad try karein.', 'info'); return; }

        manualAuthFlow = true;
        ui.authLoading = true;
        render();
        try {
          const res = await cloud.signIn(identifier, pass);
          clearFailedPasswordAttempts();
          saveRememberMe({ email: remember ? identifier : '', remember });
          state.rememberMe = loadRememberMe();
          sessionStorage.setItem(PIN_UNLOCK_SESSION_KEY, res.user.uid);
          ui.authLoading = false;

          if (cloud.isAdminEmail(res.norm.email)) {
            state = defaultData();
            state.rememberMe = loadRememberMe();
            state.session = {
              id: res.user.uid,
              uid: res.user.uid,
              name: res.user.displayName || 'Admin',
              email: res.norm.email,
              mobile: '',
              identifier: res.norm.email,
              authType: 'email',
              photo: '',
              provider: 'firebase',
              isAdmin: true,
              loginAt: Date.now()
            };
            state.kyc.status = 'approved';
            ui.pinLocked = false;
            ui.view = 'admin';
            saveState(true);
            render();
            toast('Welcome Admin ✓', 'success');
            loadAdminUsersList();
          } else {
            const cached = loadUserCache(res.user.uid);
            const overrideInfo = {
              identifier,
              email: res.norm.email,
              mobile: res.norm.mobile,
              authType: res.norm.authType
            };
            if (cached) {
              state = cached;
              state.rememberMe = loadRememberMe();
              state.session = {
                id: res.user.uid,
                uid: res.user.uid,
                cloudUid: res.user.uid,
                name: state.session?.name || res.user.displayName || state.settings?.ownerName || 'User',
                email: res.norm.email || state.session?.email || '',
                mobile: res.norm.mobile || state.session?.mobile || '',
                identifier,
                authType: res.norm.authType,
                photo: '',
                provider: 'firebase',
                loginAt: Date.now()
              };
              ui.pinLocked = false;
              ui.view = (state.blocked || !isKycVerified()) ? 'kyc' : 'home';
              saveState(true);
              render();
              toast(`Assalam o Alaikum, ${state.session?.name || 'User'} ✓`, 'success');
              hydrateFromFirebaseUser(res.user, overrideInfo, { background: true });
            } else {
              await hydrateFromFirebaseUser(res.user, overrideInfo);
              ui.view = isAdminSession() ? 'admin' : ((state.blocked || !isKycVerified()) ? 'kyc' : 'home');
              render();
              toast(`Assalam o Alaikum, ${state.session?.name || 'User'} ✓`, 'success');
            }
            if (!state.blocked && isKycVerified() && (!state.pinSecurity?.enabled || !state.pinSecurity?.hash)) {
              if (ui.promptPinAfterLogin) {
                ui.promptPinAfterLogin = false;
                setTimeout(() => openModal('set-pin'), 250);
              } else {
                setTimeout(() => openModal('pin-setup-prompt'), 350);
              }
            } else {
              ui.promptPinAfterLogin = false;
            }
          }
        } catch (err) {
          ui.authLoading = false;
          const lockState = recordFailedPasswordAttempt();
          const msg = mapFirebaseAuthError(err);
          if (lockState.count >= 5) {
            toast('5 wrong passwords! Security lock active for 5 minutes.', 'error');
          } else {
            toast(`${msg} (${lockState.count}/5)`, 'error');
          }
          render();
        } finally {
          manualAuthFlow = false;
        }
        return;
      }

      if (f.id === 'signup-step1-form') {
        const name = (document.getElementById('su-step-name')?.value || '').trim();
        const sd = ui.signupData || newSignupData();
        ui.signupData = sd;
        if (!name) {
          sd.error = 'Apna Full Name zaroor likhein.';
          render();
          document.getElementById('su-step-name')?.focus();
          return;
        }
        sd.name = name;
        sd.error = '';
        ui.signupStep = 2;
        render();
        document.getElementById('su-step-email')?.focus();
        return;
      }

      if (f.id === 'signup-step2-form') {
        const email = (document.getElementById('su-step-email')?.value || '').trim().toLowerCase();
        const sd = ui.signupData || newSignupData();
        ui.signupData = sd;
        sd.email = email;
        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          sd.error = 'Sahi Gmail address likhein (e.g. name@gmail.com).';
          render();
          document.getElementById('su-step-email')?.focus();
          return;
        }
        sd.error = '';
        ui.authLoading = true;
        render();
        try {
          const otp = await sendSignupEmailOtp(email);
          sd.otpCode = otp;
          sd.otpSentTo = email;
          sd.otpSentAt = Date.now();
          sd.otpInput = '';
          sd.otpVerified = false;
          ui.authLoading = false;
          ui.signupStep = 3;
          render();
          document.querySelector('[data-digit-group="signup-otp"][data-digit-index="0"]')?.focus();
          toast('6-Digit OTP aapke Gmail par bhej diya gaya hai ✓', 'success');
        } catch (err) {
          ui.authLoading = false;
          sd.error = err?.message || 'OTP bhejne me masla aya. Internet check karein.';
          render();
          toast(sd.error, 'error');
        }
        return;
      }

      if (f.id === 'signup-step3-form') {
        const sd = ui.signupData || newSignupData();
        ui.signupData = sd;
        const entered = readDigitGroup('signup-otp', 6);
        sd.otpInput = entered;
        if (entered.length < 6) {
          sd.error = '6-Digit OTP mukammal likhein.';
          render();
          return;
        }
        if (!sd.otpCode || sd.otpSentTo !== sd.email || entered !== sd.otpCode) {
          sd.error = 'OTP ghalat hai. Sahi 6-digit code likhein ya Resend OTP karein.';
          render();
          toast('Wrong OTP!', 'error');
          return;
        }
        sd.otpVerified = true;
        sd.error = '';
        ui.signupStep = 4;
        render();
        document.getElementById('su-step-pass')?.focus();
        toast('OTP Verified ✓', 'success');
        return;
      }

      if (f.id === 'signup-step4-form') {
        const sd = ui.signupData || newSignupData();
        ui.signupData = sd;
        const pass = document.getElementById('su-step-pass')?.value || '';
        sd.password = pass;
        if (!pass || pass.length < 6) {
          sd.error = 'Password kam az kam 6 digits ya characters ka hona chahiye.';
          render();
          document.getElementById('su-step-pass')?.focus();
          return;
        }
        sd.error = '';
        ui.signupStep = 5;
        render();
        document.getElementById('su-step-confirm')?.focus();
        return;
      }

      if (f.id === 'signup-step5-form') {
        const sd = ui.signupData || newSignupData();
        ui.signupData = sd;
        const conf = document.getElementById('su-step-confirm')?.value || '';
        sd.confirmPassword = conf;
        if (!sd.otpVerified || !sd.name || !sd.email) {
          sd.error = 'Signup steps dubara mukammal karein.';
          ui.signupStep = 1;
          render();
          return;
        }
        if (conf !== sd.password) {
          sd.error = 'Password Match Nahi Ho Raha';
          render();
          document.getElementById('su-step-confirm')?.focus();
          toast('Password Match Nahi Ho Raha', 'error');
          return;
        }

        const cloud = getCloud();
        if (!cloud) {
          sd.error = 'Cloud service abhi load ho rahi hai.';
          render();
          return;
        }

        manualAuthFlow = true;
        ui.authLoading = true;
        sd.error = '';
        render();
        try {
          const res = await cloud.signUp(sd.name, sd.email, sd.password);
          clearFailedPasswordAttempts();
          saveRememberMe({ email: sd.email, remember: true });
          state.rememberMe = loadRememberMe();
          sessionStorage.setItem(PIN_UNLOCK_SESSION_KEY, res.user.uid);
          ui.authLoading = false;
          manualAuthFlow = false;
          await hydrateFromFirebaseUser(res.user, {
            isNewSignup: true,
            name: sd.name,
            identifier: sd.email,
            email: res.norm.email,
            mobile: '',
            authType: 'email'
          });
          ui.signupStep = 1;
          ui.signupData = newSignupData();
          ui.view = 'kyc';
          render();
          toast('Account ban gaya ✓ Ab KYC Verification mukammal karein.', 'success');
        } catch (err) {
          manualAuthFlow = false;
          ui.authLoading = false;
          sd.error = mapFirebaseAuthError(err);
          render();
          toast(sd.error, 'error');
        }
        return;
      }

      if (f.id === 'forgot-form') {
        const emailInput = document.getElementById('forgot-email');
        const alertBox = document.getElementById('forgot-alert');
        const email = (emailInput ? emailInput.value : '').trim();
        if (alertBox) { alertBox.classList.add('hidden'); alertBox.textContent = ''; }
        if (!email) {
          const msg = 'Apna registered Email Address likhein.';
          if (alertBox) { alertBox.textContent = msg; alertBox.classList.remove('hidden'); }
          toast(msg, 'error');
          return;
        }
        const cloud = getCloud();
        if (!cloud) { toast('Cloud service loading...', 'info'); return; }
        ui.authLoading = true;
        render();
        try {
          await cloud.sendReset(email);
          ui.authLoading = false;
