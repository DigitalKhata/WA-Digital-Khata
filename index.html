  <style>
    :root, html[data-theme="dark-blue"] {

    html[data-theme="black"] {

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;

      html, body {
        background-color: var(--bg-canvas);

    .app-shell-frame {
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      background-color: var(--bg-canvas);
      background-image:
        radial-gradient(65% 45% at 15% 0%, var(--bg-glow-1), transparent 70%),
        radial-gradient(55% 40% at 90% 18%, var(--bg-glow-2), transparent 70%);

      position: relative;
      overflow-x: hidden;

    @media (max-width: 430px) {
      .app-shell-frame {
        box-shadow: none;
      }
    }
    .tabular-nums {
      font-variant-numeric: tabular-nums;
      font-family: 'JetBrains Mono', 'Plus Jakarta Sans', monospace;
    }
    .glass-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .glass-strong {
      background: var(--glass-bg-strong);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);

    .glass-input {
      background: var(--input-bg);
      border: 1px solid var(--glass-border);

    .glass-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);

    .glass-input::placeholder { color: var(--text-muted); }
    .text-sec { color: var(--text-secondary); }
    .text-mut { color: var(--text-muted); }
    .nav-bar {
      background: var(--nav-bg);

      backdrop-filter: blur(20px);

    .blue-hero-card {
      background: linear-gradient(135deg, #1d4ed8 0%, #1e3a8a 52%, #0f172a 100%);

    }
    .blue-inner-card {
      background: rgba(255, 255, 255, 0.11);

    .btn-primary-grad {
      background: linear-gradient(90deg, #2563eb 0%, #06b6d4 100%);

      box-shadow: 0 10px 25px -8px rgba(6, 182, 212, 0.45);
      transition: transform 150ms ease, opacity 150ms ease;

    .btn-primary-grad:active { transform: scale(0.985); }
    .modules-theme-section {
      background: var(--glass-bg);

      backdrop-filter: blur(20px);

    .module-theme-card {
      background: rgba(15, 31, 68, 0.72);
      color: var(--text-primary);
      border: 1px solid var(--glass-border);
      box-shadow: 0 6px 18px -6px rgba(2, 6, 23, 0.45);
      transition: transform 150ms ease, border-color 150ms ease, background-color 150ms ease;
    }
    html[data-theme="light"] .module-theme-card {
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 0 4px 12px -4px rgba(15, 23, 42, 0.12);
    }
    html[data-theme="green"] .module-theme-card {
      background: rgba(6, 44, 33, 0.78);
    }
    html[data-theme="black"] .module-theme-card {
      background: rgba(24, 25, 31, 0.88);

    .module-theme-card:hover { transform: translateY(-2px); border-color: var(--accent); }
    .module-theme-card:active { transform: scale(0.97); }
    .emoji-3d {
      filter: drop-shadow(0 4px 6px rgba(15, 23, 42, 0.25));
      line-height: 1;
    }
    .digit-box-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
    }
    .otp-pin-box {
      flex: 1 1 0;
      min-width: 38px;

      border: 1.5px solid rgba(56, 189, 248, 0.28);

      font-size: 1.45rem;

      caret-color: #38bdf8;
      outline: none;
      box-shadow: inset 0 2px 6px rgba(2, 6, 23, 0.55);
      transition: border-color 150ms ease, box-shadow 150ms ease, transform 120ms ease, background-color 150ms ease;
    }
    .otp-pin-box.pin-box-lg {
      max-width: 58px;
      height: 60px;
      font-size: 1.65rem;
      border-radius: 16px;
    }
    .otp-pin-box:focus {
      border-color: #38bdf8;
      background: rgba(11, 27, 64, 0.98);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.30), 0 0 18px rgba(52, 211, 153, 0.24);
      transform: translateY(-1px);
    }
    .otp-pin-box.filled {
      border-color: rgba(52, 211, 153, 0.72);
      box-shadow: 0 0 0 2px rgba(52, 211, 153, 0.16);
    }
    html[data-theme="light"] .otp-pin-box {
      background: #f1f5f9;
      color: #0f172a;
      border-color: rgba(37, 99, 235, 0.28);
      box-shadow: inset 0 1px 4px rgba(15, 23, 42, 0.08);
    }
    html[data-theme="light"] .otp-pin-box:focus {
      background: #ffffff;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.24);
    }
    @media print {
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        color-adjust: exact !important;
      }
      body { background: #ffffff !important; color: #0f172a !important; }
      #app, #modal-root, #toast-root { display: none !important; }
      #print-root { display: block !important; color: #0f172a !important; padding: 12px !important; }
    }
  </style>
</head>
<body>
  <div id="app" class="app-shell-frame"></div>
  <div id="modal-root"></div>
  <div id="toast-root" class="fixed top-4 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-2 w-[92%] max-w-[400px] pointer-events-none"></div>
  <div id="print-root" class="hidden p-6 max-w-4xl mx-auto"></div>

  <script>
  (function() {
    'use strict';

    // Check if Tailwind loaded via Vite; if opened standalone via file://, load Tailwind browser script
    window.addEventListener('DOMContentLoaded', () => {
      const test = document.createElement('div');
      test.className = 'hidden';
      document.body.appendChild(test);
      if (getComputedStyle(test).display !== 'none') {
        const s = document.createElement('script');
        s.src = 'https://cdn.tailwindcss.com';
        document.head.appendChild(s);
      }
      test.remove();
    });

    const STORAGE_KEY = 'dk_warsha_aluminium_v1';
    const USER_CACHE_PREFIX = 'dk_warsha_user_v2_';
    const ACTIVE_UID_KEY = 'dk_active_uid_v2';
    const REMEMBER_ME_KEY = 'dk_remember_me_v2';
    const LAST_PIN_USER_KEY = 'dk_last_pin_user_v2';
    const AUTH_LOCK_KEY = 'dk_auth_lock_v1';
    const PENDING_SYNC_KEY = 'dk_pending_sync_uid';
    const PIN_UNLOCK_SESSION_KEY = 'dk_pin_unlocked_uid';
    const DEFAULT_LOGO_PATH = '/assets/aistudio/logo_5d9f834e.png';
    const KYC_VERIFY_DURATION_MS = 5 * 60 * 1000;
    const EMAILJS_PUBLIC_KEY = 'WyRcd-PQ5UkXjB_Sk';
    const EMAILJS_SERVICE_ID = 'service_lvdb54j';
    const EMAILJS_TEMPLATE_ID = 'template_b11csg9';

    const STOCK_CATEGORIES = [
      'Sheet', 'Hardware', 'Paint', 'Glue', 'Accessories',
      'Aluminium Profile', 'Glass (5mm)', 'Glass (8mm)', 'Glass (10mm)', 'Mirror',
      'Channel', 'Angle', 'Handle', 'Lock', 'Hinges', 'Roller', 'Wheel',
      'Screw', 'Silicon', 'Rubber', 'Cutter Blade', 'Polish', 'Other'
    ];
    const STOCK_CORE_CATEGORIES = ['Sheet', 'Hardware', 'Paint', 'Glue', 'Accessories'];
    const STOCK_UNITS = ['Sheet', 'Pcs', 'Kg', 'Litre', 'Packet'];
    const EXPENSE_CATEGORIES = ['Mess', 'Diesel', 'Rent', 'Committee', 'Salary', 'Supplier', 'Other'];
    const ALUMINIUM_WORK_ITEMS = [
      'Window',
      'Door',
      'Sliding Window',
      'Kitchen Cabinet',
      'Wardrobe',
      'Partition',
      'Shop Front',
      'Ventilator',
      'Net Door',
      'Glass Work'
    ];

    function defaultLowStockLimit(category) {
      const c = (category || '').toLowerCase();
      if (c.includes('sheet') || c.includes('aluminium') || c.includes('channel') || c.includes('angle') || c.includes('screw')) return 10;
      if (c.includes('glass') || c.includes('mirror')) return 5;
      return 5;
    }

    function getStockStatus(item) {
      const qty = Number(item?.qty || 0);
      const limit = Number(item?.minQty ?? 5);
      if (qty <= 0) return { label: 'Out of Stock', tone: 'red' };
      if (qty < limit) return { label: 'Low Stock', tone: 'yellow' };
      return { label: 'In Stock', tone: 'green' };
    }

    function isLowStock(item) {
      const qty = Number(item?.qty || 0);
      const limit = Number(item?.minQty ?? 5);
      return qty < limit || qty <= 0;
    }

    function getLowStockItems() {
      return state.stock.filter(isLowStock);
    }

    function defaultData() {
      return {
        accounts: [],
        session: null,
        lastUserMeta: null,
        rememberMe: { email: '', remember: false },
        biometric: {
          enabled: false,
          declined: false,
          credentialId: '',
          userId: '',
          userName: '',
          userEmail: '',
          userMobile: '',
          userPhoto: '',
          provider: 'firebase',
          createdAt: 0
        },
        cloudMeta: {
          uid: '',
          lastSyncAt: 0,
          lastBackupAt: 0,
          lastDailyBackupDate: ''
        },
        pinSecurity: {
          enabled: false,
          hash: ''
        },
        settings: {
          theme: 'dark-blue',
          customLogo: '',
          hideBalance: false,
          shopName: 'Warsha Aluminium Workshop',
          shopAddress: '',
          shopMobile: '',
          ownerName: '',
          ownerMobile: ''
        },
        customers: [],
        orders: [],
        customerPayments: [],
        transactions: [],
        stock: [],
        suppliers: [],
        supplierEntries: [],
        partyPayments: [],
        staff: [],
        staffLogs: [],
        messEntries: [],
        rentRecords: [],
        rentPayments: [],
        committees: [],
        archivedReports: [],
        lastActiveMonth: '',
        kyc: {
          status: 'none',
          fullName: '',
          cnic: '',
          frontPhoto: '',
          backPhoto: '',
          selfiePhoto: '',
          selfieConfirmed: false,
          shopName: '',
          mobile: '',
          submittedAt: 0,
          approvedAt: 0
        }
      };
    }

    function loadRememberMe() {
      try {
        const raw = localStorage.getItem(REMEMBER_ME_KEY);
        if (!raw) return { email: '', remember: false };
        const parsed = JSON.parse(raw);
        return { email: String(parsed?.email || ''), remember: Boolean(parsed?.remember) };
      } catch (e) {
        return { email: '', remember: false };
      }
    }

    function saveRememberMe(rem) {
      try {
        localStorage.setItem(REMEMBER_ME_KEY, JSON.stringify({
          email: rem?.remember ? String(rem.email || '') : '',
          remember: Boolean(rem?.remember)
        }));
      } catch (e) {}
    }

    function loadLastPinMeta() {
      try {
        const raw = localStorage.getItem(LAST_PIN_USER_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        return parsed && parsed.uid && parsed.pinHash ? parsed : null;
      } catch (e) {
        return null;
      }
    }

    function saveLastPinMeta(meta) {
      try {
        if (!meta || !meta.uid || !meta.pinHash) {
          localStorage.removeItem(LAST_PIN_USER_KEY);
          return;
        }
        localStorage.setItem(LAST_PIN_USER_KEY, JSON.stringify(meta));
      } catch (e) {}
    }

    function mergeWithDefaults(parsed) {
      const def = defaultData();
      if (!parsed || typeof parsed !== 'object') return def;
      return {
        ...def,
        ...parsed,
        biometric: { ...def.biometric, ...(parsed.biometric || {}) },
        cloudMeta: { ...def.cloudMeta, ...(parsed.cloudMeta || {}) },
        pinSecurity: { ...def.pinSecurity, ...(parsed.pinSecurity || {}) },
        settings: { ...def.settings, ...(parsed.settings || {}) },
        rememberMe: { ...def.rememberMe, ...(parsed.rememberMe || {}) },
        kyc: { ...def.kyc, ...(parsed.kyc || {}) }
      };
    }

    function loadUserCache(uid) {
      if (!uid) return null;
      try {
        const raw = localStorage.getItem(USER_CACHE_PREFIX + uid);
        if (!raw) return null;
        return mergeWithDefaults(JSON.parse(raw));
      } catch (e) {
        return null;
      }
    }

    function saveUserCache(uid, st, clearSession = false) {
      if (!uid || !st) return;
      try {
        const copy = { ...st, session: clearSession ? null : st.session };
        localStorage.setItem(USER_CACHE_PREFIX + uid, JSON.stringify(copy));
      } catch (e) {}
    }

    function loadState() {
      const rem = loadRememberMe();
      try {
        const activeUid = localStorage.getItem(ACTIVE_UID_KEY) || '';
        if (activeUid) {
          const cached = loadUserCache(activeUid);
          if (cached) {
            cached.rememberMe = rem;
            return cached;
          }
        }
        // One-time safe migration from legacy STORAGE_KEY ONLY if a real active session existed
        const legacyRaw = localStorage.getItem(STORAGE_KEY);
        if (legacyRaw) {
          const parsed = JSON.parse(legacyRaw);
          if (parsed && parsed.rememberMe) {
            saveRememberMe(parsed.rememberMe);
          }
          if (parsed && parsed.session && (parsed.session.uid || parsed.session.id)) {
            const migUid = parsed.session.uid || parsed.session.id;
            const merged = mergeWithDefaults(parsed);
            merged.rememberMe = loadRememberMe();
            saveUserCache(migUid, merged, false);
            localStorage.setItem(ACTIVE_UID_KEY, migUid);
            localStorage.removeItem(STORAGE_KEY);
            return merged;
          }
          localStorage.removeItem(STORAGE_KEY);
        }
      } catch (e) {}
      const clean = defaultData();
      clean.rememberMe = rem;
      return clean;
    }

    function newSignupData() {
      return {
        name: '',
        email: '',
        otpCode: '',
        otpSentTo: '',
        otpSentAt: 0,
        otpInput: '',
        otpVerified: false,
        password: '',
        confirmPassword: '',
        error: ''
      };
    }

    function isKycVerified() {
      return Boolean(state.kyc && state.kyc.status === 'approved');
    }

    let state = loadState();
    let ui = {
      view: state.session ? (isKycVerified() ? 'home' : 'kyc') : 'login',
      authMode: 'login',
      signupStep: 1,
      signupData: newSignupData(),
      showPass: false,
      authLoading: false,
      cloudHydrating: false,
      cloudNotice: '',
      kycWelcomeBanner: false,
      syncStatus: navigator.onLine ? (localStorage.getItem(PENDING_SYNC_KEY) ? 'pending' : 'synced') : 'offline',
      pinLocked: Boolean(state.session && state.pinSecurity?.enabled && sessionStorage.getItem(PIN_UNLOCK_SESSION_KEY) !== (state.session.uid || state.session.id)),
      pinEntry: '',
      pinErrorCount: 0,
      promptPinAfterLogin: false,
      selectedCustomerId: null,
      selectedOrderId: null,
      selectedStockId: null,
      selectedStaffId: null,
      selectedSupplierId: null,
      workFilter: 'all',
      customerFilter: 'all',
      stockFilter: 'all',
      rentTab: 'Home',
      paymentFilter: 'all',
      recordSearch: '',
      searchQuery: '',
      kycTimer: null,
      cameraStream: null
    };

    let cloudSyncTimer = null;
    let isSyncInFlight = false;
    let manualAuthFlow = false;
    let hydrateGeneration = 0;

    function updateSyncStatusBadgeDom() {
      const badge = document.getElementById('sync-status-pill');
      if (!badge) return;
      const st = ui.syncStatus;
      if (st === 'synced') {
        badge.className = 'inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-emerald-500/20 border border-emerald-400/40 text-emerald-200 text-[10px] font-bold';
        badge.textContent = 'Synced ✅';
      } else {
        badge.className = 'inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-amber-500/20 border border-amber-400/40 text-amber-200 text-[10px] font-bold';
        badge.textContent = st === 'syncing' ? 'Syncing ⏳' : 'Pending ⏳';
      }
    }

    function saveState(skipCloud = false) {
      saveRememberMe(state.rememberMe);
      const uid = state.session?.uid || state.session?.cloudUid || state.session?.id || state.cloudMeta?.uid || '';
      try {
        if (state.session && uid) {
          localStorage.setItem(ACTIVE_UID_KEY, uid);
          saveUserCache(uid, state, false);
          if (state.pinSecurity?.enabled && state.pinSecurity?.hash) {
            saveLastPinMeta({
              uid,
              name: state.session.name || '',
              email: state.session.email || '',
              mobile: state.session.mobile || '',
              identifier: state.session.identifier || state.session.email || state.session.mobile || '',
              authType: state.session.authType || 'email',
              pinHash: state.pinSecurity.hash
            });
          } else {
            const curPinMeta = loadLastPinMeta();
            if (curPinMeta && curPinMeta.uid === uid) {
              saveLastPinMeta(null);
            }
          }
        }
      } catch (e) {
        toast('Storage full! Try removing large photos or export backup.', 'error');
      }
      if (!skipCloud && state.session && state.session.uid) {
        try { localStorage.setItem(PENDING_SYNC_KEY, state.session.uid); } catch (e) {}
        ui.syncStatus = navigator.onLine ? 'pending' : 'offline';
        updateSyncStatusBadgeDom();
        scheduleCloudSync();
      }
    }

    function applyTheme() {
      const t = state.settings.theme || 'dark-blue';
      document.documentElement.setAttribute('data-theme', t);
      if (t === 'light') document.documentElement.classList.remove('dark');
      else document.documentElement.classList.add('dark');
    }

    function esc(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function uid(prefix = 'id') {
      return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
    }

    function todayISO() {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function nowTime() {
      const d = new Date();
      return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    }

    function formatTime12(timeStr) {
      if (!timeStr) return '';
      const parts = String(timeStr).split(':');
      if (parts.length < 2) return timeStr;
      let h = Number(parts[0]);
      const m = parts[1].slice(0, 2);
      if (isNaN(h)) return timeStr;
      const ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      return `${String(h).padStart(2, '0')}:${m} ${ampm}`;
    }

    function formatDateTime(dateStr, timeStr, isoFallback) {
      const d = dateStr || (isoFallback ? String(isoFallback).slice(0, 10) : '');
      const t = timeStr || (isoFallback ? String(isoFallback).slice(11, 16) : '');
      return `${formatShortDate(d)}${t ? ' · ' + formatTime12(t) : ''}`;
    }

    function currentMonthKey() {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    }

    function formatMonthLabel(monthKey) {
      if (!monthKey) return '';
      const [y, m] = monthKey.split('-');
      const names = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      return `${names[Number(m) - 1] || m} ${y}`;
    }

    function formatDisplayDate(dateStr) {
      const d = dateStr ? new Date(dateStr + (dateStr.length === 10 ? 'T12:00:00' : '')) : new Date();
      if (isNaN(d.getTime())) return '';
      const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      return `${days[d.getDay()]}, ${String(d.getDate()).padStart(2, '0')} ${months[d.getMonth()]} ${d.getFullYear()}`;
    }

    function formatShortDate(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr + (dateStr.length === 10 ? 'T12:00:00' : ''));
      if (isNaN(d.getTime())) return dateStr;
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      return `${String(d.getDate()).padStart(2, '0')} ${months[d.getMonth()]} ${d.getFullYear()}`;
    }

    function fmtRs(num, maskable = false) {
      if (maskable && state.settings.hideBalance) return 'Rs ••••••';
      const n = Number(num) || 0;
      const abs = Math.abs(Math.round(n));
      return (n < 0 ? '-Rs ' : 'Rs ') + abs.toLocaleString('en-PK');
    }

    // Auto Archive on 1st of new month
    function checkAutoArchive() {
      const curMonth = currentMonthKey();
      if (!state.lastActiveMonth) {
        state.lastActiveMonth = curMonth;
        saveState();
        return;
      }
      if (state.lastActiveMonth !== curMonth) {
        const monthsSet = new Set();
        state.transactions.forEach(t => { if (t.date && t.date.slice(0, 7) < curMonth) monthsSet.add(t.date.slice(0, 7)); });
        state.orders.forEach(o => { if (o.date && o.date.slice(0, 7) < curMonth) monthsSet.add(o.date.slice(0, 7)); });
        let archivedCount = 0;
        monthsSet.forEach(mKey => {
          if (!state.archivedReports.some(r => r.monthKey === mKey)) {
            const inc = state.transactions.filter(t => t.type === 'income' && (t.date || '').startsWith(mKey)).reduce((s, t) => s + Number(t.amount || 0), 0);
            const exp = state.transactions.filter(t => t.type === 'expense' && (t.date || '').startsWith(mKey)).reduce((s, t) => s + Number(t.amount || 0), 0);
            const ord = state.orders.filter(o => (o.date || '').startsWith(mKey)).length;
            if (inc > 0 || exp > 0 || ord > 0) {
              const [y, m] = mKey.split('-');
              const names = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
              state.archivedReports.push({
                monthKey: mKey,
                label: `${names[Number(m) - 1] || m} ${y}`,
                income: inc,
                expense: exp,
                profit: inc - exp,
                ordersCount: ord,
                archivedAt: new Date().toISOString()
              });
              archivedCount++;
            }
          }
        });
        state.lastActiveMonth = curMonth;
        saveState();
        if (archivedCount > 0) toast(`Auto-archived ${archivedCount} previous month report(s).`, 'info');
      }
    }

    // Check KYC 5-minute auto-approval
    function getKycCountdownInfo() {
      const k = state.kyc || {};
      const elapsed = Math.max(0, Date.now() - (k.submittedAt || Date.now()));
      const remainingMs = Math.max(0, KYC_VERIFY_DURATION_MS - elapsed);
      const displaySec = remainingMs > 0 ? Math.floor(Math.max(0, remainingMs - 1) / 1000) : 0;
      const mins = Math.floor(displaySec / 60);
      const secs = displaySec % 60;
      const timerStr = `${mins}:${String(secs).padStart(2, '0')}`;
      const pct = Math.min(100, Math.round((elapsed / KYC_VERIFY_DURATION_MS) * 100));
      return { elapsed, remainingMs, timerStr, pct };
    }

    function startKycCountdownTimer() {
      if (ui.kycTimer) { clearInterval(ui.kycTimer); ui.kycTimer = null; }
      if (!state.kyc || state.kyc.status !== 'verifying') return;
      ui.kycTimer = setInterval(() => {
        checkKycAutoApprove();
        if (state.kyc && state.kyc.status === 'verifying' && ui.view === 'kyc') {
          const info = getKycCountdownInfo();
          const timerEl = document.getElementById('kyc-countdown-text');
          const barEl = document.getElementById('kyc-progress-bar');
          const pctEl = document.getElementById('kyc-pct-text');
          if (timerEl && barEl) {
            timerEl.textContent = info.timerStr;
            barEl.style.width = `${info.pct}%`;
            if (pctEl) pctEl.textContent = `${info.pct}%`;

            render();
          }
        }

    }

    function checkKycAutoApprove() {
      if (state.kyc && state.kyc.status === 'verifying' && state.kyc.submittedAt) {
        const elapsed = Date.now() - state.kyc.submittedAt;
        if (elapsed >= KYC_VERIFY_DURATION_MS) {
          state.kyc.status = 'approved';

          if (ui.kycTimer) { clearInterval(ui.kycTimer); ui.kycTimer = null; }

    function migrateLegacyData() {
      let changed = false;
      if (!Array.isArray(state.messEntries)) { state.messEntries = []; changed = true; }
      if (!Array.isArray(state.rentRecords)) { state.rentRecords = []; changed = true; }
      if (!Array.isArray(state.rentPayments)) { state.rentPayments = []; changed = true; }
      if (!Array.isArray(state.partyPayments)) { state.partyPayments = []; changed = true; }

      // Migrate legacy order advances into customerPayments without double counting
      state.orders.forEach(o => {
        if (!o.time && o.createdAt) { o.time = String(o.createdAt).slice(11, 16) || '12:00'; changed = true; }
        const adv = Number(o.advance || 0);
        const hasLinkedPay = state.customerPayments.some(p => p.orderId === o.id);
        if (adv > 0 && !hasLinkedPay) {
          state.customerPayments.push({
            id: uid('pay'),
            customerId: o.customerId,
            orderId: o.id,
            amount: adv,
            date: o.date || todayISO(),
            time: o.time || '12:00',
            method: 'Cash',
            note: 'Initial Advance',
            isInitialAdvance: true,
            createdAt: o.createdAt || new Date().toISOString()
          });
          changed = true;
        }
      });

      // Migrate legacy Mess transactions into messEntries
      state.transactions.forEach(tx => {
        if (tx.type === 'expense' && tx.category === 'Mess' && !tx.messId) {
          const already = state.messEntries.some(m => m.txId === tx.id);
          if (!already) {
            const mId = uid('mess');
            state.messEntries.push({
              id: mId,
              itemName: tx.title || 'Mess Expense',
              qty: '1',
              amount: Number(tx.amount || 0),
              date: tx.date || todayISO(),
              time: tx.time || '12:00',
              paidBy: 'Workshop',
              note: '',
              txId: tx.id,
              createdAt: tx.createdAt || new Date().toISOString()
            });
            tx.messId = mId;
            changed = true;
          }
        }
      });

      // Migrate legacy Rent transactions into rentRecords + rentPayments
      const legacyRents = state.transactions.filter(tx => tx.type === 'expense' && tx.category === 'Rent' && !tx.rentPaymentId);
      if (legacyRents.length > 0) {
        let shopRentRec = state.rentRecords.find(r => r.isLegacyImport);
        if (!shopRentRec) {
          const curMonthLegacySum = legacyRents
            .filter(x => (x.date || '').startsWith(currentMonthKey()))
            .reduce((s, x) => s + Number(x.amount || 0), 0);
          shopRentRec = {
            id: uid('rent'),
            rentType: 'Shop',
            title: 'Previous Shop Rent Entries',
            ownerName: 'Landlord',
            monthlyAmount: curMonthLegacySum,
            dueDate: 'Monthly',
            date: legacyRents[0].date || todayISO(),
            time: '12:00',
            note: 'Auto-imported from previous Rent expenses',
            isLegacyImport: true,
            createdAt: new Date().toISOString()
          };
          state.rentRecords.push(shopRentRec);
        }
        legacyRents.forEach(tx => {
          const rpId = uid('rpay');
          state.rentPayments.push({
            id: rpId,
            rentId: shopRentRec.id,
            amount: Number(tx.amount || 0),
            date: tx.date || todayISO(),
            time: tx.time || '12:00',
            method: 'Cash',
            note: tx.title || 'Legacy Rent Payment',
            txId: tx.id,
            createdAt: tx.createdAt || new Date().toISOString()
          });
          tx.rentPaymentId = rpId;
          changed = true;
        });
      }

      // Normalize stock metadata
      state.stock.forEach(s => {
        if (s.initialQty === undefined) { s.initialQty = Number(s.qty || 0); changed = true; }
        if (s.usedQty === undefined) { s.usedQty = 0; changed = true; }
        if (s.purchaseDate === undefined) { s.purchaseDate = (s.updatedAt ? String(s.updatedAt).slice(0, 10) : todayISO()); changed = true; }
        if (s.purchaseTime === undefined) { s.purchaseTime = '12:00'; changed = true; }
        if (!Array.isArray(s.history)) {
          s.history = [{
            id: uid('sh'),
            type: 'purchase',
            qtyDelta: Number(s.qty || 0),
            remaining: Number(s.qty || 0),
            rate: Number(s.cost || 0),
            date: s.purchaseDate,
            time: s.purchaseTime,
            partyName: s.supplierName || '',
            note: 'Stock Added'
          }];
          changed = true;
        }
      });

      if (changed) saveState();
    }

    function recalcOrderTotals(orderId) {
      const o = state.orders.find(x => x.id === orderId);
      if (!o) return;
      const orderPays = state.customerPayments.filter(p => p.orderId === orderId);
      o.advance = orderPays.reduce((s, p) => s + Number(p.amount || 0), 0);
    }

    function getOrderStats(order) {
      const sqFt = Number(order.length || 0) * Number(order.width || 0) * Number(order.qty || 1);
      const total = Math.round(sqFt * Number(order.rate || 0));
      const orderPays = state.customerPayments.filter(p => p.orderId === order.id);
      const paid = orderPays.length > 0 ? orderPays.reduce((s, p) => s + Number(p.amount || 0), 0) : Number(order.advance || 0);
      const remaining = Math.max(0, total - paid);
      const extraPaid = Math.max(0, paid - total);
      return { sqFt, total: order.total != null ? Number(order.total) : total, paid, remaining, extraPaid, payments: orderPays };
    }

    function getCustomerStats(customerId) {
      const cust = state.customers.find(c => c.id === customerId);
      const opening = Number(cust?.openingBalance || 0);
      const custOrders = state.orders.filter(o => o.customerId === customerId);
      const custPays = state.customerPayments.filter(p => p.customerId === customerId);
      const billed = opening + custOrders.reduce((s, o) => s + Number(o.total || 0), 0);
      const paidViaPayments = custPays.reduce((s, p) => s + Number(p.amount || 0), 0);
      // Fallback if any order has advance without a linked customerPayments row
      const unlinkedAdvance = custOrders.reduce((s, o) => {
        const hasPay = custPays.some(p => p.orderId === o.id);
        return s + (hasPay ? 0 : Number(o.advance || 0));
      }, 0);
      const received = paidViaPayments + unlinkedAdvance;
      const baqaya = Math.max(0, billed - received);
      const extraPaid = Math.max(0, received - billed);
      return { billed, received, baqaya, extraPaid, ordersCount: custOrders.length };
    }

    function getPartyStockItems(supplier) {
      if (!supplier) return [];
      const sName = (supplier.name || '').trim().toLowerCase();
      return state.stock.filter(item =>
        item.supplierId === supplier.id ||
        (sName && (item.supplierName || '').trim().toLowerCase() === sName)
      );
    }

    function getSupplierStats(supplierId) {
      const sup = state.suppliers.find(x => x.id === supplierId);
      const entries = state.supplierEntries.filter(e => e.supplierId === supplierId);
      const stockItems = getPartyStockItems(sup);
      const stockPurchaseTotal = stockItems.reduce((s, item) => {
        const baseVal = item.purchaseTotal != null ? Number(item.purchaseTotal) : (Number(item.initialQty ?? item.qty ?? 0) * Number(item.cost || 0));
        return s + baseVal;
      }, 0);
      const entriesTotal = entries.reduce((s, e) => s + Number(e.amount || 0), 0);
      const entriesPaid = entries.reduce((s, e) => s + Number(e.paid || 0), 0);
      const partyPays = (state.partyPayments || []).filter(p => p.supplierId === supplierId);
      const directPaid = partyPays.reduce((s, p) => s + Number(p.amount || 0), 0);
      const total = entriesTotal + stockPurchaseTotal;
      const paid = entriesPaid + directPaid;
      const remaining = Math.max(0, total - paid);
      return { total, paid, remaining, count: entries.length + stockItems.length, stockCount: stockItems.length };
    }

    function getMetrics() {
      const mKey = currentMonthKey();
      const tDay = todayISO();
      let totalIncome = 0, totalExpense = 0, monthIncome = 0, monthExpense = 0;
      state.transactions.forEach(t => {
        const amt = Number(t.amount || 0);
        if (t.type === 'income') {
          totalIncome += amt;
          if ((t.date || '').startsWith(mKey)) monthIncome += amt;
        } else if (t.type === 'expense') {
          totalExpense += amt;
          if ((t.date || '').startsWith(mKey)) monthExpense += amt;
        }
      });
      const totalProfit = totalIncome - totalExpense;

      let custTotal = 0, custReceived = 0, custBaqaya = 0, baqayaBills = 0;
      state.customers.forEach(c => {
        const st = getCustomerStats(c.id);
        custTotal += st.billed;
        custReceived += st.received;
        custBaqaya += st.baqaya;
        if (st.baqaya > 0) baqayaBills++;
      });

      const totalWork = state.orders.length;
      const todayWork = state.orders.filter(o => o.date === tDay).length;
      const totalPayment = custTotal;
      const pendingPayment = custBaqaya;

      return {
        totalIncome, totalExpense, totalProfit,
        monthIncome, monthExpense,
        custTotal, custReceived, custBaqaya, baqayaBills,
        totalWork, todayWork, totalPayment, pendingPayment
      };
    }

    function getLast6MonthsSeries() {
      const now = new Date();
      const labels = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sept','Oct','Nov','Dec'];
      const series = [];
      for (let i = 5; i >= 0; i--) {
        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
        let inc = 0, exp = 0;
        state.transactions.forEach(t => {
          if ((t.date || '').startsWith(key)) {
            if (t.type === 'income') inc += Number(t.amount || 0);
            else if (t.type === 'expense') exp += Number(t.amount || 0);
          }
        });
        series.push({ key, label: labels[d.getMonth()], income: inc, expense: exp });
      }
      return series;
    }

    async function hashPassword(pw) {
      if (window.crypto && crypto.subtle) {
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
        return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
      }
      return btoa(unescape(encodeURIComponent(pw)));
    }

    function compressImageFile(file, maxW = 640, quality = 0.72) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const maxDim = Math.max(img.width || maxW, img.height || maxW);
            const scale = Math.min(1, maxW / maxDim);
            const w = Math.max(1, Math.round((img.width || maxW) * scale));
            const h = Math.max(1, Math.round((img.height || maxW) * scale));
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#071330';
            ctx.fillRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
          img.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function evaluateSelfieFaceInOval(video) {
      if (!video || video.readyState < 2 || !video.videoWidth || !video.videoHeight || !camAnalysisCtx) {
        return { ok: false, msg: 'Camera tayyar ho raha hai...' };
      }

      const W = camAnalysisCanvas.width;
      const H = camAnalysisCanvas.height;
      camAnalysisCtx.save();
      camAnalysisCtx.scale(-1, 1);
      camAnalysisCtx.drawImage(video, -W, 0, W, H);
      camAnalysisCtx.restore();

      const imgData = camAnalysisCtx.getImageData(0, 0, W, H).data;
      const cx = 0.5, cy = 0.46, rx = 0.27, ry = 0.35;
      let ovalCount = 0, coreCount = 0, skinOval = 0, skinCore = 0;
      let sumY = 0, sumY2 = 0;
      let gradCount = 0, gradHits = 0;

      for (let py = 2; py < H - 2; py += 2) {
        const ny = py / H;
        for (let px = 2; px < W - 2; px += 2) {
          const nx = px / W;
          const dx = (nx - cx) / rx;
          const dy = (ny - cy) / ry;
          const dist2 = dx * dx + dy * dy;
          if (dist2 > 1.0) continue;

          const idx = (py * W + px) * 4;
          const r = imgData[idx], g = imgData[idx + 1], b = imgData[idx + 2];
          const y = 0.299 * r + 0.587 * g + 0.114 * b;
          const cb = 128 - 0.168736 * r - 0.331264 * g + 0.5 * b;
          const cr = 128 + 0.5 * r - 0.418688 * g - 0.081312 * b;

          ovalCount++;
          sumY += y;
          sumY2 += y * y;

          const isSkin = y > 32 && y < 246 && cb >= 74 && cb <= 138 && cr >= 130 && cr <= 180 && r >= g * 0.90 && r > b * 0.96;
          if (isSkin) skinOval++;
          if (dist2 <= 0.45) {
            coreCount++;
            if (isSkin) skinCore++;
          }

          if (ny >= 0.28 && ny <= 0.64) {
            const idxR = (py * W + (px + 2)) * 4;
            const idxD = ((py + 2) * W + px) * 4;
            const yR = 0.299 * imgData[idxR] + 0.587 * imgData[idxR + 1] + 0.114 * imgData[idxR + 2];
            const yD = 0.299 * imgData[idxD] + 0.587 * imgData[idxD + 1] + 0.114 * imgData[idxD + 2];
            gradCount++;
            if (Math.abs(y - yR) + Math.abs(y - yD) > 16) gradHits++;
          }
        }
      }

      if (!ovalCount || !coreCount) return { ok: false, msg: 'Apna chehra gol/oval nishaan ke andar layein' };

      const avgY = sumY / ovalCount;
      const variance = Math.max(0, (sumY2 / ovalCount) - avgY * avgY);
      const stdDev = Math.sqrt(variance);
      const skinRatio = skinOval / ovalCount;
      const coreSkinRatio = skinCore / coreCount;
      const edgeDensity = gradCount ? (gradHits / gradCount) : 0;

      if (avgY < 26) return { ok: false, msg: 'Roshni bohat kam hai — light me aayein' };
      if (avgY > 246 && stdDev < 10) return { ok: false, msg: 'Camera ke samne clear chehra rakhein' };

      if (kycFaceDetector) {
        try {
          const faces = await kycFaceDetector.detect(camAnalysisCanvas);
          if (Array.isArray(faces) && faces.length > 0) {
            const insideFace = faces.some((f) => {
              const b = f.boundingBox;
              const fx = (b.x + b.width * 0.5) / W;
              const fy = (b.y + b.height * 0.5) / H;
              const fw = b.width / W;
              const d = Math.pow((fx - cx) / 0.29, 2) + Math.pow((fy - cy) / 0.37, 2);
              return d <= 1.0 && fw >= 0.15 && fw <= 0.88;
            });
            if (insideFace) {
              return { ok: true, msg: 'Chehra Oval me hai ✓ — Ab Photo Khinchein' };
            }
            return { ok: false, msg: 'Apna chehra gol/oval nishaan ke bilkul andar layein' };
          }
        } catch (e) {}
      }

      if (coreSkinRatio >= 0.20 && skinRatio >= 0.18 && stdDev >= 11 && edgeDensity >= 0.06) {
        return { ok: true, msg: 'Chehra Oval me hai ✓ — Ab Photo Khinchein' };
      }
      if (coreSkinRatio < 0.15) {
        return { ok: false, msg: 'Apna chehra gol/oval nishaan ke andar layein' };
      }
      return { ok: false, msg: 'Chehra seedha camera ki taraf aur oval ke andar rakhein' };
    }

    function bufToBase64Url(buf) {
      const bytes = new Uint8Array(buf);
      let bin = '';
      for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function base64UrlToBuf(b64) {
      const pad = b64.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((b64.length + 3) % 4);
      const bin = atob(pad);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return bytes.buffer;
    }

    function randomChallenge() {
      const arr = new Uint8Array(32);
      crypto.getRandomValues(arr);
      return arr;
    }

    async function isPlatformBiometricReady() {
      if (!window.PublicKeyCredential || !navigator.credentials || typeof navigator.credentials.create !== 'function') {
        return false;

      try {
        if (typeof PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable === 'function') {
          return await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
        }
        return true;
      } catch (e) {
        return false;
      }
    }

    function getAuthLockState() {
      try {
        return JSON.parse(localStorage.getItem(AUTH_LOCK_KEY) || '{}') || {};
      } catch {
        return {};
      }
    }

    function recordFailedPasswordAttempt() {
      const lock = getAuthLockState();
      const count = Number(lock.count || 0) + 1;
      const next = { count, lockedUntil: count >= 5 ? Date.now() + 5 * 60 * 1000 : 0 };
      localStorage.setItem(AUTH_LOCK_KEY, JSON.stringify(next));
      return next;
    }

    function clearFailedPasswordAttempts() {
      localStorage.removeItem(AUTH_LOCK_KEY);
    }

    function getLockoutRemainingSec() {
      const lock = getAuthLockState();
      if (!lock.lockedUntil || lock.lockedUntil <= Date.now()) return 0;
      return Math.ceil((lock.lockedUntil - Date.now()) / 1000);
    }

        return 'Firebase Email/Password Auth abhi Console me ON nahi hai. Neeche diya step follow karein.';

      if (code === 'auth/email-already-in-use') return 'Yeh Email / Mobile pehle se registered hai. Sign in karein.';
      if (code === 'auth/invalid-credential' || code === 'auth/wrong-password' || code === 'auth/user-not-found') {
        return 'Email/Mobile ya Password ghalat hai.';
      }
      if (code === 'auth/weak-password') return 'Password kam az kam 6 characters ka rakhein.';
      if (code === 'auth/too-many-requests') return 'Zyada failed tries ki wajah se temporarily blocked hai. Thori der baad try karein.';
      if (code === 'auth/network-request-failed') return 'Internet connection check karein.';
      if (code === 'auth/requires-recent-login') return 'Security ke liye pehle Sign Out karke dobara Sign In karein, phir password change karein.';
      return msg || 'Authentication failed.';
    }

          await fbUser.getIdToken();
        } catch (tokErr) {
          if (navigator.onLine) {
            if (myGen === hydrateGeneration) {
              try { await cloud.signOutUser(); } catch (e) {}
            }
            return;
          }
        }
        if (myGen !== hydrateGeneration || !cloud.auth?.currentUser || cloud.auth.currentUser.uid !== fbUser.uid) {
          return;
        }

        const prevUid = state.session?.uid || state.cloudMeta?.uid || '';
        const isNewSignup = Boolean(overrideInfo.isNewSignup);
        const remCopy = loadRememberMe();

        // STRICT PER-ACCOUNT ISOLATION:
        // Never carry another user's local records into a new signup or different account.
        if (isNewSignup || prevUid !== fbUser.uid) {
          state = defaultData();
          state.rememberMe = remCopy;
        }

        if (isNewSignup) {
          const displayName = String(overrideInfo.name || fbUser.displayName || 'User');
          const emailVal = String(overrideInfo.email || fbUser.email || '');
          state.session = {
            id: fbUser.uid,
            uid: fbUser.uid,
            name: displayName,
            email: emailVal,
            mobile: '',
            identifier: emailVal,
            authType: 'email',
            photo: '',
            provider: 'firebase',
            loginAt: Date.now()
          };
          state.cloudMeta = { uid: fbUser.uid, lastSyncAt: 0, lastBackupAt: 0, lastDailyBackupDate: '' };
          state.kyc.status = 'none';
          state.kyc.fullName = displayName;
          ui.pinLocked = false;
          ui.view = 'kyc';
          saveState(true);
          await flushCloudSync();
          return;
        }

        const bundle = await cloud.loadUserBundle(fbUser.uid);
        if (myGen !== hydrateGeneration || !cloud.auth?.currentUser || cloud.auth.currentUser.uid !== fbUser.uid) {
          return;
        }
        const prof = bundle.profile || {};
        const uidCache = loadUserCache(fbUser.uid);

        if (bundle.hasCloudData) {
          const hasPending = localStorage.getItem(PENDING_SYNC_KEY) === fbUser.uid;
          if (hasPending && uidCache && hasWorkshopRecords(uidCache)) {
            applyBackupPayload({ data: uidCache }, true);
          } else {
            applyBackupPayload({ data: bundle.vaultData }, true);
          }
        } else if (uidCache) {
          applyBackupPayload({ data: uidCache }, true);
        }

        const displayName = String(overrideInfo.name || prof.name || fbUser.displayName || 'User');
        const emailVal = String(overrideInfo.email || prof.email || (fbUser.email && !fbUser.email.endsWith('@mobile.digitalkhata.app') ? fbUser.email : '') || '');
        const mobileVal = String(overrideInfo.mobile || prof.mobile || '');
        const identifierVal = String(overrideInfo.identifier || prof.identifier || emailVal || mobileVal || '');

        state.session = {
          id: fbUser.uid,
          uid: fbUser.uid,
          name: displayName,
          email: emailVal,
          mobile: mobileVal,
          identifier: identifierVal,
          authType: (prof.authType === 'mobile' || overrideInfo.authType === 'mobile') ? 'mobile' : 'email',
          photo: '',
          provider: 'firebase',
          loginAt: Date.now()
        };
        if (prof.pinEnabled && prof.pinHash) {
          state.pinSecurity = { enabled: true, hash: String(prof.pinHash) };
        }
        state.cloudMeta = {
          ...(state.cloudMeta || {}),
          uid: fbUser.uid,
          lastSyncAt: Number(prof.lastSyncAt || state.cloudMeta?.lastSyncAt || 0),
          lastBackupAt: Number(prof.lastBackupAt || bundle.latestBackup?.createdAt || state.cloudMeta?.lastBackupAt || 0)
        };
        if (!state.kyc.fullName && displayName) state.kyc.fullName = displayName;
        if (!state.kyc.mobile && mobileVal) state.kyc.mobile = mobileVal;

        ui.pinLocked = Boolean(
          state.pinSecurity?.enabled &&
          state.pinSecurity?.hash &&
          sessionStorage.getItem(PIN_UNLOCK_SESSION_KEY) !== fbUser.uid
        );
        if (state.kyc && state.kyc.status === 'verifying' && state.kyc.submittedAt && (Date.now() - state.kyc.submittedAt >= KYC_VERIFY_DURATION_MS)) {
          state.kyc.status = 'approved';
          state.kyc.approvedAt = Date.now();
          ui.kycWelcomeBanner = true;
        }
        saveState(true);
        await flushCloudSync();
        if (myGen !== hydrateGeneration) return;
        await maybeRunAutoDailyBackup();
      } catch (err) {
        if (myGen !== hydrateGeneration) return;
        if (!err || err.message !== 'AUTH_SESSION_CHANGED') {
          ui.syncStatus = 'pending';
        }
      } finally {
        if (myGen !== hydrateGeneration) return;
        ui.cloudHydrating = false;
        if (!state.session) {
          ui.view = 'login';
        } else if (!isKycVerified()) {
          ui.view = 'kyc';
          if (state.kyc?.status === 'verifying') startKycCountdownTimer();
        } else {
          ui.view = ui.view === 'login' ? 'home' : ui.view;
        }
        render();
      }
    }

    function buildBackupPayload() {
      return {
        app: 'Digital Khata - Warsha Aluminium',
        version: 2,
        exportedAt: new Date().toISOString(),
        data: {
          settings: state.settings,
          customers: state.customers,
          orders: state.orders,
          customerPayments: state.customerPayments,
          transactions: state.transactions,
          stock: state.stock,
          suppliers: state.suppliers,
          supplierEntries: state.supplierEntries,
          partyPayments: state.partyPayments,
          staff: state.staff,
          staffLogs: state.staffLogs,
          messEntries: state.messEntries,
          rentRecords: state.rentRecords,
          rentPayments: state.rentPayments,
          committees: state.committees,
          archivedReports: state.archivedReports,
          lastActiveMonth: state.lastActiveMonth,
          kyc: state.kyc
        }
      };
    }

    function applyBackupPayload(payload, resetFirst = false) {
      const d = payload && payload.data ? payload.data : payload;
      if (!d || typeof d !== 'object') throw new Error('Invalid backup format');
      const def = defaultData();
      if (resetFirst) {
        const keepSess = state.session;
        const keepRem = state.rememberMe;
        const keepCloud = state.cloudMeta;
        const keepPin = state.pinSecurity;
        const keepBio = state.biometric;
        state = defaultData();
        state.session = keepSess;
        state.rememberMe = keepRem;
        state.cloudMeta = keepCloud;
        state.pinSecurity = keepPin;
        state.biometric = keepBio;
      }
      if (d.settings) state.settings = { ...def.settings, ...d.settings };
      if (Array.isArray(d.customers)) state.customers = d.customers;
      if (Array.isArray(d.orders)) state.orders = d.orders;
      if (Array.isArray(d.customerPayments)) state.customerPayments = d.customerPayments;
      if (Array.isArray(d.transactions)) state.transactions = d.transactions;
      if (Array.isArray(d.stock)) state.stock = d.stock;
      if (Array.isArray(d.suppliers)) state.suppliers = d.suppliers;
      if (Array.isArray(d.supplierEntries)) state.supplierEntries = d.supplierEntries;
      if (Array.isArray(d.partyPayments)) state.partyPayments = d.partyPayments;
      if (Array.isArray(d.staff)) state.staff = d.staff;
      if (Array.isArray(d.staffLogs)) state.staffLogs = d.staffLogs;
      if (Array.isArray(d.messEntries)) state.messEntries = d.messEntries;
      if (Array.isArray(d.rentRecords)) state.rentRecords = d.rentRecords;
      if (Array.isArray(d.rentPayments)) state.rentPayments = d.rentPayments;
      if (Array.isArray(d.committees)) state.committees = d.committees;
      if (Array.isArray(d.archivedReports)) state.archivedReports = d.archivedReports;
      if (d.lastActiveMonth) state.lastActiveMonth = d.lastActiveMonth;
      if (d.kyc && typeof d.kyc === 'object') state.kyc = { ...def.kyc, ...d.kyc };
      migrateLegacyData();
      applyTheme();
      saveState(true);
      render();
    }

    function downloadFile(filename, content, mime) {
      const blob = new Blob([content], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function exportJsonBackup() {
      const name = `DigitalKhata_Backup_${todayISO()}.json`;
      downloadFile(name, JSON.stringify(buildBackupPayload(), null, 2), 'application/json');
      toast('JSON backup exported ✓', 'success');
    }

    function importJsonBackup(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          applyBackupPayload(parsed);
          toast('Backup imported successfully ✓', 'success');
        } catch (e) {
          toast('Invalid JSON backup file.', 'error');
        }
      };
      reader.readAsText(file);
    }

    function shareWhatsAppKhata(customerId = null) {
      let text = '';
      if (customerId) {
        const c = state.customers.find(x => x.id === customerId);
        if (!c) return;
        const st = getCustomerStats(c.id);
        const orders = state.orders.filter(o => o.customerId === c.id);
        text = `*Digital Khata - ${state.settings.shopName}*\nCustomer: *${c.name}*\nTotal Bill: ${fmtRs(st.billed)}\nReceived: ${fmtRs(st.received)}\n*Baqaya: ${fmtRs(st.baqaya)}*\n`;
        if (orders.length) {
          text += `\nOrders:\n` + orders.slice(-5).map(o => `• ${o.itemName} (${o.length}x${o.width}ft × ${o.qty}) = ${fmtRs(o.total)}`).join('\n');
        }
      } else {
        const m = getMetrics();
        text = `*Digital Khata Summary (${formatDisplayDate(todayISO())})*\nTotal Work: ${m.totalWork}\nTotal Income: ${fmtRs(m.totalIncome)}\nTotal Expense: ${fmtRs(m.totalExpense)}\nNet Profit: ${fmtRs(m.totalProfit)}\nCustomers Baqaya: ${fmtRs(m.custBaqaya)}`;
      }
      const phone = customerId ? (state.customers.find(x => x.id === customerId)?.mobile || '').replace(/\D/g, '') : '';
      const url = phone
        ? `https://wa.me/${phone.startsWith('0') ? '92' + phone.slice(1) : phone}?text=${encodeURIComponent(text)}`
        : `https://wa.me/?text=${encodeURIComponent(text)}`;
      const a = document.createElement('a');
      a.href = url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    // ========================
    // DIGIT BOXES, STEP-BY-STEP SIGNUP, LOGIN & 4-DIGIT PIN
    // ========================
    function renderDigitBoxes(group, count, currentValue = '', extraClass = '') {
      const clean = String(currentValue || '').replace(/\D/g, '').slice(0, count);
      return `
        <div class="digit-box-row">
          ${Array.from({ length: count }).map((_, i) => {
            const ch = clean[i] || '';
            return `<input
              type="text"
              inputmode="numeric"
              pattern="[0-9]*"
              maxlength="1"
              autocomplete="${group === 'signup-otp' ? 'one-time-code' : 'off'}"
              data-digit-group="${esc(group)}"
              data-digit-index="${i}"
              value="${esc(ch)}"
              aria-label="Digit ${i + 1}"
              class="otp-pin-box ${extraClass} ${ch ? 'filled' : ''}"
            />`;
          }).join('')}
        </div>
      `;
    }

    function readDigitGroup(group, count) {
      let out = '';
      for (let i = 0; i < count; i++) {
        const el = document.querySelector(`[data-digit-group="${group}"][data-digit-index="${i}"]`);
        out += (el ? String(el.value || '').replace(/\D/g, '').slice(0, 1) : '');
      }
      return out;
    }

    function renderSignupStepDots(step) {
      const labels = ['Name', 'Gmail', 'OTP', 'Password', 'Confirm'];
      return `
        <div class="mb-5">
          <div class="flex items-center justify-between gap-1">
            ${labels.map((lbl, idx) => {
              const sNum = idx + 1;
              const done = sNum < step;
              const active = sNum === step;
              return `
                <div class="flex flex-col items-center flex-1">
                  <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-extrabold border transition-all ${
                    done
                      ? 'bg-emerald-500 border-emerald-400 text-slate-950 shadow-sm shadow-emerald-500/40'
                      : active
                      ? 'bg-cyan-500/25 border-cyan-400 text-cyan-200 ring-4 ring-cyan-400/20'
                      : 'bg-white/5 border-white/15 text-sec'
                  }">${done ? '✓' : sNum}</div>
                  <span class="text-[10px] font-semibold mt-1 ${active ? 'text-cyan-300' : done ? 'text-emerald-300' : 'text-mut'}">${esc(lbl)}</span>
                </div>
                ${idx < labels.length - 1 ? `<div class="h-0.5 flex-1 -mt-4 rounded-full ${done ? 'bg-emerald-400' : 'bg-white/10'}"></div>` : ''}
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

      return `

            <div class="flex gap-1.5 glass-card p-1 rounded-xl">
              <button type="button" data-cust-filter="all" class="px-3 h-9 rounded-lg text-xs font-semibold cursor-pointer ${ui.customerFilter === 'all' ? 'bg-blue-600 text-white' : 'text-sec'}">All</button>
              <button type="button" data-cust-filter="baqaya" class="px-3 h-9 rounded-lg text-xs font-semibold cursor-pointer ${ui.customerFilter === 'baqaya' ? 'bg-amber-600 text-white' : 'text-sec'}">Remaining</button>
              <button type="button" data-cust-filter="clear" class="px-3 h-9 rounded-lg text-xs font-semibold cursor-pointer ${ui.customerFilter === 'clear' ? 'bg-emerald-600 text-white' : 'text-sec'}">Clear</button>

              ${list.map(c => {
                const st = getCustomerStats(c.id);
                const custOrders = state.orders.filter(o => o.customerId === c.id);

                  <div data-open-customer="${esc(c.id)}" class="w-full glass-card rounded-2xl p-4 text-left hover:border-cyan-400/50 transition-colors cursor-pointer space-y-2.5">
                    <div class="flex items-start justify-between gap-3">
                      <div class="min-w-0">
                        <div class="text-base font-bold truncate">${esc(c.name)}</div>
                        <div class="text-xs text-sec mt-0.5">${esc(c.mobile || 'No phone')}${c.address ? ' · ' + esc(c.address) : ''}${latestOrd ? ' · ' + esc(latestOrd.itemName) : ''}</div>
                        ${latestOrd?.deliveryDate ? `<div class="text-[11px] text-cyan-300 mt-0.5">Delivery: ${esc(formatShortDate(latestOrd.deliveryDate))}</div>` : ''}

      return `

            <div class="grid grid-cols-2 gap-3 mt-4">

              return `
                <div data-open-order="${esc(o.id)}" class="glass-card rounded-2xl p-4 space-y-2.5 hover:border-cyan-400/50 transition-colors cursor-pointer">

      const paysAsc = [...ost.payments].sort((a, b) => ((a.date || '') + ' ' + (a.time || '')).localeCompare((b.date || '') + ' ' + (b.time || '')));
      let cumPaid = 0;
      const paysWithBalance = paysAsc.map(p => {
        cumPaid += Number(p.amount || 0);

              <div><div class="text-[11px] text-blue-100/80">Advance / Paid</div><div class="text-base font-bold text-emerald-300 tabular-nums">${esc(fmtRs(ost.paid))}</div></div>
