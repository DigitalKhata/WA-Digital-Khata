    #app-bg-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background-color: var(--bg-canvas);
      background-image:
        radial-gradient(65% 45% at 15% 0%, var(--bg-glow-1), transparent 70%),
        radial-gradient(55% 40% at 90% 18%, var(--bg-glow-2), transparent 70%);
    }
    #app-bg-photo {
      position: absolute;
      inset: -24px;
      width: calc(100% + 48px);
      height: calc(100% + 48px);
      object-fit: cover;
      transition: filter 180ms ease, opacity 180ms ease;
    }
    #app-bg-overlay {
      position: absolute;
      inset: 0;
      transition: background-color 180ms ease;
    }

    @keyframes dkPillSlideUp {
      0% { opacity: 0; transform: translate3d(0, 26px, 0) scale(0.92); }
      70% { opacity: 1; transform: translate3d(0, -4px, 0) scale(1.015); }
      100% { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
    }
    #toast-root {
      position: fixed;
      bottom: 90px;
      left: 24px;
      right: 24px;
      margin: 0 auto;
      max-width: 440px;
      z-index: 2100;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .dk-notif-pill {
      pointer-events: auto;
      height: 48px;
      border-radius: 24px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      background-color: var(--pill-bg, rgba(15, 23, 42, 0.55));
      background-image: var(--pill-bg-image, none);
      background-size: cover;
      background-position: center;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.30);
      box-shadow: 0 10px 28px -6px rgba(0, 0, 0, 0.55);
      animation: dkPillSlideUp 400ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      transition: transform 200ms ease, opacity 200ms ease;
      cursor: pointer;
      touch-action: pan-y;
    }
    .dk-notif-pill::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.25);
      pointer-events: none;
    }
    .dk-notif-pill > * {
      position: relative;
      z-index: 1;
    }

    /* Smooth Page Slide + Fade Transition */
    @keyframes pageSlideFade {

    }

    }

    /* Smooth Colorful Transparent Glass Bottom Navigation Bar (Always Below Modals) */
    .pill-navbar-wrap {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 16px);
      max-width: 780px;
      z-index: 45;
    }
    .pill-navbar {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;

      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.16);

    @keyframes navIconPop {
      0% { transform: scale(0.88) translateY(2px); }
      60% { transform: scale(1.22) translateY(-2px); }
      100% { transform: scale(1.16) translateY(-1px); }
    }
    .pill-nav-btn {
      position: relative;
      z-index: 1;
      flex: 1 1 0%;
      min-width: 56px;
      height: 54px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      border-radius: 18px;
      cursor: pointer;
      color: #cbd5e1;
      background: transparent;
      transition: all 300ms cubic-bezier(0.34, 1.56, 0.64, 1);
      padding: 4px 4px 5px;
      white-space: nowrap;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html[data-theme="light"] .pill-nav-btn {
      color: #475569;
    }
    .pill-nav-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #f8fafc;
    }
    html[data-theme="light"] .pill-nav-btn:hover {
      background: rgba(37, 99, 235, 0.08);
      color: #1e293b;
    }
    .pill-nav-btn:active {
      transform: scale(0.92);
    }
    .pill-nav-btn .nav-icon-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 300ms cubic-bezier(0.34, 1.56, 0.64, 1), color 300ms ease;
    }
    .pill-nav-btn .nav-label {
      font-size: 10px;
      line-height: 1.1;
      font-weight: 600;
      letter-spacing: -0.01em;
      transition: color 300ms ease, font-weight 300ms ease;
    }
    .pill-nav-btn .nav-dot {
      width: 5px;
      height: 5px;
      border-radius: 9999px;
      background: currentColor;
      opacity: 0;
      transform: scale(0);
      transition: all 300ms cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .pill-nav-btn.active .nav-icon-wrap {
      transform: scale(1.18) translateY(-1px);
      animation: navIconPop 300ms cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .pill-nav-btn.active .nav-label {
      font-weight: 800;
    }
    .pill-nav-btn.active .nav-dot {
      opacity: 1;
      transform: scale(1);
    }
    /* Per-Tab Colorful Active States */
    .pill-nav-btn[data-nav-tone="blue"].active { color: #3b82f6; background: rgba(59, 130, 246, 0.16); }

      const out = {};

      Object.keys(rawMap).forEach((key) => {

          branchName: String(val.branchName || ''),

      const rem = loadRememberMe();
      try {
        const activeUid = localStorage.getItem(ACTIVE_UID_KEY) || '';
        if (activeUid) {
          const cached = loadUserCache(activeUid);
          if (cached) {
            cached.rememberMe = rem;
            return cached;
          }
        }
        // One-time safe migration from legacy STORAGE_KEY ONLY if a real active session existed
        const legacyRaw = localStorage.getItem(STORAGE_KEY);
        if (legacyRaw) {
          const parsed = JSON.parse(legacyRaw);
          if (parsed && parsed.rememberMe) {
            saveRememberMe(parsed.rememberMe);
          }
          if (parsed && parsed.session && (parsed.session.uid || parsed.session.id)) {
            const migUid = parsed.session.uid || parsed.session.id;
            const merged = mergeWithDefaults(parsed);
            merged.rememberMe = loadRememberMe();
            saveUserCache(migUid, merged, false);
            localStorage.setItem(ACTIVE_UID_KEY, migUid);
            localStorage.removeItem(STORAGE_KEY);
            return merged;
          }
          localStorage.removeItem(STORAGE_KEY);

    function todayISO() {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function nowTime() {
      const d = new Date();
      return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    }

    function formatTime12(timeStr) {
      if (!timeStr) return '';
      const parts = String(timeStr).split(':');
      if (parts.length < 2) return timeStr;
      let h = Number(parts[0]);
      const m = parts[1].slice(0, 2);
      if (isNaN(h)) return timeStr;
      const ampm = isAr() ? (h >= 12 ? 'م' : 'ص') : (h >= 12 ? 'PM' : 'AM');
      h = h % 12 || 12;
      return `${String(h).padStart(2, '0')}:${m} ${ampm}`;
    }

    function formatDateTime(dateStr, timeStr, isoFallback) {
      const d = dateStr || (isoFallback ? String(isoFallback).slice(0, 10) : '');
      const t = timeStr || (isoFallback ? String(isoFallback).slice(11, 16) : '');
      return `${formatShortDate(d)}${t ? ' · ' + formatTime12(t) : ''}`;
    }

    function currentMonthKey() {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    }

    function formatMonthLabel(monthKey) {
      if (!monthKey) return '';
      const [y, m] = monthKey.split('-');
      const names = isAr()
        ? ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر']
        : ['January','February','March','April','May','June','July','August','September','October','November','December'];
      return `${names[Number(m) - 1] || m} ${y}`;
    }

    function formatDisplayDate(dateStr) {
      const d = dateStr ? new Date(dateStr + (dateStr.length === 10 ? 'T12:00:00' : '')) : new Date();
      if (isNaN(d.getTime())) return '';
      const days = isAr()
        ? ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت']
        : ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      const months = isAr()
        ? ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر']
        : ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      return `${days[d.getDay()]}, ${String(d.getDate()).padStart(2, '0')} ${months[d.getMonth()]} ${d.getFullYear()}`;
    }

    function formatShortDate(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr + (dateStr.length === 10 ? 'T12:00:00' : ''));
      if (isNaN(d.getTime())) return dateStr;
      const months = isAr()
        ? ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر']
        : ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      return `${String(d.getDate()).padStart(2, '0')} ${months[d.getMonth()]} ${d.getFullYear()}`;
    }

    function fmtRs(num, maskable = false) {
      if (maskable && state.settings.hideBalance) return 'Rs ••••••';
      const n = Number(num) || 0;
      const abs = Math.abs(Math.round(n));
      return (n < 0 ? '-Rs ' : 'Rs ') + abs.toLocaleString('en-PK');
    }

    function formatNotifPillDate(ts = Date.now()) {
      const d = new Date(ts);
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      const day = d.getDate();
      const mon = months[d.getMonth()] || '';
      let h = d.getHours();
      const min = String(d.getMinutes()).padStart(2, '0');
      const ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      return `${day} ${mon} • ${h}:${min} ${ampm}`;
    }

    function formatNotifFullDate(ts = Date.now()) {
      const d = new Date(ts);
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      const day = d.getDate();
      const mon = months[d.getMonth()] || '';
      const yr = d.getFullYear();
      let h = d.getHours();
      const min = String(d.getMinutes()).padStart(2, '0');
      const ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      return `${day} ${mon} ${yr} • ${h}:${min} ${ampm}`;

    function getWorkshopGreeting() {
      const hr = new Date().getHours();
      let greetEn = 'Good Morning';
      let greetAr = 'صباح الخير';
      let suffixEn = "Here's your workshop overview for today";
      let suffixAr = 'إليك نظرة عامة على ورشتك لليوم';
      if (hr >= 12 && hr < 17) {
        greetEn = 'Good Afternoon';
        greetAr = 'طاب مساؤك';
      } else if (hr >= 17 && hr < 21) {
        greetEn = 'Good Evening';
        greetAr = 'مساء الخير';
      } else if (hr >= 21 || hr < 5) {
        greetEn = 'Good Night';
        greetAr = 'طابت ليلتك';
        suffixEn = "Here's your workshop overview for tonight";
        suffixAr = 'إليك نظرة عامة على ورشتك لهذه الليلة';
      }
      const s = state.session || {};
      const cloudUser = getCloud()?.auth?.currentUser || null;
      let rawName = String(state.settings?.ownerName || s.name || cloudUser?.displayName || '').trim();
      if (!rawName || rawName.toLowerCase() === 'user' || rawName.toLowerCase() === 'workshop owner') {
        const emailSrc = String(s.email || cloudUser?.email || '').trim();
        if (emailSrc && emailSrc.includes('@')) {
          const uname = emailSrc.split('@')[0].replace(/[._-]+/g, ' ').trim();
          rawName = uname ? uname.replace(/\b\w/g, c => c.toUpperCase()) : 'Owner';
        } else {
          rawName = 'Owner';
        }
      }
      return {
        heading: `${L(greetEn, greetAr)}, ${rawName}`,
        subtitle: L(suffixEn, suffixAr)
      };
    }

      });

    function playNotificationSoundAndVibrate() {
      const prefs = state.settings?.notifications || {};
      if (prefs.master === false) return;
      if (prefs.vibration !== false && navigator.vibrate) {
        try { navigator.vibrate(35); } catch (e) {}
      }
      if (prefs.sound !== false) {
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            const ctx = new AudioCtx();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(740, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(980, ctx.currentTime + 0.09);
            gain.gain.setValueAtTime(0.05, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.16);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.17);
          }
        } catch (e) {}
      }
    }

    function inferNotificationMeta(msg, type, opts = {}) {
      const lower = String(msg || '').toLowerCase();
      let category = opts.category || '';
      let targetView = opts.targetView || '';
      if (!category) {
        if (lower.includes('payment') || lower.includes('wasooli') || lower.includes('salary') || lower.includes('income') || lower.includes('دفعة') || lower.includes('دخل')) {
          category = 'payment';
          if (!targetView) targetView = lower.includes('party') ? 'party' : (lower.includes('staff') ? 'staff' : 'payments');
        } else if (lower.includes('expense') || lower.includes('mess') || lower.includes('rent') || lower.includes('diesel') || lower.includes('مصروف')) {
          category = 'expense';
          if (!targetView) targetView = 'expenses';
        } else {
          category = 'system';
          if (!targetView) {
            if (lower.includes('stock')) targetView = 'stock';
            else if (lower.includes('drive') || lower.includes('backup')) targetView = 'profile';
            else if (lower.includes('customer') || lower.includes('order')) targetView = 'customers';
            else targetView = 'notifications';
          }
        }
      }
      return { category, targetView: targetView || 'notifications' };
    }

    function toast(msg, type = 'info', opts = {}) {
      const cleanMsg = String(msg || '').trim();
      if (!cleanMsg) return;
      const meta = inferNotificationMeta(cleanMsg, type, opts);
      const prefs = state.settings?.notifications || {};
      const catEnabled = prefs.master !== false && (
        (meta.category === 'payment' && prefs.payment !== false) ||
        (meta.category === 'expense' && prefs.expense !== false) ||
        (meta.category === 'system' && prefs.system !== false)
      );

      if (state.session && !opts.skipHistory && prefs.master !== false && catEnabled) {
        if (!Array.isArray(state.notificationHistory)) state.notificationHistory = [];
        state.notificationHistory.unshift({
          id: uid('notif'),
          title: cleanMsg,
          type,
          category: meta.category,
          targetView: meta.targetView,
          createdAt: Date.now(),
          read: false
        });
        if (state.notificationHistory.length > 100) {
          state.notificationHistory = state.notificationHistory.slice(0, 100);
        }
        try { saveState(true); } catch (e) {}
      }

      if (!catEnabled && type !== 'error' && !opts.forceShow) return;

      const root = document.getElementById('toast-root');
      if (!root) return;
      // Keep bottom area super compact: replace previous toast so only 1 clean floating pill shows at a time
      root.innerHTML = '';

      const logoSrc = (state.settings?.customLogo || '').trim() || DEFAULT_LOGO_PATH;
      const dateStr = formatNotifPillDate(Date.now());
      const dotColor = type === 'error' ? 'bg-rose-400' : (type === 'success' ? 'bg-emerald-400' : 'bg-sky-300');

      const el = document.createElement('div');
      el.className = 'dk-notif-pill';
      el.setAttribute('role', 'status');
      el.setAttribute('data-notif-pill', '1');
      el.setAttribute('data-target-view', meta.targetView);
      el.innerHTML = `
        <div class="w-6 h-6 rounded-full overflow-hidden shrink-0 ring-1 ring-white/40 bg-[#071330]">
          <img src="${esc(logoSrc)}" alt="WA" referrerpolicy="no-referrer" class="w-full h-full object-cover" onerror="this.style.display='none'" />
        </div>
        <span class="w-1.5 h-1.5 rounded-full ${dotColor} shrink-0"></span>
        <span class="flex-1 min-w-0 truncate text-[13px] font-semibold text-white leading-none">${esc(cleanMsg)}</span>
        <span class="text-[10px] font-medium text-white/80 shrink-0 tabular-nums whitespace-nowrap">${esc(dateStr)}</span>
      `;

      let touchStartY = 0;
      let touchStartX = 0;
      let moved = false;
      el.addEventListener('touchstart', (ev) => {
        const pt = ev.touches && ev.touches[0];
        if (!pt) return;
        touchStartY = pt.clientY;
        touchStartX = pt.clientX;
        moved = false;
      }, { passive: true });
      el.addEventListener('touchend', (ev) => {
        const pt = ev.changedTouches && ev.changedTouches[0];
        if (!pt) return;
        const dy = pt.clientY - touchStartY;
        const dx = pt.clientX - touchStartX;
        if (Math.abs(dx) > 45 || dy > 28) {
          moved = true;
          el.style.opacity = '0';
          el.style.transform = Math.abs(dx) > 45 ? `translateX(${dx > 0 ? 120 : -120}px)` : 'translateY(32px)';
          setTimeout(() => el.remove(), 180);
        } else if (dy < -24) {
          moved = true;
          openNotificationTarget(meta.targetView);
          el.remove();
        }
      }, { passive: true });
      el.addEventListener('click', () => {
        if (moved) return;
        openNotificationTarget(meta.targetView);
        el.remove();
      });

      root.appendChild(el);
      if (state.session) playNotificationSoundAndVibrate();
      setTimeout(() => {
        if (el.parentElement) {
          el.style.opacity = '0';
          el.style.transform = 'translateY(14px)';
          setTimeout(() => { if (el.parentElement) el.remove(); }, 200);
        }
      }, 4800);
    }

    function buildMonthArchiveSnapshot(mKey, isClosed = true) {
      const [y, m] = mKey.split('-');
      const names = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      const inc = (state.transactions || []).filter(t => t.type === 'income' && (t.date || '').startsWith(mKey)).reduce((s, t) => s + Number(t.amount || 0), 0);
      const exp = (state.transactions || []).filter(t => t.type === 'expense' && (t.date || '').startsWith(mKey)).reduce((s, t) => s + Number(t.amount || 0), 0);
      const ordList = (state.orders || []).filter(o => (o.date || '').startsWith(mKey));
      const txCount = (state.transactions || []).filter(t => (t.date || '').startsWith(mKey)).length;

      const staffSnapshot = (state.staff || []).map(st => {
        const adv = (state.staffLogs || []).filter(l => l.staffId === st.id && l.type === 'advance' && (l.date || '').startsWith(mKey)).reduce((s, l) => s + Number(l.amount || 0), 0);
        const sal = (state.staffLogs || []).filter(l => l.staffId === st.id && l.type === 'salary' && (l.date || '').startsWith(mKey)).reduce((s, l) => s + Number(l.amount || 0), 0);
        return { id: st.id, name: st.name, role: st.role || 'Staff', salaryAtTime: Number(st.salary || 0), advances: adv, salaryPaid: sal };
      });

      let customerPending = 0, customerCountWithBaqaya = 0;
      (state.customers || []).forEach(c => {
        const cst = getCustomerStats(c.id);
        if (cst.baqaya > 0) { customerPending += cst.baqaya; customerCountWithBaqaya++; }
      });
      let partyPending = 0, partyCountWithBaqaya = 0;
      (state.suppliers || []).forEach(sup => {
        const sst = getSupplierStats(sup.id);
        if (sst.remaining > 0) { partyPending += sst.remaining; partyCountWithBaqaya++; }
      });

      return {
        monthKey: mKey,
        label: `${names[Number(m) - 1] || m} ${y}`,
        income: inc,
        expense: exp,
        profit: inc - exp,
        ordersCount: ordList.length,
        txCount,
        staffSnapshot,
        pendingCarryForward: {
          customerPending: Math.round(customerPending),
          customerCountWithBaqaya,
          partyPending: Math.round(partyPending),
          partyCountWithBaqaya
        },
        closed: Boolean(isClosed),
        archivedAt: new Date().toISOString()
      };
    }

    function checkAutoArchive(forceCloseCurrentIfEndOfDay = false) {
      const curMonth = currentMonthKey();
      state.archivedReports = Array.isArray(state.archivedReports) ? state.archivedReports : [];
      let changed = false;

      // Ensure legacy archive entries are marked closed if before currentMonth
      state.archivedReports.forEach((r, idx) => {
        if (r && r.monthKey && r.monthKey < curMonth && r.closed === undefined) {
          const full = buildMonthArchiveSnapshot(r.monthKey, true);
          state.archivedReports[idx] = { ...full, ...r, closed: true };
          changed = true;
        }
      });

      const monthsSet = new Set();
      (state.transactions || []).forEach(t => { if (t.date && t.date.slice(0, 7) < curMonth) monthsSet.add(t.date.slice(0, 7)); });
      (state.orders || []).forEach(o => { if (o.date && o.date.slice(0, 7) < curMonth) monthsSet.add(o.date.slice(0, 7)); });
      if (state.lastActiveMonth && state.lastActiveMonth < curMonth) monthsSet.add(state.lastActiveMonth);

      let archivedCount = 0;
      monthsSet.forEach(mKey => {
        if (!state.archivedReports.some(r => r.monthKey === mKey)) {
          const snap = buildMonthArchiveSnapshot(mKey, true);
          if (snap.income > 0 || snap.expense > 0 || snap.ordersCount > 0 || snap.pendingCarryForward.customerPending > 0) {
            state.archivedReports.push(snap);
            archivedCount++;
            changed = true;
          }
        }
      });

      // Auto-close at 23:59 on last day of the month
      if (forceCloseCurrentIfEndOfDay) {
        const now = new Date();
        const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
        const isLastDay = tomorrow.getDate() === 1;
        if (isLastDay && now.getHours() === 23 && now.getMinutes() >= 59) {
          if (!state.archivedReports.some(r => r.monthKey === curMonth)) {
            state.archivedReports.push(buildMonthArchiveSnapshot(curMonth, true));
            archivedCount++;
            changed = true;
          }
        }
      }

      if (state.lastActiveMonth !== curMonth) {
        state.lastActiveMonth = curMonth;
        changed = true;
      }
      if (changed) {
        state.archivedReports.sort((a, b) => String(a.monthKey || '').localeCompare(String(b.monthKey || '')));
        saveState();
        if (archivedCount > 0) toast(L(`Auto-archived ${archivedCount} completed month report(s) ✓`, `تمت أرشفة ${archivedCount} تقرير شهري مكتمل تلقائياً ✓`), 'info');
      }
    }

    // Check KYC 5-minute auto-approval
    function getKycCountdownInfo() {
      const k = state.kyc || {};
      const elapsed = Math.max(0, Date.now() - (k.submittedAt || Date.now()));
      const remainingMs = Math.max(0, KYC_VERIFY_DURATION_MS - elapsed);
      const displaySec = remainingMs > 0 ? Math.floor(Math.max(0, remainingMs - 1) / 1000) : 0;
      const mins = Math.floor(displaySec / 60);
      const secs = displaySec % 60;
      const timerStr = `${mins}:${String(secs).padStart(2, '0')}`;
      const pct = Math.min(100, Math.round((elapsed / KYC_VERIFY_DURATION_MS) * 100));
      return { elapsed, remainingMs, timerStr, pct };
    }

    function startKycCountdownTimer() {
      if (ui.kycTimer) { clearInterval(ui.kycTimer); ui.kycTimer = null; }
      if (!state.kyc || state.kyc.status !== 'verifying') return;
      ui.kycTimer = setInterval(() => {

          const barEl = document.getElementById('kyc-progress-bar');

    function migrateLegacyData() {
      let changed = false;
      if (!Array.isArray(state.messEntries)) { state.messEntries = []; changed = true; }
      if (!Array.isArray(state.rentRecords)) { state.rentRecords = []; changed = true; }
      if (!Array.isArray(state.rentPayments)) { state.rentPayments = []; changed = true; }
      if (!Array.isArray(state.partyPayments)) { state.partyPayments = []; changed = true; }

      // Migrate legacy order advances into customerPayments without double counting
      state.orders.forEach(o => {
        if (!o.time && o.createdAt) { o.time = String(o.createdAt).slice(11, 16) || '12:00'; changed = true; }
        const adv = Number(o.advance || 0);
        const hasLinkedPay = state.customerPayments.some(p => p.orderId === o.id);
        if (adv > 0 && !hasLinkedPay) {
          state.customerPayments.push({
            id: uid('pay'),
            customerId: o.customerId,
            orderId: o.id,
            amount: adv,
            date: o.date || todayISO(),
            time: o.time || '12:00',
            method: 'Cash',
            note: 'Initial Advance',
            isInitialAdvance: true,
            createdAt: o.createdAt || new Date().toISOString()
          });
          changed = true;
        }
      });

      // Migrate legacy Mess transactions into messEntries
      state.transactions.forEach(tx => {
        if (tx.type === 'expense' && tx.category === 'Mess' && !tx.messId) {
          const already = state.messEntries.some(m => m.txId === tx.id);
          if (!already) {
            const mId = uid('mess');
            state.messEntries.push({
              id: mId,
              itemName: tx.title || 'Mess Expense',
              qty: '1',
              amount: Number(tx.amount || 0),
              date: tx.date || todayISO(),
              time: tx.time || '12:00',
              paidBy: 'Workshop',
              note: '',
              txId: tx.id,
              createdAt: tx.createdAt || new Date().toISOString()
            });
            tx.messId = mId;
            changed = true;
          }
        }
      });

      // Migrate legacy Rent transactions into rentRecords + rentPayments
      const legacyRents = state.transactions.filter(tx => tx.type === 'expense' && tx.category === 'Rent' && !tx.rentPaymentId);
      if (legacyRents.length > 0) {
        let shopRentRec = state.rentRecords.find(r => r.isLegacyImport);
        if (!shopRentRec) {
          const curMonthLegacySum = legacyRents
            .filter(x => (x.date || '').startsWith(currentMonthKey()))
            .reduce((s, x) => s + Number(x.amount || 0), 0);
          shopRentRec = {
            id: uid('rent'),
            rentType: 'Shop',
            title: 'Previous Shop Rent Entries',
            ownerName: 'Landlord',
            monthlyAmount: curMonthLegacySum,
            dueDate: 'Monthly',
            date: legacyRents[0].date || todayISO(),
            time: '12:00',
            note: 'Auto-imported from previous Rent expenses',
            isLegacyImport: true,
            createdAt: new Date().toISOString()
          };
          state.rentRecords.push(shopRentRec);
        }
        legacyRents.forEach(tx => {
          const rpId = uid('rpay');
          state.rentPayments.push({
            id: rpId,
            rentId: shopRentRec.id,
            amount: Number(tx.amount || 0),
            date: tx.date || todayISO(),
            time: tx.time || '12:00',
            method: 'Cash',
            note: tx.title || 'Legacy Rent Payment',
            txId: tx.id,
            createdAt: tx.createdAt || new Date().toISOString()
          });
          tx.rentPaymentId = rpId;
          changed = true;
        });
      }

      // Normalize stock metadata
      state.stock.forEach(s => {
        if (s.initialQty === undefined) { s.initialQty = Number(s.qty || 0); changed = true; }
        if (s.usedQty === undefined) { s.usedQty = 0; changed = true; }
        if (s.purchaseDate === undefined) { s.purchaseDate = (s.updatedAt ? String(s.updatedAt).slice(0, 10) : todayISO()); changed = true; }
        if (s.purchaseTime === undefined) { s.purchaseTime = '12:00'; changed = true; }
        if (!Array.isArray(s.history)) {
          s.history = [{
            id: uid('sh'),
            type: 'purchase',
            qtyDelta: Number(s.qty || 0),
            remaining: Number(s.qty || 0),
            rate: Number(s.cost || 0),
            date: s.purchaseDate,
            time: s.purchaseTime,
            partyName: s.supplierName || '',
            note: 'Stock Added'
          }];
          changed = true;
        }
      });

      if (changed) saveState();
    }

    function recalcOrderTotals(orderId) {
      const o = state.orders.find(x => x.id === orderId);
      if (!o) return;
      const orderPays = state.customerPayments.filter(p => p.orderId === orderId);
      o.advance = orderPays.reduce((s, p) => s + Number(p.amount || 0), 0);
    }

    function getOrderStats(order) {
      const sqFt = Number(order.length || 0) * Number(order.width || 0) * Number(order.qty || 1);
      const computedLegacy = Math.round(sqFt * Number(order.rate || 0));
      const total = order.total != null
        ? Number(order.total)
        : (order.totalAmount != null ? Number(order.totalAmount) : computedLegacy);
      const orderPays = state.customerPayments.filter(p => p.orderId === order.id);
      const paid = orderPays.length > 0 ? orderPays.reduce((s, p) => s + Number(p.amount || 0), 0) : Number(order.advance || 0);
      const remaining = Math.max(0, total - paid);
      const extraPaid = Math.max(0, paid - total);
      return { sqFt, total, paid, remaining, extraPaid, payments: orderPays };
    }

    function getCustomerStats(customerId) {
      const cust = state.customers.find(c => c.id === customerId);
      const opening = Number(cust?.openingBalance || 0);
      const custOrders = state.orders.filter(o => o.customerId === customerId);
      const custPays = state.customerPayments.filter(p => p.customerId === customerId);
      const billed = opening + custOrders.reduce((s, o) => s + Number(o.total || 0), 0);
      const paidViaPayments = custPays.reduce((s, p) => s + Number(p.amount || 0), 0);
      // Fallback if any order has advance without a linked customerPayments row
      const unlinkedAdvance = custOrders.reduce((s, o) => {
        const hasPay = custPays.some(p => p.orderId === o.id);
        return s + (hasPay ? 0 : Number(o.advance || 0));
      }, 0);
      const received = paidViaPayments + unlinkedAdvance;
      const baqaya = Math.max(0, billed - received);
      const extraPaid = Math.max(0, received - billed);
      return { billed, received, baqaya, extraPaid, ordersCount: custOrders.length };
    }

    function getPartyStockItems(supplier) {
      if (!supplier) return [];
      const sName = (supplier.name || '').trim().toLowerCase();
      return state.stock.filter(item =>
        item.supplierId === supplier.id ||
        (sName && (item.supplierName || '').trim().toLowerCase() === sName)
      );
    }

    function getSupplierStats(supplierId) {
      const sup = state.suppliers.find(x => x.id === supplierId);
      const entries = state.supplierEntries.filter(e => e.supplierId === supplierId);
      const stockItems = getPartyStockItems(sup);
      const stockPurchaseTotal = stockItems.reduce((s, item) => {
        const baseVal = item.purchaseTotal != null ? Number(item.purchaseTotal) : (Number(item.initialQty ?? item.qty ?? 0) * Number(item.cost || 0));
        return s + baseVal;
      }, 0);
      const entriesTotal = entries.reduce((s, e) => s + Number(e.amount || 0), 0);
      const entriesPaid = entries.reduce((s, e) => s + Number(e.paid || 0), 0);
      const partyPays = (state.partyPayments || []).filter(p => p.supplierId === supplierId);
      const directPaid = partyPays.reduce((s, p) => s + Number(p.amount || 0), 0);
      const total = entriesTotal + stockPurchaseTotal;
      const paid = entriesPaid + directPaid;
      const remaining = Math.max(0, total - paid);
      return { total, paid, remaining, count: entries.length + stockItems.length, stockCount: stockItems.length };
    }

    function getMetrics() {
      const mKey = currentMonthKey();
      const tDay = todayISO();
      let totalIncome = 0, totalExpense = 0, monthIncome = 0, monthExpense = 0;
      state.transactions.forEach(t => {
        const amt = Number(t.amount || 0);
        if (t.type === 'income') {
          totalIncome += amt;
          if ((t.date || '').startsWith(mKey)) monthIncome += amt;
        } else if (t.type === 'expense') {
          totalExpense += amt;
          if ((t.date || '').startsWith(mKey)) monthExpense += amt;
        }
      });
      const totalProfit = totalIncome - totalExpense;

      let custTotal = 0, custReceived = 0, custBaqaya = 0, baqayaBills = 0;
      state.customers.forEach(c => {
        const st = getCustomerStats(c.id);
        custTotal += st.billed;
        custReceived += st.received;
        custBaqaya += st.baqaya;
        if (st.baqaya > 0) baqayaBills++;
      });

      const totalWork = state.orders.length;
      const todayWork = state.orders.filter(o => o.date === tDay).length;
      const totalPayment = custTotal;
      const pendingPayment = custBaqaya;

      return {
        totalIncome, totalExpense, totalProfit,
        monthIncome, monthExpense,
        custTotal, custReceived, custBaqaya, baqayaBills,
        totalWork, todayWork, totalPayment, pendingPayment
      };
    }

    async function hashPassword(pw) {
      if (window.crypto && crypto.subtle) {
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
        return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
      }
      return btoa(unescape(encodeURIComponent(pw)));
    }

    function compressImageFile(file, maxW = 640, quality = 0.72) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const maxDim = Math.max(img.width || maxW, img.height || maxW);
            const scale = Math.min(1, maxW / maxDim);
            const w = Math.max(1, Math.round((img.width || maxW) * scale));
            const h = Math.max(1, Math.round((img.height || maxW) * scale));
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#071330';
            ctx.fillRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
          img.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function evaluateSelfieFaceInOval(video) {
      if (!video || video.readyState < 2 || !video.videoWidth || !video.videoHeight || !camAnalysisCtx) {
        return { ok: false, msg: L('Camera is initializing...', 'جاري تجهيز الكاميرا...') };
      }

      const W = camAnalysisCanvas.width;
      const H = camAnalysisCanvas.height;
      camAnalysisCtx.save();
      camAnalysisCtx.scale(-1, 1);
      camAnalysisCtx.drawImage(video, -W, 0, W, H);
      camAnalysisCtx.restore();

      const imgData = camAnalysisCtx.getImageData(0, 0, W, H).data;
      const cx = 0.5, cy = 0.46, rx = 0.27, ry = 0.35;
      let ovalCount = 0, coreCount = 0, skinOval = 0, skinCore = 0;
      let sumY = 0, sumY2 = 0;
      let gradCount = 0, gradHits = 0;

      for (let py = 2; py < H - 2; py += 2) {
        const ny = py / H;
        for (let px = 2; px < W - 2; px += 2) {
          const nx = px / W;
          const dx = (nx - cx) / rx;
          const dy = (ny - cy) / ry;
          const dist2 = dx * dx + dy * dy;
          if (dist2 > 1.0) continue;

          const idx = (py * W + px) * 4;
          const r = imgData[idx], g = imgData[idx + 1], b = imgData[idx + 2];
          const y = 0.299 * r + 0.587 * g + 0.114 * b;
          const cb = 128 - 0.168736 * r - 0.331264 * g + 0.5 * b;
          const cr = 128 + 0.5 * r - 0.418688 * g - 0.081312 * b;

          ovalCount++;
          sumY += y;
          sumY2 += y * y;

          const isSkin = y > 32 && y < 246 && cb >= 74 && cb <= 138 && cr >= 130 && cr <= 180 && r >= g * 0.90 && r > b * 0.96;
          if (isSkin) skinOval++;
          if (dist2 <= 0.45) {
            coreCount++;
            if (isSkin) skinCore++;
          }

          if (ny >= 0.28 && ny <= 0.64) {
            const idxR = (py * W + (px + 2)) * 4;
            const idxD = ((py + 2) * W + px) * 4;
            const yR = 0.299 * imgData[idxR] + 0.587 * imgData[idxR + 1] + 0.114 * imgData[idxR + 2];
            const yD = 0.299 * imgData[idxD] + 0.587 * imgData[idxD + 1] + 0.114 * imgData[idxD + 2];
            gradCount++;
            if (Math.abs(y - yR) + Math.abs(y - yD) > 16) gradHits++;
          }
        }
      }

      if (!ovalCount || !coreCount) return { ok: false, msg: L('Place your face inside the oval guide', 'ضع وجهك داخل الإطار البيضاوي') };

      const avgY = sumY / ovalCount;
      const variance = Math.max(0, (sumY2 / ovalCount) - avgY * avgY);
      const stdDev = Math.sqrt(variance);
      const skinRatio = skinOval / ovalCount;
      const coreSkinRatio = skinCore / coreCount;
      const edgeDensity = gradCount ? (gradHits / gradCount) : 0;

      if (avgY < 26) return { ok: false, msg: L('Low lighting — move to a brighter area', 'الإضاءة ضعيفة — انتقل لمكان أكثر إضاءة') };
      if (avgY > 246 && stdDev < 10) return { ok: false, msg: L('Show your clear face in front of camera', 'أظهر وجهك بوضوح أمام الكاميرا') };

      if (kycFaceDetector) {
        try {
          const faces = await kycFaceDetector.detect(camAnalysisCanvas);
          if (Array.isArray(faces) && faces.length > 0) {
            const insideFace = faces.some((f) => {
              const b = f.boundingBox;
              const fx = (b.x + b.width * 0.5) / W;
              const fy = (b.y + b.height * 0.5) / H;
              const fw = b.width / W;
              const d = Math.pow((fx - cx) / 0.29, 2) + Math.pow((fy - cy) / 0.37, 2);
              return d <= 1.0 && fw >= 0.15 && fw <= 0.88;
            });
            if (insideFace) {
              return { ok: true, msg: L('Face is inside Oval ✓ — Capture Photo Now', 'الوجه داخل الإطار ✓ — التقط الصورة الآن') };
            }
            return { ok: false, msg: L('Center your face inside the oval guide', 'وسط وجهك داخل الإطار البيضاوي') };
          }
        } catch (e) {}
      }

      if (coreSkinRatio >= 0.20 && skinRatio >= 0.18 && stdDev >= 11 && edgeDensity >= 0.06) {
        return { ok: true, msg: L('Face is inside Oval ✓ — Capture Photo Now', 'الوجه داخل الإطار ✓ — التقط الصورة الآن') };
      }
      if (coreSkinRatio < 0.15) {
        return { ok: false, msg: L('Place your face inside the oval guide', 'ضع وجهك داخل الإطار البيضاوي') };
      }
      return { ok: false, msg: L('Keep your face facing camera inside oval', 'وجهك مباشرة أمام الكاميرا داخل الإطار') };
    }

    function bufToBase64Url(buf) {
      const bytes = new Uint8Array(buf);
      let bin = '';
      for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function base64UrlToBuf(b64) {
      const pad = b64.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((b64.length + 3) % 4);
      const bin = atob(pad);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return bytes.buffer;
    }

    function randomChallenge() {
      const arr = new Uint8Array(32);
      crypto.getRandomValues(arr);
      return arr;
    }

          return await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
        }
        return true;
      } catch (e) {
        return false;

    }

    function getAuthLockState() {
      try {
        return JSON.parse(localStorage.getItem(AUTH_LOCK_KEY) || '{}') || {};
      } catch {
        return {};
      }
    }

    function recordFailedPasswordAttempt() {
      const lock = getAuthLockState();
      const count = Number(lock.count || 0) + 1;
      const next = { count, lockedUntil: count >= 5 ? Date.now() + 5 * 60 * 1000 : 0 };
      localStorage.setItem(AUTH_LOCK_KEY, JSON.stringify(next));
      return next;
    }

    function clearFailedPasswordAttempts() {
      localStorage.removeItem(AUTH_LOCK_KEY);
    }

    function getLockoutRemainingSec() {
      const lock = getAuthLockState();
      if (!lock.lockedUntil || lock.lockedUntil <= Date.now()) return 0;
      return Math.ceil((lock.lockedUntil - Date.now()) / 1000);
    }

    function getPinLockState() {
      try {
        return JSON.parse(localStorage.getItem(AUTH_PIN_LOCK_KEY) || '{}') || {};
      } catch {

    function withTimeout(promise, ms = 25000, label = 'NETWORK_TIMEOUT') {
      let tid = null;
      const timeoutP = new Promise((_, reject) => {
        tid = setTimeout(() => reject(new Error(label)), ms);
      });
      return Promise.race([promise, timeoutP]).finally(() => {
        if (tid) clearTimeout(tid);
      });
    }

      }
      if (code === 'auth/weak-password') return L('Password must be at least 6 characters.', 'يجب أن تكون كلمة المرور 6 أحرف على الأقل.');
      if (code === 'auth/too-many-requests') return L('Temporarily blocked due to too many failed attempts. Try again later.', 'محظور مؤقتاً لكثرة المحاولات الفاشلة. حاول لاحقاً.');
      if (code === 'auth/network-request-failed') return L('Please check your internet connection.', 'يرجى التحقق من اتصال الإنترنت.');
      if (code === 'auth/requires-recent-login') return L('Please sign out and sign in again to change your password.', 'يرجى تسجيل الخروج ثم تسجيل الدخول مجدداً لتغيير كلمة المرور.');
      return msg || L('Authentication failed.', 'فشلت المصادقة.');
    }

    function scheduleCloudSync() {
      if (cloudSyncTimer) clearTimeout(cloudSyncTimer);
      cloudSyncTimer = setTimeout(() => { flushCloudSync(); }, 750);
    }

    async function flushCloudSync(opts = {}) {
      const cloud = getCloud();
      const s = state.session;
      if (!cloud || !s || !s.uid) return false;
      if (!cloud.auth?.currentUser || cloud.auth.currentUser.uid !== s.uid) return false;
      if (isAdminSession()) return true;
      if (!navigator.onLine) {
        ui.syncStatus = 'offline';
        updateSyncStatusBadgeDom();
        return false;
      }
      if (isSyncInFlight && !opts.forceDataDeleted) {
        pendingCloudResync = true;
        return false;
      }
      isSyncInFlight = true;
      ui.syncStatus = 'syncing';
      updateSyncStatusBadgeDom();
      try {
        const syncedAt = await cloud.saveUserVault(
          s.uid,
          {
            name: s.name,
            identifier: s.identifier || s.email || s.mobile || '',
            email: s.email || '',
            mobile: s.mobile || state.kyc?.mobile || '',
            authType: s.authType || 'email',
            pinEnabled: Boolean(state.pinSecurity?.enabled),
            pinHash: state.pinSecurity?.hash || '',
            kycDuplicateOf: state.kyc?.duplicateOf || '',
            profilePicUrl: s.photo || state.kyc?.selfiePhoto || state.settings?.customLogo || '',
            termsAccepted: Boolean(state.cloudMeta?.termsAccepted ?? true),
            termsAcceptedAt: Number(state.cloudMeta?.termsAcceptedAt || 0),
            forceDataDeleted: Boolean(opts.forceDataDeleted),
            lastBackupAt: Number(state.cloudMeta?.lastBackupAt || 0)
          },
          state
        );
        state.cloudMeta = {
          ...(state.cloudMeta || {}),
          uid: s.uid,
          lastSyncAt: syncedAt
        };
        localStorage.removeItem(PENDING_SYNC_KEY);
        saveState(true);
        ui.syncStatus = 'synced';
        updateSyncStatusBadgeDom();
        return true;
      } catch (err) {
        if (err && err.message === 'ACCOUNT_BLOCKED') {
          state.blocked = true;
          saveState(true);
          ui.view = 'kyc';
          render();
          return false;
        }
        if (err && err.message === 'AUTH_SESSION_CHANGED') {
          return false;
        }
        ui.syncStatus = 'pending';
        updateSyncStatusBadgeDom();
        return false;
      } finally {
        isSyncInFlight = false;
        if (pendingCloudResync) {
          pendingCloudResync = false;
          setTimeout(() => { flushCloudSync(); }, 180);
        }
      }
    }

    function saveLocalUnencryptedAutoBackup(uid, payloadObj) {
      if (!uid || !payloadObj) return false;
      try {
        const plainJson = JSON.stringify(payloadObj, null, 2);
        localStorage.setItem(DK_AUTO_BACKUP_PREFIX + uid, plainJson);
        localStorage.setItem(DK_AUTO_BACKUP_PREFIX + 'latest', plainJson);
        return true;
      } catch (e) {
        return false;
      }
    }

    function loadLocalUnencryptedAutoBackup(uid) {
      try {
        const raw = (uid && localStorage.getItem(DK_AUTO_BACKUP_PREFIX + uid)) || localStorage.getItem(DK_AUTO_BACKUP_PREFIX + 'latest') || '';
        if (!raw) return null;
        return JSON.parse(raw);
      } catch (e) {
        return null;
      }
    }

    function scheduleMidnightAutoBackup() {
      if (midnightBackupTimer) {
        clearTimeout(midnightBackupTimer);
        midnightBackupTimer = null;
      }
      const now = new Date();
      const nextMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 5, 0);
      const msUntilMidnight = Math.max(5000, nextMidnight.getTime() - now.getTime());
      midnightBackupTimer = setTimeout(() => {
        maybeRunAutoDailyBackup(true);
        scheduleMidnightAutoBackup();
      }, msUntilMidnight);
    }

    async function maybeRunAutoDailyBackup(forceMidnightCheck = false) {
      const s = state.session;
      if (!s || isAdminSession()) return;
      const uidVal = s.uid || s.cloudUid || s.id || '';
      const tDay = todayISO();
      const alreadyDoneToday = state.cloudMeta?.lastDailyBackupDate === tDay && state.cloudMeta?.lastBackupAt;
      if (alreadyDoneToday && !forceMidnightCheck) return;

      const payloadObj = buildBackupPayload();
      const savedLocal = saveLocalUnencryptedAutoBackup(uidVal, payloadObj);
      if (savedLocal && !alreadyDoneToday) {
        state.cloudMeta = {
          ...(state.cloudMeta || {}),
          uid: uidVal,
          lastBackupAt: Date.now(),
          lastDailyBackupDate: tDay
        };
        saveState(true);
      }

      const cloud = getCloud();
      if (!cloud || !s.uid || !navigator.onLine) return;
      if (!cloud.auth?.currentUser || cloud.auth.currentUser.uid !== s.uid) return;
      try {
        const ts = await cloud.saveBackupSnapshot(
          s.uid,
          'daily',
          tDay,
          formatDateTime(tDay, nowTime()),
          payloadObj
        );
        state.cloudMeta = {
          ...(state.cloudMeta || {}),
          uid: s.uid,
          lastBackupAt: ts,
          lastDailyBackupDate: tDay
        };
        saveState(true);
        if (ui.view === 'profile' || ui.view === 'backup' || ui.view === 'settings') render();
      } catch (e) {}
    }

            email: res.user.email || '',
            identifier: res.user.email || '',
            authType: 'email',
            photo: res.user.photoURL || ''
          },

        } else {
          toast(L('Google Sign-In failed: ', 'فشل تسجيل الدخول عبر Google: ') + msg, 'error');

        render();
      } finally {
        manualAuthFlow = false;
      }
    }

    async function sendSignupEmailOtp(targetEmail) {
      const email = String(targetEmail || '').trim().toLowerCase();
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        throw new Error(L('Enter a valid Gmail address (e.g. name@gmail.com).', 'أدخل عنوان Gmail صحيحاً (مثال: name@gmail.com).'));
      }
      const otp = String(Math.floor(100000 + Math.random() * 900000));
      const resp = await fetch('https://api.emailjs.com/api/v1.0/email/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          service_id: EMAILJS_SERVICE_ID,
          template_id: EMAILJS_TEMPLATE_ID,
          user_id: EMAILJS_PUBLIC_KEY,
          template_params: {
            passcode: otp,
            to_email: email
          }
        })
      });
      if (!resp.ok) {
        const errText = await resp.text().catch(() => '');
        throw new Error(errText || L('Could not send Email OTP. Check internet and Gmail.', 'تعذر إرسال رمز التحقق. تحقق من الإنترنت والبريد الإلكتروني.'));
      }
      return otp;
    }

    function getOrCreateDeviceId() {
      let id = '';
      try {
        id = String(localStorage.getItem(DK_DEVICE_ID_KEY) || '').trim();
      } catch (e) {}
      if (!id || id.length < 10) {
        const rand = (window.crypto && typeof crypto.randomUUID === 'function')
          ? crypto.randomUUID().replace(/-/g, '')
          : (Date.now().toString(36) + Math.random().toString(36).slice(2, 14));
        id = 'dev_' + rand;
        try { localStorage.setItem(DK_DEVICE_ID_KEY, id); } catch (e) {}
      }
      return id;
    }

    function formatDeviceLoginTime(ts = Date.now()) {
      const d = new Date(ts);
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      const hrs = d.getHours();
      const mins = String(d.getMinutes()).padStart(2, '0');
      const ampm = hrs >= 12 ? 'PM' : 'AM';
      const h12 = String(hrs % 12 || 12).padStart(2, '0');
      return `${yyyy}-${mm}-${dd} ${h12}:${mins} ${ampm}`;
    }

    async function detectDeviceInfo() {
      const ua = navigator.userAgent || '';
      let deviceName = '';
      let isUnknown = false;

      // Try High Entropy User-Agent Client Hints first (gives real Android model even under UA-Reduction)
      let uaModel = '';
      let uaPlatform = '';
      try {
        if (navigator.userAgentData && typeof navigator.userAgentData.getHighEntropyValues === 'function') {
          const hints = await navigator.userAgentData.getHighEntropyValues(['model', 'platform']);
          uaModel = String(hints?.model || '').trim();
          uaPlatform = String(hints?.platform || '').trim();
        }
      } catch (e) {}

      if (uaModel && uaModel.toUpperCase() !== 'K' && uaModel.toLowerCase() !== 'unknown') {
        deviceName = uaModel;
      } else if (/iPhone/i.test(ua)) {
        deviceName = 'iPhone';
      } else if (/iPad/i.test(ua)) {
        deviceName = 'iPad';
      } else if (/Android/i.test(ua)) {
        const match = ua.match(/Android[^;]*;\s*([^;)]+?)(?:\s*Build\/|\))/i);
        const cand = match ? String(match[1] || '').trim() : '';
        if (cand && cand.toUpperCase() !== 'K' && !/^(Linux|Mobile|Android|wv|U)$/i.test(cand)) {
          deviceName = cand.replace(/^SAMSUNG\s+/i, 'Samsung ');
        } else {
          deviceName = 'Unknown Device';
          isUnknown = true;
        }
      } else if (/Windows/i.test(ua) || uaPlatform === 'Windows') {
        deviceName = 'Windows PC';
      } else if (/Macintosh|Mac OS/i.test(ua) || uaPlatform === 'macOS') {
        deviceName = 'Mac Desktop';
      } else if (/CrOS/i.test(ua)) {
        deviceName = 'Chromebook';
      } else if (/Linux/i.test(ua)) {
        deviceName = 'Linux Desktop';
      } else {
        deviceName = 'Unknown Device';
        isUnknown = true;
      }

      let browserName = 'Browser';
      let browserVer = '';
      const edgeM = ua.match(/Edg(?:A|iOS)?\/([\d.]+)/i);
      const chromeM = ua.match(/Chrome\/([\d.]+)/i);
      const firefoxM = ua.match(/Firefox\/([\d.]+)/i);
      const safariM = ua.match(/Version\/([\d.]+).*Safari/i);
      if (edgeM) { browserName = 'Edge'; browserVer = edgeM[1].split('.')[0]; }
      else if (chromeM) { browserName = 'Chrome'; browserVer = chromeM[1].split('.')[0]; }
      else if (firefoxM) { browserName = 'Firefox'; browserVer = firefoxM[1].split('.')[0]; }
      else if (safariM) { browserName = 'Safari'; browserVer = safariM[1].split('.')[0]; }
      else if (/Safari/i.test(ua)) { browserName = 'Safari'; }

      const browserVersion = `${browserName}${browserVer ? ' ' + browserVer : ''} / Digital Khata App v1.0`;
      return { deviceName, isUnknown, browserVersion };
    }

    async function fetchNetworkMeta() {
      const controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
      const timer = controller ? setTimeout(() => controller.abort(), 3500) : null;
      try {
        const res = await fetch('/api/device-meta', {
          method: 'GET',
          signal: controller ? controller.signal : undefined
        });
        if (timer) clearTimeout(timer);
        if (res.ok) {
          const data = await res.json();
          return {
            ip: String(data?.ip || 'Unknown').trim() || 'Unknown',
            location: String(data?.locationText || 'Location Detected').trim() || 'Location Detected'
          };
        }
      } catch (e) {
        if (timer) clearTimeout(timer);
      }
      return { ip: 'Network IP', location: 'Location Detected' };
    }

    async function buildFullDeviceMeta(opts = {}) {
      const deviceId = getOrCreateDeviceId();
      const [devInfo, netMeta] = await Promise.all([detectDeviceInfo(), fetchNetworkMeta()]);
      let localSessionId = '';
      try { localSessionId = String(localStorage.getItem(DK_SESSION_ID_KEY) || ''); } catch (e) {}
      return {
        deviceId,
        deviceName: devInfo.deviceName,
        isUnknown: Boolean(devInfo.isUnknown || devInfo.deviceName === 'Unknown Device'),
        browserVersion: devInfo.browserVersion,
        ip: netMeta.ip,
        location: netMeta.location,
        loginDateTime: formatDeviceLoginTime(Date.now()),
        recordHistory: opts.recordHistory !== false,
        localSessionId
      };
    }

    async function sendDeviceApprovalEmail(payload) {
      const toEmail = String(payload?.toEmail || '').trim().toLowerCase();
      if (!toEmail || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(toEmail)) {
        return { ok: false, reason: 'NO_OWNER_EMAIL' };
      }
      const origin = window.location.origin;
      const allowUrl = payload.reqId && payload.approvalToken
        ? `${origin}/?deviceAction=allow&uid=${encodeURIComponent(payload.uid || '')}&reqId=${encodeURIComponent(payload.reqId)}&token=${encodeURIComponent(payload.approvalToken)}`
        : '';
      const denyUrl = payload.reqId && payload.approvalToken
        ? `${origin}/?deviceAction=deny&uid=${encodeURIComponent(payload.uid || '')}&reqId=${encodeURIComponent(payload.reqId)}&token=${encodeURIComponent(payload.approvalToken)}`
        : '';

      let serverResult = null;
      try {
        const res = await fetch('/api/device-email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            kind: payload.kind === 'blocked-alert' ? 'blocked-alert' : 'approval-request',
            toEmail,
            ownerName: payload.ownerName || 'Workshop Owner',
            deviceName: payload.deviceName || 'Unknown Device',
            loginDateTime: payload.loginDateTime || formatDeviceLoginTime(Date.now()),
            location: payload.location || 'Unknown Location',
            ip: payload.ip || 'Unknown',
            browserVersion: payload.browserVersion || 'Digital Khata App v1.0',
            allowUrl,
            denyUrl
          })
        });
        if (res.ok) serverResult = await res.json();
      } catch (e) {}

      if (serverResult && serverResult.provider === 'resend') {
        return { ok: true, provider: 'resend', allowUrl, denyUrl };
      }

      // Client EmailJS fallback (works even without RESEND_API_KEY)
      const isAlert = payload.kind === 'blocked-alert';
      const detailSummary = isAlert
        ? [
            'ALERT: Unauthorized Device Blocked (Owner ne Allow Nahi Kiya)',
            `Device: ${payload.deviceName || 'Unknown Device'}`,
            `Date & Time: ${payload.loginDateTime || ''}`,
            `Location: ${payload.location || ''}`,
            `IP Address: ${payload.ip || ''}`,
            `Browser / App Version: ${payload.browserVersion || ''}`,
            'Status: BLOCKED'
          ].join(' | ')
        : [
            'Digital Khata - New Device Login Approval',
            `Device: ${payload.deviceName || 'Unknown Device'}`,
            `Date & Time: ${payload.loginDateTime || ''}`,
            `Location: ${payload.location || ''}`,
            `IP Address: ${payload.ip || ''}`,
            `Browser / App Version: ${payload.browserVersion || ''}`,
            `[ALLOW - Yes, Ye Mera Device Hai]: ${allowUrl}`,
            `[NOT ALLOW - No, Ye Mera Device Nahi Hai]: ${denyUrl}`
          ].join('\n');

      try {
        const resp = await fetch('https://api.emailjs.com/api/v1.0/email/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            service_id: EMAILJS_SERVICE_ID,
            template_id: EMAILJS_TEMPLATE_ID,
            user_id: EMAILJS_PUBLIC_KEY,
            template_params: {
              to_email: toEmail,
              owner_name: payload.ownerName || 'Owner',
              device_name: payload.deviceName || 'Unknown Device',
              login_time: payload.loginDateTime || '',
              location: payload.location || '',
              ip_address: payload.ip || '',
              browser_version: payload.browserVersion || '',
              allow_url: allowUrl,
              deny_url: denyUrl,
              passcode: detailSummary,
              message: detailSummary
            }
          })
        });
        if (resp.ok) {
          return { ok: true, provider: 'emailjs', allowUrl, denyUrl };
        }
      } catch (e) {}

      return { ok: false, reason: 'EMAIL_SEND_FAILED', allowUrl, denyUrl };
    }

    function stopSecurityWatchers() {
      if (typeof unsubDeviceApprovalWatch === 'function') {
        try { unsubDeviceApprovalWatch(); } catch (e) {}
        unsubDeviceApprovalWatch = null;
      }
      if (typeof unsubActiveSessionWatch === 'function') {
        try { unsubActiveSessionWatch(); } catch (e) {}
        unsubActiveSessionWatch = null;
      }
      if (typeof unsubAdminLiveWatch === 'function') {
        try { unsubAdminLiveWatch(); } catch (e) {}
        unsubAdminLiveWatch = null;
      }
    }

    function attachActiveSessionWatcher(uid, sessionId, localSessionVersion, knownAdminRestoreAt = 0) {
      if (typeof unsubActiveSessionWatch === 'function') {
        try { unsubActiveSessionWatch(); } catch (e) {}
        unsubActiveSessionWatch = null;
      }
      const cloud = getCloud();
      if (!cloud || !uid || isAdminSession()) return;
      const myDeviceId = getOrCreateDeviceId();
      const baseRestoreTs = Math.max(Number(knownAdminRestoreAt || 0), Number(state.cloudMeta?.lastAdminRestoreAt || 0));
      unsubActiveSessionWatch = cloud.watchUserActiveSession(
        uid,
        myDeviceId,
        sessionId || '',
        Number(localSessionVersion || 1),
        async (reason) => {
          stopSecurityWatchers();
          hydrateGeneration++;
          if (cloudSyncTimer) { clearTimeout(cloudSyncTimer); cloudSyncTimer = null; }
          try {
            localStorage.setItem(EXPLICIT_SIGNOUT_KEY, '1');
            localStorage.removeItem(DK_SESSION_ID_KEY);
            localStorage.removeItem(DK_SESSION_VERSION_KEY);
            localStorage.removeItem(ACTIVE_UID_KEY);
            localStorage.removeItem(STORAGE_KEY);
            localStorage.removeItem(PENDING_SYNC_KEY);
          } catch (e) {}
          sessionStorage.removeItem(PIN_UNLOCK_SESSION_KEY);
          ui.cloudHydrating = false;
          ui.loginPending = false;
          ui.pendingApproval = null;
          ui.pinLocked = false;
          ui.pinEntry = '';
          const remKeep = loadRememberMe();
          state = defaultData();
          state.rememberMe = remKeep;
          ui.authMode = 'login';
          ui.view = 'login';
          closeModal();
          try { await cloud.signOutUser(); } catch (e) {}
          render();
          if (reason === 'other_device') {
            toast(L('Logged out because your account was signed in on another mobile/device.', 'تم تسجيل الخروج لأن حسابك تم فتحه على جهاز آخر.'), 'error');
          } else if (reason === 'blocked') {
            toast(L('Account is currently blocked.', 'الحساب محظور حالياً.'), 'error');
          } else {
            toast(L('Logged out from all devices by Owner.', 'تم تسجيل الخروج من جميع الأجهزة.'), 'info');
          }
        },
        async (restoredAt) => {
          if (!state.session || state.session.uid !== uid) return;
          if (restoredAt <= Number(state.cloudMeta?.lastAdminRestoreAt || 0)) return;
          try {
            const bundle = await cloud.loadUserBundle(uid);
            if (bundle && bundle.hasCloudData) {
              applyBackupPayload({ data: bundle.vaultData }, true, true);
              if (bundle.profile && state.session) {
                if (bundle.profile.name) state.session.name = String(bundle.profile.name);
                if (bundle.profile.mobile !== undefined) state.session.mobile = String(bundle.profile.mobile || '');
                if (bundle.profile.email !== undefined) state.session.email = String(bundle.profile.email || '');
              }
              state.cloudMeta = {
                ...(state.cloudMeta || {}),
                uid,
                lastAdminRestoreAt: restoredAt,
                lastBackupAt: restoredAt,
                lastSyncAt: restoredAt
              };
              localStorage.removeItem(PENDING_SYNC_KEY);
              saveState(true);
              render();
              toast(L('Account data synced with Admin update ✓', 'تمت مزامنة البيانات من لوحة المسؤول ✓'), 'success');
            }
          } catch (e) {}
        },
        baseRestoreTs
      );
    }

    function startDeviceApprovalFlow(uid, devRes, devMeta, overrideInfo = {}, fbUser = null) {
      stopSecurityWatchers();
      const cloud = getCloud();
      if (!cloud) return;
      // Hold user strictly outside Dashboard / Cache until Owner clicks ALLOW
      localStorage.removeItem(ACTIVE_UID_KEY);
      localStorage.removeItem(DK_SESSION_ID_KEY);
      state.session = null;
      ui.loginPending = false;
      ui.authLoading = false;
      ui.cloudHydrating = false;
      ui.startupCheckingAuth = false;

      const approvalObj = {
        uid,
        reqId: devRes.reqId,
        approvalToken: devRes.approvalToken,
        ownerEmail: devRes.ownerEmail || '',
        ownerName: devRes.ownerName || 'Workshop Owner',
        deviceName: devMeta.deviceName || 'Unknown Device',
        isUnknown: Boolean(devMeta.isUnknown),
        loginDateTime: devMeta.loginDateTime || formatDeviceLoginTime(Date.now()),
        location: devMeta.location || 'Location Detected',
        ip: devMeta.ip || 'Unknown',
        browserVersion: devMeta.browserVersion || 'Digital Khata App v1.0',
        status: 'pending',
        emailSent: false,
        emailSending: true,
        emailError: '',
        devMeta,
        overrideInfo
      };
      ui.pendingApproval = approvalObj;
      render();

      // Send Owner Email immediately (indefinite wait, NO 10-minute timeout)
      sendDeviceApprovalEmail({
        kind: 'approval-request',
        uid,
        reqId: devRes.reqId,
        approvalToken: devRes.approvalToken,
        toEmail: approvalObj.ownerEmail,
        ownerName: approvalObj.ownerName,
        deviceName: approvalObj.deviceName,
        loginDateTime: approvalObj.loginDateTime,
        location: approvalObj.location,
        ip: approvalObj.ip,
        browserVersion: approvalObj.browserVersion
      }).then((mailRes) => {
        if (ui.pendingApproval && ui.pendingApproval.reqId === devRes.reqId) {
          ui.pendingApproval.emailSending = false;
          ui.pendingApproval.emailSent = Boolean(mailRes?.ok);
          if (!mailRes?.ok) {
            ui.pendingApproval.emailError = approvalObj.ownerEmail
              ? L('Approval email could not be sent cleanly. Tap Resend Email.', 'تعذر إرسال بريد الموافقة. اضغط إعادة الإرسال.')
              : L('No owner email saved on this account to send approval mail.', 'لا يوجد بريد إلكتروني مسجل لإرسال رسالة الموافقة.');
          }
          render();
        }
      });

      // Listen indefinitely via Firestore onSnapshot for Owner click on ALLOW / NOT ALLOW
      unsubDeviceApprovalWatch = cloud.watchDeviceApprovalLink(devRes.reqId, async (update) => {
        if (!ui.pendingApproval || ui.pendingApproval.reqId !== devRes.reqId) return;
        if (update.decision === 'allowed') {
          stopSecurityWatchers();
          ui.pendingApproval.status = 'finalizing';
          render();
          try {
            const curUser = cloud.auth?.currentUser || fbUser;
            if (!curUser || curUser.uid !== uid) {
              throw new Error('AUTH_SESSION_CHANGED');
            }
            const fin = await cloud.finalizeApprovedDeviceLogin(uid, devMeta);
            try {
              localStorage.setItem(DK_SESSION_ID_KEY, fin.sessionId);
              localStorage.setItem(DK_SESSION_VERSION_KEY, String(fin.sessionVersion || 1));
              localStorage.removeItem(EXPLICIT_SIGNOUT_KEY);
            } catch (e) {}
            ui.pendingApproval = null;
            ui.loginPending = true;
            ui.loginStageText = L('Device Approved! Opening Digital Khata...', 'تمت الموافقة على الجهاز! جاري الفتح...');
            render();
            await hydrateFromFirebaseUser(curUser, overrideInfo, { skipDeviceGate: true });
            attachActiveSessionWatcher(uid, fin.sessionId, fin.sessionVersion);
            ui.loginPending = false;
            ui.view = isAdminSession() ? 'admin' : ((state.blocked || !isKycVerified()) ? 'kyc' : 'home');
            render();
            toast(L('Device Approved ✓ Welcome to Digital Khata!', 'تمت الموافقة على الجهاز ✓ أهلاً بك!'), 'success');
          } catch (err) {
            ui.loginPending = false;
            if (ui.pendingApproval) ui.pendingApproval.status = 'pending';
            render();
            toast(L('Error activating approved device. Retry.', 'حدث خطأ أثناء تفعيل الجهاز.'), 'error');
          }
        } else if (update.decision === 'denied') {
          stopSecurityWatchers();
          try {
            await cloud.recordBlockedLoginAttempt(uid, devMeta);
          } catch (e) {}
          // Send security alert email to Owner
          sendDeviceApprovalEmail({
            kind: 'blocked-alert',
            uid,
            toEmail: approvalObj.ownerEmail,
            ownerName: approvalObj.ownerName,
            deviceName: approvalObj.deviceName,
            loginDateTime: approvalObj.loginDateTime,
            location: approvalObj.location,
            ip: approvalObj.ip,
            browserVersion: approvalObj.browserVersion
          }).catch(() => {});
          try {
            localStorage.setItem(EXPLICIT_SIGNOUT_KEY, '1');
            localStorage.removeItem(DK_SESSION_ID_KEY);
            localStorage.removeItem(DK_SESSION_VERSION_KEY);
            localStorage.removeItem(ACTIVE_UID_KEY);
          } catch (e) {}
          try { await cloud.signOutUser(); } catch (e) {}
          state.session = null;
          ui.loginPending = false;
          ui.pendingApproval = {
            ...approvalObj,
            status: 'blocked'
          };
          render();
          toast('Owner ne Is Device ko Allow Nahi Kiya', 'error');
        }
      });
    }

    async function hydrateFromFirebaseUser(fbUser, overrideInfo = {}, opts = {}) {
      const cloud = getCloud();
      if (!cloud || !fbUser) return { ok: false, reason: 'NO_USER' };
      if (!cloud.auth?.currentUser || cloud.auth.currentUser.uid !== fbUser.uid) return { ok: false, reason: 'AUTH_MISMATCH' };
      const myGen = ++hydrateGeneration;
      const isBg = Boolean(opts.background);
      const strictNetwork = Boolean(opts.strictNetwork);
      if (!isBg && (!state.session || state.session.uid !== fbUser.uid)) {
        ui.cloudHydrating = true;
      }
      try {
        try {
          await withTimeout(fbUser.getIdToken(), 12000, 'TOKEN_TIMEOUT');
        } catch (tokErr) {
          // Never auto-logout user on transient or offline token errors
        }
        if (myGen !== hydrateGeneration || !cloud.auth?.currentUser || cloud.auth.currentUser.uid !== fbUser.uid) {
          return { ok: false, reason: 'SUPERSEDED' };
        }

        const prevUid = state.session?.uid || state.cloudMeta?.uid || '';
        const isNewSignup = Boolean(overrideInfo.isNewSignup);
        const remCopy = loadRememberMe();

        // Admin direct account check
        const emailLower = String(overrideInfo.email || fbUser.email || '').trim().toLowerCase();
        if (cloud.isAdminEmail(emailLower)) {
          state = defaultData();
          state.rememberMe = remCopy;
          state.session = {
            id: fbUser.uid,
            uid: fbUser.uid,
            name: fbUser.displayName || 'Admin',
            email: emailLower,
            mobile: '',
            identifier: emailLower,
            authType: 'email',
            photo: '',
            provider: 'firebase',
            isAdmin: true,
            loginAt: Date.now()
          };
          state.kyc.status = 'approved';
          ui.pinLocked = false;
          ui.cloudHydrating = false;
          ui.view = ui.view === 'admin-inspect' ? 'admin-inspect' : 'admin';
          saveState(true);
          render();
          loadAdminUsersList();
          return { ok: true };
        }

        // DEVICE BINDING + INDEFINITE NEW DEVICE APPROVAL GATE
        if (!isNewSignup && !opts.skipDeviceGate && navigator.onLine) {
          const devMeta = await buildFullDeviceMeta({ recordHistory: !isBg && Boolean(opts.recordLoginHistory) });
          if (myGen !== hydrateGeneration || !cloud.auth?.currentUser || cloud.auth.currentUser.uid !== fbUser.uid) {
            return { ok: false, reason: 'SUPERSEDED' };
          }
          const devRes = await cloud.registerOrCheckDeviceLogin(fbUser.uid, devMeta);
          if (devRes.status === 'pending_approval') {
            startDeviceApprovalFlow(fbUser.uid, devRes, devMeta, overrideInfo, fbUser);
            return { ok: false, reason: 'PENDING_APPROVAL' };
          }
          if (devRes.status === 'approved') {
            try {
              localStorage.setItem(DK_SESSION_ID_KEY, devRes.sessionId);
              localStorage.setItem(DK_SESSION_VERSION_KEY, String(devRes.sessionVersion || 1));
            } catch (e) {}
            attachActiveSessionWatcher(fbUser.uid, devRes.sessionId, devRes.sessionVersion);
          }
        } else if (!isNewSignup && navigator.onLine) {
          let sid = '';
          let sver = 1;
          try {
            sid = String(localStorage.getItem(DK_SESSION_ID_KEY) || '');
            sver = Number(localStorage.getItem(DK_SESSION_VERSION_KEY) || 1);
          } catch (e) {}
          if (sid) attachActiveSessionWatcher(fbUser.uid, sid, sver);
        }

        // STRICT PER-ACCOUNT ISOLATION:
        if (isNewSignup || prevUid !== fbUser.uid) {
          state = defaultData();
          state.rememberMe = remCopy;
        }

        if (isNewSignup) {
          const displayName = String(overrideInfo.name || fbUser.displayName || 'User');
          const emailVal = String(overrideInfo.email || fbUser.email || '');
          state.session = {
            id: fbUser.uid,
            uid: fbUser.uid,
            name: displayName,
            email: emailVal,
            mobile: '',
            identifier: emailVal,
            authType: 'email',
            photo: '',
            provider: 'firebase',
            loginAt: Date.now()
          };
          state.cloudMeta = { uid: fbUser.uid, lastSyncAt: 0, lastBackupAt: 0, lastDailyBackupDate: '' };
          state.kyc.status = 'none';
          state.kyc.fullName = displayName;
          ui.pinLocked = false;
          ui.view = 'kyc';
          localStorage.removeItem(EXPLICIT_SIGNOUT_KEY);
          saveState(true);
          await flushCloudSync();
          try {
            const devMeta = await buildFullDeviceMeta({ recordHistory: true });
            const devRes = await cloud.registerOrCheckDeviceLogin(fbUser.uid, devMeta);
            if (devRes.status === 'approved') {
              localStorage.setItem(DK_SESSION_ID_KEY, devRes.sessionId);
              localStorage.setItem(DK_SESSION_VERSION_KEY, String(devRes.sessionVersion || 1));
              attachActiveSessionWatcher(fbUser.uid, devRes.sessionId, devRes.sessionVersion);
            }
          } catch (e) {}
          return { ok: true };
        }

        const bundle = await withTimeout(cloud.loadUserBundle(fbUser.uid), 22000, 'BUNDLE_TIMEOUT');
        if (myGen !== hydrateGeneration || !cloud.auth?.currentUser || cloud.auth.currentUser.uid !== fbUser.uid) {
          return { ok: false, reason: 'SUPERSEDED' };
        }
        const prof = bundle.profile || {};
        const uidCache = loadUserCache(fbUser.uid);

        if (bundle.hasCloudData) {
          const hasPending = localStorage.getItem(PENDING_SYNC_KEY) === fbUser.uid;
          if (hasPending && uidCache && hasWorkshopRecords(uidCache)) {
            applyBackupPayload({ data: uidCache }, true, true);
          } else {
            applyBackupPayload({ data: bundle.vaultData }, true, true);
          }
        } else if (uidCache) {
          applyBackupPayload({ data: uidCache }, true, true);
        }

        // Preserve local theme preference if user explicitly toggled it locally before cloud caught up
        const localTheme = loadSavedThemePref();
        if (localTheme && state.settings.theme !== localTheme && localStorage.getItem(PENDING_SYNC_KEY) === fbUser.uid) {
          state.settings.theme = localTheme;
        }

        const displayName = String(overrideInfo.name || prof.name || fbUser.displayName || 'User');
        const emailVal = String(overrideInfo.email || prof.email || (fbUser.email && !fbUser.email.endsWith('@mobile.digitalkhata.app') ? fbUser.email : '') || '');
        const mobileVal = String(overrideInfo.mobile || prof.mobile || state.kyc?.mobile || '');
        const identifierVal = String(overrideInfo.identifier || prof.identifier || emailVal || mobileVal || '');
        const photoVal = String(prof.profilePicUrl || state.kyc?.selfiePhoto || state.session?.photo || '');

        state.session = {
          id: fbUser.uid,
          uid: fbUser.uid,
          cloudUid: fbUser.uid,
          name: displayName,
          email: emailVal,
          mobile: mobileVal,
          identifier: identifierVal,
          authType: (prof.authType === 'mobile' || overrideInfo.authType === 'mobile') ? 'mobile' : 'email',
          photo: photoVal,
          provider: 'firebase',
          loginAt: Date.now()
        };
        localStorage.removeItem(EXPLICIT_SIGNOUT_KEY);
        state.blocked = Boolean(prof.blocked);
        if (prof.pinEnabled && prof.pinHash) {
          state.pinSecurity = { enabled: true, hash: String(prof.pinHash) };
        }
        if (prof.kycStatus === 'duplicate') {
          state.kyc.status = 'duplicate';
          state.kyc.duplicateOf = String(prof.kycDuplicateOf || state.kyc.duplicateOf || '');
        } else if (prof.kycStatus === 'approved' && state.kyc.status !== 'approved') {
          state.kyc.status = 'approved';
        }
        const remoteRestoreAt = Number(prof.lastAdminRestoreAt || 0);
        state.cloudMeta = {
          ...(state.cloudMeta || {}),
          uid: fbUser.uid,
          lastSyncAt: Number(prof.lastSyncAt || state.cloudMeta?.lastSyncAt || 0),
          lastBackupAt: Number(prof.lastBackupAt || bundle.latestBackup?.createdAt || state.cloudMeta?.lastBackupAt || 0),
          termsAccepted: Boolean(prof.termsAccepted ?? state.cloudMeta?.termsAccepted ?? true),
          termsAcceptedAt: Number(prof.termsAcceptedAt || state.cloudMeta?.termsAcceptedAt || prof.createdAt || 0),
          lastAdminRestoreAt: Math.max(remoteRestoreAt, Number(state.cloudMeta?.lastAdminRestoreAt || 0))
        };
        if (!state.kyc.fullName && displayName) state.kyc.fullName = displayName;
        if (!state.kyc.mobile && mobileVal) state.kyc.mobile = mobileVal;

        // Legacy / Existing accounts duplicate CNIC audit (never auto-deletes any account!)
        if (state.kyc?.cnic && state.kyc.status !== 'duplicate' && !prof.kycStatusOverrideByAdmin) {
          try {
            const cnicAudit = await cloud.checkOrClaimLegacyCnic(state.kyc.cnic, fbUser.uid);
            if (cnicAudit.isDuplicate) {
              state.kyc.status = 'duplicate';
              state.kyc.duplicateOf = cnicAudit.ownerUid || '';
            }
          } catch (e) {}
        }

        const unlockedThisSession = sessionStorage.getItem(PIN_UNLOCK_SESSION_KEY) === fbUser.uid;
        ui.pinLocked = Boolean(
          state.pinSecurity?.enabled &&
          state.pinSecurity?.hash &&
          !unlockedThisSession
        );
        ui.appLocked = Boolean(
          !isAdminSession() &&
          state.biometric?.enabled &&
          !unlockedThisSession
        );
        if (ui.appLocked) ui.bioFailedCount = 0;
        if (state.kyc && state.kyc.status === 'verifying' && state.kyc.submittedAt && (Date.now() - state.kyc.submittedAt >= KYC_VERIFY_DURATION_MS)) {
          state.kyc.status = 'approved';
          state.kyc.approvedAt = Date.now();
          ui.kycWelcomeBanner = true;
        }
        checkAutoArchive();
        saveState(true);
        flushCloudSync().then(() => {
          if (myGen === hydrateGeneration) {
            maybeRunAutoDailyBackup();
            maybeRunDriveAutoBackup();
          }
        });
        return { ok: true };
      } catch (err) {
        if (myGen !== hydrateGeneration) return { ok: false, reason: 'SUPERSEDED' };
        if (strictNetwork && (!state.session || state.session.uid !== fbUser.uid)) {
          throw err;
        }
        if (!err || err.message !== 'AUTH_SESSION_CHANGED') {
          ui.syncStatus = 'pending';
        }
        return { ok: false, error: err };
      } finally {
        if (myGen !== hydrateGeneration) return;
        ui.cloudHydrating = false;
        ui.startupCheckingAuth = false;
        if (!ui.pendingApproval) {
          if (state.session) {
            if (isAdminSession()) {
              ui.view = ui.view === 'admin-inspect' ? 'admin-inspect' : 'admin';
            } else if (state.blocked || !isKycVerified()) {
              ui.view = 'kyc';
              if (state.kyc?.status === 'verifying') startKycCountdownTimer();
            } else {
              ui.view = (ui.view === 'login' || ui.view === 'kyc') ? 'home' : ui.view;
            }
          } else if (!ui.loginPending) {
            ui.view = 'login';
          }
        }
        render();
      }
    }
