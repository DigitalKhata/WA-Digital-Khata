      const def = defaultData();
      if (resetFirst) {
        const keepSess = state.session;
        const keepRem = state.rememberMe;
        const keepCloud = state.cloudMeta;
        const keepPin = state.pinSecurity;
        const keepBio = state.biometric;
        state = defaultData();
        state.session = keepSess;
        state.rememberMe = keepRem;
        state.cloudMeta = keepCloud;
        state.pinSecurity = keepPin;
        state.biometric = keepBio;
      }
      if (d.settings) {
        const mappedBank = LEGACY_BANK_NAME_MAP[d.settings.defaultBank] || d.settings.defaultBank || def.settings.defaultBank;
        const dSigs = d.settings.signatures || {};
        const dQr = d.settings.whatsappQr || {};

            }
          },
          whatsappQr: {
            ownerNumber: migQr,
            owner1Number: migQr
          },
          driveAutoBackup: d.settings.driveAutoBackup !== undefined ? Boolean(d.settings.driveAutoBackup) : true,
          appBackground: {
            ...def.settings.appBackground,
            ...(d.settings.appBackground || {})
          },
          notifications: {
            ...def.settings.notifications,
            ...(d.settings.notifications || {})
          }
        };
      }
      if (Array.isArray(d.notificationHistory)) state.notificationHistory = d.notificationHistory.slice(0, 100);
      if (Array.isArray(d.customers)) state.customers = d.customers;
      if (Array.isArray(d.orders)) state.orders = d.orders;
      if (Array.isArray(d.customerPayments)) state.customerPayments = d.customerPayments;

      if (Array.isArray(d.rentRecords)) state.rentRecords = d.rentRecords;
      if (Array.isArray(d.rentPayments)) state.rentPayments = d.rentPayments;
      if (Array.isArray(d.committees)) state.committees = d.committees;
      if (Array.isArray(d.archivedReports)) state.archivedReports = d.archivedReports;

    function downloadFile(filename, content, mime) {
      const blob = new Blob([content], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function normalizeWhatsAppQrNumber(rawInput, selectedCountryCode = '+966') {
      const raw = String(rawInput || '').trim();
      if (!raw) return '';
      const stripped = raw.replace(/[^\d+]/g, '');
      if (!stripped) return '';
      if (stripped.startsWith('+')) {
        let d = stripped.slice(1).replace(/\D/g, '');
        if (!d) return '';
        if (d.startsWith('9660') && d.length >= 13) d = '966' + d.slice(4);
        else if (d.startsWith('920') && d.length >= 13) d = '92' + d.slice(3);
        return '+' + d;
      }
      if (stripped.startsWith('00')) {
        const d = stripped.slice(2).replace(/\D/g, '');
        return d ? ('+' + d) : '';
      }
      let digits = stripped.replace(/\D/g, '');
      if (!digits) return '';
      const ccDigits = String(selectedCountryCode || '+966').replace(/\D/g, '') || '966';
      if (digits.startsWith(ccDigits) && digits.length >= ccDigits.length + 7) {
        return '+' + digits;
      }
      digits = digits.replace(/^0+/, '');
      return digits ? ('+' + ccDigits + digits) : '';
    }

    function splitWhatsAppQrForInput(storedVal, defaultCc = '+966') {
      const val = String(storedVal || '').trim();
      const knownCodes = ['+966', '+92', '+971', '+974', '+965', '+973', '+968'];
      if (!val) return { countryCode: defaultCc, number: '' };
      for (const cc of knownCodes) {
        if (val.startsWith(cc)) {
          return { countryCode: cc, number: val.slice(cc.length) };
        }
      }
      if (val.startsWith('+')) {
        return { countryCode: defaultCc, number: val };
      }
      return { countryCode: defaultCc, number: val };
    }

      const digits = String(qrCfg.ownerNumber || '').replace(/\D/g, '');

    async function ensureInvoiceQrDataUrl(inv) {
      if (!inv) return '';
      const qrText = getInvoiceQrText(inv);
      if (!qrText) {
        inv.qrDataUrl = '';
        return '';
      }
      if (ui.qrCache[qrText]) {
        inv.qrDataUrl = ui.qrCache[qrText];
        return ui.qrCache[qrText];
      }
      const libs = window.__DK_INVOICE_LIBS__;
      if (!libs || !libs.QRCode) return '';
      try {
        const url = await libs.QRCode.toDataURL(qrText, {
          width: 220,
          margin: 1,
          errorCorrectionLevel: 'M',
          color: { dark: '#000000', light: '#ffffff' }
        });
        ui.qrCache[qrText] = url;
        inv.qrDataUrl = url;
        return url;
      } catch {
        return '';
      }
    }

    async function processUploadedSignatureFile(file) {
      const dataUrl = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ''));
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
      const img = await loadImgForCanvas(dataUrl);
      if (!img) throw new Error('Image load failed');
      const maxDim = 560;
      const scale = Math.min(1, maxDim / Math.max(img.width || 1, img.height || 1));
      const w = Math.max(1, Math.round((img.width || 1) * scale));
      const h = Math.max(1, Math.round((img.height || 1) * scale));
      const c = document.createElement('canvas');
      c.width = w;
      c.height = h;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const imgData = ctx.getImageData(0, 0, w, h);
      const d = imgData.data;

      // Check whether image contains blue ink strokes vs neutral black pen strokes
      let blueCount = 0;
      let darkCount = 0;
      let lumSum = 0;
      const totalPx = w * h;
      for (let i = 0; i < totalPx; i++) {
        const r = d[i * 4], g = d[i * 4 + 1], b = d[i * 4 + 2];
        const lum = 0.299 * r + 0.587 * g + 0.114 * b;
        lumSum += lum;
        if (!(g > 135 && g - r > 35 && g - b > 15)) {
          if (b - r >= 26 && b - g >= 20 && lum < 135) blueCount++;
          if (lum < 110) darkCount++;
        }
      }
      const avgLum = lumSum / Math.max(1, totalPx);
      const useBlueInkIsolation = blueCount > 35;

      const mask = new Uint8Array(totalPx);
      const lumArr = new Float32Array(totalPx);
      for (let i = 0; i < totalPx; i++) {
        const r = d[i * 4], g = d[i * 4 + 1], b = d[i * 4 + 2];
        const lum = 0.299 * r + 0.587 * g + 0.114 * b;
        lumArr[i] = lum;
        // Drop green highlights/circles
        if (g > 130 && (g - r) > 32 && (g - b) > 12) continue;
        if (useBlueInkIsolation) {
          const br = b - r;
          const bg = b - g;
          if ((r < 85 && g < 85 && lum < 105 && br >= 24 && bg >= 20) || (r < 110 && g < 110 && lum < 125 && br >= 40 && bg >= 36)) {
            mask[i] = 1;
          }
        } else {
          const darkThreshold = Math.min(135, Math.max(65, avgLum * 0.62));
          if (lum < darkThreshold) {
            mask[i] = 1;
          }
        }
      }

      // Despeckle isolated 1px noise and find tight bounding box
      const out = new Uint8ClampedArray(totalPx * 4);
      let minX = w, minY = h, maxX = -1, maxY = -1;
      for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
          const i = y * w + x;
          if (!mask[i]) continue;
          let neighbors = 0;
          for (let dy = -1; dy <= 1; dy++) {
            for (let dx = -1; dx <= 1; dx++) {
              if (mask[(y + dy) * w + (x + dx)]) neighbors++;
            }
          }
          if (neighbors < 2) continue;
          const alpha = Math.round(Math.min(255, Math.max(120, ((140 - lumArr[i]) / 85) * 255)));
          out[i * 4] = 12;
          out[i * 4 + 1] = 44;
          out[i * 4 + 2] = 148;
          out[i * 4 + 3] = alpha;
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }

      if (maxX < minX || maxY < minY) {
        // Fallback: preserve dark strokes simply
        for (let i = 0; i < totalPx; i++) {
          const r = d[i * 4], g = d[i * 4 + 1], b = d[i * 4 + 2];
          const lum = 0.299 * r + 0.587 * g + 0.114 * b;
          if (lum < 150 && !(g > 135 && g - r > 35)) {
            out[i * 4] = 12; out[i * 4 + 1] = 44; out[i * 4 + 2] = 148; out[i * 4 + 3] = 220;
            const x = i % w, y = (i - x) / w;
            if (x < minX) minX = x; if (x > maxX) maxX = x;
            if (y < minY) minY = y; if (y > maxY) maxY = y;
          }
        }
      }

      if (maxX < minX || maxY < minY) return dataUrl;

      const pad = 8;
      const sx = Math.max(0, minX - pad);
      const sy = Math.max(0, minY - pad);
      const sw = Math.min(w - sx, maxX - minX + 1 + pad * 2);
      const sh = Math.min(h - sy, maxY - minY + 1 + pad * 2);

      const tempC = document.createElement('canvas');
      tempC.width = w; tempC.height = h;
      tempC.getContext('2d').putImageData(new ImageData(out, w, h), 0, 0);

      const finalScale = Math.min(1, 360 / Math.max(sw, 1), 160 / Math.max(sh, 1));
      const fw = Math.max(1, Math.round(sw * finalScale));
      const fh = Math.max(1, Math.round(sh * finalScale));
      const outC = document.createElement('canvas');
      outC.width = fw; outC.height = fh;
      outC.getContext('2d').drawImage(tempC, sx, sy, sw, sh, 0, 0, fw, fh);
      return outC.toDataURL('image/png');
    }

    async function renderTransformedSignatureDataUrl(src, rotationDeg = 0) {
      const img = await loadImgForCanvas(src);
      if (!img) return '';
      const rad = (Number(rotationDeg || 0) * Math.PI) / 180;
      const cos = Math.abs(Math.cos(rad));
      const sin = Math.abs(Math.sin(rad));
      const w = img.width || 240;
      const h = img.height || 100;
      const rw = Math.max(1, Math.ceil(w * cos + h * sin));
      const rh = Math.max(1, Math.ceil(w * sin + h * cos));
      const canvas = document.createElement('canvas');
      canvas.width = rw;
      canvas.height = rh;
      const ctx = canvas.getContext('2d');
      ctx.translate(rw / 2, rh / 2);
      ctx.rotate(rad);
      ctx.drawImage(img, -w / 2, -h / 2, w, h);
      return canvas.toDataURL('image/png');
    }

    async function renderCircularLogoDataUrl(src) {
      const img = await loadImgForCanvas(src);
      if (!img) return '';
      const size = 180;
      const c = document.createElement('canvas');
      c.width = size; c.height = size;
      const ctx = c.getContext('2d');
      ctx.beginPath();
      ctx.arc(size / 2, size / 2, size / 2 - 2, 0, Math.PI * 2);
      ctx.closePath();
      ctx.clip();
      ctx.drawImage(img, 0, 0, size, size);
      return c.toDataURL('image/png');
    }

    function buildCustomerInvoiceModel(customerId, overrides = {}) {
      const c = state.customers.find(x => x.id === customerId);
      if (!c) return null;
      const st = getCustomerStats(c.id);
      const orders = state.orders.filter(o => o.customerId === c.id);
      const s = state.settings || {};
      const invLang = getInvoiceLanguage(overrides);
      const isInvAr = invLang === 'ar';
      const rawWorkItems = getCustomerWorkItems(c);
      const customerWorkItems = rawWorkItems.map(w => trWorkForLang(w, invLang));
      const joinSep = isInvAr ? '، ' : ', ';

      const items = orders.length
        ? orders.map(o => {
            const ost = getOrderStats(o);
            const qty = Math.max(1, Number(o.qty || 1));
            const lineTotal = Number(ost.total || 0);
            const unitPrice = Math.round((lineTotal / qty) * 100) / 100;
            const workList = (Array.isArray(o.workItems) && o.workItems.length)
              ? o.workItems.map(w => trWorkForLang(w, invLang)).join(joinSep)
              : (o.itemName ? trWorkForLang(o.itemName, invLang) : invL(invLang, 'Aluminium Work', 'أعمال ألمنيوم'));
            const desc = o.description ? `${workList} (${o.description})` : workList;
            return {
              workType: workList,
              description: desc,
              qty,
              unitPrice,
              total: lineTotal
            };
          })
        : [{
            workType: customerWorkItems.join(joinSep) || invL(invLang, 'Aluminium Work', 'أعمال ألمنيوم'),
            description: customerWorkItems.length ? customerWorkItems.join(joinSep) : invL(invLang, 'Workshop Bill / Balance', 'فاتورة الورشة / الرصيد'),
            qty: 1,
            unitPrice: st.billed,
            total: st.billed
          }];

      const subTotal = items.reduce((acc, it) => acc + Number(it.total || 0), 0);
      const vatEnabled = overrides.vatEnabled !== undefined ? Boolean(overrides.vatEnabled) : Boolean(s.vatEnabledDefault !== false);
      const vatAmount = vatEnabled ? Math.round(subTotal * 0.15 * 100) / 100 : 0;
      const grandTotal = Math.round((subTotal + vatAmount) * 100) / 100;
      const advancePaid = Number(st.received || 0);
      const remainingBalance = Math.max(0, Math.round((grandTotal - advancePaid) * 100) / 100);
      const totalUdhaar = Math.max(0, Number(st.baqaya || remainingBalance));

      const selectedBanks = getInvoiceBanksList(overrides);
      const ownerSignCfg = getSignatureConfig('owner1');
      const invNo = (overrides.invoiceNo || c.lastInvoiceNo || getNextInvoiceNumber(c)).trim();
      const invDate = overrides.invoiceDate || todayISO();
      const dueDate = overrides.dueDate || invDate;

      const workDescParts = orders.map(o => o.description).filter(Boolean);
      const shortWorkDesc = workDescParts.join(' · ') || invL(invLang, 'Custom Aluminium & Glass Fabrication Work', 'تفصيل وتركيب أعمال الألمنيوم والزجاج');

      const rawShopName = (overrides.shopName ?? s.shopName ?? 'Warsha Aluminium Workshop').trim() || 'Warsha Aluminium Workshop';
      const rawShopTagline = (overrides.shopTagline ?? s.shopTagline ?? 'Aluminium & Glass Fabrication Experts').trim();
      const rawShopAddress = (overrides.shopAddress ?? s.shopAddress ?? '').trim();

      const resolvedShopName = isInvAr
        ? ((s.shopNameAr || '').trim() || (rawShopName === 'Warsha Aluminium Workshop' ? 'ورشة ألمنيوم وزجاج' : rawShopName))
        : rawShopName;
      const resolvedShopTagline = isInvAr
        ? ((s.shopTaglineAr || '').trim() || (rawShopTagline === 'Aluminium & Glass Fabrication Experts' ? 'خبراء تفصيل وتركيب الألمنيوم والزجاج' : rawShopTagline))
        : rawShopTagline;
      const resolvedShopAddress = isInvAr
        ? ((s.shopAddressAr || '').trim() || rawShopAddress)
        : rawShopAddress;

      const defaultEnTerms = '1. Work starts after advance payment confirmation.\n2. Custom fabricated aluminium/glass items cannot be returned.\n3. Remaining balance is due upon delivery/installation.';
      const rawTerms = (overrides.terms ?? s.invoiceTerms ?? '').trim();
      const resolvedTerms = isInvAr
        ? ((!rawTerms || rawTerms === defaultEnTerms)
            ? '1. يبدأ العمل بعد تأكيد الدفعة المقدمة.\n2. الطلبات المفصلة حسب المقاس لا ترد ولا تستبدل.\n3. يُستحق الرصيد المتبقي عند التسليم والتركيب.'
            : rawTerms)
        : (rawTerms || '1. Work starts after advance payment confirmation.\n2. Remaining balance is due upon completion/delivery.');

      const model = {
        lang: invLang,
        customerId: c.id,
        invoiceNo: invNo,
        invoiceDate: invDate,
        dueDate,
        logoSrc: (s.customLogo || '').trim() || DEFAULT_LOGO_PATH,
        shopName: resolvedShopName,
        shopTagline: resolvedShopTagline,
        shopAddress: resolvedShopAddress,
        shopMobile: (overrides.shopMobile ?? s.shopMobile ?? '').trim(),
        shopEmail: (overrides.shopEmail ?? s.shopEmail ?? '').trim(),
        ownerName: (overrides.ownerName ?? s.ownerName ?? state.session?.name ?? '').trim(),
        ownerMobile: (overrides.ownerMobile ?? s.ownerMobile ?? state.session?.mobile ?? '').trim(),
        ownerEmail: (overrides.ownerEmail ?? s.ownerEmail ?? state.session?.email ?? '').trim(),
        custName: c.name,
        custPhone: c.mobile || '',
        custEmail: (overrides.custEmail ?? c.email ?? '').trim(),
        custAddress: c.address || '',
        workItems: customerWorkItems,
        shortWorkDesc,
        items,
        subTotal,
        vatEnabled,
        vatAmount,
        grandTotal,
        advancePaid,
        remainingBalance,
        selectedBanks,
        useOwnerSign: Boolean(overrides.useOwnerSign ?? overrides.useOwner1Sign),
        useOwnerQr: Boolean(overrides.useOwnerQr ?? overrides.useOwner1Qr),
        ownerSign: ownerSignCfg,
        qrDataUrl: '',
        terms: resolvedTerms
      };
      const qrText = getInvoiceQrText(model);
      model.qrDataUrl = qrText ? (ui.qrCache[qrText] || '') : '';
      return model;
    }

    function loadImgForCanvas(src) {
      return new Promise((resolve) => {
        if (!src) { resolve(null); return; }
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = src;
      });
    }

    function wrapCanvasLines(ctx, text, maxW) {
      const str = String(text || '').trim();
      if (!str) return [];
      const words = str.split(/\s+/);
      const lines = [];
      let cur = '';
      for (const word of words) {
        const test = cur ? `${cur} ${word}` : word;
        if (ctx.measureText(test).width <= maxW || !cur) {
          cur = test;
        } else {
          lines.push(cur);
          cur = word;
        }
      }
      if (cur) lines.push(cur);
      return lines;
    }

    async function generateCanvasBackedPdfBlob(inv) {
      const libs = window.__DK_INVOICE_LIBS__;
      const { jsPDF } = libs;
      if (document.fonts && document.fonts.ready) {
        try { await document.fonts.ready; } catch (e) {}
      }
      const W = 1240;
      const H = 1754;
      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');

      const invLang = inv.lang === 'ar' ? 'ar' : 'en';
      const isInvAr = invLang === 'ar';
      const padX = 94;
      const startX = isInvAr ? W - padX : padX;
      const endX = isInvAr ? padX : W - padX;
      const startAlign = isInvAr ? 'right' : 'left';
      const endAlign = isInvAr ? 'left' : 'right';
      const baseFont = isInvAr ? "'Cairo', 'Plus Jakarta Sans', sans-serif" : "'Plus Jakarta Sans', 'Cairo', sans-serif";

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#000000';
      ctx.textBaseline = 'top';
      ctx.direction = isInvAr ? 'rtl' : 'ltr';

      let y = 96;
      const dueStr = formatInvoiceDateDDMMYYYY(inv.dueDate || inv.invoiceDate);
      const dateStr = formatInvoiceDateDDMMYYYY(inv.invoiceDate);

      // Top Start: Due Date
      ctx.font = `700 23px ${baseFont}`;
      ctx.textAlign = startAlign;
      ctx.fillText(`${invL(invLang, 'DUE DATE:', 'تاريخ الاستحقاق:')} ${dueStr}`, startX, y + 6);

      // Top End: INVOICE / فاتورة + Bill No + Date
      ctx.font = `800 58px ${baseFont}`;
      ctx.textAlign = endAlign;
      ctx.fillText(invL(invLang, 'INVOICE', 'فاتورة'), endX, y);
      ctx.font = `700 23px ${baseFont}`;
      ctx.fillText(`${invL(invLang, 'Bill No:', 'رقم الفاتورة:')} ${inv.invoiceNo}`, endX, y + 68);
      ctx.font = `400 22px ${baseFont}`;
      ctx.fillText(`${invL(invLang, 'Date:', 'التاريخ:')} ${dateStr}`, endX, y + 100);

      y += 165;

      // Shop Logo + Name + Phone + Address (Start) & Customer Info (End)
      let shopTextX = startX;
      try {
        const logoDataUrl = await renderCircularLogoDataUrl(inv.logoSrc);
        if (logoDataUrl) {
          const logoImg = await loadImgForCanvas(logoDataUrl);
          if (logoImg) {
            const logoSize = 104;
            const logoDrawX = isInvAr ? (startX - logoSize) : startX;
            ctx.drawImage(logoImg, logoDrawX, y - 6, logoSize, logoSize);
            shopTextX = isInvAr ? (startX - logoSize - 22) : (startX + logoSize + 22);
          }
        }
      } catch (e) {}

      let leftEndY = y;
      ctx.textAlign = startAlign;
      ctx.font = `800 32px ${baseFont}`;
      const shopLines = wrapCanvasLines(ctx, inv.shopName || '', 440);
      shopLines.forEach(ln => { ctx.fillText(ln, shopTextX, leftEndY); leftEndY += 40; });
      if (inv.shopTagline) {
        ctx.font = `400 21px ${baseFont}`;
        ctx.fillStyle = '#111827';
        wrapCanvasLines(ctx, inv.shopTagline, 440).forEach(ln => { ctx.fillText(ln, shopTextX, leftEndY); leftEndY += 28; });
      }
      const contactPhone = inv.shopMobile || inv.ownerMobile || '';
      if (contactPhone) {
        ctx.font = `600 20px ${baseFont}`;
        ctx.fillText(`${invL(invLang, 'Phone:', 'رقم الهاتف:')} ${contactPhone}`, shopTextX, leftEndY + 2);
        leftEndY += 28;
      }
      if (inv.shopAddress) {
        ctx.font = `400 20px ${baseFont}`;
        wrapCanvasLines(ctx, `${invL(invLang, 'Address:', 'العنوان:')} ${inv.shopAddress}`, 440).forEach(ln => { ctx.fillText(ln, shopTextX, leftEndY); leftEndY += 27; });
      }

      ctx.fillStyle = '#000000';
      ctx.textAlign = endAlign;
      let rightEndY = y;
      ctx.font = `800 22px ${baseFont}`;
      ctx.fillText(invL(invLang, 'BILL TO:', 'بيانات العميل:'), endX, rightEndY);
      rightEndY += 32;
      ctx.font = `800 25px ${baseFont}`;
      wrapCanvasLines(ctx, `${invL(invLang, 'Customer Name:', 'اسم العميل:')} ${inv.custName || ''}`, 430).forEach(ln => {
        ctx.fillText(ln, endX, rightEndY);
        rightEndY += 32;
      });
      ctx.font = `400 21px ${baseFont}`;
      ctx.fillStyle = '#111827';
      if (inv.custPhone) {
        ctx.fillText(`${invL(invLang, 'Phone Number:', 'رقم الهاتف:')} ${inv.custPhone}`, endX, rightEndY);
        rightEndY += 28;
      }
      if (inv.custAddress) {
        wrapCanvasLines(ctx, `${invL(invLang, 'Address:', 'العنوان:')} ${inv.custAddress}`, 430).forEach(ln => {
          ctx.fillText(ln, endX, rightEndY);
          rightEndY += 27;
        });
      }

      y = Math.max(leftEndY, rightEndY, y + 120) + 46;

      // Work Details
      ctx.fillStyle = '#000000';
      ctx.textAlign = startAlign;
      ctx.font = `800 23px ${baseFont}`;
      ctx.fillText(invL(invLang, 'Work Details', 'تفاصيل العمل'), startX, y);
      y += 32;
      ctx.font = `400 21px ${baseFont}`;
      ctx.fillStyle = '#111827';
      wrapCanvasLines(ctx, inv.shortWorkDesc || '', W - padX * 2).forEach(ln => { ctx.fillText(ln, startX, y); y += 28; });
      if (inv.workItems && inv.workItems.length) {
        ctx.fillStyle = '#000000';
        ctx.font = `700 21px ${baseFont}`;
        wrapCanvasLines(ctx, inv.workItems.join('  •  '), W - padX * 2).forEach(ln => { ctx.fillText(ln, startX, y + 4); y += 30; });
      }

      y += 42;

      // Borderless Table
      const colDesc = startX;
      const colPrice = isInvAr ? (padX + 370) : (W - padX - 370);
      const colQty = isInvAr ? (padX + 205) : (W - padX - 205);
      const colAmt = endX;

      ctx.fillStyle = '#000000';
      ctx.font = `800 23px ${baseFont}`;
      ctx.textAlign = startAlign;
      ctx.fillText(invL(invLang, 'Item / Description', 'الصنف / الوصف'), colDesc, y);
      ctx.textAlign = endAlign;
      ctx.fillText(invL(invLang, 'Price', 'السعر'), colPrice, y);
      ctx.textAlign = 'center';
      ctx.fillText(invL(invLang, 'Quantity', 'الكمية'), colQty, y);
      ctx.textAlign = endAlign;
      ctx.fillText(invL(invLang, 'Amount', 'المبلغ'), colAmt, y);
      y += 42;

      inv.items.slice(0, 10).forEach(it => {
        ctx.font = `400 21px ${baseFont}`;
        ctx.fillStyle = '#000000';
        ctx.textAlign = startAlign;
        const dLines = wrapCanvasLines(ctx, String(it.description || ''), 520);
        let ly = y;
        dLines.forEach(ln => { ctx.fillText(ln, colDesc, ly); ly += 28; });

        ctx.fillStyle = '#111827';
        ctx.textAlign = endAlign;
        ctx.fillText(fmtInvoiceMoney(it.unitPrice), colPrice, y);
        ctx.textAlign = 'center';
        ctx.fillText(String(it.qty || 1), colQty, y);
        ctx.fillStyle = '#000000';
        ctx.font = `700 21px ${baseFont}`;
        ctx.textAlign = endAlign;
        ctx.fillText(fmtInvoiceMoney(it.total), colAmt, y);
        y = Math.max(y + 38, ly + 10);
      });

      y += 46;

      // Questions + QR (Start) & Totals (End)
      const blockTopY = y;
      let qy = blockTopY;
      ctx.fillStyle = '#000000';
      ctx.font = `800 23px ${baseFont}`;
      ctx.textAlign = startAlign;
      ctx.fillText(invL(invLang, 'Questions?', 'للاستفسار والتواصل:'), startX, qy);
      qy += 32;
      ctx.font = `400 21px ${baseFont}`;
      ctx.fillStyle = '#111827';
      const qEmail = inv.shopEmail || inv.ownerEmail || '';
      if (qEmail) { ctx.fillText(qEmail, startX, qy); qy += 28; }
      if (contactPhone) { ctx.fillText(contactPhone, startX, qy); qy += 28; }
      if (inv.qrDataUrl) {
        const qrImg = await loadImgForCanvas(inv.qrDataUrl);
        if (qrImg) {
          const qrSize = 158;
          const qrX = isInvAr ? (startX - qrSize) : startX;
          ctx.drawImage(qrImg, qrX, qy + 12, qrSize, qrSize);
          qy += qrSize + 24;
          ctx.fillStyle = '#000000';
          ctx.font = `700 19px ${baseFont}`;
          ctx.fillText(invL(invLang, 'Scan to Chat on WhatsApp', 'امسح الرمز للمراسلة على واتساب'), startX, qy);
          qy += 28;
        }
      }

      // Totals Block
      let ty = blockTopY;
      const totLabelX = isInvAr ? (endX + 260) : (endX - 260);
      const drawTotalRow = (label, val, bold = true, fs = 22) => {
        ctx.fillStyle = '#000000';
        ctx.font = `${bold ? 800 : 600} ${fs}px ${baseFont}`;
        ctx.textAlign = endAlign;
        ctx.fillText(label, totLabelX, ty);
        ctx.fillText(val, endX, ty);
        ty += fs + 16;
      };
      drawTotalRow(invL(invLang, 'SUBTOTAL', 'المجموع الفرعي'), fmtInvoiceMoney(inv.subTotal), true, 22);
      drawTotalRow(invL(invLang, 'TAX', 'الضريبة'), fmtInvoiceMoney(inv.vatAmount), true, 22);
      drawTotalRow(invL(invLang, 'Total Bill', 'إجمالي الفاتورة'), fmtInvoiceMoney(inv.grandTotal), true, 26);
      drawTotalRow(invL(invLang, 'Paid', 'المدفوع'), fmtInvoiceMoney(inv.advancePaid), false, 21);
      drawTotalRow(invL(invLang, 'Remaining', 'المتبقي'), fmtInvoiceMoney(inv.remainingBalance), true, 22);

      y = Math.max(qy, ty) + 52;

      // Payment Info & Terms
      const infoTopY = y;
      let py = infoTopY;
      ctx.fillStyle = '#000000';
      ctx.font = `800 22px ${baseFont}`;
      ctx.textAlign = startAlign;
      ctx.fillText(invL(invLang, 'PAYMENT INFO:', 'بيانات الدفع:'), startX, py);
      py += 32;
      ctx.font = `400 20px ${baseFont}`;
      ctx.fillStyle = '#111827';
      const banksList = inv.selectedBanks && inv.selectedBanks.length ? inv.selectedBanks : [];
      if (banksList.length) {
        banksList.forEach(b => {
          wrapCanvasLines(ctx, formatBankLineText(b, invLang), 480).forEach(ln => { ctx.fillText(ln, startX, py); py += 27; });
        });
      } else {
        ctx.fillText(invL(invLang, 'Cash Payment / Direct Transfer', 'الدفع نقداً / تحويل بنكي مباشر'), startX, py);
        py += 28;
      }

      const termsColX = isInvAr ? (startX - 540) : (startX + 540);
      let trY = infoTopY;
      ctx.fillStyle = '#000000';
      ctx.font = `800 22px ${baseFont}`;
      ctx.fillText(invL(invLang, 'TERMS & CONDITION', 'الشروط والأحكام'), termsColX, trY);
      trY += 32;
      ctx.font = `400 20px ${baseFont}`;
      ctx.fillStyle = '#111827';
      String(inv.terms || '').split('\n').slice(0, 5).forEach(line => {
        wrapCanvasLines(ctx, line, 490).forEach(ln => { ctx.fillText(ln, termsColX, trY); trY += 27; });
      });

      y = Math.max(py, trY) + 56;

      // Single Owner Signature
      const sigBaseY = Math.min(1505, Math.max(y, 1365));
      const drawSig = async (sigCfg) => {
        const transformedUrl = await renderTransformedSignatureDataUrl(sigCfg.src, sigCfg.rotation || 0);
        if (!transformedUrl) return;
        const sImg = await loadImgForCanvas(transformedUrl);
        if (!sImg) return;
        const scaleFactor = (sigCfg.size || 100) / 100;
        const maxW = 220 * scaleFactor;
        const maxH = 92 * scaleFactor;
        const fit = Math.min(maxW / (sImg.width || 240), maxH / (sImg.height || 100));
        const dw = Math.max(40, Math.round((sImg.width || 240) * fit));
        const dh = Math.max(30, Math.round((sImg.height || 100) * fit));
        const drawX = isInvAr ? (startX - dw) : startX;
        ctx.drawImage(sImg, drawX, sigBaseY - dh, dw, dh);
      };

      ctx.fillStyle = '#000000';
      ctx.font = `700 21px ${baseFont}`;
      if (inv.useOwnerSign && inv.ownerSign?.src) {
        await drawSig(inv.ownerSign);
        ctx.textAlign = startAlign;
        ctx.fillText(String(inv.ownerSign.name || invL(invLang, 'Owner', 'المالك')), startX, sigBaseY + 12);
      }

      // Thank You & Satisfaction Promise
      ctx.fillStyle = '#000000';
      ctx.font = `800 27px ${baseFont}`;
      ctx.textAlign = 'center';
      ctx.fillText(invL(invLang, 'Thank You!', 'شكراً لك!'), W / 2, 1598);
      ctx.fillStyle = '#111827';
      ctx.font = `600 20px ${baseFont}`;
      ctx.fillText(
        invL(invLang, 'Your Satisfaction is Our Promise - Thank You for Trusting Us!', 'رضاكم هو وعدنا - شكراً لثقتكم بنا!'),
        W / 2,
        1648
      );

      const imgDataUrl = canvas.toDataURL('image/jpeg', 0.94);
      const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
      doc.addImage(imgDataUrl, 'JPEG', 0, 0, 210, 297);
      return doc.output('blob');
    }

    async function generateInvoicePdfBlob(inv) {
      const libs = window.__DK_INVOICE_LIBS__;
      if (!libs || !libs.jsPDF) {
        throw new Error(L('PDF library is still loading, please try again in 1 second.', 'مكتبة PDF لا تزال قيد التحميل، حاول بعد ثانية.'));
      }
      await ensureInvoiceQrDataUrl(inv);
      const hasArabicChars = /[\u0600-\u06FF\u0750-\u077F]/.test(
        [
          inv.shopName, inv.shopTagline, inv.shopAddress, inv.custName, inv.custAddress,
          inv.shortWorkDesc, inv.terms, ...(inv.workItems || []), ...(inv.items || []).map(x => x.description)
        ].join(' ')
      );
      if (inv.lang === 'ar' || hasArabicChars) {
        return await generateCanvasBackedPdfBlob(inv);
      }

      const { jsPDF } = libs;
      const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
      const pageW = 210;
      const pageH = 297;
      const ml = 16;
      const mr = 16;
      const rightX = pageW - mr;
      const contentW = pageW - ml - mr;

      // Pure white page background, ZERO borders/boxes/lines
      doc.setFillColor(255, 255, 255);
      doc.rect(0, 0, pageW, pageH, 'F');

      let y = 18;
      doc.setTextColor(0, 0, 0);

      // Top Left: DUE DATE
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(10);
      doc.text(`DUE DATE: ${formatInvoiceDateDDMMYYYY(inv.dueDate || inv.invoiceDate)}`, ml, y);

      // Top Right: Big INVOICE + Bill No + Date
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(26);
      doc.text('INVOICE', rightX, y + 2, { align: 'right' });
      doc.setFontSize(10);
      doc.text(`Bill No: ${inv.invoiceNo}`, rightX, y + 9, { align: 'right' });
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9.5);
      doc.text(`Date: ${formatInvoiceDateDDMMYYYY(inv.invoiceDate)}`, rightX, y + 14.5, { align: 'right' });

      y += 28;

      // Shop Logo + Shop Name + Slogan + Phone + Address (Left)
      let shopTextX = ml;
      try {
        const logoDataUrl = await renderCircularLogoDataUrl(inv.logoSrc);
        if (logoDataUrl) {
          doc.addImage(logoDataUrl, 'PNG', ml, y - 3, 17, 17);
          shopTextX = ml + 21;
        }
      } catch (e) {}

      doc.setFont('helvetica', 'bold');
      doc.setFontSize(14);
      const shopTitleLines = doc.splitTextToSize(inv.shopName || 'Warsha Aluminium Workshop', 82);
      doc.text(shopTitleLines, shopTextX, y + 3);
      let leftEndY = y + 3 + shopTitleLines.length * 5.5;
      if (inv.shopTagline) {
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(9.5);
        const sloganLines = doc.splitTextToSize(inv.shopTagline, 82);
        doc.text(sloganLines, shopTextX, leftEndY);
        leftEndY += sloganLines.length * 4.5;
      }
      const qPhoneTop = inv.shopMobile || inv.ownerMobile || '';
      if (qPhoneTop) {
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(9);
        doc.text(`Phone: ${qPhoneTop}`, shopTextX, leftEndY);
        leftEndY += 4.3;
      }
      if (inv.shopAddress) {
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(9);
        const saLines = doc.splitTextToSize(`Address: ${inv.shopAddress}`, 82);
        doc.text(saLines, shopTextX, leftEndY);
        leftEndY += saLines.length * 4.3;
      }

      // BILL TO (Right)
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(10);
      doc.text('BILL TO:', rightX, y + 1, { align: 'right' });
      doc.setFontSize(11.5);
      doc.text(`Customer Name: ${inv.custName || ''}`, rightX, y + 7, { align: 'right' });
      let rightEndY = y + 12;
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9.5);
      if (inv.custPhone) {
        doc.text(`Phone Number: ${inv.custPhone}`, rightX, rightEndY, { align: 'right' });
        rightEndY += 4.5;
      }
      if (inv.custAddress) {
        const addrLines = doc.splitTextToSize(`Address: ${inv.custAddress}`, 74);
        doc.text(addrLines, rightX, rightEndY, { align: 'right' });
        rightEndY += addrLines.length * 4.5;
      }

      y = Math.max(leftEndY, rightEndY, y + 18) + 12;

      // Middle: Work Description + Customer's Selected Work Items
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(10);
      doc.text('Work Details', ml, y);
      y += 5;
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9.5);
      const descLines = doc.splitTextToSize(inv.shortWorkDesc || '', contentW);
      doc.text(descLines, ml, y);
      y += descLines.length * 4.5;
      if (inv.workItems && inv.workItems.length) {
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(9.5);
        const wiLines = doc.splitTextToSize(inv.workItems.join('  •  '), contentW);
        doc.text(wiLines, ml, y + 1);
        y += wiLines.length * 4.5 + 1;
      }

      y += 9;

      // Compact Borderless Table Header
      const colDesc = ml;
      const colPrice = ml + 114;
      const colQty = ml + 139;
      const colTotal = rightX;

      doc.setFont('helvetica', 'bold');
      doc.setFontSize(10);
      doc.text('Item / Description', colDesc, y);
      doc.text('Price', colPrice, y, { align: 'right' });
      doc.text('Quantity', colQty, y, { align: 'center' });
      doc.text('Amount', colTotal, y, { align: 'right' });
      y += 6.5;

      doc.setFontSize(9.5);
      const tableItems = inv.items.slice(0, 10);
      tableItems.forEach((it) => {
        doc.setFont('helvetica', 'normal');
        const dLines = doc.splitTextToSize(String(it.description || ''), 86);
        doc.text(dLines, colDesc, y);
        doc.text(fmtInvoiceMoney(it.unitPrice), colPrice, y, { align: 'right' });
        doc.text(String(it.qty || 1), colQty, y, { align: 'center' });
        doc.setFont('helvetica', 'bold');
        doc.text(fmtInvoiceMoney(it.total), colTotal, y, { align: 'right' });
        y += Math.max(6, dLines.length * 4.5 + 1.8);
      });

      y += 10;

      // Left: Questions + Email + Phone + Scannable QR Code | Right: SUBTOTAL, TAX, Total, Paid, Remaining, Total Udhaar
      const blockTopY = y;
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(10);
      doc.text('Questions?', ml, y);
      let qy = y + 5;
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9.5);
      const qEmail = inv.shopEmail || inv.ownerEmail || '';
      const qPhone = inv.shopMobile || inv.ownerMobile || '';
      if (qEmail) { doc.text(qEmail, ml, qy); qy += 4.5; }
      if (qPhone) { doc.text(qPhone, ml, qy); qy += 4.5; }
      if (inv.qrDataUrl) {
        doc.addImage(inv.qrDataUrl, 'PNG', ml, qy + 3, 27, 27);
        qy += 33.5;
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(8.5);
        doc.text('Scan to Chat on WhatsApp', ml, qy);
        qy += 4;
      }

      // Totals on Right
      let ty = blockTopY;
      const totLabelX = rightX - 42;
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(10);
      doc.text('SUBTOTAL', totLabelX, ty, { align: 'right' });
      doc.text(fmtInvoiceMoney(inv.subTotal), rightX, ty, { align: 'right' });
      ty += 6;
      doc.text('TAX', totLabelX, ty, { align: 'right' });
      doc.text(fmtInvoiceMoney(inv.vatAmount), rightX, ty, { align: 'right' });
      ty += 7;
      doc.setFontSize(12);
      doc.text('Total Bill', totLabelX, ty, { align: 'right' });
      doc.text(fmtInvoiceMoney(inv.grandTotal), rightX, ty, { align: 'right' });
      ty += 6.5;
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9.5);
      doc.text('Paid', totLabelX, ty, { align: 'right' });
      doc.text(fmtInvoiceMoney(inv.advancePaid), rightX, ty, { align: 'right' });
      ty += 5.5;
      doc.setFont('helvetica', 'bold');
      doc.text('Remaining', totLabelX, ty, { align: 'right' });
      doc.text(fmtInvoiceMoney(inv.remainingBalance), rightX, ty, { align: 'right' });
      ty += 5.5;

      y = Math.max(qy, ty) + 12;

      // PAYMENT INFO (Left) & TERMS & CONDITION (Right)
      const infoTopY = y;
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(10);
      doc.text('PAYMENT INFO:', ml, y);
      let py = y + 5;
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9);
      const banksList = inv.selectedBanks && inv.selectedBanks.length ? inv.selectedBanks : [];
      if (banksList.length) {
        banksList.forEach(b => {
          const bLines = doc.splitTextToSize(formatBankLineText(b, 'en'), 86);
          doc.text(bLines, ml, py);
          py += bLines.length * 4.3 + 1;
        });
      } else {
        doc.text('Cash Payment / Direct Transfer', ml, py);
        py += 5;
      }

      const termsColX = ml + 94;
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(10);
      doc.text('TERMS & CONDITION', termsColX, infoTopY);
      let trY = infoTopY + 5;
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9);
      String(inv.terms || '').split('\n').slice(0, 5).forEach(line => {
        const tl = doc.splitTextToSize(line, contentW - 94);
        doc.text(tl, termsColX, trY);
        trY += tl.length * 4.3;
      });

      y = Math.max(py, trY) + 14;

      // Single Owner Signature (Left) ONLY if ticked
      const sigBaseY = Math.min(256, Math.max(y, 232));
      const addFittedSig = async (sigCfg) => {
        const transformedUrl = await renderTransformedSignatureDataUrl(sigCfg.src, sigCfg.rotation || 0);
        if (!transformedUrl) return;
        const tImg = await loadImgForCanvas(transformedUrl);
        const scaleFactor = (sigCfg.size || 100) / 100;
        const maxW = 40 * scaleFactor;
        const maxH = 16 * scaleFactor;
        const natW = tImg?.width || 240;
        const natH = tImg?.height || 100;
        const fitScale = Math.min(maxW / natW, maxH / natH);
        const imgW = Math.max(8, Math.round(natW * fitScale));
        const imgH = Math.max(6, Math.round(natH * fitScale));
        doc.addImage(transformedUrl, 'PNG', ml, sigBaseY - imgH, imgW, imgH);
      };
      if (inv.useOwnerSign && inv.ownerSign?.src) {
        await addFittedSig(inv.ownerSign);
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(9.5);
        doc.text(String(inv.ownerSign.name || 'Owner'), ml, sigBaseY + 5);
      }

      // Bottom Center: Thank You! + Satisfaction Promise
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(11);
      doc.text('Thank You!', pageW / 2, 274, { align: 'center' });
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9.5);
      doc.text('Your Satisfaction is Our Promise - Thank You for Trusting Us!', pageW / 2, 282, { align: 'center' });

      return doc.output('blob');
    }

    async function downloadInvoicePdf(inv) {
      if (!inv) return;
      try {
        const blob = await generateInvoicePdfBlob(inv);
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        const safeCust = String(inv.custName || 'Customer').replace(/[^a-zA-Z0-9\u0600-\u06FF]+/g, '_') || 'Customer';
        a.download = `${inv.invoiceNo || 'Invoice'}_${safeCust}.pdf`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1500);
        toast(L('Invoice PDF downloaded ✓', 'تم تنزيل الفاتورة PDF ✓'), 'success');
      } catch (err) {
        toast(L('Error creating PDF: ', 'خطأ أثناء إنشاء PDF: ') + (err?.message || err), 'error');
      }
    }

    async function shareInvoiceOnWhatsApp(inv) {
      if (!inv) return;
      const rawPhone = String(inv.custPhone || '').trim();
      const phone = rawPhone.replace(/\D/g, '');
      if (!phone || phone.length < 7) {
        toast(L('Is Customer Ka Number Nahi Hai', 'لا يوجد رقم هاتف لهذا العميل'), 'error');
        return;
      }

      const isInvAr = inv.lang === 'ar';
      const shortMessage = isInvAr
        ? `السلام عليكم ${inv.custName}، إليكم الفاتورة رقم ${inv.invoiceNo} من ${inv.shopName}. شكراً لتعاملكم معنا!`
        : `Assalam-o-Alaikum ${inv.custName}, your Invoice (${inv.invoiceNo}) from ${inv.shopName} is ready. Thank you!`;
      const safeCust = String(inv.custName || 'Customer').replace(/[^a-zA-Z0-9\u0600-\u06FF]+/g, '_') || 'Customer';
      const fileName = `${inv.invoiceNo || 'Invoice'}_${safeCust}.pdf`;

      try {
        toast(L('Preparing Invoice PDF & WhatsApp...', 'جاري تجهيز الفاتورة وفتح واتساب...'), 'info');
        const pdfBlob = await generateInvoicePdfBlob(inv);
        const url = URL.createObjectURL(pdfBlob);
        const dl = document.createElement('a');
        dl.href = url;
        dl.download = fileName;
        document.body.appendChild(dl);
        dl.click();
        dl.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1500);
      } catch (e) {
        toast(L('Error generating PDF: ', 'خطأ في إنشاء PDF: ') + (e?.message || e), 'error');
        return;
      }

      let waPhone = phone;
      if (waPhone.startsWith('00')) waPhone = waPhone.slice(2);
      if (waPhone.startsWith('0') && waPhone.length === 11) waPhone = '92' + waPhone.slice(1);
      else if (waPhone.startsWith('05') && waPhone.length === 10) waPhone = '966' + waPhone.slice(1);
      const waUrl = `https://wa.me/${waPhone}?text=${encodeURIComponent(shortMessage)}`;
      const link = document.createElement('a');
      link.href = waUrl;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      document.body.appendChild(link);
      link.click();
      link.remove();
      toast(L('Invoice PDF downloaded & WhatsApp opened ✓', 'تم تنزيل الفاتورة وفتح واتساب ✓'), 'success');
    }

    async function generateWorkshopSummaryPdfBlob() {
      const libs = window.__DK_INVOICE_LIBS__;
      if (!libs || !libs.jsPDF) return null;
      const { jsPDF } = libs;
      const info = getWorkshopSummaryPrintModel();
      const m = info.m;
      if (document.fonts && document.fonts.ready) {
        try { await document.fonts.ready; } catch (e) {}
      }
      const W = 1240;
      const rowsCount = Math.min(28, state.customers.length);
      const H = Math.max(1500, 820 + rowsCount * 46);
      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, W, H);

      const fontFam = "'Cairo','Plus Jakarta Sans',sans-serif";
      const pad = 68;
      // Top blue header bar
      ctx.fillStyle = '#1e3a8a';
      ctx.fillRect(0, 0, W, 178);
      try {
        const logoUrl = await renderCircularLogoDataUrl(info.logoSrc);
        if (logoUrl) {
          const img = await loadImgForCanvas(logoUrl);
          if (img) ctx.drawImage(img, pad, 34, 110, 110);
        }
      } catch (e) {}

      ctx.fillStyle = '#ffffff';
      ctx.font = `800 38px ${fontFam}`;
      ctx.fillText(info.shopName, pad + 132, 86);
      ctx.fillStyle = '#bfdbfe';
      ctx.font = `600 22px ${fontFam}`;
      ctx.fillText(`Financial Summary Report · ${info.dateTimeLabel}`, pad + 132, 128);

      // 3 Primary KPI Boxes
      const cardY = 216;
      const cardW = (W - pad * 2 - 40) / 3;
      const cards = [
        { label: 'Total Profit', val: fmtRs(m.totalProfit), bg: '#eff6ff', border: '#93c5fd', color: m.totalProfit >= 0 ? '#1d4ed8' : '#dc2626' },
        { label: 'This Month Income', val: fmtRs(m.monthIncome), bg: '#ecfdf5', border: '#86efac', color: '#059669' },
        { label: 'This Month Expense', val: fmtRs(m.monthExpense), bg: '#fff7ed', border: '#fdba74', color: '#ea580c' }
      ];
      cards.forEach((c, idx) => {
        const cx = pad + idx * (cardW + 20);
        ctx.fillStyle = c.bg;
        ctx.strokeStyle = c.border;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.roundRect(cx, cardY, cardW, 138, 18);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#334155';
        ctx.font = `700 21px ${fontFam}`;
        ctx.fillText(c.label, cx + 24, cardY + 48);
        ctx.fillStyle = c.color;
        ctx.font = `800 34px ${fontFam}`;
        ctx.fillText(c.val, cx + 24, cardY + 102);
      });

      // Secondary stats row
      const subY = 382;
      const subCards = [
        { label: 'All-Time Income', val: fmtRs(m.totalIncome), color: '#059669' },
        { label: 'All-Time Expense', val: fmtRs(m.totalExpense), color: '#ea580c' },
        { label: 'Customers Udhaar', val: fmtRs(m.custBaqaya), color: '#dc2626' }
      ];
      subCards.forEach((sc, idx) => {
        const sx = pad + idx * (cardW + 20);
        ctx.fillStyle = '#f8fafc';
        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(sx, subY, cardW, 96, 14);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#475569';
        ctx.font = `600 19px ${fontFam}`;
        ctx.fillText(sc.label, sx + 22, subY + 36);
        ctx.fillStyle = sc.color;
        ctx.font = `800 26px ${fontFam}`;
        ctx.fillText(sc.val, sx + 22, subY + 74);
      });

      // Customer Table
      let ty = 524;
      ctx.fillStyle = '#1e3a8a';
      ctx.font = `800 26px ${fontFam}`;
      ctx.fillText(`Customer Ledgers (${state.customers.length})`, pad, ty);
      ty += 22;

      ctx.fillStyle = '#1e40af';
      ctx.fillRect(pad, ty, W - pad * 2, 46);
      ctx.fillStyle = '#ffffff';
      ctx.font = `700 20px ${fontFam}`;
      ctx.fillText('Customer Name', pad + 16, ty + 31);
      ctx.fillText('Phone', pad + 390, ty + 31);
      ctx.fillText('Total Bill', pad + 640, ty + 31);
      ctx.fillText('Paid', pad + 830, ty + 31);
      ctx.fillText('Remaining', pad + 980, ty + 31);
      ty += 46;

      if (state.customers.length === 0) {
        ctx.fillStyle = '#475569';
        ctx.font = `600 21px ${fontFam}`;
        ctx.fillText('No customer records yet.', pad + 20, ty + 42);
      } else {
        state.customers.slice(0, 28).forEach((c, idx) => {
          const st = getCustomerStats(c.id);
          ctx.fillStyle = idx % 2 === 0 ? '#ffffff' : '#f1f5f9';
          ctx.fillRect(pad, ty, W - pad * 2, 44);
          ctx.fillStyle = '#0f172a';
          ctx.font = `700 19px ${fontFam}`;
          ctx.fillText(String(c.name || '').slice(0, 24), pad + 16, ty + 29);
          ctx.font = `500 18px ${fontFam}`;
          ctx.fillText(String(c.mobile || '-').slice(0, 16), pad + 390, ty + 29);
          ctx.fillText(fmtRs(st.billed), pad + 640, ty + 29);
          ctx.fillStyle = '#059669';
          ctx.fillText(fmtRs(st.received), pad + 830, ty + 29);
          ctx.fillStyle = st.baqaya > 0 ? '#dc2626' : '#059669';
          ctx.font = `700 19px ${fontFam}`;
          ctx.fillText(fmtRs(st.baqaya), pad + 980, ty + 29);
          ty += 44;
        });
      }

      const imgData = canvas.toDataURL('image/jpeg', 0.92);
      const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
      const pdfH = Math.min(297, Math.round((H / W) * 210));
      doc.addImage(imgData, 'JPEG', 0, 0, 210, pdfH);
      return doc.output('blob');
    }

    function buildUnifiedRecordsList() {
      const records = [];
      const custById = new Map((state.customers || []).map(c => [c.id, c]));

      const toSortTs = (dStr, tStr, iso) => {
        if (iso) {
          const parsed = Date.parse(iso);
          if (!isNaN(parsed)) return parsed;
        }
        const d = (dStr || todayISO()).slice(0, 10);
        const tm = (tStr || '12:00').slice(0, 5);
        const parsed = Date.parse(`${d}T${tm}:00`);
        return isNaN(parsed) ? 0 : parsed;

      // 1. Customers Work Orders
      (state.orders || []).forEach(o => {
        const cust = custById.get(o.customerId);
        const ost = getOrderStats(o);
        const workTitle = Array.isArray(o.workItems) && o.workItems.length
          ? o.workItems.map(trWork).join(', ')

          id: `rec_tx_${tx.id}`,

            { label: L('Date & Time', 'التاريخ والوقت'), val: formatDateTime(tx.date, tx.time, tx.createdAt) }
          ]
        });
      });

      records.sort((a, b) => {
        const cmpDate = String(b.date || '').localeCompare(String(a.date || ''));
        if (cmpDate !== 0) return cmpDate;
        return (b.sortTs || 0) - (a.sortTs || 0);
      });
      return records;
    }

    function filterUnifiedRecords(records) {
      const q = (ui.recordSearch || '').trim().toLowerCase();
      const timeF = ui.recordTimeFilter || 'all';
      const catF = ui.recordCatFilter || 'all';
      const today = todayISO();
      const curMonth = currentMonthKey();
      const nowMs = Date.now();
      const weekCutoffMs = nowMs - 7 * 86400000;

      return records.filter(r => {
        if (catF !== 'all' && r.category !== catF) return false;
        if (timeF === 'today' && r.date !== today) return false;
        if (timeF === 'month' && !String(r.date || '').startsWith(curMonth)) return false;
        if (timeF === 'week') {
          const ts = Date.parse(`${r.date}T12:00:00`);
          if (isNaN(ts) || ts < weekCutoffMs) return false;
        }
        if (q) {
          const hay = `${r.title} ${r.subtitle} ${r.date} ${r.amount} ${r.category} ${r.subCategory}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
    }

      const root = document.getElementById('print-root');

        await ensureInvoiceQrDataUrl(inv);
        root.innerHTML = renderProfessionalInvoiceHtml(inv, false);
        setTimeout(() => { try { window.print(); } catch (e) {} }, 140);
      } else {

    // ========================
    // DIGIT BOXES, STEP-BY-STEP SIGNUP, LOGIN & 4-DIGIT PIN
    // ========================
    function renderDigitBoxes(group, count, currentValue = '', extraClass = '') {
      const clean = String(currentValue || '').replace(/\D/g, '').slice(0, count);
      return `
        <div class="digit-box-row">
          ${Array.from({ length: count }).map((_, i) => {
            const ch = clean[i] || '';
            return `<input
              type="text"
              inputmode="numeric"
              pattern="[0-9]*"
              maxlength="1"
              autocomplete="${group === 'signup-otp' ? 'one-time-code' : 'off'}"
              data-digit-group="${esc(group)}"
              data-digit-index="${i}"
              value="${esc(ch)}"
              aria-label="Digit ${i + 1}"
              class="otp-pin-box ${extraClass} ${ch ? 'filled' : ''}"
            />`;
          }).join('')}
        </div>
      `;
    }

    function readDigitGroup(group, count) {
      let out = '';
      for (let i = 0; i < count; i++) {
        const el = document.querySelector(`[data-digit-group="${group}"][data-digit-index="${i}"]`);
        out += (el ? String(el.value || '').replace(/\D/g, '').slice(0, 1) : '');
      }
      return out;
    }

    function renderSignupStepDots(step) {
      const labels = [
        L('Name', 'الاسم'),
        L('Gmail', 'البريد'),
        L('OTP', 'الرمز'),
        L('Password', 'كلمة المرور'),
        L('Confirm', 'تأكيد')
      ];
      return `
        <div class="mb-5">
          <div class="flex items-center justify-between gap-1">
            ${labels.map((lbl, idx) => {
              const sNum = idx + 1;
              const done = sNum < step;
              const active = sNum === step;
              return `
                <div class="flex flex-col items-center flex-1">
                  <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-extrabold border transition-all ${
                    done
                      ? 'bg-emerald-500 border-emerald-400 text-slate-950 shadow-sm shadow-emerald-500/40'
                      : active
                      ? 'bg-cyan-500/25 border-cyan-400 text-cyan-200 ring-4 ring-cyan-400/20'
                      : 'bg-white/5 border-white/15 text-sec'
                  }">${done ? '✓' : sNum}</div>
                  <span class="text-[10px] font-semibold mt-1 ${active ? 'text-cyan-300' : done ? 'text-emerald-300' : 'text-mut'}">${esc(lbl)}</span>
                </div>
                ${idx < labels.length - 1 ? `<div class="h-0.5 flex-1 -mt-4 rounded-full ${done ? 'bg-emerald-400' : 'bg-white/10'}"></div>` : ''}
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function renderParty() {

    // ========================
    // RENT MODULE (HOME + SHOP BOTH)
    // ========================
    function renderRent() {
      const mKey = currentMonthKey();
      const recs = state.rentRecords || [];
      const pays = state.rentPayments || [];

      const totalHomeRent = recs.filter(r => r.rentType === 'Home').reduce((s, r) => s + Number(r.monthlyAmount || 0), 0);
      const totalShopRent = recs.filter(r => r.rentType === 'Shop').reduce((s, r) => s + Number(r.monthlyAmount || 0), 0);
      const totalRentThisMonth = totalHomeRent + totalShopRent;
      const totalPaid = pays.filter(p => (p.date || '').startsWith(mKey)).reduce((s, p) => s + Number(p.amount || 0), 0);
      const totalBaqaya = recs.reduce((s, r) => {
        const paidRecMonth = pays.filter(p => p.rentId === r.id && (p.date || '').startsWith(mKey)).reduce((ps, p) => ps + Number(p.amount || 0), 0);
        return s + Math.max(0, Number(r.monthlyAmount || 0) - paidRecMonth);
      }, 0);

      const activeTab = ui.rentTab === 'Shop' ? 'Shop' : 'Home';
      const activeTabLabel = activeTab === 'Shop' ? L('Shop', 'المحل') : L('Home', 'السكن');
      const filteredRecs = recs.filter(r => r.rentType === activeTab);

      return `
        <div class="space-y-4">
          <div class="flex items-center justify-between gap-3">
            <h1 class="text-xl font-extrabold">${L('Rent Management', 'إدارة الإيجارات')}</h1>

          <div class="grid grid-cols-2 gap-2.5">

              <div class="text-[11px] text-sec">${L('Total Home Rent', 'إيجار السكن')}</div>

            </div>
            <div class="glass-card rounded-2xl p-3.5">
              <div class="text-[11px] text-sec">${L('Total Shop Rent', 'إيجار المحل')}</div>
              <div class="text-sm font-extrabold text-violet-300 tabular-nums mt-1">${esc(fmtRs(totalShopRent))}</div>
            </div>
            <div class="glass-card rounded-2xl p-3.5">
              <div class="text-[11px] text-sec">${L('Rent This Month', 'إيجار هذا الشهر')}</div>
              <div class="text-sm font-extrabold tabular-nums mt-1">${esc(fmtRs(totalRentThisMonth))}</div>
            </div>
            <div class="glass-card rounded-2xl p-3.5">
              <div class="text-[11px] text-sec">${L('Total Paid', 'إجمالي المدفوع')}</div>
              <div class="text-sm font-extrabold text-emerald-400 tabular-nums mt-1">${esc(fmtRs(totalPaid))}</div>
            </div>
            <div class="glass-card rounded-2xl p-3.5 col-span-2">
              <div class="text-[11px] text-sec">${L('Total Remaining Rent', 'إجمالي المتبقي')}</div>
              <div class="text-sm font-extrabold ${totalBaqaya > 0 ? 'text-rose-400' : 'text-emerald-400'} tabular-nums mt-1">${esc(fmtRs(totalBaqaya))}</div>
            </div>

    function renderRecords() {
      const allRecords = buildUnifiedRecordsList();
      const filtered = filterUnifiedRecords(allRecords);
      const timeF = ui.recordTimeFilter || 'all';
      const catF = ui.recordCatFilter || 'all';
      const incTotal = filtered.filter(r => r.flowType === 'income').reduce((s, r) => s + Number(r.amount || 0), 0);
      const expTotal = filtered.filter(r => r.flowType === 'expense').reduce((s, r) => s + Number(r.amount || 0), 0);

      // Group date-wise (Newest First)
      const groups = [];

    function formatLastBackupText() {
      const ts = Number(state.cloudMeta?.lastBackupAt || 0);
      if (!ts) return L('No cloud backup yet', 'لا يوجد نسخ احتياطي سحابي بعد');
      const d = new Date(ts);
      const iso = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      const tm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
      return formatDateTime(iso, tm);
    }

    function renderAdminUserInspect() {

      const staff = Array.isArray(v.staff) ? v.staff : [];
      const staffLogs = Array.isArray(v.staffLogs) ? v.staffLogs : [];
      const messEntries = Array.isArray(v.messEntries) ? v.messEntries : [];
      const rentRecords = Array.isArray(v.rentRecords) ? v.rentRecords : [];
      const rentPayments = Array.isArray(v.rentPayments) ? v.rentPayments : [];
      const committees = Array.isArray(v.committees) ? v.committees : [];
      const archived = Array.isArray(v.archivedReports) ? v.archivedReports : [];
      const txs = Array.isArray(v.transactions) ? v.transactions : [];
      const backups = Array.isArray(d?.backups) ? d.backups : [];
      const kycObj = v.kyc || {};
      const incomeSum = txs.filter(x => x.type === 'income').reduce((s, x) => s + Number(x.amount || 0), 0);
      const expenseSum = txs.filter(x => x.type === 'expense').reduce((s, x) => s + Number(x.amount || 0), 0);

      const calcCustStats = (custObj) => {
        if (!custObj) return { billed: 0, paid: 0, remaining: 0, custOrders: [], custPays: [] };
        const custOrders = orders.filter(o => o.customerId === custObj.id);
        const custPays = custPayments.filter(py => py.customerId === custObj.id);
        const billed = Number(custObj.openingBalance || 0) + custOrders.reduce((s, o) => s + Number(o.total ?? o.totalAmount ?? (Number(o.sqft || 0) * Number(o.rate || 0))), 0);
        const paidDirect = custPays.reduce((s, py) => s + Number(py.amount || 0), 0);
        const unlinkedAdv = custOrders.reduce((s, o) => (custPays.some(py => py.orderId === o.id) ? s : s + Number(o.advance || 0)), 0);
        const paid = paidDirect + unlinkedAdv;
        return { billed, paid, remaining: Math.max(0, billed - paid), custOrders, custPays };
      };

      const subView = ui.adminInspectSubView || 'overview';
      const selectedCust = subView === 'customer-detail'

      const topAdminActionsBar = `

            ${kycObj.selfiePhoto ? `<button type="button" data-admin-zoom-img="${esc(kycObj.selfiePhoto)}" data-admin-zoom-title="KYC Live Selfie" class="text-start cursor-pointer group"><div class="text-[10px] text-sec mb-1">Selfie ↗</div><img src="${esc(kycObj.selfiePhoto)}" class="w-full h-24 object-cover rounded-xl ring-1 ring-white/20 group-hover:ring-cyan-400 transition" /></button>` : ''}

      if (!nav) return;
      const activeBtn = nav.querySelector('.pill-nav-btn.active');
      if (activeBtn && nav.scrollWidth > nav.clientWidth + 4) {
        activeBtn.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
      }
    }

          </div>

      }

      if (ui.view === 'terms') {
        return `
          <div class="min-h-screen pb-10">
            <main class="w-full px-3.5 sm:px-5 pt-4">
              ${renderTermsPage()}
            </main>
          </div>
        `;
      }

      const kycOk = isKycVerified();
      // Strictly gate Home and workshop pages until KYC is Verified & not blocked
      const v = kycOk ? ui.view : 'kyc';
      const animatePage = ui.lastRenderedView && ui.lastRenderedView !== v;
      ui.lastRenderedView = v;

      let bodyHtml = '';
      if (!kycOk) bodyHtml = renderKyc();
      else if (v === 'home') bodyHtml = renderHome();

      else if (v === 'order-detail') bodyHtml = renderOrderDetail();
      else if (v === 'stock') bodyHtml = renderStock();
      else if (v === 'stock-detail') bodyHtml = renderStockDetail();
      else if (v === 'party') bodyHtml = renderParty();
      else if (v === 'supplier-detail') bodyHtml = renderSupplierDetail();
      else if (v === 'staff') bodyHtml = renderStaff();
      else if (v === 'staff-detail') bodyHtml = renderStaffDetail();
      else if (v === 'committee') bodyHtml = renderExpenses('Committee');
      else if (v === 'mess') bodyHtml = renderMess();
      else if (v === 'diesel') bodyHtml = renderExpenses('Diesel');
      else if (v === 'rent') bodyHtml = renderRent();
      else if (v === 'expenses') bodyHtml = renderExpenses(null);
      else if (v === 'report') bodyHtml = renderReport();
      else if (v === 'payments') bodyHtml = renderPayments();
      else if (v === 'records') bodyHtml = renderRecords();
      else if (v === 'profile') bodyHtml = renderProfile();
      else if (v === 'kyc') bodyHtml = renderKyc();
      else if (v === 'settings') bodyHtml = renderSettings();
      else if (v === 'login-history') bodyHtml = renderLoginHistory();
      else bodyHtml = renderHome();

      if (ui.urlDeviceAction) {
        root.innerHTML = renderDeviceActionLanding();

        root.innerHTML = renderWaitingApprovalScreen();
      } else if (!state.session) {
        if (ui.view === 'terms') {
          root.innerHTML = renderTermsPage();
        } else if ((ui.loginPending || ui.startupCheckingAuth) && ui.authMode === 'login') {
          root.innerHTML = renderAuthLoadingScreen();
        } else {
          root.innerHTML = renderAuth();

      } else if ((ui.appLocked || ui.pinLocked) && !isAdminSession() && (state.biometric?.enabled || (state.pinSecurity?.enabled && state.pinSecurity?.hash))) {
        root.innerHTML = renderPinLock();
      } else {
        root.innerHTML = renderShell();
      }
      requestAnimationFrame(positionPillSlider);

    async function downloadOfficialApkWithProgress() {
      if (ui.apkDownloading) return;
      ui.apkDownloading = true;
      ui.apkDownloadDone = false;
      ui.apkDownloadError = '';
      ui.apkDownloadProgress = 0;
      if (ui.apkBlobUrl) {
        try { URL.revokeObjectURL(ui.apkBlobUrl); } catch (e) {}
        ui.apkBlobUrl = '';
      }
      updateApkModalProgressDom();
      try {
        const resp = await fetch('/Digital-Khata-v1.0.apk', { cache: 'no-store' });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const total = Number(resp.headers.get('content-length') || 0);
        const chunks = [];
        let loaded = 0;
        if (resp.body && typeof resp.body.getReader === 'function') {
          const reader = resp.body.getReader();
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            if (value) {
              chunks.push(value);
              loaded += value.length;
              if (total > 0) {
                ui.apkDownloadProgress = Math.min(99, Math.round((loaded / total) * 100));
              } else {
                ui.apkDownloadProgress = Math.min(95, (ui.apkDownloadProgress || 5) + 18);
              }
              updateApkModalProgressDom();
            }
          }
        } else {
          const buf = await resp.arrayBuffer();
          chunks.push(new Uint8Array(buf));
          loaded = buf.byteLength;
        }
        const blob = new Blob(chunks, { type: 'application/vnd.android.package-archive' });
        ui.apkBlobUrl = URL.createObjectURL(blob);
        ui.apkDownloadProgress = 100;
        ui.apkDownloading = false;
        ui.apkDownloadDone = true;
        updateApkModalProgressDom();

        const a = document.createElement('a');
        a.href = ui.apkBlobUrl;
        a.download = 'Digital-Khata-v1.0.apk';
        document.body.appendChild(a);
        a.click();
        a.remove();
        toast('Digital-Khata-v1.0.apk downloaded ✓', 'success');
      } catch (err) {
        ui.apkDownloading = false;
        ui.apkDownloadDone = false;
        ui.apkDownloadError = L('Download failed: ', 'فشل التنزيل: ') + (err?.message || err);
        updateApkModalProgressDom();
      }
    }

    function captureInitialUrlDeviceAction() {
      try {
        const sp = new URLSearchParams(window.location.search || '');
        const action = String(sp.get('deviceAction') || '').trim().toLowerCase();
        const uid = String(sp.get('uid') || '').trim();
        const reqId = String(sp.get('reqId') || '').trim();
        const token = String(sp.get('token') || '').trim();
        if ((action === 'allow' || action === 'deny') && reqId && token) {
          ui.urlDeviceAction = {
            status: 'loading',
            started: false,
            action,
            uid,
            reqId,
            token,
            message: L('Verifying approval link...', 'جاري التحقق من رابط الموافقة...'),
            info: null
          };
          window.history.replaceState({}, '', window.location.pathname || '/');
        }
      } catch (e) {}
    }

    async function processUrlDeviceAction() {
      const actObj = ui.urlDeviceAction;
      if (!actObj || actObj.started || actObj.status !== 'loading') return;
      const cloud = getCloud();
      if (!cloud) return;
      actObj.started = true;
      render();
      let preInfo = null;
      try {
        preInfo = await cloud.getDeviceApprovalInfo(actObj.reqId);
      } catch (e) {}
      try {
        const decision = actObj.action === 'allow' ? 'allowed' : 'denied';
        const res = await cloud.resolveDeviceApprovalLink(actObj.reqId, decision, actObj.token);
        const info = res.data || preInfo || {};
        if (res.decision === 'allowed') {
          ui.urlDeviceAction = {
            status: res.alreadyResolved ? 'already-allowed' : 'allowed',
            message: res.alreadyResolved ? 'Ye device pehle hi allow ho chuka hai ✓' : 'Yes, Ye Device Allow Ho Gaya Hai ✓',
            info
          };
        } else {
          if (!res.alreadyResolved) {
            sendDeviceApprovalEmail({
              kind: 'blocked-alert',
              uid: info.uid || actObj.uid || '',
              toEmail: info.ownerEmail || '',
              ownerName: info.ownerName || 'Owner',
              deviceName: info.deviceName || 'Unknown Device',
              loginDateTime: info.loginDateTime || formatDeviceLoginTime(Date.now()),
              location: info.location || '',
              ip: info.ip || '',
              browserVersion: info.browserVersion || ''
            }).catch(() => {});
          }
          ui.urlDeviceAction = {
            status: res.alreadyResolved ? 'already-denied' : 'denied',
            message: 'Owner ne Is Device ko Allow Nahi Kiya',
            info
          };
        }
      } catch (err) {
        ui.urlDeviceAction = {
          status: 'error',
          message: err?.message || L('Invalid or expired approval link.', 'رابط الموافقة غير صالح أو منتهي.'),
          info: preInfo
        };
      }
      render();
    }

    async function performSignOut(disconnectDrive = false) {
      stopAdminLiveWatcher();
      stopSecurityWatchers();
      hydrateGeneration++;
      if (cloudSyncTimer) { clearTimeout(cloudSyncTimer); cloudSyncTimer = null; }
      localStorage.setItem(EXPLICIT_SIGNOUT_KEY, '1');
      localStorage.removeItem(DK_SESSION_ID_KEY);
      localStorage.removeItem(DK_SESSION_VERSION_KEY);
      ui.loginPending = false;
      ui.loginRetry = null;
      ui.pendingApproval = null;
      ui.startupCheckingAuth = false;
      const curUid = state.session?.uid || state.session?.cloudUid || state.session?.id || state.cloudMeta?.uid || '';
      if (ui.kycTimer) { clearInterval(ui.kycTimer); ui.kycTimer = null; }
      if (ui.cameraStream) { ui.cameraStream.getTracks().forEach(tr => tr.stop()); ui.cameraStream = null; }
      if (curUid) {
        saveUserCache(curUid, state, true);
        if (state.pinSecurity?.enabled && state.pinSecurity?.hash && state.session) {
          saveLastPinMeta({
            uid: curUid,
            name: state.session.name || '',
            email: state.session.email || '',
            mobile: state.session.mobile || '',
            identifier: state.session.identifier || state.session.email || state.session.mobile || '',
            authType: state.session.authType || 'email',
            pinHash: state.pinSecurity.hash
          });
        }
      }
      const cloud = getCloud();
      if (state.session?.uid && cloud?.auth?.currentUser?.uid === state.session.uid && localStorage.getItem(PENDING_SYNC_KEY) === state.session.uid) {
        try { await flushCloudSync(); } catch (e) {}
      }
      if (disconnectDrive) {
        const drive = getDrive();
        if (drive) {
          try { await drive.disconnectGoogleDrive(); } catch (e) {}
        }
        ui.driveBackups = [];
      }
      if (cloud) { try { await cloud.signOutUser(); } catch (e) {} }
      ui.cloudHydrating = false;
      localStorage.removeItem(ACTIVE_UID_KEY);
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem(PENDING_SYNC_KEY);
      sessionStorage.removeItem(PIN_UNLOCK_SESSION_KEY);
      const remKeep = loadRememberMe();
      state = defaultData();
      state.rememberMe = remKeep;
      ui.appLocked = false;
      ui.bioFailedCount = 0;
      ui.pendingBgPreview = '';
      ui.pinLocked = false;
      ui.pinEntry = '';
      ui.pinErrorCount = 0;
      ui.authMode = 'login';
      ui.view = 'login';
      ui.selectedCustomerId = null;
      ui.selectedOrderId = null;
      ui.selectedStockId = null;
      ui.selectedStaffId = null;
      ui.selectedSupplierId = null;
      ui.searchQuery = '';
      ui.recordSearch = '';
      ui.kycWelcomeBanner = false;
      ui.signupStep = 1;
      ui.signupData = newSignupData();
      closeModal();
      applyTheme();
      render();
