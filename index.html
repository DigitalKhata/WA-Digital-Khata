    async function verifyPinEntryCode(enteredPin) {
      const remLock = getPinLockoutRemainingSec();
      if (remLock > 0) {
        ui.pinEntry = '';
        const lm = Math.floor(remLock / 60);
        const ls = remLock % 60;
        render();
        toast(L(`3 wrong PINs! Try again in ${lm}m ${ls}s.`, `3 محاولات خاطئة! حاول بعد ${lm}د ${ls}ث.`), 'error');
        return;
      }
      const enteredHash = await hashPassword(enteredPin);
      if (!state.session && ui.authMode === 'pin') {
        const pinMeta = loadLastPinMeta();
        if (pinMeta && enteredHash === pinMeta.pinHash) {
          clearFailedPinAttempts();
          localStorage.removeItem(EXPLICIT_SIGNOUT_KEY);
          ui.pinEntry = '';
          ui.pinErrorCount = 0;
          const cloud = getCloud();
          const fbUser = cloud?.auth?.currentUser || null;
          if (fbUser && fbUser.uid === pinMeta.uid) {
            sessionStorage.setItem(PIN_UNLOCK_SESSION_KEY, fbUser.uid);
            ui.authMode = 'login';
            ui.pinLocked = false;
            ui.appLocked = false;
            ui.bioFailedCount = 0;
            const hydRes = await hydrateFromFirebaseUser(fbUser, {}, { recordLoginHistory: true });
            if (hydRes && hydRes.reason === 'PENDING_APPROVAL') {
              render();
              return;
            }
            ui.view = isKycVerified() ? 'home' : 'kyc';
            render();
            toast(L('PIN Verified! Welcome ✓', 'تم التحقق من PIN! أهلاً بك ✓'), 'success');
          } else {
            const remKeep = loadRememberMe();
            const userCache = loadUserCache(pinMeta.uid);
            state = userCache ? userCache : defaultData();
            state.rememberMe = remKeep;
            state.pinSecurity = { enabled: true, hash: pinMeta.pinHash };
            state.session = {
              id: pinMeta.uid,
              uid: '',
              cloudUid: pinMeta.uid,
              name: pinMeta.name || state.settings?.ownerName || 'Workshop Owner',
              email: pinMeta.email || '',
              mobile: pinMeta.mobile || '',
              identifier: pinMeta.identifier || pinMeta.email || '',
              authType: pinMeta.authType || 'email',
              photo: '',
              provider: 'pin-local',
              loginAt: Date.now()
            };
            sessionStorage.setItem(PIN_UNLOCK_SESSION_KEY, pinMeta.uid);
            ui.authMode = 'login';
            ui.pinLocked = false;
            ui.appLocked = false;
            ui.bioFailedCount = 0;
            ui.view = isKycVerified() ? 'home' : 'kyc';
            if (state.kyc?.status === 'verifying') startKycCountdownTimer();
            saveState(true);
            render();
            toast(L('PIN Verified! Logged in ✓', 'تم التحقق من PIN! تم تسجيل الدخول ✓'), 'success');
          }
          return;
        }
      } else if (state.session && enteredHash === state.pinSecurity?.hash) {
        clearFailedPinAttempts();
        ui.pinEntry = '';
        ui.pinErrorCount = 0;
        ui.pinLocked = false;
        ui.appLocked = false;
        ui.bioFailedCount = 0;
        sessionStorage.setItem(PIN_UNLOCK_SESSION_KEY, state.session?.uid || state.session?.id || '1');
        ui.view = isKycVerified() ? 'home' : 'kyc';
        render();
        toast(L('App unlocked ✓', 'تم فتح التطبيق ✓'), 'success');
        return;
      }

      ui.pinEntry = '';
      const lockState = recordFailedPinAttempt();
      ui.pinErrorCount = lockState.count;
      render();
      if (lockState.count >= 3) {
        toast(L('3 wrong PINs! Account locked for 5 minutes.', '3 محاولات PIN خاطئة! تم قفل الحساب لمدة 5 دقائق.'), 'error');
      } else {
        const grp = !state.session && ui.authMode === 'pin' ? 'auth-pin' : 'lock-pin';
        document.querySelector(`[data-digit-group="${grp}"][data-digit-index="0"]`)?.focus();
        toast(L(`Wrong PIN (${lockState.count}/3)`, `رمز PIN غير صحيح (${lockState.count}/3)`), 'error');
      }
    }

    async function executeLoginWithCredentials(identifier, pass, remember) {
      const cloud = getCloud();
      if (!cloud) {
        ui.loginPending = true;
        ui.loginRetry = { identifier, pass, remember, errorText: L('Cloud service is still loading. Please retry.', 'الخدمة السحابية لا تزال قيد التحميل. أعد المحاولة.') };
        render();
        return;
      }

      manualAuthFlow = true;
      ui.loginPending = true;
      ui.loginRetry = null;
      ui.pendingApproval = null;
      ui.loginStageText = L('Verifying account...', 'جاري التحقق من الحساب...');
      ui.authLoading = true;
      render();
      try {
        const res = await withTimeout(cloud.signIn(identifier, pass), 20000, 'LOGIN_TIMEOUT');
        clearFailedPasswordAttempts();
        localStorage.removeItem(EXPLICIT_SIGNOUT_KEY);
        saveRememberMe({ email: remember ? identifier : '', remember });
        state.rememberMe = loadRememberMe();
        sessionStorage.setItem(PIN_UNLOCK_SESSION_KEY, res.user.uid);

        ui.loginStageText = L('Checking device security & loading session...', 'جاري التحقق من أمان الجهاز وتحميل الجلسة...');
        render();
        try {
          await withTimeout(res.user.getIdToken(), 12000, 'TOKEN_TIMEOUT');
        } catch (tokErr) {}

        if (cloud.isAdminEmail(res.norm.email)) {
          state = defaultData();
          state.rememberMe = loadRememberMe();
          state.session = {
            id: res.user.uid,
            uid: res.user.uid,
            name: res.user.displayName || 'Admin',
            email: res.norm.email,
            mobile: '',
            identifier: res.norm.email,
            authType: 'email',
            photo: '',
            provider: 'firebase',
            isAdmin: true,
            loginAt: Date.now()
          };
          state.kyc.status = 'approved';
          ui.pinLocked = false;
          ui.view = 'admin';
          saveState(true);
          ui.loginPending = false;
          ui.authLoading = false;
          ui.loginRetry = null;
          render();
          toast(L('Welcome Admin ✓', 'مرحباً بالمسؤول ✓'), 'success');
          loadAdminUsersList();
        } else {
          const cached = loadUserCache(res.user.uid);
          const overrideInfo = {
            identifier,
            email: res.norm.email,
            mobile: res.norm.mobile,
            authType: res.norm.authType
          };
          if (!navigator.onLine && cached && localStorage.getItem(DK_SESSION_ID_KEY)) {
            state = cached;
            state.rememberMe = loadRememberMe();
            state.session = {
              id: res.user.uid,
              uid: res.user.uid,
              cloudUid: res.user.uid,
              name: state.session?.name || res.user.displayName || state.settings?.ownerName || 'User',
              email: res.norm.email || state.session?.email || '',
              mobile: res.norm.mobile || state.session?.mobile || '',
              identifier,
              authType: res.norm.authType,
              photo: '',
              provider: 'firebase',
              loginAt: Date.now()
            };
            ui.pinLocked = false;
            ui.view = (state.blocked || !isKycVerified()) ? 'kyc' : 'home';
            saveState(true);
            ui.loginPending = false;
            ui.authLoading = false;
            ui.loginRetry = null;
            render();
            toast(L(`Welcome, ${state.session?.name || 'User'} ✓`, `أهلاً بك، ${state.session?.name || 'User'} ✓`), 'success');
          } else {
            const hydRes = await hydrateFromFirebaseUser(res.user, overrideInfo, { strictNetwork: true, recordLoginHistory: true });
            ui.loginPending = false;
            ui.authLoading = false;
            ui.loginRetry = null;
            if (hydRes && hydRes.reason === 'PENDING_APPROVAL') {
              render();
              return;
            }
            ui.view = isAdminSession() ? 'admin' : ((state.blocked || !isKycVerified()) ? 'kyc' : 'home');
            render();
            toast(L(`Welcome, ${state.session?.name || 'User'} ✓`, `أهلاً بك، ${state.session?.name || 'User'} ✓`), 'success');
          }
          if (!ui.pendingApproval && !state.blocked && isKycVerified() && (!state.pinSecurity?.enabled || !state.pinSecurity?.hash)) {
            if (ui.promptPinAfterLogin) {
              ui.promptPinAfterLogin = false;
              setTimeout(() => openModal('set-pin'), 250);
            } else if (!state.biometric?.enabled && !state.biometric?.declined) {
              maybePromptBiometricSetup();
            } else {
              setTimeout(() => openModal('pin-setup-prompt'), 350);
            }
          } else {
            ui.promptPinAfterLogin = false;
            if (!ui.pendingApproval && !state.blocked && isKycVerified()) {
              maybePromptBiometricSetup();
            }
          }
        }
      } catch (err) {
        ui.authLoading = false;
        const code = String(err?.code || '');
        const msgStr = String(err?.message || '');
        const isNetworkOrTimeout =
          msgStr === 'LOGIN_TIMEOUT' ||
          msgStr === 'TOKEN_TIMEOUT' ||
          msgStr === 'BUNDLE_TIMEOUT' ||
          code === 'auth/network-request-failed' ||
          code === 'unavailable' ||
          msgStr.toLowerCase().includes('network') ||
          msgStr.toLowerCase().includes('timeout');

        if (isNetworkOrTimeout) {
          ui.loginPending = true;
          ui.loginRetry = {
            identifier,
            pass,
            remember,
            errorText: L('Internet is slow or network timed out. Tap Retry.', 'الإنترنت بطيء أو انتهت المهلة. اضغط إعادة المحاولة.')
          };
          render();
          toast(L('Internet is slow — tap Retry.', 'الإنترنت بطيء — اضغط إعادة المحاولة.'), 'error');
        } else {
          ui.loginPending = false;
          ui.loginRetry = null;
          const lockState = recordFailedPasswordAttempt();
          const msg = mapFirebaseAuthError(err);
          if (lockState.count >= 5) {
            toast(L('5 wrong passwords! Security lock active for 5 minutes.', '5 كلمات مرور خاطئة! تم تفعيل قفل الأمان لمدة 5 دقائق.'), 'error');
          } else {
            toast(`${msg} (${lockState.count}/5)`, 'error');
          }
          render();
        }
      } finally {
        manualAuthFlow = false;
      }
    }

    // Form Submissions
    document.addEventListener('submit', async (e) => {
      const f = e.target;
      e.preventDefault();

      if (f.id === 'login-form') {
        const rem = getLockoutRemainingSec();
        if (rem > 0) {
          toast(L(`Too many wrong attempts. Wait ${rem}s.`, `محاولات خاطئة كثيرة. انتظر ${rem} ث.`), 'error');
          render();
          return;
        }
        const termsEl = document.getElementById('login-terms-agree');
        if (termsEl && !termsEl.checked) {
          toast('Please tick "I agree to Terms & Privacy Policy" first.', 'error');
          return;
        }
        const identifier = document.getElementById('login-email').value.trim();
        const pass = document.getElementById('login-password').value;
        const remember = document.getElementById('login-remember').checked;
        await executeLoginWithCredentials(identifier, pass, remember);
        return;
      }

      if (f.id === 'signup-step1-form') {
        const name = (document.getElementById('su-step-name')?.value || '').trim();
        const agreedEl = document.getElementById('signup-terms-agree');
        const agreed = Boolean(agreedEl ? agreedEl.checked : ui.signupData?.agreedTerms);
        const sd = ui.signupData || newSignupData();
        ui.signupData = sd;
        sd.name = name;
        sd.agreedTerms = agreed;
        if (!name) {
          sd.error = L('Please enter your Full Name.', 'يرجى إدخال اسمك الكامل.');
          render();
          document.getElementById('su-step-name')?.focus();
          return;
        }
        if (!agreed) {
          sd.error = 'Please agree to Terms & Privacy Policy to create an account.';
          render();
          toast('Please tick "I agree to Terms & Privacy Policy"', 'error');
          return;
        }
        sd.error = '';
        ui.signupStep = 2;
        render();
        document.getElementById('su-step-email')?.focus();
        return;
      }

      if (f.id === 'signup-step2-form') {
        const email = (document.getElementById('su-step-email')?.value || '').trim().toLowerCase();
        const sd = ui.signupData || newSignupData();
        ui.signupData = sd;
        sd.email = email;
        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          sd.error = L('Enter a valid Gmail address (e.g. name@gmail.com).', 'أدخل عنوان بريد إلكتروني صحيح (مثال: name@gmail.com).');
          render();
          document.getElementById('su-step-email')?.focus();
          return;
        }
        sd.error = '';
        ui.authLoading = true;
        render();
        try {
          const otp = await sendSignupEmailOtp(email);
          sd.otpCode = otp;
          sd.otpSentTo = email;
          sd.otpSentAt = Date.now();
          sd.otpInput = '';
          sd.otpVerified = false;
          ui.authLoading = false;
          ui.signupStep = 3;
          render();
          document.querySelector('[data-digit-group="signup-otp"][data-digit-index="0"]')?.focus();
          toast(L('6-Digit OTP sent to your Gmail ✓', 'تم إرسال رمز التحقق من 6 أرقام إلى بريدك ✓'), 'success');
        } catch (err) {
          ui.authLoading = false;
          sd.error = err?.message || L('Problem sending OTP. Check your internet.', 'حدثت مشكلة أثناء إرسال رمز التحقق. تحقق من الإنترنت.');
          render();
          toast(sd.error, 'error');
        }
        return;
      }

      if (f.id === 'signup-step3-form') {
        const sd = ui.signupData || newSignupData();
        ui.signupData = sd;
        const entered = readDigitGroup('signup-otp', 6);
        sd.otpInput = entered;
        if (entered.length < 6) {
          sd.error = L('Enter complete 6-Digit OTP.', 'أدخل رمز التحقق كاملاً من 6 أرقام.');
          render();
          return;
        }
        if (!sd.otpCode || sd.otpSentTo !== sd.email || entered !== sd.otpCode) {
          sd.error = L('Invalid OTP. Enter the right 6-digit code or tap Resend OTP.', 'رمز التحقق غير صحيح. أدخل الرمز الصحيح أو أعد الإرسال.');
          render();
          toast(L('Wrong OTP!', 'رمز التحقق غير صحيح!'), 'error');

        sd.otpVerified = true;
        sd.error = '';
        ui.signupStep = 4;
        render();
        document.getElementById('su-step-pass')?.focus();
        toast(L('OTP Verified ✓', 'تم التحقق من الرمز ✓'), 'success');
        return;
      }

      if (f.id === 'signup-step4-form') {
        const sd = ui.signupData || newSignupData();
        ui.signupData = sd;
        const pass = document.getElementById('su-step-pass')?.value || '';
        sd.password = pass;

          render();
          document.getElementById('su-step-pass')?.focus();
          return;

        sd.error = '';
        ui.signupStep = 5;
        render();
        document.getElementById('su-step-confirm')?.focus();

      if (f.id === 'signup-step5-form') {

        const conf = document.getElementById('su-step-confirm')?.value || '';
        const agreedEl5 = document.getElementById('signup-terms-agree');
        if (agreedEl5) sd.agreedTerms = Boolean(agreedEl5.checked);
        sd.confirmPassword = conf;
        if (!sd.agreedTerms) {
          sd.error = 'You must tick "I agree to Terms & Privacy Policy" before signing up.';

          render();

          toast(L('Passwords do not match', 'كلمات المرور غير متطابقة'), 'error');

          sd.error = L('Cloud service is still loading.', 'الخدمة السحابية لا تزال قيد التحميل.');

          return;

        manualAuthFlow = true;
        ui.authLoading = true;
        sd.error = '';

        try {
          const res = await cloud.signUp(sd.name, sd.email, sd.password, undefined, undefined, true);
          clearFailedPasswordAttempts();
          saveRememberMe({ email: sd.email, remember: true });

          sessionStorage.setItem(PIN_UNLOCK_SESSION_KEY, res.user.uid);

            isNewSignup: true,

        if (!email) {

          if (alertBox) { alertBox.textContent = msg; alertBox.classList.remove('hidden'); }

        render();

          render();
          toast(L('Password reset link sent to your Email ✓', 'تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك ✓'), 'success');
        } catch (err) {
          ui.authLoading = false;
          render();
          const msg = mapFirebaseAuthError(err);
          const ab = document.getElementById('forgot-alert');
          if (ab) { ab.textContent = msg; ab.classList.remove('hidden'); }
          toast(msg, 'error');
        }

      if (f.id === 'modal-customer-form') {
        const fd = new FormData(f);

        const custPhone = (fd.get('mobile') || '').toString().trim();

        if (!custPhone) { toast(L('Please enter Phone Number.', 'يرجى إدخال رقم الهاتف.'), 'error'); return; }

        try {
          selectedWorks = JSON.parse((fd.get('workItemsJson') || '[]').toString());

    // Multi-Digit Box Handlers (OTP 6 boxes & PIN 4 boxes)
    document.addEventListener('keydown', (e) => {
      const t = e.target;
      if (!t || !t.hasAttribute || !t.hasAttribute('data-digit-group')) return;
      const group = t.getAttribute('data-digit-group');
      const idx = Number(t.getAttribute('data-digit-index') || 0);
      const boxes = Array.from(document.querySelectorAll(`[data-digit-group="${group}"]`));
      if (e.key === 'Backspace') {
        if (!t.value && idx > 0) {
          e.preventDefault();
          const prev = boxes[idx - 1];
          prev.value = '';
          prev.classList.remove('filled');
          prev.focus();
        } else {
          setTimeout(() => t.classList.toggle('filled', Boolean(t.value)), 0);
        }
      } else if (e.key === 'ArrowLeft' && idx > 0) {
        e.preventDefault();
        boxes[idx - 1].focus();
      } else if (e.key === 'ArrowRight' && idx < boxes.length - 1) {
        e.preventDefault();
        boxes[idx + 1].focus();
      }
    });

    document.addEventListener('paste', (e) => {
      const t = e.target;
      if (!t || !t.hasAttribute || !t.hasAttribute('data-digit-group')) return;
      const text = (e.clipboardData || window.clipboardData)?.getData('text') || '';
      const digits = text.replace(/\D/g, '');
      if (!digits) return;
      e.preventDefault();
      const group = t.getAttribute('data-digit-group');
      const startIdx = digits.length >= 4 && Number(t.getAttribute('data-digit-index') || 0) === 0 ? 0 : Number(t.getAttribute('data-digit-index') || 0);
      const boxes = Array.from(document.querySelectorAll(`[data-digit-group="${group}"]`));
      for (let k = 0; k < digits.length && (startIdx + k) < boxes.length; k++) {
        boxes[startIdx + k].value = digits[k];
        boxes[startIdx + k].classList.add('filled');
      }
      const nextPos = Math.min(boxes.length - 1, startIdx + digits.length);
      boxes[nextPos]?.focus();
      const val = readDigitGroup(group, boxes.length);
      if (group === 'signup-otp' && ui.signupData) ui.signupData.otpInput = val;
      if ((group === 'auth-pin' || group === 'lock-pin')) {
        ui.pinEntry = val;
        if (val.length === 4) verifyPinEntryCode(val);
      }
    });

    // Inputs & File Handlers
    document.addEventListener('input', (e) => {
      const t = e.target;
      if (t.hasAttribute && t.hasAttribute('data-digit-group')) {
        const group = t.getAttribute('data-digit-group');
        const idx = Number(t.getAttribute('data-digit-index') || 0);
        const boxes = Array.from(document.querySelectorAll(`[data-digit-group="${group}"]`));
        const clean = String(t.value || '').replace(/\D/g, '');
        if (clean.length > 1) {
          for (let k = 0; k < clean.length && (idx + k) < boxes.length; k++) {
            boxes[idx + k].value = clean[k];
            boxes[idx + k].classList.add('filled');
          }
          boxes[Math.min(boxes.length - 1, idx + clean.length)]?.focus();
        } else {
          t.value = clean;
          t.classList.toggle('filled', clean.length === 1);
          if (clean.length === 1 && idx < boxes.length - 1) {
            boxes[idx + 1].focus();
            boxes[idx + 1].select?.();
          } else if (clean.length === 1 && group === 'set-pin-1' && idx === boxes.length - 1) {
            document.querySelector('[data-digit-group="set-pin-2"][data-digit-index="0"]')?.focus();
          }
        }
        const combined = readDigitGroup(group, boxes.length);

          ui.signupData.otpInput = combined;

      }
      if (t.id === 'login-terms-agree') {
        ui.loginTermsAgreed = Boolean(t.checked);
        return;
      }
      if (t.id === 'wo-cust') {
        const wrap = document.getElementById('wo-new-cust-wrap');
        if (wrap) wrap.classList.toggle('hidden', t.value !== '__new__');
        return;
      }
      if (t.id === 'settings-bank-select') {
        const bank = t.value;
        const bData = (state.settings.bankAccounts && state.settings.bankAccounts[bank]) || {};
        const accEl = document.getElementById('bank-acc-name');
        const ibanEl = document.getElementById('bank-acc-iban');
        const brEl = document.getElementById('bank-acc-branch');
        const showEl = document.getElementById('bank-show-invoice');
        if (accEl) accEl.value = bData.accountName || '';
        if (ibanEl) ibanEl.value = bData.iban || '';
        if (brEl) brEl.value = bData.branchName || '';
        if (showEl) showEl.checked = Boolean(bData.showOnInvoice);
        return;
      }
      if (t.hasAttribute && t.hasAttribute('data-toggle-bank-invoice')) {
        const bank = t.getAttribute('data-toggle-bank-invoice');
        if (!state.settings.bankAccounts) state.settings.bankAccounts = {};
        if (!state.settings.bankAccounts[bank]) state.settings.bankAccounts[bank] = { accountName: '', iban: '', branchName: '', showOnInvoice: false };
        const want = Boolean(t.checked);
        if (want) {
          const otherTicked = SAUDI_BANKS.filter(b => b !== bank && state.settings.bankAccounts[b]?.showOnInvoice).length;
          if (otherTicked >= 3) {
            t.checked = false;
            toast(L('Maximum 3 banks can be selected for the invoice.', 'يمكن تحديد 3 بنوك كحد أقصى للفاتورة.'), 'error');
            return;
          }
        }
        state.settings.bankAccounts[bank].showOnInvoice = want;
        saveState();
        render();
        await flushCloudSync();
        return;
      }
      if (t.id === 'graph-range-select') {
        ui.graphRange = t.value || '6m';
        const ser = getProfitGraphSeries(ui.graphRange, ui.graphCustomMonth);
        ui.selectedGraphMonth = (ser[ser.length - 1] && ser[ser.length - 1].key) || currentMonthKey();
        render();
        return;
      }
      if (t.id === 'graph-custom-month') {
        ui.graphCustomMonth = t.value || currentMonthKey();
        ui.selectedGraphMonth = ui.graphCustomMonth;
        render();
        return;
      }
      if (t.id === 'inv-vat-toggle' || t.id === 'inv-date-input' || t.id === 'inv-due-input' || t.id === 'inv-sign1-toggle' || t.id === 'inv-qr1-toggle') {
        if (ui.invoiceDraft) {
          if (t.id === 'inv-vat-toggle') ui.invoiceDraft.vatEnabled = Boolean(t.checked);
          if (t.id === 'inv-date-input') ui.invoiceDraft.invoiceDate = t.value;
          if (t.id === 'inv-due-input') ui.invoiceDraft.dueDate = t.value;
          if (t.id === 'inv-sign1-toggle') ui.invoiceDraft.useOwnerSign = Boolean(t.checked);
          if (t.id === 'inv-qr1-toggle') {
            const checked = Boolean(t.checked);
            ui.invoiceDraft.useOwnerQr = checked;
            if (checked) {
              const qrCfg = getWhatsAppQrConfig();
              if (!qrCfg.ownerNumber || qrCfg.ownerNumber.replace(/\D/g, '').length < 8) {
                toast(L('Please save Owner WhatsApp Number in Settings first.', 'يرجى حفظ رقم واتساب المالك في الإعدادات أولاً.'), 'info');
              }
            }
          }
          refreshInvoiceDraftPreview();
        }
        return;
      }
      if (t.id === 'sig-owner1-file' && t.files && t.files[0]) {
        try {
          toast(L('Cleaning signature photo...', 'جاري تنظيف صورة التوقيع...'), 'info');
          const cleanDataUrl = await processUploadedSignatureFile(t.files[0]);
          if (!state.settings.signatures) state.settings.signatures = {};
          const cur = getSignatureConfig('owner1');
          state.settings.signatures.owner1 = {
            name: cur.name,
            dataUrl: cleanDataUrl,
            deleted: false,
            rotation: Number(state.settings.signatures.owner1?.rotation || 0),
            size: Number(state.settings.signatures.owner1?.size || 100)
          };
          saveState();
          render();
          await flushCloudSync();
          toast(L('Owner Signature cleaned & saved ✓', 'تم تنظيف وحفظ توقيع المالك ✓'), 'success');
        } catch (err) {
          toast(L('Signature process error: ', 'خطأ في معالجة التوقيع: ') + (err?.message || err), 'error');
        } finally {
          t.value = '';
        }
        return;
      }
      if (t.id === 'stk-sup-sel') {
        const wrap = document.getElementById('stk-new-sup-wrap');
        if (wrap) wrap.classList.toggle('hidden', t.value !== '__new__');
        return;
      }
      if (t.hasAttribute('data-order-status')) {
        const oid = t.getAttribute('data-order-status');
        const o = state.orders.find(x => x.id === oid);
        if (o) {
          o.status = t.value;
          saveState();
          render();
          toast(L('Order status updated ✓', 'تم تحديث حالة الطلب ✓'), 'success');
          await flushCloudSync();
        }
        return;
      }
      if (t.hasAttribute('data-admin-order-status')) {
        const cloud = getCloud();
        if (!cloud || !isAdminSession() || !ui.adminInspectData) return;
        const [targetUid, oid] = String(t.getAttribute('data-admin-order-status') || '').split(':');
        if (!targetUid || !oid) return;
        const v = ui.adminInspectData.vaultData || {};
        const curOrders = Array.isArray(v.orders) ? v.orders : [];
        const targetOrd = curOrders.find(x => x.id === oid);
        if (!targetOrd) return;
        const nextStatus = t.value || 'Pending';
        const nextOrders = curOrders.map(x => x.id === oid ? { ...x, status: nextStatus } : x);
        try {
          await cloud.adminSaveUserAndCustomerData(
            targetUid,
            {},
            { orders: nextOrders },
            `Admin changed order ${oid} status to ${nextStatus}`
          );
          toast(`Order status set to ${nextStatus} & synced ✓`, 'success');
          await openAdminInspectUser(targetUid, { preserveSubView: true });
        } catch (err) {
          toast('Status update failed: ' + (err.message || err), 'error');
        }
        return;
      }
      if (t.id === 'stk-cat-sel') {
        const minInput = document.getElementById('stk-min-qty');
        if (minInput) minInput.value = defaultLowStockLimit(t.value);
        return;
      }
      if (t.hasAttribute('data-stock-filter-sel')) {
        ui.stockFilter = t.value;
        render();
        return;
      }
      if (t.id === 'custom-logo-input' && t.files && t.files[0]) {
        const file = t.files[0];
        try {
          state.settings.customLogo = await compressImageFile(file, 220, 0.80);
          saveState();
          render();
          const synced = await flushCloudSync();
          toast(synced ? L('Custom Shop Logo saved & synced to Cloud ✓', 'تم حفظ شعار الورشة المخصص ومزامنته سحابياً ✓') : L('Custom Shop Logo saved ✓', 'تم حفظ شعار الورشة المخصص ✓'), 'success');
        } catch (err) {
          toast(L('Could not load logo image.', 'تعذر تحميل صورة الشعار.'), 'error');
        } finally {
          t.value = '';
        }
        return;
      }
      if (t.id === 'import-json-input' && t.files[0]) {
        importJsonBackup(t.files[0]);
        return;
      }
      if (t.id === 'kyc-front-file' && t.files[0]) {
        state.kyc.frontPhoto = await compressImageFile(t.files[0], 640, 0.72);
        saveState(); render(); return;
      }
      if (t.id === 'kyc-back-file' && t.files[0]) {
        state.kyc.backPhoto = await compressImageFile(t.files[0], 640, 0.72);
        saveState(); render(); return;
      }
      if (t.id === 'kyc-selfie-file' && t.files[0]) {
        state.kyc.selfiePhoto = await compressImageFile(t.files[0], 640, 0.72);
        state.kyc.selfieConfirmed = true;
        saveState(); render(); toast(L('Selfie uploaded from gallery ✓', 'تم رفع السيلفي من المعرض ✓'), 'success'); return;
      }
      if (t.id === 'app-bg-blur' || t.id === 'app-bg-overlay') {
        saveState();
        return;
      }
      if (t.id === 'drive-auto-backup-toggle') {
        state.settings.driveAutoBackup = Boolean(t.checked);
        saveState();
        toast(t.checked ? L('Drive Auto Backup ON ✓', 'النسخ التلقائي لـ Drive مفعل ✓') : L('Drive Auto Backup OFF', 'تم إيقاف النسخ التلقائي لـ Drive'), 'info');
        if (t.checked) maybeRunDriveAutoBackup();
        return;
      }
      if (t.id === 'app-bg-file' && t.files && t.files[0]) {
        try {
          toast(L('Preparing wallpaper preview...', 'جاري تجهيز معاينة الخلفية...'), 'info', { skipHistory: true });
          const dataUrl = await compressImageFile(t.files[0], 800, 0.68);
          ui.pendingBgPreview = dataUrl;
          openModal('bg-preview');
        } catch (err) {
          toast(L('Could not load wallpaper image.', 'تعذر تحميل صورة الخلفية.'), 'error');
        } finally {
          t.value = '';
        }
        return;
      }
    });

    // Cloud Bridge + Offline/Online Auto Sync Listeners
    let cloudBridgeBound = false;
    function initCloudBridge() {
      const cloud = getCloud();
      if (!cloud || cloudBridgeBound) return;
      cloudBridgeBound = true;
      if (typeof cloud.consumeGoogleRedirectResult === 'function') {
        cloud.consumeGoogleRedirectResult().then(async (r) => {
          if (r && r.user) {
            if (r.accessToken && window.dkDrive?.setSessionToken) {
              window.dkDrive.setSessionToken(r.accessToken, r.user);
            }
            localStorage.removeItem(EXPLICIT_SIGNOUT_KEY);
            sessionStorage.setItem(PIN_UNLOCK_SESSION_KEY, r.user.uid);
            await hydrateFromFirebaseUser(r.user, {
              email: r.user.email || '',
              authType: 'google'
            }, { recordLoginHistory: true });
            refreshDriveBackupsList(true);
            maybePromptBiometricSetup();
            render();
          }
        }).catch(() => {});
      }
      if (ui.urlDeviceAction && ui.urlDeviceAction.status === 'loading') {
        processUrlDeviceAction();
      }
      if (cloud.auth && typeof cloud.auth.authStateReady === 'function') {
        cloud.auth.authStateReady().then(() => {
          if (ui.startupCheckingAuth && !cloud.auth.currentUser && !state.session && !ui.loginPending) {
            ui.startupCheckingAuth = false;
            render();
          }
        }).catch(() => {
          ui.startupCheckingAuth = false;
          render();
        });
      }
      cloud.onAuthChange(async (fbUser) => {
        if (manualAuthFlow) return;
        if (fbUser) {
          ui.startupCheckingAuth = false;
          await hydrateFromFirebaseUser(fbUser);
        } else {
          ui.startupCheckingAuth = false;
          stopSecurityWatchers();
          hydrateGeneration++;
          if (cloudSyncTimer) { clearTimeout(cloudSyncTimer); cloudSyncTimer = null; }
          ui.cloudHydrating = false;
          // Never auto-logout unless user explicitly pressed Sign Out
          if (state.session && state.session.provider === 'firebase' && localStorage.getItem(EXPLICIT_SIGNOUT_KEY) === '1') {
            localStorage.removeItem(ACTIVE_UID_KEY);
            localStorage.removeItem(DK_SESSION_ID_KEY);
            localStorage.removeItem(DK_SESSION_VERSION_KEY);
            sessionStorage.removeItem(PIN_UNLOCK_SESSION_KEY);
            const remKeep = loadRememberMe();
            state = defaultData();
            state.rememberMe = remKeep;
            ui.pinLocked = false;
            ui.appLocked = false;
            ui.view = 'login';
          }
          render();
        }
      });
    }

    if (ui.startupCheckingAuth) {
      setTimeout(() => {
        if (ui.startupCheckingAuth && !state.session && !ui.loginPending) {
          ui.startupCheckingAuth = false;
          render();
        }
      }, 4500);
    }

    // Lock app when returning after 5+ minutes in background (if Fingerprint or PIN lock is enabled)
    let hiddenSinceTs = 0;
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') {
        hiddenSinceTs = Date.now();
        return;
      }
      if (document.visibilityState === 'visible' && hiddenSinceTs && state.session && !isAdminSession()) {
        const elapsed = Date.now() - hiddenSinceTs;
        hiddenSinceTs = 0;
        const bioOn = Boolean(state.biometric?.enabled);
        const pinOn = Boolean(state.pinSecurity?.enabled && state.pinSecurity?.hash);
        if (elapsed >= 5 * 60 * 1000 && (bioOn || pinOn)) {
          sessionStorage.removeItem(PIN_UNLOCK_SESSION_KEY);
          ui.appLocked = bioOn;
          ui.pinLocked = !bioOn && pinOn;
          ui.bioFailedCount = 0;
          ui.pinEntry = '';
          render();
        }
      }
    });

    window.addEventListener('dk-cloud-ready', initCloudBridge);
    window.addEventListener('dk-pwa-state', () => {
      if (ui.view === 'settings' || ui.view === 'profile') render();
    });
    window.addEventListener('dk-drive-state', () => {
      if (ui.view === 'profile' || ui.view === 'settings') render();
    });
    window.addEventListener('online', () => {
      ui.syncStatus = 'pending';
      updateSyncStatusBadgeDom();
      flushCloudSync().then(() => {
        maybeRunAutoDailyBackup();
        maybeRunDriveAutoBackup();
      });
      toast(L('Online ✓ Cloud sync started', 'متصل ✓ بدأت المزامنة السحابية'), 'success');
    });
    window.addEventListener('offline', () => {
      ui.syncStatus = 'offline';
      updateSyncStatusBadgeDom();
      toast(L('Offline mode — saving data locally ⏳', 'وضع عدم الاتصال — يتم الحفظ محلياً ⏳'), 'info');
    });

    window.addEventListener('resize', positionPillSlider);
    setInterval(() => {
      checkAutoArchive(true);
      maybeRunAutoDailyBackup();
      maybeRunDriveAutoBackup();
    }, 30000);

    // Startup
    captureInitialUrlDeviceAction();
    migrateLegacyData();
    checkAutoArchive();
    checkKycAutoApprove();
    scheduleMidnightAutoBackup();
    maybeRunAutoDailyBackup();
    maybeRunDriveAutoBackup();
    applyAppBackground();
    if (state.kyc && state.kyc.status === 'verifying') {
      startKycCountdownTimer();
    }
    initCloudBridge();
    render();
  })();
  </script>
</body>
</html>
