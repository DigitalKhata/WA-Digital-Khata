          if (cached) {

            return cached;
          }
        }
        // One-time safe migration from legacy STORAGE_KEY ONLY if a real active session existed
        const legacyRaw = localStorage.getItem(STORAGE_KEY);
        if (legacyRaw) {
          const parsed = JSON.parse(legacyRaw);
          if (parsed && parsed.rememberMe) {
            saveRememberMe(parsed.rememberMe);
          }
          if (parsed && parsed.session && (parsed.session.uid || parsed.session.id)) {
            const migUid = parsed.session.uid || parsed.session.id;
            const merged = mergeWithDefaults(parsed);
            merged.rememberMe = loadRememberMe();
            saveUserCache(migUid, merged, false);
            localStorage.setItem(ACTIVE_UID_KEY, migUid);
            localStorage.removeItem(STORAGE_KEY);
            return merged;
          }
          localStorage.removeItem(STORAGE_KEY);
        }
      } catch (e) {}
      const clean = defaultData();
      clean.rememberMe = rem;
      return clean;

    function esc(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')

    function todayISO() {
      const d = new Date();

    }

    function nowTime() {
      const d = new Date();
      return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    }

    function formatTime12(timeStr) {
      if (!timeStr) return '';
      const parts = String(timeStr).split(':');
      if (parts.length < 2) return timeStr;
      let h = Number(parts[0]);
      const m = parts[1].slice(0, 2);
      if (isNaN(h)) return timeStr;
      const ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      return `${String(h).padStart(2, '0')}:${m} ${ampm}`;
    }

    function formatDateTime(dateStr, timeStr, isoFallback) {
      const d = dateStr || (isoFallback ? String(isoFallback).slice(0, 10) : '');
      const t = timeStr || (isoFallback ? String(isoFallback).slice(11, 16) : '');
      return `${formatShortDate(d)}${t ? ' · ' + formatTime12(t) : ''}`;
    }

    function formatMonthLabel(monthKey) {

      const names = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      return `${names[Number(m) - 1] || m} ${y}`;
    }

    function formatDisplayDate(dateStr) {
      const d = dateStr ? new Date(dateStr + (dateStr.length === 10 ? 'T12:00:00' : '')) : new Date();
      if (isNaN(d.getTime())) return '';
      const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      return `${days[d.getDay()]}, ${String(d.getDate()).padStart(2, '0')} ${months[d.getMonth()]} ${d.getFullYear()}`;
    }

    function formatShortDate(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr + (dateStr.length === 10 ? 'T12:00:00' : ''));
      if (isNaN(d.getTime())) return dateStr;
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      return `${String(d.getDate()).padStart(2, '0')} ${months[d.getMonth()]} ${d.getFullYear()}`;
    }

    // Auto Archive & Closed Month Protection
    function isMonthClosed(monthKey) {
      if (!monthKey) return false;
      const cur = currentMonthKey();
      return monthKey < cur && (state.archivedReports || []).some(r => r.monthKey === monthKey && r.closed !== false);

    function isDateInClosedMonth(dateStr) {
      if (!dateStr || String(dateStr).length < 7) return false;

    function buildMonthArchiveSnapshot(mKey, isClosed = true) {
      const [y, m] = mKey.split('-');
      const names = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      const inc = (state.transactions || []).filter(t => t.type === 'income' && (t.date || '').startsWith(mKey)).reduce((s, t) => s + Number(t.amount || 0), 0);
      const exp = (state.transactions || []).filter(t => t.type === 'expense' && (t.date || '').startsWith(mKey)).reduce((s, t) => s + Number(t.amount || 0), 0);
      const ordList = (state.orders || []).filter(o => (o.date || '').startsWith(mKey));
      const txCount = (state.transactions || []).filter(t => (t.date || '').startsWith(mKey)).length;

      const staffSnapshot = (state.staff || []).map(st => {
        const adv = (state.staffLogs || []).filter(l => l.staffId === st.id && l.type === 'advance' && (l.date || '').startsWith(mKey)).reduce((s, l) => s + Number(l.amount || 0), 0);
        const sal = (state.staffLogs || []).filter(l => l.staffId === st.id && l.type === 'salary' && (l.date || '').startsWith(mKey)).reduce((s, l) => s + Number(l.amount || 0), 0);
        return { id: st.id, name: st.name, role: st.role || 'Staff', salaryAtTime: Number(st.salary || 0), advances: adv, salaryPaid: sal };
      });

      let customerPending = 0, customerCountWithBaqaya = 0;
      (state.customers || []).forEach(c => {
        const cst = getCustomerStats(c.id);
        if (cst.baqaya > 0) { customerPending += cst.baqaya; customerCountWithBaqaya++; }
      });
      let partyPending = 0, partyCountWithBaqaya = 0;
      (state.suppliers || []).forEach(sup => {
        const sst = getSupplierStats(sup.id);
        if (sst.remaining > 0) { partyPending += sst.remaining; partyCountWithBaqaya++; }
      });

      return {
        monthKey: mKey,
        label: `${names[Number(m) - 1] || m} ${y}`,
        income: inc,
        expense: exp,
        profit: inc - exp,
        ordersCount: ordList.length,
        txCount,
        staffSnapshot,
        pendingCarryForward: {
          customerPending: Math.round(customerPending),
          customerCountWithBaqaya,
          partyPending: Math.round(partyPending),
          partyCountWithBaqaya
        },
        closed: Boolean(isClosed),
        archivedAt: new Date().toISOString()
      };
    }

    function checkAutoArchive(forceCloseCurrentIfEndOfDay = false) {
      const curMonth = currentMonthKey();
      state.archivedReports = Array.isArray(state.archivedReports) ? state.archivedReports : [];
      let changed = false;

      // Ensure legacy archive entries are marked closed if before currentMonth
      state.archivedReports.forEach((r, idx) => {
        if (r && r.monthKey && r.monthKey < curMonth && r.closed === undefined) {
          const full = buildMonthArchiveSnapshot(r.monthKey, true);
          state.archivedReports[idx] = { ...full, ...r, closed: true };
          changed = true;
        }
      });

      const monthsSet = new Set();
      (state.transactions || []).forEach(t => { if (t.date && t.date.slice(0, 7) < curMonth) monthsSet.add(t.date.slice(0, 7)); });
      (state.orders || []).forEach(o => { if (o.date && o.date.slice(0, 7) < curMonth) monthsSet.add(o.date.slice(0, 7)); });
      if (state.lastActiveMonth && state.lastActiveMonth < curMonth) monthsSet.add(state.lastActiveMonth);

      let archivedCount = 0;
      monthsSet.forEach(mKey => {
        if (!state.archivedReports.some(r => r.monthKey === mKey)) {
          const snap = buildMonthArchiveSnapshot(mKey, true);
          if (snap.income > 0 || snap.expense > 0 || snap.ordersCount > 0 || snap.pendingCarryForward.customerPending > 0) {
            state.archivedReports.push(snap);
            archivedCount++;
            changed = true;
          }
        }
      });

      // Auto-close at 23:59 on last day of the month
      if (forceCloseCurrentIfEndOfDay) {
        const now = new Date();
        const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
        const isLastDay = tomorrow.getDate() === 1;
        if (isLastDay && now.getHours() === 23 && now.getMinutes() >= 59) {
          if (!state.archivedReports.some(r => r.monthKey === curMonth)) {
            state.archivedReports.push(buildMonthArchiveSnapshot(curMonth, true));
            archivedCount++;
            changed = true;
          }
        }
      }

      if (state.lastActiveMonth !== curMonth) {
        state.lastActiveMonth = curMonth;
        changed = true;
      }
      if (changed) {
        state.archivedReports.sort((a, b) => String(a.monthKey || '').localeCompare(String(b.monthKey || '')));
        saveState();
        if (archivedCount > 0) toast(`Auto-archived ${archivedCount} completed month report(s) ✓`, 'info');
      }
    }

    // Check KYC 5-minute auto-approval
    function getKycCountdownInfo() {
      const k = state.kyc || {};
      const elapsed = Math.max(0, Date.now() - (k.submittedAt || Date.now()));
      const remainingMs = Math.max(0, KYC_VERIFY_DURATION_MS - elapsed);
      const displaySec = remainingMs > 0 ? Math.floor(Math.max(0, remainingMs - 1) / 1000) : 0;
      const mins = Math.floor(displaySec / 60);
      const secs = displaySec % 60;
      const timerStr = `${mins}:${String(secs).padStart(2, '0')}`;
      const pct = Math.min(100, Math.round((elapsed / KYC_VERIFY_DURATION_MS) * 100));
      return { elapsed, remainingMs, timerStr, pct };
    }

    function migrateLegacyData() {
      let changed = false;
      if (!Array.isArray(state.messEntries)) { state.messEntries = []; changed = true; }
      if (!Array.isArray(state.rentRecords)) { state.rentRecords = []; changed = true; }
      if (!Array.isArray(state.rentPayments)) { state.rentPayments = []; changed = true; }
      if (!Array.isArray(state.partyPayments)) { state.partyPayments = []; changed = true; }

      // Migrate legacy order advances into customerPayments without double counting
      state.orders.forEach(o => {
        if (!o.time && o.createdAt) { o.time = String(o.createdAt).slice(11, 16) || '12:00'; changed = true; }
        const adv = Number(o.advance || 0);
        const hasLinkedPay = state.customerPayments.some(p => p.orderId === o.id);
        if (adv > 0 && !hasLinkedPay) {
          state.customerPayments.push({
            id: uid('pay'),
            customerId: o.customerId,
            orderId: o.id,
            amount: adv,
            date: o.date || todayISO(),
            time: o.time || '12:00',
            method: 'Cash',
            note: 'Initial Advance',
            isInitialAdvance: true,
            createdAt: o.createdAt || new Date().toISOString()
          });
          changed = true;
        }
      });

      // Migrate legacy Mess transactions into messEntries
      state.transactions.forEach(tx => {
        if (tx.type === 'expense' && tx.category === 'Mess' && !tx.messId) {
          const already = state.messEntries.some(m => m.txId === tx.id);
          if (!already) {
            const mId = uid('mess');
            state.messEntries.push({
              id: mId,
              itemName: tx.title || 'Mess Expense',
              qty: '1',
              amount: Number(tx.amount || 0),
              date: tx.date || todayISO(),
              time: tx.time || '12:00',
              paidBy: 'Workshop',
              note: '',
              txId: tx.id,
              createdAt: tx.createdAt || new Date().toISOString()
            });
            tx.messId = mId;
            changed = true;
          }
        }
      });

      // Migrate legacy Rent transactions into rentRecords + rentPayments
      const legacyRents = state.transactions.filter(tx => tx.type === 'expense' && tx.category === 'Rent' && !tx.rentPaymentId);
      if (legacyRents.length > 0) {
        let shopRentRec = state.rentRecords.find(r => r.isLegacyImport);
        if (!shopRentRec) {
          const curMonthLegacySum = legacyRents
            .filter(x => (x.date || '').startsWith(currentMonthKey()))
            .reduce((s, x) => s + Number(x.amount || 0), 0);
          shopRentRec = {
            id: uid('rent'),
            rentType: 'Shop',
            title: 'Previous Shop Rent Entries',
            ownerName: 'Landlord',
            monthlyAmount: curMonthLegacySum,
            dueDate: 'Monthly',
            date: legacyRents[0].date || todayISO(),
            time: '12:00',
            note: 'Auto-imported from previous Rent expenses',
            isLegacyImport: true,
            createdAt: new Date().toISOString()
          };
          state.rentRecords.push(shopRentRec);
        }
        legacyRents.forEach(tx => {
          const rpId = uid('rpay');
          state.rentPayments.push({
            id: rpId,
            rentId: shopRentRec.id,
            amount: Number(tx.amount || 0),
            date: tx.date || todayISO(),
            time: tx.time || '12:00',
            method: 'Cash',
            note: tx.title || 'Legacy Rent Payment',
            txId: tx.id,
            createdAt: tx.createdAt || new Date().toISOString()
          });
          tx.rentPaymentId = rpId;
          changed = true;
        });
      }

      // Normalize stock metadata
      state.stock.forEach(s => {
        if (s.initialQty === undefined) { s.initialQty = Number(s.qty || 0); changed = true; }
        if (s.usedQty === undefined) { s.usedQty = 0; changed = true; }
        if (s.purchaseDate === undefined) { s.purchaseDate = (s.updatedAt ? String(s.updatedAt).slice(0, 10) : todayISO()); changed = true; }
        if (s.purchaseTime === undefined) { s.purchaseTime = '12:00'; changed = true; }
        if (!Array.isArray(s.history)) {
          s.history = [{
            id: uid('sh'),
            type: 'purchase',
            qtyDelta: Number(s.qty || 0),
            remaining: Number(s.qty || 0),
            rate: Number(s.cost || 0),
            date: s.purchaseDate,
            time: s.purchaseTime,
            partyName: s.supplierName || '',
            note: 'Stock Added'
          }];
          changed = true;
        }
      });

      if (changed) saveState();
    }

    function recalcOrderTotals(orderId) {
      const o = state.orders.find(x => x.id === orderId);
      if (!o) return;
      const orderPays = state.customerPayments.filter(p => p.orderId === orderId);
      o.advance = orderPays.reduce((s, p) => s + Number(p.amount || 0), 0);
    }

    function getOrderStats(order) {
      const sqFt = Number(order.length || 0) * Number(order.width || 0) * Number(order.qty || 1);
      const computedLegacy = Math.round(sqFt * Number(order.rate || 0));
      const total = order.total != null
        ? Number(order.total)
        : (order.totalAmount != null ? Number(order.totalAmount) : computedLegacy);
      const orderPays = state.customerPayments.filter(p => p.orderId === order.id);
      const paid = orderPays.length > 0 ? orderPays.reduce((s, p) => s + Number(p.amount || 0), 0) : Number(order.advance || 0);
      const remaining = Math.max(0, total - paid);
      const extraPaid = Math.max(0, paid - total);
      return { sqFt, total, paid, remaining, extraPaid, payments: orderPays };
    }

    function getCustomerStats(customerId) {
      const cust = state.customers.find(c => c.id === customerId);
      const opening = Number(cust?.openingBalance || 0);
      const custOrders = state.orders.filter(o => o.customerId === customerId);
      const custPays = state.customerPayments.filter(p => p.customerId === customerId);
      const billed = opening + custOrders.reduce((s, o) => s + Number(o.total || 0), 0);
      const paidViaPayments = custPays.reduce((s, p) => s + Number(p.amount || 0), 0);
      // Fallback if any order has advance without a linked customerPayments row
      const unlinkedAdvance = custOrders.reduce((s, o) => {
        const hasPay = custPays.some(p => p.orderId === o.id);
        return s + (hasPay ? 0 : Number(o.advance || 0));
      }, 0);
      const received = paidViaPayments + unlinkedAdvance;
      const baqaya = Math.max(0, billed - received);
      const extraPaid = Math.max(0, received - billed);
      return { billed, received, baqaya, extraPaid, ordersCount: custOrders.length };
    }

    function getPartyStockItems(supplier) {
      if (!supplier) return [];
      const sName = (supplier.name || '').trim().toLowerCase();
      return state.stock.filter(item =>
        item.supplierId === supplier.id ||
        (sName && (item.supplierName || '').trim().toLowerCase() === sName)
      );
    }

    function getSupplierStats(supplierId) {
      const sup = state.suppliers.find(x => x.id === supplierId);
      const entries = state.supplierEntries.filter(e => e.supplierId === supplierId);
      const stockItems = getPartyStockItems(sup);
      const stockPurchaseTotal = stockItems.reduce((s, item) => {
        const baseVal = item.purchaseTotal != null ? Number(item.purchaseTotal) : (Number(item.initialQty ?? item.qty ?? 0) * Number(item.cost || 0));
        return s + baseVal;
      }, 0);
      const entriesTotal = entries.reduce((s, e) => s + Number(e.amount || 0), 0);
      const entriesPaid = entries.reduce((s, e) => s + Number(e.paid || 0), 0);
      const partyPays = (state.partyPayments || []).filter(p => p.supplierId === supplierId);
      const directPaid = partyPays.reduce((s, p) => s + Number(p.amount || 0), 0);
      const total = entriesTotal + stockPurchaseTotal;
      const paid = entriesPaid + directPaid;
      const remaining = Math.max(0, total - paid);
      return { total, paid, remaining, count: entries.length + stockItems.length, stockCount: stockItems.length };
    }

    function getMetrics() {
      const mKey = currentMonthKey();
      const tDay = todayISO();
      let totalIncome = 0, totalExpense = 0, monthIncome = 0, monthExpense = 0;
      state.transactions.forEach(t => {
        const amt = Number(t.amount || 0);
        if (t.type === 'income') {
          totalIncome += amt;
          if ((t.date || '').startsWith(mKey)) monthIncome += amt;
        } else if (t.type === 'expense') {
          totalExpense += amt;
          if ((t.date || '').startsWith(mKey)) monthExpense += amt;
        }
      });
      const totalProfit = totalIncome - totalExpense;

      let custTotal = 0, custReceived = 0, custBaqaya = 0, baqayaBills = 0;
      state.customers.forEach(c => {
        const st = getCustomerStats(c.id);
        custTotal += st.billed;
        custReceived += st.received;
        custBaqaya += st.baqaya;
        if (st.baqaya > 0) baqayaBills++;
      });

      const totalWork = state.orders.length;
      const todayWork = state.orders.filter(o => o.date === tDay).length;
      const totalPayment = custTotal;
      const pendingPayment = custBaqaya;

      return {
        totalIncome, totalExpense, totalProfit,
        monthIncome, monthExpense,
        custTotal, custReceived, custBaqaya, baqayaBills,
        totalWork, todayWork, totalPayment, pendingPayment
      };
    }

    function getLast6MonthsSeries() {
      const now = new Date();
      const labels = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sept','Oct','Nov','Dec'];
      const series = [];
      for (let i = 5; i >= 0; i--) {
        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
        let inc = 0, exp = 0;
        state.transactions.forEach(t => {
          if ((t.date || '').startsWith(key)) {
            if (t.type === 'income') inc += Number(t.amount || 0);
            else if (t.type === 'expense') exp += Number(t.amount || 0);
          }
        });
        series.push({ key, label: labels[d.getMonth()], income: inc, expense: exp });
      }
      return series;
    }

    async function hashPassword(pw) {
      if (window.crypto && crypto.subtle) {
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
        return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
      }
      return btoa(unescape(encodeURIComponent(pw)));
    }

    function compressImageFile(file, maxW = 640, quality = 0.72) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const maxDim = Math.max(img.width || maxW, img.height || maxW);
            const scale = Math.min(1, maxW / maxDim);
            const w = Math.max(1, Math.round((img.width || maxW) * scale));
            const h = Math.max(1, Math.round((img.height || maxW) * scale));
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#071330';
            ctx.fillRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
          img.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function evaluateSelfieFaceInOval(video) {
      if (!video || video.readyState < 2 || !video.videoWidth || !video.videoHeight || !camAnalysisCtx) {
        return { ok: false, msg: 'Camera tayyar ho raha hai...' };
      }

      const W = camAnalysisCanvas.width;
      const H = camAnalysisCanvas.height;
      camAnalysisCtx.save();
      camAnalysisCtx.scale(-1, 1);
      camAnalysisCtx.drawImage(video, -W, 0, W, H);
      camAnalysisCtx.restore();

      const imgData = camAnalysisCtx.getImageData(0, 0, W, H).data;
      const cx = 0.5, cy = 0.46, rx = 0.27, ry = 0.35;
      let ovalCount = 0, coreCount = 0, skinOval = 0, skinCore = 0;
      let sumY = 0, sumY2 = 0;
      let gradCount = 0, gradHits = 0;

      for (let py = 2; py < H - 2; py += 2) {
        const ny = py / H;
        for (let px = 2; px < W - 2; px += 2) {
          const nx = px / W;
          const dx = (nx - cx) / rx;
          const dy = (ny - cy) / ry;
          const dist2 = dx * dx + dy * dy;
          if (dist2 > 1.0) continue;

          const idx = (py * W + px) * 4;
          const r = imgData[idx], g = imgData[idx + 1], b = imgData[idx + 2];
          const y = 0.299 * r + 0.587 * g + 0.114 * b;
          const cb = 128 - 0.168736 * r - 0.331264 * g + 0.5 * b;
          const cr = 128 + 0.5 * r - 0.418688 * g - 0.081312 * b;

          ovalCount++;
          sumY += y;
          sumY2 += y * y;

          const isSkin = y > 32 && y < 246 && cb >= 74 && cb <= 138 && cr >= 130 && cr <= 180 && r >= g * 0.90 && r > b * 0.96;
          if (isSkin) skinOval++;
          if (dist2 <= 0.45) {
            coreCount++;
            if (isSkin) skinCore++;
          }

          if (ny >= 0.28 && ny <= 0.64) {
            const idxR = (py * W + (px + 2)) * 4;
            const idxD = ((py + 2) * W + px) * 4;
            const yR = 0.299 * imgData[idxR] + 0.587 * imgData[idxR + 1] + 0.114 * imgData[idxR + 2];
            const yD = 0.299 * imgData[idxD] + 0.587 * imgData[idxD + 1] + 0.114 * imgData[idxD + 2];
            gradCount++;
            if (Math.abs(y - yR) + Math.abs(y - yD) > 16) gradHits++;
          }
        }
      }

      if (!ovalCount || !coreCount) return { ok: false, msg: 'Apna chehra gol/oval nishaan ke andar layein' };

      const avgY = sumY / ovalCount;
      const variance = Math.max(0, (sumY2 / ovalCount) - avgY * avgY);
      const stdDev = Math.sqrt(variance);
      const skinRatio = skinOval / ovalCount;
      const coreSkinRatio = skinCore / coreCount;
      const edgeDensity = gradCount ? (gradHits / gradCount) : 0;

      if (avgY < 26) return { ok: false, msg: 'Roshni bohat kam hai — light me aayein' };
      if (avgY > 246 && stdDev < 10) return { ok: false, msg: 'Camera ke samne clear chehra rakhein' };

      if (kycFaceDetector) {
        try {
          const faces = await kycFaceDetector.detect(camAnalysisCanvas);
          if (Array.isArray(faces) && faces.length > 0) {
            const insideFace = faces.some((f) => {
              const b = f.boundingBox;
              const fx = (b.x + b.width * 0.5) / W;
              const fy = (b.y + b.height * 0.5) / H;
              const fw = b.width / W;
              const d = Math.pow((fx - cx) / 0.29, 2) + Math.pow((fy - cy) / 0.37, 2);
              return d <= 1.0 && fw >= 0.15 && fw <= 0.88;
            });
            if (insideFace) {
              return { ok: true, msg: 'Chehra Oval me hai ✓ — Ab Photo Khinchein' };
            }
            return { ok: false, msg: 'Apna chehra gol/oval nishaan ke bilkul andar layein' };
          }
        } catch (e) {}
      }

      if (coreSkinRatio >= 0.20 && skinRatio >= 0.18 && stdDev >= 11 && edgeDensity >= 0.06) {
        return { ok: true, msg: 'Chehra Oval me hai ✓ — Ab Photo Khinchein' };
      }
      if (coreSkinRatio < 0.15) {
        return { ok: false, msg: 'Apna chehra gol/oval nishaan ke andar layein' };
      }
      return { ok: false, msg: 'Chehra seedha camera ki taraf aur oval ke andar rakhein' };
    }

    async function openKycCamera(target) {
      stopKycCameraAll();
      kycCamTarget = target;
      openModal('kyc-camera', { target });

      const video = document.getElementById('kyc-cam-video');
      const errBox = document.getElementById('kyc-cam-error');
      const liveBox = document.getElementById('kyc-cam-live-wrap');
      if (!video) return;

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        if (liveBox) liveBox.classList.add('hidden');
        if (errBox) {
          errBox.classList.remove('hidden');
          const txt = document.getElementById('kyc-cam-error-text');
          if (txt) txt.textContent = 'Is browser me Camera API available nahi hai. Chrome ya Safari use karein.';
        }
        return;
      }

      const constraintsList = target === 'selfie'
        ? [
            { video: { facingMode: { ideal: 'user' }, width: { ideal: 720 }, height: { ideal: 960 } }, audio: false },
            { video: { facingMode: 'user' }, audio: false },
            { video: true, audio: false }
          ]
        : [
            { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 800 } }, audio: false },
            { video: { facingMode: 'environment' }, audio: false },
            { video: true, audio: false }
          ];

      let stream = null;
      let lastErr = null;
      for (const c of constraintsList) {
        try {
          stream = await navigator.mediaDevices.getUserMedia(c);
          break;
        } catch (err) {
          lastErr = err;
        }
      }

      if (!document.getElementById('kyc-cam-video') || kycCamTarget !== target) {
        if (stream) { try { stream.getTracks().forEach(tr => tr.stop()); } catch (e) {} }
        return;
      }

      if (!stream) {
        if (liveBox) liveBox.classList.add('hidden');
        if (errBox) {
          errBox.classList.remove('hidden');
          const txt = document.getElementById('kyc-cam-error-text');
          if (txt) {
            txt.textContent = lastErr?.name === 'NotAllowedError'
              ? 'Camera permission band hai. Browser settings me Camera Allow karke Retry dabayein.'
              : 'Camera open nahi ho saka. Camera connect/allow karke Retry dabayein.';
          }
        }
        return;
      }

      ui.cameraStream = stream;
      video.srcObject = stream;
      try { await video.play(); } catch (e) {}

      if (target === 'selfie') {
        setKycCamOverlayState(false, 'Apna chehra gol/oval nishaan ke andar layein');
        kycCamLoopTimer = setInterval(async () => {
          const v = document.getElementById('kyc-cam-video');
          if (!v || !ui.cameraStream || kycCamPreview) return;
          const res = await evaluateSelfieFaceInOval(v);
          if (res.ok) {
            kycCamPassStreak++;
            kycCamFailStreak = 0;
            if (kycCamPassStreak >= 2 || kycCamFaceOk) {
              setKycCamOverlayState(true, res.msg);
            }
          } else {
            kycCamFailStreak++;
            kycCamPassStreak = 0;
            if (kycCamFailStreak >= 3 || !kycCamFaceOk) {
              setKycCamOverlayState(false, res.msg);
            }
          }
        }, 180);
      } else {
        const capBtn = document.getElementById('kyc-cam-capture-btn');
        if (capBtn) {
          capBtn.disabled = false;
          capBtn.className = 'w-full h-12 rounded-xl btn-primary-grad font-extrabold text-sm cursor-pointer transition';
        }
      }
    }

    function captureKycCameraPhoto() {
      const video = document.getElementById('kyc-cam-video');
      if (!video || !ui.cameraStream || video.readyState < 2) {
        toast('Camera abhi tayyar nahi hai.', 'error');

      if (kycCamTarget === 'selfie' && !kycCamFaceOk) {
        toast('Pehle apna chehra gol/oval nishaan ke andar layein.', 'error');
        return;
      }
      const vw = video.videoWidth || 640;
      const vh = video.videoHeight || 480;
      const maxW = 640;
      const scale = Math.min(1, maxW / Math.max(vw, vh));
      const cw = Math.max(1, Math.round(vw * scale));
      const ch = Math.max(1, Math.round(vh * scale));
      const capCanvas = document.createElement('canvas');
      capCanvas.width = cw;
      capCanvas.height = ch;
      const ctx = capCanvas.getContext('2d');
      ctx.fillStyle = '#071330';
      ctx.fillRect(0, 0, cw, ch);
      if (kycCamTarget === 'selfie') {
        ctx.save();
        ctx.scale(-1, 1);
        ctx.drawImage(video, -cw, 0, cw, ch);
        ctx.restore();
      } else {
        ctx.drawImage(video, 0, 0, cw, ch);
      }
      kycCamPreview = capCanvas.toDataURL('image/jpeg', 0.78);
      stopKycCameraStream();

      const liveWrap = document.getElementById('kyc-cam-live-wrap');
      const revWrap = document.getElementById('kyc-cam-review-wrap');
      const revImg = document.getElementById('kyc-cam-preview-img');
      if (revImg) revImg.src = kycCamPreview;
      if (liveWrap) liveWrap.classList.add('hidden');
      if (revWrap) revWrap.classList.remove('hidden');

    function bufToBase64Url(buf) {
      const bytes = new Uint8Array(buf);
      let bin = '';
      for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function base64UrlToBuf(b64) {
      const pad = b64.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((b64.length + 3) % 4);
      const bin = atob(pad);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return bytes.buffer;
    }

    function randomChallenge() {
      const arr = new Uint8Array(32);
      crypto.getRandomValues(arr);
      return arr;
    }

          return await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
        }
        return true;
      } catch (e) {
        return false;
      }
    }

    function getAuthLockState() {
      try {
        return JSON.parse(localStorage.getItem(AUTH_LOCK_KEY) || '{}') || {};
      } catch {
        return {};
      }
    }

    function recordFailedPasswordAttempt() {
      const lock = getAuthLockState();
      const count = Number(lock.count || 0) + 1;
      const next = { count, lockedUntil: count >= 5 ? Date.now() + 5 * 60 * 1000 : 0 };
      localStorage.setItem(AUTH_LOCK_KEY, JSON.stringify(next));
      return next;
    }

    function clearFailedPasswordAttempts() {
      localStorage.removeItem(AUTH_LOCK_KEY);
    }

    function getLockoutRemainingSec() {
      const lock = getAuthLockState();
      if (!lock.lockedUntil || lock.lockedUntil <= Date.now()) return 0;
      return Math.ceil((lock.lockedUntil - Date.now()) / 1000);
    }

    async function flushCloudSync() {

      const s = state.session;
      if (!cloud || !s || !s.uid) return false;
      if (!cloud.auth?.currentUser || cloud.auth.currentUser.uid !== s.uid) return false;
      if (isAdminSession()) return true;
      if (!navigator.onLine) {
        ui.syncStatus = 'offline';
        updateSyncStatusBadgeDom();
        return false;
      }
      if (isSyncInFlight) {
        pendingCloudResync = true;
        return false;
      }
      isSyncInFlight = true;
      ui.syncStatus = 'syncing';
      updateSyncStatusBadgeDom();
      try {
        const syncedAt = await cloud.saveUserVault(
          s.uid,
          {
            name: s.name,
            identifier: s.identifier || s.email || s.mobile || '',
            email: s.email || '',
            mobile: s.mobile || '',

            kycDuplicateOf: state.kyc?.duplicateOf || '',

          state
        );
        state.cloudMeta = {
          ...(state.cloudMeta || {}),
          uid: s.uid,
          lastSyncAt: syncedAt
        };
        localStorage.removeItem(PENDING_SYNC_KEY);
        saveState(true);
        ui.syncStatus = 'synced';
        updateSyncStatusBadgeDom();
        return true;
      } catch (err) {
        if (err && err.message === 'ACCOUNT_BLOCKED') {
          state.blocked = true;
          saveState(true);
          ui.view = 'kyc';
          render();
          return false;
        }
        if (err && err.message === 'AUTH_SESSION_CHANGED') {
          return false;
        }
        ui.syncStatus = 'pending';
        updateSyncStatusBadgeDom();
        return false;
      } finally {
        isSyncInFlight = false;
        if (pendingCloudResync) {
          pendingCloudResync = false;
          setTimeout(() => { flushCloudSync(); }, 180);
        }
      }
    }

        throw new Error('Sahi Gmail address likhein (e.g. name@gmail.com).');
      }
      const otp = String(Math.floor(100000 + Math.random() * 900000));
      const resp = await fetch('https://api.emailjs.com/api/v1.0/email/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          service_id: EMAILJS_SERVICE_ID,
          template_id: EMAILJS_TEMPLATE_ID,
          user_id: EMAILJS_PUBLIC_KEY,
          template_params: {
            passcode: otp,
            to_email: email
          }
        })
      });
      if (!resp.ok) {
        const errText = await resp.text().catch(() => '');
        throw new Error(errText || 'Email OTP send nahi ho saka. Internet aur Gmail check karein.');
      }
      return otp;
    }

    async function hydrateFromFirebaseUser(fbUser, overrideInfo = {}, opts = {}) {
      const cloud = getCloud();
      if (!cloud || !fbUser) return;
      if (!cloud.auth?.currentUser || cloud.auth.currentUser.uid !== fbUser.uid) return;
      const myGen = ++hydrateGeneration;
      const isBg = Boolean(opts.background);
      if (!isBg && (!state.session || state.session.uid !== fbUser.uid)) {
        ui.cloudHydrating = true;
      }
      try {
        try {
          await fbUser.getIdToken();
        } catch (tokErr) {
          const code = tokErr?.code || '';
          if (navigator.onLine && (code === 'auth/user-token-expired' || code === 'auth/user-disabled' || code === 'auth/user-not-found')) {
            if (myGen === hydrateGeneration) {
              try { await cloud.signOutUser(); } catch (e) {}
            }
            return;
          }
        }
        if (myGen !== hydrateGeneration || !cloud.auth?.currentUser || cloud.auth.currentUser.uid !== fbUser.uid) {
          return;
        }

        const prevUid = state.session?.uid || state.cloudMeta?.uid || '';
        const isNewSignup = Boolean(overrideInfo.isNewSignup);
        const remCopy = loadRememberMe();

        // Admin direct account check
        const emailLower = String(overrideInfo.email || fbUser.email || '').trim().toLowerCase();
        if (cloud.isAdminEmail(emailLower)) {
          state = defaultData();
          state.rememberMe = remCopy;
          state.session = {
            id: fbUser.uid,
            uid: fbUser.uid,
            name: fbUser.displayName || 'Admin',
            email: emailLower,
            mobile: '',
            identifier: emailLower,
            authType: 'email',
            photo: '',
            provider: 'firebase',
            isAdmin: true,
            loginAt: Date.now()
          };
          state.kyc.status = 'approved';
          ui.pinLocked = false;
          ui.cloudHydrating = false;
          ui.view = ui.view === 'admin-inspect' ? 'admin-inspect' : 'admin';
          saveState(true);
          render();
          loadAdminUsersList();
          return;
        }

        // STRICT PER-ACCOUNT ISOLATION:
        if (isNewSignup || prevUid !== fbUser.uid) {
          state = defaultData();
          state.rememberMe = remCopy;
        }

        if (isNewSignup) {
          const displayName = String(overrideInfo.name || fbUser.displayName || 'User');
          const emailVal = String(overrideInfo.email || fbUser.email || '');
          state.session = {
            id: fbUser.uid,
            uid: fbUser.uid,
            name: displayName,
            email: emailVal,
            mobile: '',
            identifier: emailVal,
            authType: 'email',
            photo: '',
            provider: 'firebase',
            loginAt: Date.now()
          };
          state.cloudMeta = { uid: fbUser.uid, lastSyncAt: 0, lastBackupAt: 0, lastDailyBackupDate: '' };
          state.kyc.status = 'none';
          state.kyc.fullName = displayName;
          ui.pinLocked = false;
          ui.view = 'kyc';
          saveState(true);
          await flushCloudSync();
          return;
        }

        const bundle = await cloud.loadUserBundle(fbUser.uid);
        if (myGen !== hydrateGeneration || !cloud.auth?.currentUser || cloud.auth.currentUser.uid !== fbUser.uid) {
          return;
        }
        const prof = bundle.profile || {};
        const uidCache = loadUserCache(fbUser.uid);

        if (bundle.hasCloudData) {
          const hasPending = localStorage.getItem(PENDING_SYNC_KEY) === fbUser.uid;
          if (hasPending && uidCache && hasWorkshopRecords(uidCache)) {
            applyBackupPayload({ data: uidCache }, true, true);
          } else {
            applyBackupPayload({ data: bundle.vaultData }, true, true);
          }
        } else if (uidCache) {
          applyBackupPayload({ data: uidCache }, true, true);
        }

        // Preserve local theme preference if user explicitly toggled it locally before cloud caught up
        const localTheme = loadSavedThemePref();
        if (localTheme && state.settings.theme !== localTheme && localStorage.getItem(PENDING_SYNC_KEY) === fbUser.uid) {
          state.settings.theme = localTheme;
        }

        const displayName = String(overrideInfo.name || prof.name || fbUser.displayName || 'User');
        const emailVal = String(overrideInfo.email || prof.email || (fbUser.email && !fbUser.email.endsWith('@mobile.digitalkhata.app') ? fbUser.email : '') || '');
        const mobileVal = String(overrideInfo.mobile || prof.mobile || '');
        const identifierVal = String(overrideInfo.identifier || prof.identifier || emailVal || mobileVal || '');

        state.session = {
          id: fbUser.uid,
          uid: fbUser.uid,
          cloudUid: fbUser.uid,
          name: displayName,
          email: emailVal,
          mobile: mobileVal,
          identifier: identifierVal,
          authType: (prof.authType === 'mobile' || overrideInfo.authType === 'mobile') ? 'mobile' : 'email',
          photo: '',
          provider: 'firebase',
          loginAt: Date.now()
        };
        state.blocked = Boolean(prof.blocked);
        if (prof.pinEnabled && prof.pinHash) {
          state.pinSecurity = { enabled: true, hash: String(prof.pinHash) };
        }
        if (prof.kycStatus === 'duplicate') {
          state.kyc.status = 'duplicate';
          state.kyc.duplicateOf = String(prof.kycDuplicateOf || state.kyc.duplicateOf || '');
        } else if (prof.kycStatus === 'approved' && state.kyc.status !== 'approved') {
          state.kyc.status = 'approved';
        }
        state.cloudMeta = {
          ...(state.cloudMeta || {}),
          uid: fbUser.uid,
          lastSyncAt: Number(prof.lastSyncAt || state.cloudMeta?.lastSyncAt || 0),
          lastBackupAt: Number(prof.lastBackupAt || bundle.latestBackup?.createdAt || state.cloudMeta?.lastBackupAt || 0)
        };
        if (!state.kyc.fullName && displayName) state.kyc.fullName = displayName;
        if (!state.kyc.mobile && mobileVal) state.kyc.mobile = mobileVal;

        // Legacy / Existing accounts duplicate CNIC audit (never auto-deletes any account!)
        if (state.kyc?.cnic && state.kyc.status !== 'duplicate' && !prof.kycStatusOverrideByAdmin) {
          try {
            const cnicAudit = await cloud.checkOrClaimLegacyCnic(state.kyc.cnic, fbUser.uid);
            if (cnicAudit.isDuplicate) {
              state.kyc.status = 'duplicate';
              state.kyc.duplicateOf = cnicAudit.ownerUid || '';
            }
          } catch (e) {}
        }

        ui.pinLocked = Boolean(
          state.pinSecurity?.enabled &&
          state.pinSecurity?.hash &&
          sessionStorage.getItem(PIN_UNLOCK_SESSION_KEY) !== fbUser.uid
        );
        if (state.kyc && state.kyc.status === 'verifying' && state.kyc.submittedAt && (Date.now() - state.kyc.submittedAt >= KYC_VERIFY_DURATION_MS)) {
          state.kyc.status = 'approved';
          state.kyc.approvedAt = Date.now();
          ui.kycWelcomeBanner = true;
        }
        checkAutoArchive();
        saveState(true);
        flushCloudSync().then(() => {
          if (myGen === hydrateGeneration) maybeRunAutoDailyBackup();
        });
      } catch (err) {
        if (myGen !== hydrateGeneration) return;
        if (!err || err.message !== 'AUTH_SESSION_CHANGED') {
          ui.syncStatus = 'pending';
        }
      } finally {
        if (myGen !== hydrateGeneration) return;
        ui.cloudHydrating = false;
        if (!state.session) {
          ui.view = 'login';
        } else if (isAdminSession()) {
          ui.view = ui.view === 'admin-inspect' ? 'admin-inspect' : 'admin';
        } else if (state.blocked || !isKycVerified()) {
          ui.view = 'kyc';
          if (state.kyc?.status === 'verifying') startKycCountdownTimer();
        } else {
          ui.view = (ui.view === 'login' || ui.view === 'kyc') ? 'home' : ui.view;
        }
        render();
      }
    }

    function applyBackupPayload(payload, resetFirst = false, skipRender = false) {
      const d = payload && payload.data ? payload.data : payload;
      if (!d || typeof d !== 'object') throw new Error('Invalid backup format');
      const def = defaultData();
      if (resetFirst) {
        const keepSess = state.session;
        const keepRem = state.rememberMe;
        const keepCloud = state.cloudMeta;
        const keepPin = state.pinSecurity;
        const keepBio = state.biometric;
        state = defaultData();
        state.session = keepSess;
        state.rememberMe = keepRem;
        state.cloudMeta = keepCloud;
        state.pinSecurity = keepPin;
        state.biometric = keepBio;
      }
      if (d.settings) {
        state.settings = {
          ...def.settings,
          ...d.settings,
          bankAccounts: { ...(def.settings.bankAccounts || {}), ...(d.settings.bankAccounts || {}) }
        };
      }
      if (Array.isArray(d.customers)) state.customers = d.customers;
      if (Array.isArray(d.orders)) state.orders = d.orders;
      if (Array.isArray(d.customerPayments)) state.customerPayments = d.customerPayments;
      if (Array.isArray(d.transactions)) state.transactions = d.transactions;
      if (Array.isArray(d.stock)) state.stock = d.stock;
      if (Array.isArray(d.suppliers)) state.suppliers = d.suppliers;
      if (Array.isArray(d.supplierEntries)) state.supplierEntries = d.supplierEntries;
      if (Array.isArray(d.partyPayments)) state.partyPayments = d.partyPayments;
      if (Array.isArray(d.staff)) state.staff = d.staff;
      if (Array.isArray(d.staffLogs)) state.staffLogs = d.staffLogs;
      if (Array.isArray(d.salaryHistory)) state.salaryHistory = d.salaryHistory;
      if (Array.isArray(d.messEntries)) state.messEntries = d.messEntries;
      if (Array.isArray(d.rentRecords)) state.rentRecords = d.rentRecords;
      if (Array.isArray(d.rentPayments)) state.rentPayments = d.rentPayments;
      if (Array.isArray(d.committees)) state.committees = d.committees;
      if (Array.isArray(d.archivedReports)) state.archivedReports = d.archivedReports;
      if (d.lastActiveMonth) state.lastActiveMonth = d.lastActiveMonth;
      if (d.kyc && typeof d.kyc === 'object') state.kyc = { ...def.kyc, ...d.kyc };
      migrateLegacyData();
      applyTheme();
      saveState(true);
      if (!skipRender) render();
    }

    function downloadFile(filename, content, mime) {
      const blob = new Blob([content], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function exportJsonBackup() {
      const name = `DigitalKhata_Backup_${todayISO()}.json`;
      downloadFile(name, JSON.stringify(buildBackupPayload(), null, 2), 'application/json');

    }

    function importJsonBackup(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          applyBackupPayload(parsed);
          toast('Backup imported successfully ✓', 'success');
        } catch (e) {
          toast('Invalid JSON backup file.', 'error');
        }
      };
      reader.readAsText(file);
    }

    function getNextInvoiceNumber(customer) {
      if (customer && customer.lastInvoiceNo) return customer.lastInvoiceNo;
      const year = new Date().getFullYear();

      state.settings.invoiceSeq = seq;

    function buildCustomerInvoiceModel(customerId, overrides = {}) {
      const c = state.customers.find(x => x.id === customerId);
      if (!c) return null;
      const st = getCustomerStats(c.id);
      const orders = state.orders.filter(o => o.customerId === c.id);
      const s = state.settings || {};

      const items = orders.length
        ? orders.map(o => {
            const ost = getOrderStats(o);
            const qty = Math.max(1, Number(o.qty || 1));
            const lineTotal = Number(ost.total || 0);
            const unitPrice = Math.round((lineTotal / qty) * 100) / 100;
            const desc = o.description
              ? `${o.itemName} (${o.description})`
              : (o.itemName || 'Aluminium Work');
            return {
              workType: o.itemName || 'Aluminium Work',
              description: desc,
              qty,
              unitPrice,
              total: lineTotal
            };
          })
        : [{
            workType: 'Aluminium Work',
            description: 'Workshop Bill / Balance',
            qty: 1,
            unitPrice: st.billed,
            total: st.billed
          }];

      const subTotal = items.reduce((acc, it) => acc + Number(it.total || 0), 0);
      const vatEnabled = overrides.vatEnabled !== undefined ? Boolean(overrides.vatEnabled) : Boolean(s.vatEnabledDefault !== false);
      const vatAmount = vatEnabled ? Math.round(subTotal * 0.15 * 100) / 100 : 0;
      const grandTotal = Math.round((subTotal + vatAmount) * 100) / 100;
      const advancePaid = Number(st.received || 0);
      const remainingBalance = Math.max(0, Math.round((grandTotal - advancePaid) * 100) / 100);

      const bankName = overrides.bankName || s.defaultBank || 'Al Rajhi Bank';
      const savedBank = (s.bankAccounts && s.bankAccounts[bankName]) || {};

      return {
        customerId: c.id,
        invoiceNo: (overrides.invoiceNo || c.lastInvoiceNo || getNextInvoiceNumber(c)).trim(),
        invoiceDate: overrides.invoiceDate || todayISO(),
        logoSrc: (s.customLogo || '').trim() || DEFAULT_LOGO_PATH,
        shopName: (overrides.shopName ?? s.shopName ?? 'Warsha Aluminium Workshop').trim() || 'Warsha Aluminium Workshop',
        shopTagline: (overrides.shopTagline ?? s.shopTagline ?? 'Aluminium & Glass Fabrication Experts').trim(),
        shopAddress: (overrides.shopAddress ?? s.shopAddress ?? '').trim(),
        shopMobile: (overrides.shopMobile ?? s.shopMobile ?? '').trim(),
        shopEmail: (overrides.shopEmail ?? s.shopEmail ?? '').trim(),
        ownerName: (overrides.ownerName ?? s.ownerName ?? state.session?.name ?? '').trim(),
        ownerMobile: (overrides.ownerMobile ?? s.ownerMobile ?? state.session?.mobile ?? '').trim(),
        ownerEmail: (overrides.ownerEmail ?? s.ownerEmail ?? state.session?.email ?? '').trim(),
        custName: c.name,
        custPhone: c.mobile || '',
        custEmail: (overrides.custEmail ?? c.email ?? '').trim(),
        custAddress: c.address || '',
        items,
        subTotal,
        vatEnabled,
        vatAmount,
        grandTotal,
        advancePaid,
        remainingBalance,
        bankName,
        bankAccountName: savedBank.accountName || '',
        bankIban: savedBank.iban || '',
        bankBranch: savedBank.branchName || '',
        terms: (overrides.terms ?? s.invoiceTerms ?? '').trim() || '1. Work starts after advance payment confirmation.\n2. Remaining balance is due upon completion/delivery.'
      };
    }

    function loadImgForCanvas(src) {
      return new Promise((resolve) => {
        if (!src) { resolve(null); return; }
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = src;
      });
    }

    function wrapCanvasLines(ctx, text, maxW) {
      const words = String(text || '').split(/\s+/);
      const lines = [];
      let cur = '';
      for (const w of words) {
        const next = cur ? cur + ' ' + w : w;
        if (ctx.measureText(next).width > maxW && cur) {
          lines.push(cur);
          cur = w;
        } else {
          cur = next;
        }
      }
      if (cur) lines.push(cur);
      return lines;
    }

    async function generateInvoicePngBlob(inv) {
      const W = 1200;
      const H = 1660;
      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');

      // White page background + outer border
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = '#0a1d42';
      ctx.lineWidth = 6;
      ctx.strokeRect(18, 18, W - 36, H - 36);

      // Top Navy Header
      const hdrH = 260;
      ctx.fillStyle = '#0a1d42';
      ctx.fillRect(21, 21, W - 42, hdrH);
      ctx.fillStyle = '#f59e0b';
      ctx.fillRect(21, 21 + hdrH, W - 42, 10);

      // Shop Logo circle
      const logoImg = await loadImgForCanvas(inv.logoSrc);
      if (logoImg) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(105, 115, 56, 0, Math.PI * 2);
        ctx.closePath();
        ctx.clip();
        ctx.drawImage(logoImg, 49, 59, 112, 112);
        ctx.restore();
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(105, 115, 56, 0, Math.PI * 2);
        ctx.stroke();
      }

      const textX = logoImg ? 185 : 54;
      ctx.fillStyle = '#ffffff';
      ctx.font = '800 36px "Plus Jakarta Sans", Arial, sans-serif';
      ctx.fillText(inv.shopName.toUpperCase().slice(0, 34), textX, 95);

      ctx.fillStyle = '#fbbf24';
      ctx.font = '700 20px "Plus Jakarta Sans", Arial, sans-serif';
      if (inv.shopTagline) ctx.fillText(inv.shopTagline.slice(0, 52), textX, 128);

      ctx.fillStyle = '#dbeafe';
      ctx.font = '500 18px "Plus Jakarta Sans", Arial, sans-serif';
      let hy = 162;
      if (inv.shopAddress) { ctx.fillText('Address: ' + inv.shopAddress.slice(0, 58), textX, hy); hy += 26; }
      if (inv.shopMobile) { ctx.fillText('Phone: ' + inv.shopMobile, textX, hy); hy += 26; }
      if (inv.shopEmail) { ctx.fillText('Email: ' + inv.shopEmail, textX, hy); }

      // Right INVOICE label + box
      ctx.textAlign = 'right';
      ctx.fillStyle = '#f59e0b';
      ctx.font = '900 56px "Plus Jakarta Sans", Arial, sans-serif';
      ctx.fillText('INVOICE', W - 55, 105);
      ctx.fillStyle = 'rgba(245,158,11,0.16)';
      ctx.fillRect(W - 350, 128, 295, 86);
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 2;
      ctx.strokeRect(W - 350, 128, 295, 86);
      ctx.fillStyle = '#fef3c7';
      ctx.font = '700 19px "Plus Jakarta Sans", Arial, sans-serif';
      ctx.fillText('No: ' + inv.invoiceNo, W - 70, 162);
      ctx.fillText('Date: ' + formatShortDate(inv.invoiceDate), W - 70, 194);
      ctx.textAlign = 'left';

      // Invoice To & Payment Detail boxes
      const boxY = 320;
      const boxW = (W - 120) / 2;
      const boxH = 195;

      // Left Box: Invoice To
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(48, boxY, boxW, boxH);
      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 2;
      ctx.strokeRect(48, boxY, boxW, boxH);
      ctx.fillStyle = '#0a1d42';
      ctx.fillRect(48, boxY, 8, boxH);

      ctx.fillStyle = '#ea580c';
      ctx.font = '800 18px "Plus Jakarta Sans", Arial, sans-serif';
      ctx.fillText('INVOICE TO', 74, boxY + 34);
      ctx.fillStyle = '#0a1d42';
      ctx.font = '800 25px "Plus Jakarta Sans", Arial, sans-serif';
      ctx.fillText(inv.custName.slice(0, 30), 74, boxY + 70);
      ctx.fillStyle = '#334155';
      ctx.font = '500 18px "Plus Jakarta Sans", Arial, sans-serif';
      let cy = boxY + 102;
      if (inv.custPhone) { ctx.fillText('Phone: ' + inv.custPhone, 74, cy); cy += 28; }
      if (inv.custEmail) { ctx.fillText('Email: ' + inv.custEmail, 74, cy); cy += 28; }
      if (inv.custAddress) {
        const addrLines = wrapCanvasLines(ctx, 'Address: ' + inv.custAddress, boxW - 44).slice(0, 2);
        addrLines.forEach(line => { ctx.fillText(line, 74, cy); cy += 24; });
      }

      // Right Box: Payment Detail
      const rx = 72 + boxW;
      ctx.fillStyle = '#fffbeb';
      ctx.fillRect(rx, boxY, boxW, boxH);
      ctx.strokeStyle = '#fde68a';
      ctx.lineWidth = 2;
      ctx.strokeRect(rx, boxY, boxW, boxH);
      ctx.fillStyle = '#f59e0b';
      ctx.fillRect(rx, boxY, 8, boxH);

      ctx.fillStyle = '#0a1d42';
      ctx.font = '800 18px "Plus Jakarta Sans", Arial, sans-serif';
      ctx.fillText('PAYMENT DETAIL', rx + 26, boxY + 34);
      ctx.fillStyle = '#1e293b';
      ctx.font = '700 20px "Plus Jakarta Sans", Arial, sans-serif';
      ctx.fillText('Bank: ' + inv.bankName, rx + 26, boxY + 70);
      ctx.font = '600 17px "Plus Jakarta Sans", Arial, sans-serif';
      if (inv.bankName !== 'Cash') {
        ctx.fillText('Account: ' + (inv.bankAccountName || 'Not set'), rx + 26, boxY + 102);
        ctx.fillText('IBAN/No: ' + (inv.bankIban || 'Not set'), rx + 26, boxY + 132);
        if (inv.bankBranch) ctx.fillText('Branch: ' + inv.bankBranch, rx + 26, boxY + 162);
      } else {
        ctx.fillText('Method: Cash Payment at Workshop', rx + 26, boxY + 104);
      }

      // Table Header
      let ty = 550;
      const tblW = W - 96;
      ctx.fillStyle = '#0a1d42';
      ctx.fillRect(48, ty, tblW, 52);
      ctx.fillStyle = '#ffffff';
      ctx.font = '800 19px "Plus Jakarta Sans", Arial, sans-serif';
      ctx.fillText('PRODUCT DESCRIPTION', 66, ty + 33);
      ctx.textAlign = 'right';
      ctx.fillText('PRICE', 775, ty + 33);
      ctx.textAlign = 'center';
      ctx.fillText('QTY', 885, ty + 33);
      ctx.textAlign = 'right';
      ctx.fillStyle = '#fbbf24';
      ctx.fillText('TOTAL', W - 66, ty + 33);
      ctx.textAlign = 'left';

      ty += 52;
      const showItems = inv.items.slice(0, 8);
      showItems.forEach((it, idx) => {
        const rowH = 54;
        ctx.fillStyle = idx % 2 === 0 ? '#ffffff' : '#f1f5f9';
        ctx.fillRect(48, ty, tblW, rowH);
        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(48, ty, tblW, rowH);
        ctx.fillStyle = '#0f172a';
        ctx.font = '700 18px "Plus Jakarta Sans", Arial, sans-serif';
        ctx.fillText(String(it.description || '').slice(0, 46), 66, ty + 34);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#334155';
        ctx.font = '600 18px "Plus Jakarta Sans", Arial, sans-serif';
        ctx.fillText(fmtRs(it.unitPrice), 775, ty + 34);
        ctx.textAlign = 'center';
        ctx.fillText(String(it.qty), 885, ty + 34);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#0a1d42';
        ctx.font = '800 19px "Plus Jakarta Sans", Arial, sans-serif';
        ctx.fillText(fmtRs(it.total), W - 66, ty + 34);
        ctx.textAlign = 'left';
        ty += rowH;
      });

      // Totals Box (right) + Terms (left)
      const botY = Math.max(ty + 34, 1060);
      const termsW = 580;
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(48, botY, termsW, 250);
      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 2;
      ctx.strokeRect(48, botY, termsW, 250);
      ctx.fillStyle = '#0a1d42';
      ctx.font = '800 19px "Plus Jakarta Sans", Arial, sans-serif';
      ctx.fillText('TERMS AND CONDITIONS', 68, botY + 34);
      ctx.fillStyle = '#475569';
      ctx.font = '500 16px "Plus Jakarta Sans", Arial, sans-serif';
      let tty = botY + 66;
      inv.terms.split('\n').slice(0, 6).forEach(line => {
        wrapCanvasLines(ctx, line, termsW - 40).slice(0, 2).forEach(wl => {
          if (tty < botY + 235) { ctx.fillText(wl, 68, tty); tty += 24; }
        });
      });

      // Totals card on right
      const totX = 665;
      const totW = W - 48 - totX;
      const rows = [
        { label: 'Sub Total', val: fmtRs(inv.subTotal), bg: '#ffffff', fg: '#0f172a', valFg: '#0f172a' },
        { label: 'VAT 15% (KSA)', val: inv.vatEnabled ? fmtRs(inv.vatAmount) : 'Excluded', bg: '#fff7ed', fg: '#9a3412', valFg: '#ea580c' },
        { label: 'GRAND TOTAL', val: fmtRs(inv.grandTotal), bg: '#0a1d42', fg: '#fbbf24', valFg: '#ffffff', bold: true },
        { label: 'Advance Paid', val: fmtRs(inv.advancePaid), bg: '#ecfdf5', fg: '#065f46', valFg: '#059669' },
        { label: 'Baqi / Remaining', val: fmtRs(inv.remainingBalance), bg: inv.remainingBalance > 0 ? '#fef2f2' : '#ecfdf5', fg: inv.remainingBalance > 0 ? '#991b1b' : '#065f46', valFg: inv.remainingBalance > 0 ? '#dc2626' : '#059669', bold: true }
      ];
      rows.forEach((r, idx) => {
        const ry = botY + idx * 50;
        ctx.fillStyle = r.bg;
        ctx.fillRect(totX, ry, totW, 50);
        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(totX, ry, totW, 50);
        ctx.fillStyle = r.fg;
        ctx.font = (r.bold ? '800 ' : '700 ') + '19px "Plus Jakarta Sans", Arial, sans-serif';
        ctx.fillText(r.label, totX + 18, ry + 32);
        ctx.textAlign = 'right';
        ctx.fillStyle = r.valFg;
        ctx.font = '800 20px "Plus Jakarta Sans", Arial, sans-serif';
        ctx.fillText(r.val, totX + totW - 18, ry + 32);
        ctx.textAlign = 'left';
      });
      ctx.strokeStyle = '#0a1d42';
      ctx.lineWidth = 3;
      ctx.strokeRect(totX, botY, totW, 250);

      // Footer
      const fY = 1480;
      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(48, fY);
      ctx.lineTo(W - 48, fY);
      ctx.stroke();

      ctx.fillStyle = '#ea580c';
      ctx.font = '900 28px "Plus Jakarta Sans", Arial, sans-serif';
      ctx.fillText('Thanks For Your Business!', 48, fY + 52);

      ctx.fillStyle = '#334155';
      ctx.font = '600 18px "Plus Jakarta Sans", Arial, sans-serif';
      const ownerLine = [inv.ownerName ? 'Owner: ' + inv.ownerName : '', inv.ownerMobile ? 'Tel: ' + inv.ownerMobile : ''].filter(Boolean).join('   |   ');
      if (ownerLine) ctx.fillText(ownerLine, 48, fY + 88);
      if (inv.ownerEmail) ctx.fillText('Email: ' + inv.ownerEmail, 48, fY + 116);

      // Authorized Signature
      ctx.strokeStyle = '#0a1d42';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(W - 360, fY + 86);
      ctx.lineTo(W - 56, fY + 86);
      ctx.stroke();
      ctx.textAlign = 'center';
      ctx.fillStyle = '#0a1d42';
      ctx.font = '800 18px "Plus Jakarta Sans", Arial, sans-serif';
      ctx.fillText('AUTHORIZED SIGNATURE', W - 208, fY + 116);
      ctx.textAlign = 'left';

      return await new Promise((resolve) => canvas.toBlob(resolve, 'image/png', 0.95));
    }

    async function downloadInvoicePng(inv) {
      if (!inv) return;
      const blob = await generateInvoicePngBlob(inv);
      if (!blob) { toast('Invoice image banate waqt error aya.', 'error'); return; }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${inv.invoiceNo || 'Invoice'}_${inv.custName.replace(/[^a-zA-Z0-9]+/g, '_')}.png`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
      toast('Invoice Photo download ho gaya ✓', 'success');
    }

    async function shareInvoiceOnWhatsApp(inv) {
      if (!inv) return;
      const workSummary = inv.items.map(i => `• ${i.description} (${i.qty}x) = ${fmtRs(i.total)}`).join('\n');
      const bankSummary = inv.bankName === 'Cash'
        ? 'Payment: Cash'
        : `Bank: ${inv.bankName}${inv.bankAccountName ? `\nAccount: ${inv.bankAccountName}` : ''}${inv.bankIban ? `\nIBAN: ${inv.bankIban}` : ''}`;

      const caption = [
        `*${inv.shopName}*`,
        inv.shopTagline ? `_${inv.shopTagline}_` : '',
        `━━━━━━━━━━━━━━━━`,
        `*INVOICE:* ${inv.invoiceNo}`,
        `*Date:* ${formatShortDate(inv.invoiceDate)}`,
        `*Customer:* ${inv.custName}`,
        inv.custPhone ? `*Phone:* ${inv.custPhone}` : '',
        ``,
        `*Work Details:*`,
        workSummary,
        ``,
        `Sub Total: ${fmtRs(inv.subTotal)}`,
        inv.vatEnabled ? `VAT (15%): ${fmtRs(inv.vatAmount)}` : '',
        `*Grand Total: ${fmtRs(inv.grandTotal)}*`,
        `Advance Paid: ${fmtRs(inv.advancePaid)}`,
        `*Baqi / Remaining: ${fmtRs(inv.remainingBalance)}*`,
        ``,
        bankSummary,
        `━━━━━━━━━━━━━━━━`,
        `Thanks For Your Business!`
      ].filter(Boolean).join('\n');

      try {
        const blob = await generateInvoicePngBlob(inv);
        if (blob && navigator.share && navigator.canShare) {
          const fileName = `${inv.invoiceNo || 'Invoice'}.png`;
          const file = new File([blob], fileName, { type: 'image/png' });
          if (navigator.canShare({ files: [file] })) {
            await navigator.share({
              files: [file],
              title: `Invoice ${inv.invoiceNo} - ${inv.custName}`,
              text: caption
            });
            toast('Invoice WhatsApp / Share bhej diya gaya ✓', 'success');
            return;
          }
        }
        // Fallback for Desktop browsers: download Invoice PNG photo + open WhatsApp with customer details
        if (blob) {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `${inv.invoiceNo || 'Invoice'}_${inv.custName.replace(/[^a-zA-Z0-9]+/g, '_')}.png`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1500);
        }
      } catch (e) {}

      const phone = String(inv.custPhone || '').replace(/\D/g, '');
      let waPhone = phone;
      if (waPhone.startsWith('0') && waPhone.length === 11) waPhone = '92' + waPhone.slice(1);
      else if (waPhone.startsWith('05') && waPhone.length === 10) waPhone = '966' + waPhone.slice(1);
      const waUrl = waPhone
        ? `https://wa.me/${waPhone}?text=${encodeURIComponent(caption)}`
        : `https://wa.me/?text=${encodeURIComponent(caption)}`;
      const link = document.createElement('a');
      link.href = waUrl;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      document.body.appendChild(link);
      link.click();
      link.remove();
      toast('Invoice Photo download ho gaya aur WhatsApp khul gaya ✓', 'success');
    }

    // ========================
    // DIGIT BOXES, STEP-BY-STEP SIGNUP, LOGIN & 4-DIGIT PIN
    // ========================
    function renderDigitBoxes(group, count, currentValue = '', extraClass = '') {
      const clean = String(currentValue || '').replace(/\D/g, '').slice(0, count);
      return `
        <div class="digit-box-row">
          ${Array.from({ length: count }).map((_, i) => {
            const ch = clean[i] || '';
            return `<input
              type="text"
              inputmode="numeric"
              pattern="[0-9]*"
              maxlength="1"
              autocomplete="${group === 'signup-otp' ? 'one-time-code' : 'off'}"
              data-digit-group="${esc(group)}"
              data-digit-index="${i}"
              value="${esc(ch)}"
              aria-label="Digit ${i + 1}"
              class="otp-pin-box ${extraClass} ${ch ? 'filled' : ''}"
            />`;
          }).join('')}
        </div>
      `;
    }

    function readDigitGroup(group, count) {
      let out = '';
      for (let i = 0; i < count; i++) {
        const el = document.querySelector(`[data-digit-group="${group}"][data-digit-index="${i}"]`);
        out += (el ? String(el.value || '').replace(/\D/g, '').slice(0, 1) : '');
      }
      return out;
    }

    function renderSignupStepDots(step) {
      const labels = ['Name', 'Gmail', 'OTP', 'Password', 'Confirm'];
      return `
        <div class="mb-5">
          <div class="flex items-center justify-between gap-1">
            ${labels.map((lbl, idx) => {
              const sNum = idx + 1;
              const done = sNum < step;
              const active = sNum === step;
              return `
                <div class="flex flex-col items-center flex-1">
                  <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-extrabold border transition-all ${
                    done
                      ? 'bg-emerald-500 border-emerald-400 text-slate-950 shadow-sm shadow-emerald-500/40'
                      : active
                      ? 'bg-cyan-500/25 border-cyan-400 text-cyan-200 ring-4 ring-cyan-400/20'
                      : 'bg-white/5 border-white/15 text-sec'
                  }">${done ? '✓' : sNum}</div>
                  <span class="text-[10px] font-semibold mt-1 ${active ? 'text-cyan-300' : done ? 'text-emerald-300' : 'text-mut'}">${esc(lbl)}</span>
                </div>
                ${idx < labels.length - 1 ? `<div class="h-0.5 flex-1 -mt-4 rounded-full ${done ? 'bg-emerald-400' : 'bg-white/10'}"></div>` : ''}
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function renderCustomers() {
      const m = getMetrics();
      const q = (ui.searchQuery || '').toLowerCase();
      const list = state.customers.filter(c => {
        const st = getCustomerStats(c.id);
        const matchQ = !q || c.name.toLowerCase().includes(q) || (c.mobile || '').includes(q);
        const matchF = ui.customerFilter === 'all' || (ui.customerFilter === 'baqaya' ? st.baqaya > 0 : st.baqaya === 0);
        return matchQ && matchF;
      });
      return `
        <div class="space-y-4">
          <div class="flex flex-wrap items-center justify-between gap-2.5">
            <h1 class="text-xl font-extrabold">Customers (گاہک)</h1>
            <button type="button" data-modal="add-customer" class="px-4 h-10 rounded-xl btn-primary-grad text-xs font-bold whitespace-nowrap cursor-pointer">+ Add Customer</button>
          </div>
          <div class="glass-card rounded-2xl p-4 grid grid-cols-3 gap-3">
            <div><div class="text-xs text-sec">Total Bill</div><div class="text-base font-bold tabular-nums">${esc(fmtRs(m.custTotal))}</div></div>
            <div><div class="text-xs text-sec">Advance / Paid</div><div class="text-base font-bold text-emerald-400 tabular-nums">${esc(fmtRs(m.custReceived))}</div></div>
            <div><div class="text-xs text-sec">Remaining</div><div class="text-base font-bold text-amber-400 tabular-nums">${esc(fmtRs(m.custBaqaya))}</div></div>
          </div>
          <div class="flex flex-col sm:flex-row gap-2.5">
            <input id="global-search" type="search" value="${esc(ui.searchQuery)}" placeholder="Search customer name or phone..." class="flex-1 h-11 px-4 rounded-xl glass-input text-sm" />
            <div class="flex gap-1.5 glass-card p-1 rounded-xl">
              <button type="button" data-cust-filter="all" class="px-3 h-9 rounded-lg text-xs font-semibold cursor-pointer ${ui.customerFilter === 'all' ? 'bg-blue-600 text-white' : 'text-sec'}">All</button>
              <button type="button" data-cust-filter="baqaya" class="px-3 h-9 rounded-lg text-xs font-semibold cursor-pointer ${ui.customerFilter === 'baqaya' ? 'bg-amber-600 text-white' : 'text-sec'}">Remaining</button>
              <button type="button" data-cust-filter="clear" class="px-3 h-9 rounded-lg text-xs font-semibold cursor-pointer ${ui.customerFilter === 'clear' ? 'bg-emerald-600 text-white' : 'text-sec'}">Clear</button>
            </div>
          </div>
          ${list.length === 0 ? `
            <div class="glass-card rounded-3xl p-8 text-center">
              <p class="text-sm text-sec">No customers yet. Add your first customer &amp; work order.</p>
              <div class="flex justify-center mt-4">
                <button type="button" data-modal="add-customer" class="px-5 h-11 rounded-xl btn-primary-grad text-xs font-bold cursor-pointer">+ Add Customer</button>
              </div>
            </div>
          ` : `
            <div class="space-y-2.5">
              ${list.map(c => {
                const st = getCustomerStats(c.id);
                const custOrders = state.orders.filter(o => o.customerId === c.id);
                const latestOrd = custOrders.length ? custOrders[custOrders.length - 1] : null;
                return `
                  <div data-open-customer="${esc(c.id)}" class="w-full glass-card rounded-2xl p-4 text-left hover:border-cyan-400/50 transition-colors cursor-pointer space-y-2.5">
                    <div class="flex items-start justify-between gap-3">
                      <div class="min-w-0">
                        <div class="text-base font-bold truncate">${esc(c.name)}</div>
                        <div class="text-xs text-sec mt-0.5">📞 ${esc(c.mobile || 'No phone')}${c.address ? ' · ' + esc(c.address) : ''}</div>
                        ${latestOrd ? `
                          <div class="text-xs font-semibold text-cyan-300 mt-1 truncate">
                            🛠️ ${esc(latestOrd.itemName)}${latestOrd.description ? ' — ' + esc(latestOrd.description) : ''}
                          </div>
                        ` : ''}
                      </div>
                      <div class="flex items-center gap-2 shrink-0">
                        <button type="button" data-stop-prop data-print-cust="${esc(c.id)}" class="h-8 px-2.5 rounded-lg glass-card text-[11px] font-bold text-amber-300 hover:bg-white/10 cursor-pointer">Invoice</button>
                        <span class="text-xs text-cyan-400 font-semibold">Details →</span>
                      </div>
                    </div>
                    <div class="grid grid-cols-3 gap-2 pt-2 border-t border-white/10 text-xs">
                      <div><div class="text-mut">Total Bill</div><div class="font-bold tabular-nums">${esc(fmtRs(st.billed))}</div></div>
                      <div><div class="text-mut">Advance</div><div class="font-bold text-emerald-400 tabular-nums">${esc(fmtRs(st.received))}</div></div>

                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `}
        </div>
      `;

      const st = getCustomerStats(c.id);
      const orders = state.orders.filter(o => o.customerId === c.id).reverse();
      const generalPays = state.customerPayments.filter(p => p.customerId === c.id && !p.orderId).reverse();
      return `
        <div class="space-y-4">
          <div class="flex items-center justify-between gap-3">
            <button type="button" data-nav="customers" class="h-10 px-3 rounded-xl glass-card flex items-center gap-1.5 text-xs font-semibold cursor-pointer">${icon('back', 'w-4 h-4')} Customers</button>

              <button type="button" data-delete-customer="${esc(c.id)}" class="h-10 px-3 rounded-xl bg-rose-600/20 text-rose-300 border border-rose-500/30 text-xs font-semibold cursor-pointer">Delete</button>

            <div class="grid grid-cols-3 gap-3 mt-4 pt-3 border-t border-white/15">
              <div><div class="text-[11px] text-blue-100/80">Total Bill</div><div class="text-base font-bold tabular-nums">${esc(fmtRs(st.billed))}</div></div>
              <div><div class="text-[11px] text-blue-100/80">Total Advance Paid</div><div class="text-base font-bold text-emerald-300 tabular-nums">${esc(fmtRs(st.received))}</div></div>

                <div class="text-[11px] text-blue-100/80">Remaining Baqaya</div>
                <div class="text-base font-bold text-amber-300 tabular-nums">${esc(fmtRs(st.baqaya))}</div>
                ${st.extraPaid > 0 ? `<div class="text-[11px] font-bold text-rose-300 tabular-nums">Extra Paid: ${esc(fmtRs(st.extraPaid))}</div>` : ''}
              </div>
            </div>
            <div class="grid grid-cols-2 gap-3 mt-4">
              <button type="button" data-add-work-for="${esc(c.id)}" class="h-11 rounded-xl bg-white/15 hover:bg-white/25 font-semibold text-xs cursor-pointer">+ Add Work Order</button>
              <button type="button" data-receive-payment="${esc(c.id)}" class="h-11 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs cursor-pointer">+ Receive Wasooli</button>

                Delivered: 'bg-violet-500/20 text-violet-300 border-violet-400/40'
              };
              return `
                <div data-open-order="${esc(o.id)}" class="glass-card rounded-2xl p-4 space-y-2.5 hover:border-cyan-400/50 transition-colors cursor-pointer">

          ${generalPays.length > 0 ? `
