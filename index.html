        const method = fd.get('method') ? fd.get('method').toString() : 'Cash';
        const stName = state.staff.find(s => s.id === staffId)?.name || 'Staff';
        const txTitle = `${stName} (${logType === 'advance' ? 'Advance' : 'Salary - ' + forMonth})`;

        if (logId) {
          const lg = state.staffLogs.find(x => x.id === logId);
          if (lg) {
            lg.amount = amount; lg.date = date; lg.time = time; lg.note = note;
            if (logType !== 'advance') { lg.forMonth = forMonth; lg.method = method; }
            const tx = state.transactions.find(x => x.id === lg.txId || x.staffLogId === logId);
            if (tx) { tx.amount = amount; tx.date = date; tx.time = time; tx.title = txTitle; }
          }
          toast('Staff entry updated ✓', 'success');
        } else {
          const newLogId = uid('sl');
          const txId = uid('tx');
          state.staffLogs.push({ id: newLogId, staffId, type: logType, amount, date, time, note, forMonth: logType === 'advance' ? '' : forMonth, method, txId, createdAt: new Date().toISOString() });
          state.transactions.push({
            id: txId, type: 'expense', category: 'Salary', title: txTitle, amount, date, time, staffId, staffLogId: newLogId, createdAt: new Date().toISOString()
          });
          toast('Staff payment recorded ✓', 'success');
        }
        saveState(); closeModal(); render(); return;
      }

      if (f.id === 'modal-staff-salary-form') {
        const fd = new FormData(f);
        const staffId = fd.get('staffId').toString();
        const newSalary = Number(fd.get('newSalary') || 0);
        const effectiveDate = fd.get('effectiveDate').toString() || todayISO();
        const note = (fd.get('note') || '').toString().trim();
        const st = state.staff.find(x => x.id === staffId);
        if (!st) return;
        const previousSalary = Number(st.salary || 0);
        if (newSalary !== previousSalary) {
          state.salaryHistory = Array.isArray(state.salaryHistory) ? state.salaryHistory : [];
          state.salaryHistory.push({
            id: uid('shist'),
            staffId,
            previousSalary,
            newSalary,
            effectiveDate,
            note,
            updatedAt: new Date().toISOString()
          });
          st.salary = newSalary;
        }
        saveState(); closeModal(); render(); toast('Staff salary updated ✓ (Past history safe)', 'success'); return;
      }

      if (f.id === 'modal-committee-form') {
        const fd = new FormData(f);
        state.committees.push({
          id: uid('com'),
          name: fd.get('name').toString().trim(),
          monthlyAmount: Number(fd.get('monthlyAmount') || 0),
          totalMonths: Number(fd.get('totalMonths') || 10),
          paidMonths: 0,
          createdAt: new Date().toISOString()
        });
        saveState(); closeModal(); render(); toast('Committee added ✓', 'success'); return;
      }

      if (f.id === 'modal-set-pin-form') {
        const pin = readDigitGroup('set-pin-1', 4);
        const confirmPin = readDigitGroup('set-pin-2', 4);
        if (!/^\d{4}$/.test(pin)) { toast('4-Digit PIN mukammal likhein.', 'error'); return; }
        if (pin !== confirmPin) { toast('PINs match nahi ho rahe.', 'error'); return; }
        state.pinSecurity = { enabled: true, hash: await hashPassword(pin) };
        sessionStorage.setItem(PIN_UNLOCK_SESSION_KEY, state.session?.uid || state.session?.cloudUid || state.session?.id || '1');
        saveState();
        await flushCloudSync();
        closeModal();
        render();
        toast('4-Digit PIN Lock enabled ✓', 'success');
        return;
      }

      if (f.id === 'modal-chpass-form') {
        const fd = new FormData(f);
        const np = fd.get('newPass').toString();
        const cp = fd.get('confPass').toString();
        if (np !== cp) { toast('Passwords do not match.', 'error'); return; }
        const cloud = getCloud();
        if (!cloud) { toast('Cloud service not ready.', 'error'); return; }
        try {
          await cloud.updateUserPassword(np);
          closeModal(); toast('Password updated ✓', 'success');
        } catch (err) {
          toast(mapFirebaseAuthError(err), 'error');
        }
        return;
      }

      if (f.id === 'kyc-form') {
        if (state.blocked || state.kyc?.status === 'approved' || state.kyc?.status === 'duplicate') return;
        const rawMobile = (document.getElementById('kyc-mobile')?.value || '').trim();
        const rawCnic = (document.getElementById('kyc-cnic')?.value || '').trim();
        const cloud = getCloud();
        let digits13 = '';
        let formattedCnic = rawCnic;
        try {
          if (cloud) {
            digits13 = cloud.normalizeCnic13(rawCnic);
            formattedCnic = cloud.formatCnicDashed(digits13);
          } else {
            const cleaned = rawCnic.replace(/[\s-]/g, '');
            if (!/^\d{13}$/.test(cleaned)) throw new Error('CNIC 13 digits ka hona chahiye (e.g. 35202-1234567-1 ya 3520212345671).');
            digits13 = cleaned;
            formattedCnic = `${cleaned.slice(0, 5)}-${cleaned.slice(5, 12)}-${cleaned.slice(12)}`;
          }
        } catch (cnicErr) {
          toast(cnicErr?.message || '13 digit CNIC darj karein.', 'error');
          return;
        }
        const mobDigits = cloud ? cloud.normalizeMobileDigits(rawMobile) : rawMobile.replace(/\D/g, '');
        if (!mobDigits || mobDigits.length < 8 || mobDigits.length > 15) {
          toast('Valid Mobile Number likhein (1 Mobile = 1 Account).', 'error');
          return;
        }
        if (!state.kyc.frontPhoto || !state.kyc.backPhoto) {
          toast('CNIC Front aur Back dono photos upload karein.', 'error');
          return;
        }
        if (!state.kyc.selfiePhoto || !state.kyc.selfieConfirmed) {
          toast('Pehle Take Live Selfie ya Gallery Upload se apni Selfie photo lagayein.', 'error');
          return;
        }
        const activeUid = cloud?.auth?.currentUser?.uid || state.session?.uid || '';
        if (!cloud || !activeUid || !cloud?.auth?.currentUser) {
          toast('Security verification ke liye Internet aur Cloud Session zaroori hai. Dobara Sign in karke try karein.', 'error');
          return;
        }
        if (!navigator.onLine) {
          toast('Internet ON karein — 1 ID Card / 1 Mobile check online hota hai.', 'error');
          return;
        }
        try {
          await cloud.claimCnicForUser(digits13, activeUid);
          await cloud.claimMobileForUser(rawMobile, activeUid);
        } catch (claimErr) {
          toast(claimErr?.message || 'Ye CNIC ya Mobile Number pehle se kisi aur account par registered hai.', 'error');
          return;
        }
        state.kyc = {
          ...state.kyc,
          status: 'verifying',
          fullName: state.kyc.fullName || state.session?.name || '',
          cnic: formattedCnic,
          shopName: state.kyc.shopName || state.settings?.shopName || '',
          mobile: rawMobile,
          submittedAt: Date.now()
        };
        if (state.session && !state.session.mobile) state.session.mobile = rawMobile;
        saveState();
        await flushCloudSync();
        startKycCountdownTimer();
        render();
        toast('KYC Submitted - Verification me hai, 5 Minute Wait Karein', 'info');
        return;
      }
    });

    // Multi-Digit Box Handlers (OTP 6 boxes & PIN 4 boxes)
    document.addEventListener('keydown', (e) => {
      const t = e.target;
      if (!t || !t.hasAttribute || !t.hasAttribute('data-digit-group')) return;
      const group = t.getAttribute('data-digit-group');
      const idx = Number(t.getAttribute('data-digit-index') || 0);
      const boxes = Array.from(document.querySelectorAll(`[data-digit-group="${group}"]`));
      if (e.key === 'Backspace') {
        if (!t.value && idx > 0) {
          e.preventDefault();
          const prev = boxes[idx - 1];
          prev.value = '';
          prev.classList.remove('filled');
          prev.focus();
        } else {
          setTimeout(() => t.classList.toggle('filled', Boolean(t.value)), 0);
        }
      } else if (e.key === 'ArrowLeft' && idx > 0) {
        e.preventDefault();
        boxes[idx - 1].focus();
      } else if (e.key === 'ArrowRight' && idx < boxes.length - 1) {
        e.preventDefault();
        boxes[idx + 1].focus();
      }
    });

    document.addEventListener('paste', (e) => {
      const t = e.target;
      if (!t || !t.hasAttribute || !t.hasAttribute('data-digit-group')) return;
      const text = (e.clipboardData || window.clipboardData)?.getData('text') || '';
      const digits = text.replace(/\D/g, '');
      if (!digits) return;
      e.preventDefault();
      const group = t.getAttribute('data-digit-group');
      const startIdx = digits.length >= 4 && Number(t.getAttribute('data-digit-index') || 0) === 0 ? 0 : Number(t.getAttribute('data-digit-index') || 0);
      const boxes = Array.from(document.querySelectorAll(`[data-digit-group="${group}"]`));
      for (let k = 0; k < digits.length && (startIdx + k) < boxes.length; k++) {
        boxes[startIdx + k].value = digits[k];
        boxes[startIdx + k].classList.add('filled');
      }
      const nextPos = Math.min(boxes.length - 1, startIdx + digits.length);
      boxes[nextPos]?.focus();
      const val = readDigitGroup(group, boxes.length);
      if (group === 'signup-otp' && ui.signupData) ui.signupData.otpInput = val;
      if ((group === 'auth-pin' || group === 'lock-pin')) {
        ui.pinEntry = val;
        if (val.length === 4) verifyPinEntryCode(val);
      }
    });

    // Inputs & File Handlers
    document.addEventListener('input', (e) => {
      const t = e.target;
      if (t.hasAttribute && t.hasAttribute('data-digit-group')) {
        const group = t.getAttribute('data-digit-group');
        const idx = Number(t.getAttribute('data-digit-index') || 0);
        const boxes = Array.from(document.querySelectorAll(`[data-digit-group="${group}"]`));
        const clean = String(t.value || '').replace(/\D/g, '');
        if (clean.length > 1) {
          for (let k = 0; k < clean.length && (idx + k) < boxes.length; k++) {
            boxes[idx + k].value = clean[k];
            boxes[idx + k].classList.add('filled');
          }
          boxes[Math.min(boxes.length - 1, idx + clean.length)]?.focus();
        } else {
          t.value = clean;
          t.classList.toggle('filled', clean.length === 1);
          if (clean.length === 1 && idx < boxes.length - 1) {
            boxes[idx + 1].focus();
            boxes[idx + 1].select?.();
          } else if (clean.length === 1 && group === 'set-pin-1' && idx === boxes.length - 1) {
            document.querySelector('[data-digit-group="set-pin-2"][data-digit-index="0"]')?.focus();
          }
        }
        const combined = readDigitGroup(group, boxes.length);
        if (group === 'signup-otp' && ui.signupData) {
          ui.signupData.otpInput = combined;
        } else if (group === 'auth-pin' || group === 'lock-pin') {
          ui.pinEntry = combined;
          if (combined.length === 4) {
            verifyPinEntryCode(combined);
          }
        }
        return;
      }
      if (t.id === 'global-search') {
        ui.searchQuery = t.value;
        const pos = t.selectionStart;
        render();
        const el = document.getElementById('global-search');
        if (el) { el.focus(); el.setSelectionRange(pos, pos); }
        return;
      }
      if (t.id === 'record-search') {
        ui.recordSearch = t.value;
        const pos = t.selectionStart;
        render();
        const el = document.getElementById('record-search');
        if (el) { el.focus(); el.setSelectionRange(pos, pos); }
        return;
      }
      if (t.id === 'wo-total' || t.id === 'wo-adv') {
        updateWorkCalculator();
        return;
      }
      if (t.id === 'inv-no-input' || t.id === 'inv-date-input' || t.id === 'inv-cust-email') {
        if (ui.invoiceDraft) {
          if (t.id === 'inv-no-input') ui.invoiceDraft.invoiceNo = t.value;
          if (t.id === 'inv-date-input') ui.invoiceDraft.invoiceDate = t.value;
          if (t.id === 'inv-cust-email') ui.invoiceDraft.custEmail = t.value;
          refreshInvoiceDraftPreview();
        }
        return;
      }
      if (t.id === 'stk-qty' || t.id === 'stk-cost') {
        const q = Number(document.getElementById('stk-qty')?.value || 0);
        const c = Number(document.getElementById('stk-cost')?.value || 0);
        const vEl = document.getElementById('stk-val');
        if (vEl) vEl.textContent = fmtRs(q * c);
        return;
      }
      if (t.id === 'admin-user-search') {
        ui.adminSearch = t.value;
        const pos = t.selectionStart;
        render();
        const el = document.getElementById('admin-user-search');
        if (el) { el.focus(); el.setSelectionRange(pos, pos); }
        return;
      }
      if (t.id === 'kyc-cnic') {
        t.value = String(t.value || '').replace(/[^\d-]/g, '').slice(0, 15);
        if (state.kyc) state.kyc.cnic = t.value;
        return;
      }
    });

    document.addEventListener('change', async (e) => {
      const t = e.target;
      if (t.id === 'wo-cust') {
        const wrap = document.getElementById('wo-new-cust-wrap');
        if (wrap) wrap.classList.toggle('hidden', t.value !== '__new__');
        return;
      }
      if (t.id === 'settings-bank-select') {
        const bank = t.value;
        const bData = (state.settings.bankAccounts && state.settings.bankAccounts[bank]) || {};
        const accEl = document.getElementById('bank-acc-name');
        const ibanEl = document.getElementById('bank-acc-iban');
        const brEl = document.getElementById('bank-acc-branch');
        if (accEl) accEl.value = bData.accountName || '';
        if (ibanEl) ibanEl.value = bData.iban || '';
        if (brEl) brEl.value = bData.branchName || '';
        return;
      }
      if (t.id === 'inv-bank-select' || t.id === 'inv-vat-toggle' || t.id === 'inv-date-input') {
        if (ui.invoiceDraft) {
          if (t.id === 'inv-bank-select') ui.invoiceDraft.bankName = t.value;
          if (t.id === 'inv-vat-toggle') ui.invoiceDraft.vatEnabled = Boolean(t.checked);
          if (t.id === 'inv-date-input') ui.invoiceDraft.invoiceDate = t.value;
          refreshInvoiceDraftPreview();
        }
        return;
      }
      if (t.id === 'stk-sup-sel') {
        const wrap = document.getElementById('stk-new-sup-wrap');
        if (wrap) wrap.classList.toggle('hidden', t.value !== '__new__');
        return;
      }
      if (t.hasAttribute('data-order-status')) {
        const oid = t.getAttribute('data-order-status');
        const o = state.orders.find(x => x.id === oid);
        if (o) { o.status = t.value; saveState(); toast('Order status updated', 'success'); }
        return;
      }
      if (t.id === 'stk-cat-sel') {
        const minInput = document.getElementById('stk-min-qty');
        if (minInput) minInput.value = defaultLowStockLimit(t.value);
        return;
      }
      if (t.hasAttribute('data-stock-filter-sel')) {
        ui.stockFilter = t.value;
        render();
        return;
      }
      if (t.id === 'custom-logo-input' && t.files && t.files[0]) {
        const file = t.files[0];
        try {
          state.settings.customLogo = await compressImageFile(file, 220, 0.80);
          saveState();
          render();
          const synced = await flushCloudSync();
          toast(synced ? 'Custom Shop Logo saved & synced to Cloud ✓' : 'Custom Shop Logo saved ✓', 'success');
        } catch (err) {
          toast('Could not load logo image.', 'error');
        } finally {
          t.value = '';
        }
        return;
      }
      if (t.id === 'import-json-input' && t.files[0]) {
        importJsonBackup(t.files[0]);
        return;
      }
      if (t.id === 'kyc-front-file' && t.files[0]) {
        state.kyc.frontPhoto = await compressImageFile(t.files[0], 640, 0.72);
        saveState(); render(); return;
      }
      if (t.id === 'kyc-back-file' && t.files[0]) {
        state.kyc.backPhoto = await compressImageFile(t.files[0], 640, 0.72);
        saveState(); render(); return;
      }
      if (t.id === 'kyc-selfie-file' && t.files[0]) {
        state.kyc.selfiePhoto = await compressImageFile(t.files[0], 640, 0.72);
        state.kyc.selfieConfirmed = true;
        saveState(); render(); toast('Selfie Gallery se upload ho gayi ✓', 'success'); return;
      }
    });

    // Cloud Bridge + Offline/Online Auto Sync Listeners
    let cloudBridgeBound = false;
    function initCloudBridge() {
      const cloud = getCloud();
      if (!cloud || cloudBridgeBound) return;
      cloudBridgeBound = true;
      cloud.onAuthChange(async (fbUser) => {
        if (manualAuthFlow) return;
        if (fbUser) {
          await hydrateFromFirebaseUser(fbUser);
        } else {
          hydrateGeneration++;
          if (cloudSyncTimer) { clearTimeout(cloudSyncTimer); cloudSyncTimer = null; }
          ui.cloudHydrating = false;
          // If Firebase says signed out, clear active cloud session cleanly
          if (state.session && state.session.provider === 'firebase') {
            localStorage.removeItem(ACTIVE_UID_KEY);
            sessionStorage.removeItem(PIN_UNLOCK_SESSION_KEY);
            const remKeep = loadRememberMe();
            state = defaultData();
            state.rememberMe = remKeep;
            ui.pinLocked = false;
            ui.view = 'login';
            render();
          }
        }
      });
    }

    window.addEventListener('dk-cloud-ready', initCloudBridge);
    window.addEventListener('dk-drive-state', () => {
      if (ui.view === 'profile' || ui.view === 'settings') render();
    });
    window.addEventListener('online', () => {
      ui.syncStatus = 'pending';
      updateSyncStatusBadgeDom();
      flushCloudSync().then(() => maybeRunAutoDailyBackup());
      toast('Online ✓ Cloud sync shuru ho gaya', 'success');
    });
    window.addEventListener('offline', () => {
      ui.syncStatus = 'offline';
      updateSyncStatusBadgeDom();
      toast('Offline mode — data local save ho raha hai ⏳', 'info');
    });

    window.addEventListener('resize', positionPillSlider);
    setInterval(() => checkAutoArchive(true), 30000);

    // Startup
    migrateLegacyData();
    checkAutoArchive();
    checkKycAutoApprove();
    if (state.kyc && state.kyc.status === 'verifying') {
      startKycCountdownTimer();
    }
    initCloudBridge();
    render();
  })();
  </script>
</body>
</html>
