      `;
    }

    // ========================
    // STOCK MODULE (SEPARATE, FULL DETAIL)
    // ========================
    function renderStock() {
      const totalVal = state.stock.reduce((s, x) => s + (Number(x.qty || 0) * Number(x.cost || 0)), 0);
      const lowItems = getLowStockItems();
      const q = (ui.searchQuery || '').toLowerCase();

      return `
        <div class="space-y-4">
          <div class="flex items-center justify-between gap-3">
            <h1 class="text-xl font-extrabold">Stock Inventory</h1>
            <button type="button" data-modal="add-stock" class="px-4 h-11 rounded-xl btn-primary-grad text-xs font-bold whitespace-nowrap cursor-pointer">+ Add Stock</button>
          </div>

          <div class="grid grid-cols-3 gap-2.5 sm:gap-3">
            <div class="glass-card rounded-2xl p-3.5 sm:p-4">
              <div class="text-[11px] sm:text-xs text-sec">Total Stock Items</div>
              <div class="text-lg font-extrabold tabular-nums mt-1">${state.stock.length}</div>
            </div>
            <div class="glass-card rounded-2xl p-3.5 sm:p-4">
              <div class="text-[11px] sm:text-xs text-sec">Total Stock Value</div>
              <div class="text-base sm:text-lg font-extrabold text-cyan-300 tabular-nums mt-1 truncate">${esc(fmtRs(totalVal))}</div>
            </div>
            <div class="glass-card rounded-2xl p-3.5 sm:p-4 ${lowItems.length ? 'border-rose-500/60 bg-rose-950/30' : ''}">
              <div class="text-[11px] sm:text-xs text-sec">Low Stock Items</div>
              <div class="text-lg font-extrabold ${lowItems.length ? 'text-rose-400' : 'text-emerald-400'} tabular-nums mt-1">${lowItems.length}</div>
            </div>
          </div>

          <div class="flex flex-col sm:flex-row gap-2">
            <input id="global-search" type="search" value="${esc(ui.searchQuery)}" placeholder="Search item, category, or party..." class="flex-1 h-11 px-4 rounded-xl glass-input text-sm" />
            <select data-stock-filter-sel class="h-11 px-3 rounded-xl glass-input text-xs font-semibold">
              <option value="all" ${ui.stockFilter === 'all' ? 'selected' : ''}>All Stock</option>
              <option value="low" ${ui.stockFilter === 'low' ? 'selected' : ''}>Low / Out of Stock</option>
              ${STOCK_CATEGORIES.map(cat => `<option value="${esc(cat)}" ${ui.stockFilter === cat ? 'selected' : ''}>${esc(cat)}</option>`).join('')}
            </select>
          </div>

          ${(() => {
            const items = state.stock.filter(item => {
              const matchQ = !q || (item.item || '').toLowerCase().includes(q) || (item.category || '').toLowerCase().includes(q) || (item.supplierName || '').toLowerCase().includes(q);
              const low = isLowStock(item);
              const matchF = ui.stockFilter === 'all' || (ui.stockFilter === 'low' ? low : item.category === ui.stockFilter);
              return matchQ && matchF;
            });
            if (!items.length) {
              return `<div class="glass-card rounded-3xl p-8 text-center"><p class="text-sm text-sec">No stock items found. Tap + Add Stock to add Sheet, Hardware, Paint, Glue, or Accessories.</p><button type="button" data-modal="add-stock" class="mt-4 px-5 h-11 rounded-xl btn-primary-grad text-xs font-bold cursor-pointer">+ Add Stock Item</button></div>`;
            }
            return `<div class="space-y-3">${items.map(s => {
              const val = Number(s.qty || 0) * Number(s.cost || 0);
              const low = isLowStock(s);
              const st = getStockStatus(s);
              const badgeCls = st.tone === 'red'
                ? 'bg-rose-500/20 text-rose-300 border-rose-400/50'
                : st.tone === 'yellow'
                  ? 'bg-amber-500/20 text-amber-300 border-amber-400/50'
                  : 'bg-emerald-500/20 text-emerald-300 border-emerald-400/50';
              return `
                <div data-open-stock="${esc(s.id)}" class="glass-card rounded-2xl p-4 space-y-2.5 cursor-pointer hover:border-cyan-400/50 transition-colors ${low ? 'border-rose-500/80 bg-rose-950/35' : ''}">
                  <div class="flex items-start justify-between gap-2">
                    <div class="min-w-0">
                      <div class="flex flex-wrap items-center gap-2">
                        <span class="text-sm font-bold ${low ? 'text-rose-200' : ''}">${esc(s.item)}</span>
                        <span class="text-[11px] font-bold px-2 py-0.5 rounded-md border ${badgeCls}">${esc(st.label)}</span>
                      </div>
                      <div class="text-xs ${low ? 'text-rose-300' : 'text-sec'} mt-1">
                        ${esc(s.category)} ${s.supplierName ? '· Party: ' + esc(s.supplierName) : ''} · ${esc(formatDateTime(s.purchaseDate, s.purchaseTime, s.updatedAt))}
                      </div>
                    </div>
                    <div class="text-right shrink-0 tabular-nums">
                      <div class="text-sm font-extrabold ${low ? 'text-rose-300' : 'text-cyan-300'}">${esc(fmtRs(val))}</div>
                      <div class="text-[11px] text-sec">Rate: ${esc(fmtRs(s.cost))}/${esc(s.unit || 'Pcs')}</div>
                    </div>
                  </div>
                  <div class="grid grid-cols-3 gap-2 text-xs bg-white/5 rounded-xl px-3 py-2 tabular-nums">
                    <div><span class="text-mut">Available:</span> <strong class="${low ? 'text-rose-300' : 'text-white'}">${esc(s.qty)} ${esc(s.unit || 'Pcs')}</strong></div>
                    <div><span class="text-mut">Used:</span> <strong>${esc(s.usedQty || 0)}</strong></div>
                    <div class="text-right"><span class="text-mut">Limit:</span> <strong>${esc(s.minQty ?? 5)}</strong></div>
                  </div>
                  <div class="flex flex-wrap items-center justify-between gap-2 pt-1">
                    <div class="flex items-center gap-2">
                      <button type="button" data-use-stock="${esc(s.id)}" data-stop-prop class="px-3 h-9 rounded-xl bg-amber-500/20 hover:bg-amber-500/30 border border-amber-400/40 text-amber-200 text-xs font-bold cursor-pointer">- Use Stock</button>
                      <button type="button" data-restock-item="${esc(s.id)}" data-stop-prop class="px-3 h-9 rounded-xl bg-emerald-500/20 hover:bg-emerald-500/30 border border-emerald-400/40 text-emerald-200 text-xs font-bold cursor-pointer">+ Add</button>
                    </div>
                    <div class="flex items-center gap-3">
                      <button type="button" data-edit-stock="${esc(s.id)}" data-stop-prop class="text-xs text-cyan-400 hover:text-cyan-300 font-semibold px-2 py-1 cursor-pointer">Edit</button>
                      <button type="button" data-delete-stock="${esc(s.id)}" data-stop-prop class="text-xs text-rose-400 hover:text-rose-300 px-2 py-1 cursor-pointer">Delete</button>
                    </div>
                  </div>
                </div>
              `;
            }).join('')}</div>`;
          })()}
        </div>
      `;
    }

    function renderStockDetail() {
      const s = state.stock.find(x => x.id === ui.selectedStockId);
      if (!s) { ui.view = 'stock'; return renderStock(); }
      const st = getStockStatus(s);
      const val = Number(s.qty || 0) * Number(s.cost || 0);
      const sup = s.supplierId ? state.suppliers.find(x => x.id === s.supplierId) : state.suppliers.find(x => (x.name || '').toLowerCase() === (s.supplierName || '').toLowerCase());
      const history = [...(s.history || [])].reverse();
      return `
        <div class="space-y-4">
          <div class="flex items-center justify-between gap-2">
            <button type="button" data-nav="stock" class="h-10 px-3 rounded-xl glass-card flex items-center gap-1.5 text-xs font-semibold cursor-pointer">${icon('back', 'w-4 h-4')} Stock</button>
            <div class="flex items-center gap-2">
              <button type="button" data-edit-stock="${esc(s.id)}" class="h-10 px-3 rounded-xl glass-card text-xs font-semibold cursor-pointer">Edit</button>
              <button type="button" data-delete-stock="${esc(s.id)}" class="h-10 px-3 rounded-xl bg-rose-600/20 text-rose-300 border border-rose-500/30 text-xs font-semibold cursor-pointer">Delete</button>
            </div>
          </div>

          <div class="blue-hero-card rounded-3xl p-5 text-white space-y-3">
            <div class="flex items-start justify-between gap-2">
              <div>
                <div class="text-xs text-blue-100/80">${esc(s.category)} · Purchased: ${esc(formatDateTime(s.purchaseDate, s.purchaseTime, s.updatedAt))}</div>
                <h1 class="text-xl font-extrabold mt-0.5">${esc(s.item)}</h1>
                ${s.supplierName ? `<div class="text-xs text-cyan-200 mt-1">Party: ${sup ? `<button type="button" data-open-supplier="${esc(sup.id)}" class="underline font-semibold cursor-pointer">${esc(s.supplierName)}</button>` : esc(s.supplierName)}</div>` : ''}
              </div>
              <span class="px-2.5 py-1 rounded-lg text-xs font-bold ${st.tone === 'red' ? 'bg-rose-500 text-white' : st.tone === 'yellow' ? 'bg-amber-400 text-slate-950' : 'bg-emerald-400 text-slate-950'}">${esc(st.label)}</span>
            </div>

            <div class="grid grid-cols-3 gap-3 pt-3 border-t border-white/15 tabular-nums">
              <div><div class="text-[11px] text-blue-100/80">Total Liya (Initial)</div><div class="text-base font-bold">${esc(s.initialQty ?? s.qty)} ${esc(s.unit || 'Pcs')}</div></div>
              <div><div class="text-[11px] text-blue-100/80">Kitna Use Hua</div><div class="text-base font-bold text-amber-300">${esc(s.usedQty || 0)} ${esc(s.unit || 'Pcs')}</div></div>
              <div><div class="text-[11px] text-blue-100/80">Kitna Bacha</div><div class="text-base font-bold text-emerald-300">${esc(s.qty)} ${esc(s.unit || 'Pcs')}</div></div>
            </div>

            <div class="blue-inner-card rounded-2xl p-3 text-xs grid grid-cols-2 gap-2 tabular-nums">
              <div>Purchase Rate: <strong>${esc(fmtRs(s.cost))}</strong>/${esc(s.unit || 'Pcs')}</div>
              <div class="text-right">Stock Value: <strong class="text-amber-300">${esc(fmtRs(val))}</strong></div>
              ${s.sellingRate ? `<div>Use / Sale Rate: <strong>${esc(fmtRs(s.sellingRate))}</strong></div>` : '<div></div>'}
              <div class="text-right">Low Limit: <strong>${esc(s.minQty ?? 5)}</strong></div>
            </div>

            <div class="grid grid-cols-2 gap-3 pt-1">
              <button type="button" data-use-stock="${esc(s.id)}" class="h-11 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold text-xs cursor-pointer">- Use / Minus Stock</button>
              <button type="button" data-restock-item="${esc(s.id)}" class="h-11 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs cursor-pointer">+ Add Purchase Stock</button>
            </div>
          </div>

          <div class="glass-card rounded-3xl p-5 space-y-3">
            <h2 class="text-sm font-bold">Stock Movement History (${history.length})</h2>
            ${history.length === 0 ? `<p class="text-xs text-sec">No movement history yet.</p>` : history.map(h => `
              <div class="py-2.5 border-b border-white/10 last:border-0 flex items-center justify-between gap-2 text-xs">
                <div>
                  <div class="font-bold ${h.type === 'use' ? 'text-amber-300' : 'text-emerald-400'}">
                    ${h.type === 'use' ? 'Used / Minus' : 'Purchased / Added'} (${h.qtyDelta > 0 ? '+' : ''}${esc(h.qtyDelta)} ${esc(s.unit || 'Pcs')})
                  </div>
                  <div class="text-sec">${esc(formatDateTime(h.date, h.time))}${h.partyName ? ' · ' + esc(h.partyName) : ''}${h.note ? ' · ' + esc(h.note) : ''}</div>
                </div>
                <div class="text-right tabular-nums">
                  <div class="text-[11px] text-mut">Bacha</div>
                  <div class="font-bold">${esc(h.remaining)} ${esc(s.unit || 'Pcs')}</div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // ========================
    // PARTY MODULE (SEPARATE FROM STOCK)
    // ========================
    function renderParty() {
      const q = (ui.searchQuery || '').toLowerCase();
      const filtered = state.suppliers.filter(sup =>
        !q || (sup.name || '').toLowerCase().includes(q) || (sup.shopName || '').toLowerCase().includes(q) || (sup.mobile || '').includes(q)
      );
      const totals = state.suppliers.reduce((acc, sup) => {
        const st = getSupplierStats(sup.id);
        acc.total += st.total; acc.paid += st.paid; acc.rem += st.remaining;
        return acc;
      }, { total: 0, paid: 0, rem: 0 });

      return `
        <div class="space-y-4">
          <div class="flex items-center justify-between gap-3">
            <h1 class="text-xl font-extrabold">Supplier Parties</h1>
            <button type="button" data-modal="add-supplier" class="px-4 h-11 rounded-xl btn-primary-grad text-xs font-bold whitespace-nowrap cursor-pointer">+ Add Party</button>
          </div>

          <div class="glass-card rounded-2xl p-4 grid grid-cols-3 gap-3">
            <div><div class="text-xs text-sec">Total Purchase</div><div class="text-base font-bold tabular-nums">${esc(fmtRs(totals.total))}</div></div>
            <div><div class="text-xs text-sec">Total Paid</div><div class="text-base font-bold text-emerald-400 tabular-nums">${esc(fmtRs(totals.paid))}</div></div>
            <div><div class="text-xs text-sec">Total Baqaya</div><div class="text-base font-bold text-rose-400 tabular-nums">${esc(fmtRs(totals.rem))}</div></div>
          </div>

          <input id="global-search" type="search" value="${esc(ui.searchQuery)}" placeholder="Search party name, shop, or phone..." class="w-full h-11 px-4 rounded-xl glass-input text-sm" />

          ${filtered.length === 0 ? `
            <div class="glass-card rounded-3xl p-8 text-center">
              <p class="text-sm text-sec">No parties added yet. Add suppliers to track stock purchases, payments, and remaining baqaya.</p>
              <button type="button" data-modal="add-supplier" class="mt-4 px-5 h-11 rounded-xl btn-primary-grad text-xs font-bold cursor-pointer">+ Add Party</button>
            </div>
          ` : `
            <div class="space-y-2.5">
              ${filtered.map(sup => {
                const st = getSupplierStats(sup.id);
                return `
                  <button type="button" data-open-supplier="${esc(sup.id)}" class="w-full glass-card rounded-2xl p-4 text-left hover:border-cyan-400/50 transition-colors cursor-pointer space-y-2">
                    <div class="flex items-start justify-between gap-3">
                      <div class="min-w-0">
                        <div class="text-base font-bold truncate">${esc(sup.name)}</div>
                        <div class="text-xs text-sec mt-0.5">${sup.shopName ? esc(sup.shopName) + ' · ' : ''}${esc(sup.mobile || 'No phone')} · ${st.stockCount} stock item${st.stockCount === 1 ? '' : 's'}</div>
                      </div>
                      <span class="text-xs text-cyan-400 font-semibold shrink-0">Details →</span>
                    </div>
                    <div class="grid grid-cols-3 gap-2 pt-2 border-t border-white/10 text-xs tabular-nums">
                      <div><span class="text-mut">Purchase:</span> <strong>${esc(fmtRs(st.total))}</strong></div>
                      <div><span class="text-mut">Paid:</span> <strong class="text-emerald-400">${esc(fmtRs(st.paid))}</strong></div>
                      <div class="text-right"><span class="text-mut">Baqaya:</span> <strong class="${st.remaining > 0 ? 'text-rose-400' : 'text-emerald-400'}">${esc(fmtRs(st.remaining))}</strong></div>
                    </div>
                  </button>
                `;
              }).join('')}
            </div>
          `}
        </div>
      `;
    }

    function renderSupplierDetail() {
      const sup = state.suppliers.find(x => x.id === ui.selectedSupplierId);
      if (!sup) { ui.view = 'party'; return renderParty(); }
      const st = getSupplierStats(sup.id);
      const stockItems = getPartyStockItems(sup).reverse();
      const entries = state.supplierEntries.filter(e => e.supplierId === sup.id).reverse();
      const pays = [...(state.partyPayments || []).filter(p => p.supplierId === sup.id)].reverse();

      return `
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <button type="button" data-nav="party" class="h-10 px-3 rounded-xl glass-card flex items-center gap-1.5 text-xs font-semibold cursor-pointer">${icon('back', 'w-4 h-4')} Parties</button>
            <button type="button" data-delete-supplier="${esc(sup.id)}" class="h-10 px-3 rounded-xl bg-rose-600/20 text-rose-300 border border-rose-500/30 text-xs font-semibold cursor-pointer">Delete Party</button>
          </div>
          <div class="blue-hero-card rounded-3xl p-5 text-white">
            <div class="text-lg font-extrabold">${esc(sup.name)}</div>
            <div class="text-xs text-blue-100/85 mt-0.5">${sup.shopName ? esc(sup.shopName) + ' · ' : ''}${esc(sup.mobile || 'No phone')} ${sup.address ? '· ' + esc(sup.address) : ''}</div>
            <div class="grid grid-cols-3 gap-3 mt-4 pt-3 border-t border-white/15">
              <div><div class="text-[11px] text-blue-100/80">Total Purchase</div><div class="text-base font-bold tabular-nums">${esc(fmtRs(st.total))}</div></div>
              <div><div class="text-[11px] text-blue-100/80">Total Paid</div><div class="text-base font-bold text-emerald-300 tabular-nums">${esc(fmtRs(st.paid))}</div></div>
              <div><div class="text-[11px] text-blue-100/80">Total Baqaya</div><div class="text-base font-bold text-amber-300 tabular-nums">${esc(fmtRs(st.remaining))}</div></div>
            </div>
            <div class="grid grid-cols-2 gap-3 mt-4">
              <button type="button" data-add-party-payment="${esc(sup.id)}" class="h-11 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs cursor-pointer">+ Pay Party</button>
              <button type="button" data-add-supplier-entry="${esc(sup.id)}" class="h-11 rounded-xl bg-white/15 hover:bg-white/25 text-white font-bold text-xs cursor-pointer">+ Add Saman Bill</button>
            </div>
          </div>

          <div class="glass-card rounded-3xl p-5 space-y-2.5">
            <h2 class="text-sm font-bold">Stock Purchased from ${esc(sup.name)} (${stockItems.length})</h2>
            ${stockItems.length === 0 ? `<p class="text-xs text-sec">Is party se abhi koi stock item link nahi hai.</p>` : stockItems.map(s => {
              const pVal = s.purchaseTotal != null ? Number(s.purchaseTotal) : (Number(s.initialQty ?? s.qty ?? 0) * Number(s.cost || 0));
              return `
                <button type="button" data-open-stock="${esc(s.id)}" class="w-full py-2.5 border-b border-white/10 last:border-0 flex items-center justify-between text-xs text-left hover:bg-white/5 rounded-xl px-2 cursor-pointer">
                  <div>
                    <div class="font-bold text-sm">${esc(s.item)} <span class="text-xs font-normal text-sec">(${esc(s.category)})</span></div>
                    <div class="text-sec">${esc(s.initialQty ?? s.qty)} ${esc(s.unit || 'Pcs')} @ ${esc(fmtRs(s.cost))} · ${esc(formatDateTime(s.purchaseDate, s.purchaseTime, s.updatedAt))}</div>
                  </div>
                  <div class="text-right tabular-nums">
                    <div class="font-bold text-cyan-300">${esc(fmtRs(pVal))}</div>
                    <div class="text-[11px] text-sec">Available: ${esc(s.qty)}</div>
                  </div>
                </button>
              `;
            }).join('')}
          </div>

          <div class="glass-card rounded-3xl p-5 space-y-2.5">
            <h2 class="text-sm font-bold">Party Payment History (${pays.length})</h2>
            ${pays.length === 0 ? `<p class="text-xs text-sec">No payments recorded yet.</p>` : pays.map(p => `
              <div class="py-2.5 border-b border-white/10 last:border-0 flex items-center justify-between gap-2 text-xs">
                <div>
                  <div class="font-bold text-sm text-emerald-400 tabular-nums">${esc(fmtRs(p.amount))} <span class="text-xs font-semibold text-cyan-300">· ${esc(p.method || 'Cash')}</span></div>
                  <div class="text-sec">${esc(formatDateTime(p.date, p.time, p.createdAt))}${p.note ? ' · ' + esc(p.note) : ''}</div>
                </div>
                <div class="flex items-center gap-3">
                  <button type="button" data-edit-party-pay="${esc(p.id)}" class="text-cyan-400 font-semibold cursor-pointer">Edit</button>
                  <button type="button" data-delete-party-pay="${esc(p.id)}" class="text-rose-400 font-semibold cursor-pointer">Delete</button>
                </div>
              </div>
            `).join('')}
          </div>

          ${entries.length > 0 ? `
            <div class="glass-card rounded-3xl p-5 space-y-2.5">
              <h2 class="text-sm font-bold">Additional Saman Bills (${entries.length})</h2>
              ${entries.map(e => {
                const rem = Math.max(0, Number(e.amount || 0) - Number(e.paid || 0));
                return `
                  <div class="py-2.5 border-b border-white/10 last:border-0 flex items-center justify-between text-xs">
                    <div>
                      <div class="font-semibold text-sm">${esc(e.saman)}</div>

                `;
              }).join('')}
            </div>
          ` : ''}
        </div>
      `;
    }

                      <div><div class="text-mut">Advance (Month)</div><div class="font-bold text-amber-400 tabular-nums">${esc(fmtRs(monthAdvances))}</div></div>

    function renderStaffDetail() {
      const st = state.staff.find(x => x.id === ui.selectedStaffId);
      if (!st) { ui.view = 'staff'; return renderStaff(); }
      const mKey = currentMonthKey();
      const allLogs = state.staffLogs.filter(l => l.staffId === st.id);
      const advAsc = allLogs.filter(l => l.type === 'advance').sort((a, b) => ((a.date || '') + ' ' + (a.time || '')).localeCompare((b.date || '') + ' ' + (b.time || '')));
      const monthRun = {};
      const advWithBal = advAsc.map(l => {
        const lk = (l.date || todayISO()).slice(0, 7);
        monthRun[lk] = (monthRun[lk] || 0) + Number(l.amount || 0);
        const remBal = Math.max(0, Number(st.salary || 0) - monthRun[lk]);
        return { ...l, remainingAfter: remBal };
      }).reverse();

      const salLogs = allLogs.filter(l => l.type === 'salary').sort((a, b) => ((b.date || '') + ' ' + (b.time || '')).localeCompare((a.date || '') + ' ' + (a.time || '')));

      const monthAdvances = allLogs.filter(l => l.type === 'advance' && (l.date || '').startsWith(mKey)).reduce((s, l) => s + Number(l.amount || 0), 0);
      const monthPaid = allLogs.filter(l => l.type === 'salary' && (l.date || '').startsWith(mKey)).reduce((s, l) => s + Number(l.amount || 0), 0);
      const totalAllAdvances = advAsc.reduce((s, l) => s + Number(l.amount || 0), 0);
      const totalAllSalary = salLogs.reduce((s, l) => s + Number(l.amount || 0), 0);
      const netPayable = Math.max(0, Number(st.salary || 0) - monthAdvances);

      return `
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <button type="button" data-nav="staff" class="h-10 px-3 rounded-xl glass-card flex items-center gap-1.5 text-xs font-semibold cursor-pointer">${icon('back', 'w-4 h-4')} Staff</button>
            <button type="button" data-delete-staff="${esc(st.id)}" class="h-10 px-3 rounded-xl bg-rose-600/20 text-rose-300 border border-rose-500/30 text-xs font-semibold cursor-pointer">Delete Staff</button>
          </div>

          <div class="blue-hero-card rounded-3xl p-5 text-white space-y-4">
            <div>
              <div class="text-lg font-extrabold">${esc(st.name)}</div>
              <div class="text-xs text-blue-100/85">${esc(st.role || 'Staff')} · ${esc(st.mobile || 'No phone')}</div>
            </div>
            <div class="grid grid-cols-2 gap-3 pt-3 border-t border-white/15 tabular-nums">
              <div><div class="text-[11px] text-blue-100/80">Monthly Salary</div><div class="text-base font-bold">${esc(fmtRs(st.salary))}</div></div>
              <div><div class="text-[11px] text-blue-100/80">Advance (This Month)</div><div class="text-base font-bold text-amber-300">${esc(fmtRs(monthAdvances))}</div></div>
              <div><div class="text-[11px] text-blue-100/80">Salary Paid (Month)</div><div class="text-base font-bold text-cyan-300">${esc(fmtRs(monthPaid))}</div></div>
              <div><div class="text-[11px] text-blue-100/80">Net Payable</div><div class="text-base font-bold text-emerald-300">${esc(fmtRs(netPayable))}</div></div>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <button type="button" data-staff-action="${esc(st.id)}:advance" class="h-11 rounded-xl bg-white/15 hover:bg-white/25 font-bold text-xs cursor-pointer">- Give Advance</button>
              <button type="button" data-staff-action="${esc(st.id)}:salary" class="h-11 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs cursor-pointer">+ Pay Salary</button>
            </div>
          </div>

          <!-- Advance History Table (Latest First) -->
          <div class="glass-card rounded-3xl p-5 space-y-3">
            <div class="flex items-center justify-between">
              <h2 class="text-sm font-bold">Advance History (${advWithBal.length})</h2>
              <span class="text-xs font-bold text-amber-400 tabular-nums">Total: ${esc(fmtRs(totalAllAdvances))}</span>
            </div>
            ${advWithBal.length === 0 ? `<p class="text-xs text-sec">No advance taken yet.</p>` : `
              <div class="space-y-2.5">
                ${advWithBal.map(l => `
                  <div class="rounded-2xl bg-white/5 border border-white/10 p-3 text-xs space-y-1">
                    <div class="flex items-start justify-between gap-2">
                      <div>
                        <div class="font-bold text-sm text-amber-300 tabular-nums">${esc(fmtRs(l.amount))}</div>
                        <div class="text-sec">${esc(formatDateTime(l.date, l.time, l.createdAt))}${l.note ? ' · ' + esc(l.note) : ''}</div>
                      </div>
                      <div class="text-right tabular-nums">
                        <div class="text-[11px] text-mut">Remaining Balance</div>
                        <div class="font-bold text-emerald-400">${esc(fmtRs(l.remainingAfter))}</div>
                      </div>
                    </div>
                    <div class="flex justify-end gap-3 pt-1 border-t border-white/10">
                      <button type="button" data-edit-staff-log="${esc(l.id)}" class="text-cyan-400 font-semibold cursor-pointer">Edit</button>
                      <button type="button" data-delete-staff-log="${esc(l.id)}" class="text-rose-400 font-semibold cursor-pointer">Delete</button>
                    </div>
                  </div>
                `).join('')}
              </div>
            `}
          </div>

          <!-- Salary Payment History Table (Latest First) -->
          <div class="glass-card rounded-3xl p-5 space-y-3">
            <div class="flex items-center justify-between">
              <h2 class="text-sm font-bold">Salary Payment History (${salLogs.length})</h2>
              <span class="text-xs font-bold text-emerald-400 tabular-nums">Total: ${esc(fmtRs(totalAllSalary))}</span>
            </div>
            ${salLogs.length === 0 ? `<p class="text-xs text-sec">No salary payments recorded yet.</p>` : `
              <div class="space-y-2.5">
                ${salLogs.map(l => `
                  <div class="rounded-2xl bg-white/5 border border-white/10 p-3 text-xs space-y-1">
                    <div class="flex items-start justify-between gap-2">
                      <div>
                        <div class="font-bold text-sm text-emerald-400 tabular-nums">${esc(fmtRs(l.amount))} <span class="text-xs font-semibold text-cyan-300">· ${esc(l.method || 'Cash')}</span></div>
                        <div class="text-sec">${esc(formatDateTime(l.date, l.time, l.createdAt))}${l.note ? ' · ' + esc(l.note) : ''}</div>
                      </div>
                      <div class="text-right">
                        <div class="px-2 py-0.5 rounded-md bg-blue-500/20 text-cyan-200 font-semibold">${esc(l.forMonth || formatMonthLabel((l.date || todayISO()).slice(0, 7)))}</div>
                      </div>
                    </div>
                    <div class="flex justify-end gap-3 pt-1 border-t border-white/10">
                      <button type="button" data-edit-staff-log="${esc(l.id)}" class="text-cyan-400 font-semibold cursor-pointer">Edit</button>
                      <button type="button" data-delete-staff-log="${esc(l.id)}" class="text-rose-400 font-semibold cursor-pointer">Delete</button>
                    </div>
                  </div>
                `).join('')}
              </div>
            `}
          </div>
        </div>
      `;
    }

    // ========================
    // MESS MODULE (NO PRE-MADE ITEMS DROPDOWN)
    // ========================
    function renderMess() {
      const tDay = todayISO();
      const mKey = currentMonthKey();
      const list = [...(state.messEntries || [])].sort((a, b) => ((b.date || '') + ' ' + (b.time || '')).localeCompare((a.date || '') + ' ' + (a.time || '')));
      const todayTotal = list.filter(x => x.date === tDay).reduce((s, x) => s + Number(x.amount || 0), 0);
      const monthTotal = list.filter(x => (x.date || '').startsWith(mKey)).reduce((s, x) => s + Number(x.amount || 0), 0);
      const staffCount = state.staff.length;
      const perPerson = staffCount > 0 ? Math.round(monthTotal / staffCount) : monthTotal;

      return `
        <div class="space-y-4">
          <div class="flex items-center justify-between gap-3">
            <h1 class="text-xl font-extrabold">Workshop Mess (کھانا / چائے)</h1>
            <button type="button" data-modal="add-mess" class="px-4 h-11 rounded-xl btn-primary-grad text-xs font-bold whitespace-nowrap cursor-pointer">+ Add Mess</button>
          </div>

          <div class="grid grid-cols-3 gap-2.5 sm:gap-3">
            <div class="glass-card rounded-2xl p-3.5 sm:p-4">
              <div class="text-[11px] sm:text-xs text-sec">Today Mess Total</div>
              <div class="text-base sm:text-lg font-extrabold text-cyan-300 tabular-nums mt-1">${esc(fmtRs(todayTotal))}</div>
            </div>
            <div class="glass-card rounded-2xl p-3.5 sm:p-4">
              <div class="text-[11px] sm:text-xs text-sec">This Month Total</div>
              <div class="text-base sm:text-lg font-extrabold text-orange-400 tabular-nums mt-1">${esc(fmtRs(monthTotal))}</div>
            </div>
            <div class="glass-card rounded-2xl p-3.5 sm:p-4">
              <div class="text-[11px] sm:text-xs text-sec">Per Person Mess</div>
              <div class="text-base sm:text-lg font-extrabold text-emerald-400 tabular-nums mt-1">${esc(fmtRs(perPerson))}</div>
              <div class="text-[10px] text-mut mt-0.5">${staffCount > 0 ? `÷ ${staffCount} staff` : 'Add staff to split'}</div>
            </div>
          </div>

          ${list.length === 0 ? `
            <div class="glass-card rounded-3xl p-8 text-center">
              <p class="text-sm text-sec">No mess expenses recorded yet. Tap + Add Mess and type any item name.</p>
              <button type="button" data-modal="add-mess" class="mt-4 px-5 h-11 rounded-xl btn-primary-grad text-xs font-bold cursor-pointer">+ Add Mess Expense</button>
            </div>
          ` : `
            <div class="space-y-2.5">
              ${list.map(m => `
                <div class="glass-card rounded-2xl p-4 space-y-2 text-xs">
                  <div class="flex items-start justify-between gap-3">
                    <div class="min-w-0">
                      <div class="text-sm font-bold truncate">${esc(m.itemName)} ${m.qty ? `<span class="text-xs font-normal text-cyan-300">(${esc(m.qty)})</span>` : ''}</div>
                      <div class="text-sec mt-0.5">${esc(formatDateTime(m.date, m.time, m.createdAt))} · Paid by: <strong class="text-white">${esc(m.paidBy || 'Workshop / Owner')}</strong></div>
                      ${m.note ? `<div class="text-mut mt-0.5">${esc(m.note)}</div>` : ''}
                    </div>
                    <div class="text-right shrink-0">
                      <div class="text-base font-extrabold text-orange-400 tabular-nums">${esc(fmtRs(m.amount))}</div>
                    </div>
                  </div>
                  <div class="flex justify-end gap-3 pt-1.5 border-t border-white/10">
                    <button type="button" data-edit-mess="${esc(m.id)}" class="text-cyan-400 font-semibold cursor-pointer">Edit</button>
                    <button type="button" data-delete-mess="${esc(m.id)}" class="text-rose-400 font-semibold cursor-pointer">Delete</button>

          `}
        </div>
      `;

    // ========================
    // RENT MODULE (HOME + SHOP BOTH)
    // ========================
    function renderRent() {
      const mKey = currentMonthKey();
      const recs = state.rentRecords || [];
      const pays = state.rentPayments || [];

      const totalHomeRent = recs.filter(r => r.rentType === 'Home').reduce((s, r) => s + Number(r.monthlyAmount || 0), 0);
      const totalShopRent = recs.filter(r => r.rentType === 'Shop').reduce((s, r) => s + Number(r.monthlyAmount || 0), 0);
      const totalRentThisMonth = totalHomeRent + totalShopRent;
      const totalPaid = pays.filter(p => (p.date || '').startsWith(mKey)).reduce((s, p) => s + Number(p.amount || 0), 0);
      const totalBaqaya = recs.reduce((s, r) => {
        const paidRecMonth = pays.filter(p => p.rentId === r.id && (p.date || '').startsWith(mKey)).reduce((ps, p) => ps + Number(p.amount || 0), 0);
        return s + Math.max(0, Number(r.monthlyAmount || 0) - paidRecMonth);
      }, 0);

      const activeTab = ui.rentTab === 'Shop' ? 'Shop' : 'Home';
      const filteredRecs = recs.filter(r => r.rentType === activeTab);

      return `
        <div class="space-y-4">
          <div class="flex items-center justify-between gap-3">
            <h1 class="text-xl font-extrabold">Rent Management (گھر اور دکان)</h1>
            <button type="button" data-modal="add-rent" class="px-4 h-11 rounded-xl btn-primary-grad text-xs font-bold whitespace-nowrap cursor-pointer">+ Add Rent</button>
          </div>

          <div class="grid grid-cols-2 gap-2.5">
            <div class="glass-card rounded-2xl p-3.5">
              <div class="text-[11px] text-sec">Total Home Rent</div>
              <div class="text-sm font-extrabold text-cyan-300 tabular-nums mt-1">${esc(fmtRs(totalHomeRent))}</div>
            </div>
            <div class="glass-card rounded-2xl p-3.5">
              <div class="text-[11px] text-sec">Total Shop Rent</div>
              <div class="text-sm font-extrabold text-violet-300 tabular-nums mt-1">${esc(fmtRs(totalShopRent))}</div>
            </div>
            <div class="glass-card rounded-2xl p-3.5">
              <div class="text-[11px] text-sec">Rent This Month</div>
              <div class="text-sm font-extrabold tabular-nums mt-1">${esc(fmtRs(totalRentThisMonth))}</div>
            </div>
            <div class="glass-card rounded-2xl p-3.5">
              <div class="text-[11px] text-sec">Total Paid</div>
              <div class="text-sm font-extrabold text-emerald-400 tabular-nums mt-1">${esc(fmtRs(totalPaid))}</div>
            </div>
            <div class="glass-card rounded-2xl p-3.5 col-span-2">
              <div class="text-[11px] text-sec">Total Baqaya</div>
              <div class="text-sm font-extrabold ${totalBaqaya > 0 ? 'text-rose-400' : 'text-emerald-400'} tabular-nums mt-1">${esc(fmtRs(totalBaqaya))}</div>
            </div>
          </div>

          <div class="flex gap-1.5 glass-card p-1 rounded-xl w-fit">
            <button type="button" data-rent-tab="Home" class="px-4 h-9 rounded-lg text-xs font-bold cursor-pointer ${activeTab === 'Home' ? 'bg-blue-600 text-white' : 'text-sec'}">🏠 Home Rent</button>
            <button type="button" data-rent-tab="Shop" class="px-4 h-9 rounded-lg text-xs font-bold cursor-pointer ${activeTab === 'Shop' ? 'bg-blue-600 text-white' : 'text-sec'}">🏪 Shop Rent</button>
          </div>

          ${filteredRecs.length === 0 ? `
            <div class="glass-card rounded-3xl p-8 text-center">
              <p class="text-sm text-sec">No ${esc(activeTab)} Rent added yet. Tap + Add Rent to add a landlord &amp; monthly rent.</p>
              <button type="button" data-modal="add-rent" class="mt-4 px-5 h-11 rounded-xl btn-primary-grad text-xs font-bold cursor-pointer">+ Add ${esc(activeTab)} Rent</button>
            </div>
          ` : `
            <div class="space-y-3">
              ${filteredRecs.map(r => {
                const recPaysAsc = pays.filter(p => p.rentId === r.id).sort((a, b) => ((a.date || '') + ' ' + (a.time || '')).localeCompare((b.date || '') + ' ' + (b.time || '')));
                const monthPayMap = {};
                const recPaysWithBal = recPaysAsc.map(p => {
                  const pk = (p.date || todayISO()).slice(0, 7);
                  monthPayMap[pk] = (monthPayMap[pk] || 0) + Number(p.amount || 0);
                  const balAfter = Math.max(0, Number(r.monthlyAmount || 0) - monthPayMap[pk]);
                  return { ...p, balAfter };
                }).reverse();
                const paidThisMonth = monthPayMap[mKey] || 0;
                const remThisMonth = Math.max(0, Number(r.monthlyAmount || 0) - paidThisMonth);
                const isPaid = Number(r.monthlyAmount || 0) === 0 ? paidThisMonth > 0 : remThisMonth === 0;
                return `
                  <div class="glass-card rounded-3xl p-4 sm:p-5 space-y-3">
                    <div class="flex items-start justify-between gap-2">
                      <div>
                        <div class="flex flex-wrap items-center gap-2">
                          <span class="px-2 py-0.5 rounded-md text-[11px] font-bold ${r.rentType === 'Home' ? 'bg-cyan-500/20 text-cyan-300 border border-cyan-400/40' : 'bg-violet-500/20 text-violet-300 border border-violet-400/40'}">${esc(r.rentType)}</span>
                          <span class="text-base font-extrabold">${esc(r.title)}</span>
                          <span class="px-2 py-0.5 rounded-md text-[11px] font-bold ${isPaid ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-400/40' : 'bg-rose-500/20 text-rose-300 border border-rose-400/40'}">${isPaid ? 'Paid ✓' : 'Pending'}</span>
                        </div>
                        <div class="text-xs text-sec mt-1">Owner: ${esc(r.ownerName || 'Landlord')} ${r.dueDate ? '· Due: ' + esc(r.dueDate) : ''} · ${esc(formatDateTime(r.date, r.time, r.createdAt))}</div>
                        ${r.note ? `<div class="text-xs text-mut mt-0.5">${esc(r.note)}</div>` : ''}
                      </div>
                      <div class="text-right shrink-0 tabular-nums">
                        <div class="text-xs text-mut">Monthly Rent</div>
                        <div class="text-base font-extrabold">${esc(fmtRs(r.monthlyAmount))}</div>
                      </div>
                    </div>

                    <div class="grid grid-cols-3 gap-2 text-xs bg-white/5 rounded-2xl p-3 tabular-nums">
                      <div><span class="text-mut">Paid (Month):</span> <strong class="text-emerald-400">${esc(fmtRs(paidThisMonth))}</strong></div>
                      <div><span class="text-mut">Baqaya:</span> <strong class="${remThisMonth > 0 ? 'text-rose-400' : 'text-emerald-400'}">${esc(fmtRs(remThisMonth))}</strong></div>
                      <div class="text-right"><button type="button" data-pay-rent="${esc(r.id)}" class="px-3 h-8 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold cursor-pointer">+ Pay Rent</button></div>
                    </div>

                    <div class="flex justify-end gap-3 text-xs">
                      <button type="button" data-edit-rent="${esc(r.id)}" class="text-cyan-400 font-semibold cursor-pointer">Edit Rent</button>
                      <button type="button" data-delete-rent="${esc(r.id)}" class="text-rose-400 font-semibold cursor-pointer">Delete</button>
                    </div>

                    <div class="pt-2 border-t border-white/10 space-y-2">
                      <div class="text-xs font-bold text-sec">Payment History (${recPaysWithBal.length})</div>
                      ${recPaysWithBal.length === 0 ? `<p class="text-xs text-mut">No rent payments recorded yet.</p>` : recPaysWithBal.map(p => `
                        <div class="rounded-xl bg-white/5 border border-white/10 p-2.5 text-xs space-y-1">
                          <div class="flex items-start justify-between gap-2">
                            <div>
                              <div class="font-bold text-emerald-400 tabular-nums">${esc(fmtRs(p.amount))} <span class="text-cyan-300 font-semibold">· ${esc(p.method || 'Cash')}</span></div>
                              <div class="text-sec">${esc(formatDateTime(p.date, p.time, p.createdAt))}${p.note ? ' · ' + esc(p.note) : ''}</div>
                            </div>
                            <div class="text-right tabular-nums">
                              <div class="text-[10px] text-mut">Baqaya After</div>

    function formatLastBackupText() {
      const ts = Number(state.cloudMeta?.lastBackupAt || 0);
      if (!ts) return 'Abhi tak Cloud Backup nahi hua';
      const d = new Date(ts);
      const iso = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      const tm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
      return formatDateTime(iso, tm);
    }

    // ========================
    // MAIN SHELL & BOTTOM NAV (ONLY Home | Customers | Stock | Party | Profile, 430px MAX WIDTH)
    // ========================
    function renderShell() {
      const kycOk = isKycVerified();
      // Strictly gate Home and workshop pages until KYC is Verified
      const v = kycOk ? ui.view : 'kyc';
      let bodyHtml = '';
      if (!kycOk) bodyHtml = renderKyc();
      else if (v === 'home') bodyHtml = renderHome();
      else if (v === 'work' || v === 'customers') bodyHtml = renderCustomers();
      else if (v === 'customer-detail') bodyHtml = renderCustomerDetail();
      else if (v === 'order-detail') bodyHtml = renderOrderDetail();
      else if (v === 'stock') bodyHtml = renderStock();
      else if (v === 'stock-detail') bodyHtml = renderStockDetail();
      else if (v === 'party') bodyHtml = renderParty();
      else if (v === 'supplier-detail') bodyHtml = renderSupplierDetail();
      else if (v === 'staff') bodyHtml = renderStaff();
      else if (v === 'staff-detail') bodyHtml = renderStaffDetail();
      else if (v === 'committee') bodyHtml = renderExpenses('Committee');
      else if (v === 'mess') bodyHtml = renderMess();
      else if (v === 'diesel') bodyHtml = renderExpenses('Diesel');
      else if (v === 'rent') bodyHtml = renderRent();
      else if (v === 'expenses') bodyHtml = renderExpenses(null);
      else if (v === 'report') bodyHtml = renderReport();
      else if (v === 'payments') bodyHtml = renderPayments();
      else if (v === 'records') bodyHtml = renderRecords();
      else if (v === 'profile') bodyHtml = renderProfile();
      else if (v === 'kyc') bodyHtml = renderKyc();
      else if (v === 'settings') bodyHtml = renderSettings();
      else bodyHtml = renderHome();

      const navItems = [
        { id: 'home', label: 'Home', icon: 'home' },
        { id: 'customers', label: 'Customers', icon: 'users' },
        { id: 'stock', label: 'Stock', icon: 'stock' },
        { id: 'party', label: 'Party', icon: 'party' },
        { id: 'profile', label: 'Profile', icon: 'user' }
      ];

      return `
        <div class="min-h-screen ${kycOk ? 'pb-24' : 'pb-8'}">
          <main class="w-full px-3.5 pt-4">
            ${bodyHtml}
          </main>

          ${kycOk ? `
          <!-- 8) BOTTOM NAVIGATION - ALWAYS VISIBLE (CONSTRAINED TO 430px CENTERED) -->
          <nav class="nav-bar fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[430px] z-40 h-16 px-1">
            <div class="h-full grid grid-cols-5 items-center">
              ${navItems.map(n => {
                const active = v === n.id
                  || (n.id === 'customers' && (v === 'work' || v === 'customer-detail' || v === 'order-detail'))
                  || (n.id === 'stock' && v === 'stock-detail')
                  || (n.id === 'party' && v === 'supplier-detail')
                  || (n.id === 'profile' && v === 'kyc');
                return `
                  <button type="button" data-nav="${n.id}" class="h-14 flex flex-col items-center justify-center gap-0.5 cursor-pointer transition-colors ${active ? 'text-cyan-400' : 'text-sec hover:text-white'}">
                    ${icon(n.icon, 'w-5 h-5')}
                    <span class="text-[11px] font-semibold tracking-tight">${esc(n.label)}</span>
                  </button>
                `;
              }).join('')}
            </div>
          </nav>
          ` : ''}
        </div>
      `;
    }

    function render() {
      applyTheme();
      checkKycAutoApprove();
      const root = document.getElementById('app');
      if (!root) return;
      if (!state.session) {
        root.innerHTML = renderAuth();
      } else if (ui.pinLocked && state.pinSecurity?.enabled && state.pinSecurity?.hash) {
        root.innerHTML = renderPinLock();
      } else {
        root.innerHTML = renderShell();
      }
    }

      }

      m.innerHTML = `
        <div id="modal-backdrop" class="fixed inset-y-0 left-1/2 -translate-x-1/2 w-full max-w-[430px] z-50 bg-black/70 backdrop-blur-sm flex items-end justify-center p-0">
          <div class="w-full glass-strong rounded-t-3xl p-5 shadow-2xl max-h-[88vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-4">
              <h3 class="text-base font-extrabold">${esc(title)}</h3>
              <button type="button" data-close-modal aria-label="Close modal" class="w-9 h-9 rounded-xl glass-card flex items-center justify-center text-sm cursor-pointer">✕</button>
            </div>
            ${content}
          </div>
        </div>
      `;
    }

    function updateWorkCalculator() {
      const l = Number(document.getElementById('wo-len')?.value || 0);
      const w = Number(document.getElementById('wo-wid')?.value || 0);
      const q = Number(document.getElementById('wo-qty')?.value || 0);
      const r = Number(document.getElementById('wo-rate')?.value || 0);
      const adv = Number(document.getElementById('wo-adv')?.value || 0);
      const sqFt = l * w * q;
      const total = Math.round(sqFt * r);
      const rem = Math.max(0, total - adv);
      const extraPaid = Math.max(0, adv - total);
      const sqftEl = document.getElementById('wo-calc-sqft');
      const totEl = document.getElementById('wo-calc-total');
      const remEl = document.getElementById('wo-calc-rem');
      const extEl = document.getElementById('wo-calc-extra');
      if (sqftEl) sqftEl.textContent = `${Number(sqFt.toFixed(2))} sq.ft`;
      if (totEl) totEl.textContent = fmtRs(total);
      if (remEl) remEl.textContent = fmtRs(rem);
      if (extEl) {
        if (extraPaid > 0) {
          extEl.textContent = `Extra Paid: ${fmtRs(extraPaid)}`;
          extEl.classList.remove('hidden');
        } else {
          extEl.textContent = '';
          extEl.classList.add('hidden');
        }
      }
    }

    // ========================
    // GLOBAL EVENT DELEGATION
    // ========================
    document.addEventListener('click', async (e) => {
      const t = e.target;
      if (t.id === 'modal-backdrop' || t.closest('[data-close-modal]')) {
        closeModal();
        return;
      }

      const quickCustModal = t.closest('[data-quick-cust-modal]');
      if (quickCustModal) {
        if (!isKycVerified()) { ui.view = 'kyc'; render(); toast('Pehle KYC Verification mukammal karein.', 'info'); return; }
        const mType = quickCustModal.getAttribute('data-quick-cust-modal');
        ui.view = 'customers';
        ui.searchQuery = '';
        render();
        openModal(mType);
        return;
      }

      const navBtn = t.closest('[data-nav]');
      if (navBtn) {
        const target = navBtn.getAttribute('data-nav');
        if (!isKycVerified() && target !== 'kyc') {
          ui.view = 'kyc';
          render();
          toast('Home aur baaki pages KYC Verify hone ke baad khulenge.', 'info');
          return;
        }
        ui.view = target === 'work' ? 'customers' : target;
        ui.searchQuery = '';
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      const modalBtn = t.closest('[data-modal]');
      if (modalBtn) {
        const mType = modalBtn.getAttribute('data-modal');

        if (mType === 'set-pin') {
          setTimeout(() => document.querySelector('[data-digit-group="set-pin-1"][data-digit-index="0"]')?.focus(), 40);

        return;
      }

      // Specific inner actions BEFORE card-open handlers so buttons inside cards never leak into card clicks
      const addOrdPay = t.closest('[data-add-order-payment]');
      if (addOrdPay) {
        openModal('add-order-payment', { orderId: addOrdPay.getAttribute('data-add-order-payment') });
        return;
      }
      const editOrdPay = t.closest('[data-edit-order-pay]');
      if (editOrdPay) {
        openModal('edit-order-payment', { paymentId: editOrdPay.getAttribute('data-edit-order-pay') });
        return;
      }
      const delOrdPay = t.closest('[data-delete-order-pay]');
      if (delOrdPay) {
        const pid = delOrdPay.getAttribute('data-delete-order-pay');
        const pay = state.customerPayments.find(p => p.id === pid);
        if (pay) {
          state.customerPayments = state.customerPayments.filter(p => p.id !== pid);
          state.transactions = state.transactions.filter(tx => tx.id !== pay.txId && tx.orderPayId !== pid);
          if (pay.orderId) recalcOrderTotals(pay.orderId);
          saveState(); render(); toast('Payment deleted', 'info');
        }
        return;
      }

      const useStk = t.closest('[data-use-stock]');
      if (useStk) { openModal('use-stock', { stockId: useStk.getAttribute('data-use-stock') }); return; }

      const restockBtn = t.closest('[data-restock-item]');
      if (restockBtn) { openModal('restock-item', { stockId: restockBtn.getAttribute('data-restock-item') }); return; }

      const editStk = t.closest('[data-edit-stock]');
      if (editStk) { openModal('edit-stock', { stockId: editStk.getAttribute('data-edit-stock') }); return; }

      const delStk = t.closest('[data-delete-stock]');
      if (delStk) {
        const id = delStk.getAttribute('data-delete-stock');
        state.stock = state.stock.filter(s => s.id !== id);
        if (ui.selectedStockId === id) { ui.selectedStockId = null; ui.view = 'stock'; }
        saveState(); render(); toast('Stock item removed', 'info'); return;
      }

      const staffAct = t.closest('[data-staff-action]');
      if (staffAct) {
        const [staffId, actionType] = staffAct.getAttribute('data-staff-action').split(':');
        const st = state.staff.find(x => x.id === staffId);
        const mKey = currentMonthKey();
        const adv = state.staffLogs.filter(l => l.staffId === staffId && l.type === 'advance' && (l.date || '').startsWith(mKey)).reduce((s, l) => s + Number(l.amount || 0), 0);
        const paid = state.staffLogs.filter(l => l.staffId === staffId && l.type === 'salary' && (l.date || '').startsWith(mKey)).reduce((s, l) => s + Number(l.amount || 0), 0);
        const suggested = actionType === 'salary' ? Math.max(0, Number(st?.salary || 0) - adv - paid) : '';
        openModal('staff-action', { staffId, actionType, suggested });
        return;
      }

      const editStfLog = t.closest('[data-edit-staff-log]');
      if (editStfLog) { openModal('edit-staff-log', { logId: editStfLog.getAttribute('data-edit-staff-log') }); return; }

      const delStfLog = t.closest('[data-delete-staff-log]');
      if (delStfLog) {
        const lid = delStfLog.getAttribute('data-delete-staff-log');
        const lg = state.staffLogs.find(l => l.id === lid);
        if (lg) {
          state.staffLogs = state.staffLogs.filter(l => l.id !== lid);
          state.transactions = state.transactions.filter(tx => tx.id !== lg.txId && tx.staffLogId !== lid);
          saveState(); render(); toast('Staff log deleted', 'info');
        }
        return;
      }

      const delStf = t.closest('[data-delete-staff]');
      if (delStf) {
        const id = delStf.getAttribute('data-delete-staff');
        state.staff = state.staff.filter(s => s.id !== id);
        state.staffLogs = state.staffLogs.filter(l => l.staffId !== id);
        state.transactions = state.transactions.filter(tx => tx.staffId !== id);
        if (ui.selectedStaffId === id) { ui.selectedStaffId = null; ui.view = 'staff'; }
        saveState(); render(); toast('Staff removed', 'info'); return;
      }

      const addPartyPay = t.closest('[data-add-party-payment]');
      if (addPartyPay) { openModal('add-party-payment', { supplierId: addPartyPay.getAttribute('data-add-party-payment') }); return; }

      const editPartyPay = t.closest('[data-edit-party-pay]');
      if (editPartyPay) { openModal('edit-party-payment', { partyPaymentId: editPartyPay.getAttribute('data-edit-party-pay') }); return; }

      const delPartyPay = t.closest('[data-delete-party-pay]');
      if (delPartyPay) {
        const pid = delPartyPay.getAttribute('data-delete-party-pay');
        const pp = (state.partyPayments || []).find(p => p.id === pid);
        if (pp) {
          state.partyPayments = state.partyPayments.filter(p => p.id !== pid);
          state.transactions = state.transactions.filter(tx => tx.id !== pp.txId && tx.partyPayId !== pid);
          saveState(); render(); toast('Party payment deleted', 'info');
        }
        return;
      }

      const editMess = t.closest('[data-edit-mess]');
      if (editMess) { openModal('edit-mess', { messId: editMess.getAttribute('data-edit-mess') }); return; }

      const delMess = t.closest('[data-delete-mess]');
      if (delMess) {
        const mid = delMess.getAttribute('data-delete-mess');
        const me = (state.messEntries || []).find(x => x.id === mid);
        state.messEntries = (state.messEntries || []).filter(x => x.id !== mid);
        state.transactions = state.transactions.filter(tx => tx.messId !== mid && (!me || tx.id !== me.txId));
        saveState(); render(); toast('Mess entry deleted', 'info'); return;
      }

      const rentTabBtn = t.closest('[data-rent-tab]');
      if (rentTabBtn) { ui.rentTab = rentTabBtn.getAttribute('data-rent-tab'); render(); return; }

      const payRentBtn = t.closest('[data-pay-rent]');
      if (payRentBtn) { openModal('pay-rent', { rentId: payRentBtn.getAttribute('data-pay-rent') }); return; }

      const editRentBtn = t.closest('[data-edit-rent]');
      if (editRentBtn) { openModal('edit-rent', { rentId: editRentBtn.getAttribute('data-edit-rent') }); return; }

      const delRentBtn = t.closest('[data-delete-rent]');
      if (delRentBtn) {
        const rid = delRentBtn.getAttribute('data-delete-rent');
        state.rentRecords = (state.rentRecords || []).filter(r => r.id !== rid);
        state.rentPayments = (state.rentPayments || []).filter(p => p.rentId !== rid);
        state.transactions = state.transactions.filter(tx => tx.rentId !== rid);
        saveState(); render(); toast('Rent record deleted', 'info'); return;
      }

      const editRentPay = t.closest('[data-edit-rent-pay]');
      if (editRentPay) { openModal('edit-rent-payment', { rentPaymentId: editRentPay.getAttribute('data-edit-rent-pay') }); return; }

      const delRentPay = t.closest('[data-delete-rent-pay]');
      if (delRentPay) {
        const rpid = delRentPay.getAttribute('data-delete-rent-pay');
        const rp = (state.rentPayments || []).find(p => p.id === rpid);
        state.rentPayments = (state.rentPayments || []).filter(p => p.id !== rpid);
        state.transactions = state.transactions.filter(tx => tx.rentPaymentId !== rpid && (!rp || tx.id !== rp.txId));
        saveState(); render(); toast('Rent payment deleted', 'info'); return;
      }

      const addWorkFor = t.closest('[data-add-work-for]');
      if (addWorkFor) { openModal('add-work', { customerId: addWorkFor.getAttribute('data-add-work-for') }); return; }

      const recPay = t.closest('[data-receive-payment]');
      if (recPay) { openModal('receive-payment', { customerId: recPay.getAttribute('data-receive-payment') }); return; }

      const addExpCat = t.closest('[data-add-expense-cat]');
      if (addExpCat) { openModal('add-expense', { category: addExpCat.getAttribute('data-add-expense-cat') }); return; }

      const addSupEnt = t.closest('[data-add-supplier-entry]');
      if (addSupEnt) { openModal('add-supplier-entry', { supplierId: addSupEnt.getAttribute('data-add-supplier-entry') }); return; }

      const payComm = t.closest('[data-pay-committee]');
      if (payComm) {
        const cid = payComm.getAttribute('data-pay-committee');
        const cm = state.committees.find(x => x.id === cid);
        if (cm) {
          cm.paidMonths = (cm.paidMonths || 0) + 1;
          state.transactions.push({
            id: uid('tx'),
            type: 'expense',
            category: 'Committee',
            title: `Committee Installment: ${cm.name}`,
            amount: Number(cm.monthlyAmount),
            date: todayISO(),
            committeeId: cm.id,
            createdAt: new Date().toISOString()
          });
          saveState();
          render();
          toast('Committee installment paid ✓', 'success');
        }
        return;
      }

      const stkAdj = t.closest('[data-stock-adj]');
      if (stkAdj) {
        const [sid, delta] = stkAdj.getAttribute('data-stock-adj').split(':');
        const item = state.stock.find(x => x.id === sid);
        if (item) {
          item.qty = Math.max(0, Number(item.qty || 0) + Number(delta));
          item.history = item.history || [];
          item.history.push({ id: uid('sh'), type: 'purchase', qtyDelta: Number(delta), remaining: item.qty, rate: Number(item.cost || 0), date: todayISO(), time: nowTime(), partyName: item.supplierName || '', note: 'Quick Restock' });
          saveState();
          render();
        }
        return;
      }

      const delOrd = t.closest('[data-delete-order]');
      if (delOrd) {
        const id = delOrd.getAttribute('data-delete-order');
        state.orders = state.orders.filter(o => o.id !== id);
        state.customerPayments = state.customerPayments.filter(p => p.orderId !== id);
        state.transactions = state.transactions.filter(tx => tx.orderId !== id);
        if (ui.selectedOrderId === id) { ui.selectedOrderId = null; ui.view = ui.selectedCustomerId ? 'customer-detail' : 'customers'; }
        saveState(); render(); toast('Order deleted', 'info'); return;
      }

      const delCust = t.closest('[data-delete-customer]');
      if (delCust) {
        const id = delCust.getAttribute('data-delete-customer');
        state.customers = state.customers.filter(c => c.id !== id);
        state.orders = state.orders.filter(o => o.customerId !== id);
        state.customerPayments = state.customerPayments.filter(p => p.customerId !== id);
        state.transactions = state.transactions.filter(tx => tx.customerId !== id);
        ui.view = 'customers';
        saveState(); render(); toast('Customer deleted', 'info'); return;
      }

      const delSup = t.closest('[data-delete-supplier]');
      if (delSup) {
        const id = delSup.getAttribute('data-delete-supplier');
        state.suppliers = state.suppliers.filter(s => s.id !== id);
        state.supplierEntries = state.supplierEntries.filter(e => e.supplierId !== id);
        state.partyPayments = (state.partyPayments || []).filter(p => p.supplierId !== id);
        state.transactions = state.transactions.filter(tx => tx.supplierId !== id);
        ui.view = 'party';
        saveState(); render(); toast('Party removed', 'info'); return;
      }

      const delTx = t.closest('[data-delete-tx]');
      if (delTx) {
        const tid = delTx.getAttribute('data-delete-tx');
        const tx = state.transactions.find(x => x.id === tid);
        state.transactions = state.transactions.filter(x => x.id !== tid);
        if (tx) {
          if (tx.messId) state.messEntries = (state.messEntries || []).filter(m => m.id !== tx.messId && m.txId !== tid);
          if (tx.rentPaymentId) state.rentPayments = (state.rentPayments || []).filter(p => p.id !== tx.rentPaymentId && p.txId !== tid);
          if (tx.partyPayId) state.partyPayments = (state.partyPayments || []).filter(p => p.id !== tx.partyPayId && p.txId !== tid);
          if (tx.staffLogId) state.staffLogs = state.staffLogs.filter(l => l.id !== tx.staffLogId && l.txId !== tid);
          if (tx.orderPayId) {
            const pay = state.customerPayments.find(p => p.id === tx.orderPayId);
            state.customerPayments = state.customerPayments.filter(p => p.id !== tx.orderPayId && p.txId !== tid);
            if (pay && pay.orderId) recalcOrderTotals(pay.orderId);
          }
        }
        saveState(); render(); toast('Entry deleted', 'info'); return;
      }

      const shareWa = t.closest('[data-share-wa]');
      if (shareWa) { shareWhatsAppKhata(shareWa.getAttribute('data-share-wa') || null); return; }

      const printCust = t.closest('[data-print-cust]');
      if (printCust) { openModal('print-cust-bill', { customerId: printCust.getAttribute('data-print-cust') }); return; }

      const custF = t.closest('[data-cust-filter]');
      if (custF) { ui.customerFilter = custF.getAttribute('data-cust-filter'); render(); return; }

      const payF = t.closest('[data-pay-filter]');
      if (payF) { ui.paymentFilter = payF.getAttribute('data-pay-filter'); render(); return; }

      const themeBtn = t.closest('[data-set-theme]');
      if (themeBtn) {
        state.settings.theme = themeBtn.getAttribute('data-set-theme');
        saveState(); render(); toast('Theme updated', 'success'); return;
      }

      // Skip card-open navigation if interacting with form controls or explicit stop-prop elements
      if (!t.closest('select, input, textarea, [data-stop-prop]')) {
        const ordOpen = t.closest('[data-open-order]');
        if (ordOpen) {
          ui.selectedOrderId = ordOpen.getAttribute('data-open-order');
          ui.view = 'order-detail';
          render();
          window.scrollTo({ top: 0, behavior: 'smooth' });
          return;
        }
        const stkOpen = t.closest('[data-open-stock]');
        if (stkOpen) {
          ui.selectedStockId = stkOpen.getAttribute('data-open-stock');
          ui.view = 'stock-detail';
          render();
          window.scrollTo({ top: 0, behavior: 'smooth' });
          return;
        }
        const stfOpen = t.closest('[data-open-staff]');
        if (stfOpen) {
          ui.selectedStaffId = stfOpen.getAttribute('data-open-staff');
          ui.view = 'staff-detail';
          render();
          window.scrollTo({ top: 0, behavior: 'smooth' });
          return;
        }
      }

      const custOpen = t.closest('[data-open-customer]');
      if (custOpen) {
        ui.selectedCustomerId = custOpen.getAttribute('data-open-customer');
        ui.view = 'customer-detail';
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      const supOpen = t.closest('[data-open-supplier]');
      if (supOpen) {
        ui.selectedSupplierId = supOpen.getAttribute('data-open-supplier');
        ui.view = 'supplier-detail';
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      if (t.closest('[data-back-suppliers]')) {
        ui.view = 'party';
        render();
        return;
      }

      const pinDigitBtn = t.closest('[data-pin-digit]');
      if (pinDigitBtn) {
        if (ui.pinEntry.length < 4) {
          ui.pinEntry += pinDigitBtn.getAttribute('data-pin-digit');
          if (ui.pinEntry.length === 4) {
            await verifyPinEntryCode(ui.pinEntry);
          } else {
            render();
          }
        }
        return;
      }

      const actEl = t.closest('[data-action]');
      if (!actEl) return;
      const act = actEl.getAttribute('data-action');

      if (act === 'toggle-pass') {
        ui.showPass = !ui.showPass;
        const passInput = document.getElementById('login-password') || document.getElementById('su-step-pass') || document.getElementById('su-step-confirm');
        if (passInput) {
          passInput.type = ui.showPass ? 'text' : 'password';
          actEl.innerHTML = ui.showPass ? icon('eyeOff', 'w-5 h-5') : icon('eye', 'w-5 h-5');
        } else {
          render();
        }
      }
      else if (act === 'go-signup') {
        ui.authMode = 'signup';
        ui.signupStep = 1;
        ui.signupData = newSignupData();
        ui.cloudNotice = '';
        render();
        document.getElementById('su-step-name')?.focus();
      }
      else if (act === 'signup-back') {
        const curStep = Number(ui.signupStep || 1);
        if (ui.signupData) ui.signupData.error = '';
        if (curStep <= 1) {
          ui.authMode = 'login';
          ui.signupStep = 1;
          ui.signupData = newSignupData();
        } else {
          ui.signupStep = curStep - 1;
        }
        render();
      }
      else if (act === 'signup-resend-otp') {
        const sd = ui.signupData || newSignupData();
        sd.error = '';
        ui.authLoading = true;
        render();
        try {
          const otp = await sendSignupEmailOtp(sd.email);
          sd.otpCode = otp;
          sd.otpSentTo = sd.email;
          sd.otpSentAt = Date.now();
          sd.otpInput = '';
          sd.otpVerified = false;
          ui.authLoading = false;
          render();
          document.querySelector('[data-digit-group="signup-otp"][data-digit-index="0"]')?.focus();
          toast('Naya 6-digit OTP aapke Gmail par bhej diya gaya hai ✓', 'success');
        } catch (err) {
          ui.authLoading = false;
          sd.error = err?.message || 'OTP send karne me masla aya.';
          render();
          toast(sd.error, 'error');
        }
      }
      else if (act === 'go-login') {
        ui.authMode = 'login';
        ui.cloudNotice = '';
        ui.pinEntry = '';
        ui.signupStep = 1;
        render();
      }
      else if (act === 'go-forgot') { ui.authMode = 'forgot'; ui.cloudNotice = ''; render(); }
      else if (act === 'login-with-pin') {
        const pinMeta = loadLastPinMeta();
        if (pinMeta && pinMeta.pinHash) {
          ui.authMode = 'pin';
          ui.pinEntry = '';
          ui.pinErrorCount = 0;
          render();
          document.querySelector('[data-digit-group="auth-pin"][data-digit-index="0"]')?.focus();
        } else {
          ui.promptPinAfterLogin = true;
          toast('Abhi 4-Digit PIN set nahi hai. Pehle Email/Password se Sign in karein, phir PIN set karne ka option aayega.', 'info');
          document.getElementById('login-email')?.focus();
        }
      }
      else if (act === 'verify-pin-submit') {
        const code = readDigitGroup('auth-pin', 4);
        if (code.length < 4) { toast('4-Digit PIN mukammal likhein.', 'error'); return; }
        await verifyPinEntryCode(code);
      }
      else if (act === 'open-set-pin-from-prompt') {
        closeModal();
        openModal('set-pin');
        setTimeout(() => document.querySelector('[data-digit-group="set-pin-1"][data-digit-index="0"]')?.focus(), 50);
      }
      else if (act === 'dismiss-kyc-banner') {
        ui.kycWelcomeBanner = false;
        render();
      }
      else if (act === 'kyc-open-camera') {
        const camT = btn.getAttribute('data-cam-target') || 'selfie';
        await openKycCamera(camT);
      }
      else if (act === 'kyc-cam-capture') {
        captureKycCameraPhoto();
      }
      else if (act === 'kyc-cam-retake') {

    async function verifyPinEntryCode(enteredPin) {
      const enteredHash = await hashPassword(enteredPin);
      if (!state.session && ui.authMode === 'pin') {
        const pinMeta = loadLastPinMeta();
        if (pinMeta && enteredHash === pinMeta.pinHash) {
          ui.pinEntry = '';
          ui.pinErrorCount = 0;
          const cloud = getCloud();
          const fbUser = cloud?.auth?.currentUser || null;
          if (fbUser && fbUser.uid === pinMeta.uid) {
            sessionStorage.setItem(PIN_UNLOCK_SESSION_KEY, fbUser.uid);
            ui.authMode = 'login';
            ui.pinLocked = false;
            await hydrateFromFirebaseUser(fbUser);
            ui.view = isKycVerified() ? 'home' : 'kyc';
            render();
            toast('PIN Verified! Assalam o Alaikum ✓', 'success');
          } else {
            const remKeep = loadRememberMe();
            const userCache = loadUserCache(pinMeta.uid);
            state = userCache ? userCache : defaultData();
            state.rememberMe = remKeep;
            state.pinSecurity = { enabled: true, hash: pinMeta.pinHash };
            state.session = {
              id: pinMeta.uid,
              uid: '',
              cloudUid: pinMeta.uid,
              name: pinMeta.name || state.settings?.ownerName || 'Workshop Owner',
              email: pinMeta.email || '',
              mobile: pinMeta.mobile || '',
              identifier: pinMeta.identifier || pinMeta.email || '',
              authType: pinMeta.authType || 'email',
              photo: '',
              provider: 'pin-local',
              loginAt: Date.now()
            };
            sessionStorage.setItem(PIN_UNLOCK_SESSION_KEY, pinMeta.uid);
            ui.authMode = 'login';
            ui.pinLocked = false;
            ui.view = isKycVerified() ? 'home' : 'kyc';
            if (state.kyc?.status === 'verifying') startKycCountdownTimer();
            saveState(true);
            render();
            toast('PIN Verified! Login ho gaya ✓', 'success');
          }
          return;
        }
      } else if (state.session && enteredHash === state.pinSecurity?.hash) {
        ui.pinEntry = '';
        ui.pinErrorCount = 0;
        ui.pinLocked = false;
        sessionStorage.setItem(PIN_UNLOCK_SESSION_KEY, state.session?.uid || state.session?.id || '1');
        ui.view = isKycVerified() ? 'home' : 'kyc';
        render();
        toast('App unlocked ✓', 'success');
        return;
      }

      ui.pinEntry = '';
      ui.pinErrorCount = Number(ui.pinErrorCount || 0) + 1;
      if (ui.pinErrorCount >= 5) {
        const cloud = getCloud();
        if (cloud) { try { await cloud.signOutUser(); } catch (e) {} }
        localStorage.removeItem(ACTIVE_UID_KEY);
        sessionStorage.removeItem(PIN_UNLOCK_SESSION_KEY);
        const remKeep = loadRememberMe();
        state = defaultData();
        state.rememberMe = remKeep;
        ui.pinLocked = false;
        ui.authMode = 'login';
        ui.pinErrorCount = 0;
        render();
        toast('5 wrong PIN attempts. Security logout ho gaya — Password se login karein.', 'error');
      } else {
        render();
        const grp = !state.session && ui.authMode === 'pin' ? 'auth-pin' : 'lock-pin';
        document.querySelector(`[data-digit-group="${grp}"][data-digit-index="0"]`)?.focus();
        toast('Wrong PIN!', 'error');
      }

    // Multi-Digit Box Handlers (OTP 6 boxes & PIN 4 boxes)
    document.addEventListener('keydown', (e) => {
      const t = e.target;
      if (!t || !t.hasAttribute || !t.hasAttribute('data-digit-group')) return;
      const group = t.getAttribute('data-digit-group');
      const idx = Number(t.getAttribute('data-digit-index') || 0);
      const boxes = Array.from(document.querySelectorAll(`[data-digit-group="${group}"]`));
      if (e.key === 'Backspace') {
        if (!t.value && idx > 0) {
          e.preventDefault();
          const prev = boxes[idx - 1];
          prev.value = '';
          prev.classList.remove('filled');
          prev.focus();
        } else {
          setTimeout(() => t.classList.toggle('filled', Boolean(t.value)), 0);
        }
      } else if (e.key === 'ArrowLeft' && idx > 0) {
        e.preventDefault();
        boxes[idx - 1].focus();
      } else if (e.key === 'ArrowRight' && idx < boxes.length - 1) {
        e.preventDefault();
        boxes[idx + 1].focus();
      }
    });

    document.addEventListener('paste', (e) => {
      const t = e.target;
      if (!t || !t.hasAttribute || !t.hasAttribute('data-digit-group')) return;
      const text = (e.clipboardData || window.clipboardData)?.getData('text') || '';
      const digits = text.replace(/\D/g, '');
      if (!digits) return;
      e.preventDefault();
      const group = t.getAttribute('data-digit-group');
      const startIdx = digits.length >= 4 && Number(t.getAttribute('data-digit-index') || 0) === 0 ? 0 : Number(t.getAttribute('data-digit-index') || 0);
      const boxes = Array.from(document.querySelectorAll(`[data-digit-group="${group}"]`));
      for (let k = 0; k < digits.length && (startIdx + k) < boxes.length; k++) {
        boxes[startIdx + k].value = digits[k];
        boxes[startIdx + k].classList.add('filled');
      }
      const nextPos = Math.min(boxes.length - 1, startIdx + digits.length);
      boxes[nextPos]?.focus();
      const val = readDigitGroup(group, boxes.length);
      if (group === 'signup-otp' && ui.signupData) ui.signupData.otpInput = val;
      if ((group === 'auth-pin' || group === 'lock-pin')) {
        ui.pinEntry = val;
        if (val.length === 4) verifyPinEntryCode(val);
      }
    });

    // Inputs & File Handlers
    document.addEventListener('input', (e) => {
      const t = e.target;
      if (t.hasAttribute && t.hasAttribute('data-digit-group')) {
        const group = t.getAttribute('data-digit-group');
        const idx = Number(t.getAttribute('data-digit-index') || 0);
        const boxes = Array.from(document.querySelectorAll(`[data-digit-group="${group}"]`));
        const clean = String(t.value || '').replace(/\D/g, '');
        if (clean.length > 1) {
          for (let k = 0; k < clean.length && (idx + k) < boxes.length; k++) {
            boxes[idx + k].value = clean[k];
            boxes[idx + k].classList.add('filled');
          }
          boxes[Math.min(boxes.length - 1, idx + clean.length)]?.focus();
        } else {
          t.value = clean;
          t.classList.toggle('filled', clean.length === 1);
          if (clean.length === 1 && idx < boxes.length - 1) {
            boxes[idx + 1].focus();
            boxes[idx + 1].select?.();
          } else if (clean.length === 1 && group === 'set-pin-1' && idx === boxes.length - 1) {
            document.querySelector('[data-digit-group="set-pin-2"][data-digit-index="0"]')?.focus();
          }
        }
        const combined = readDigitGroup(group, boxes.length);
        if (group === 'signup-otp' && ui.signupData) {
          ui.signupData.otpInput = combined;
        } else if (group === 'auth-pin' || group === 'lock-pin') {
          ui.pinEntry = combined;
          if (combined.length === 4) {
            verifyPinEntryCode(combined);
          }
        }
        return;
      }
      if (t.id === 'global-search') {
        ui.searchQuery = t.value;
        const pos = t.selectionStart;
        render();
        const el = document.getElementById('global-search');
        if (el) { el.focus(); el.setSelectionRange(pos, pos); }
